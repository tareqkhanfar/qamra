[project]
name = "qamra-ai"
version = "0.0.1"
description = "Qamra AI provider adapters, prompts and generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "google-genai>=1.0",
    "openai>=2.0",
    "fal-client>=0.5",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "pyyaml>=6",
    "pillow>=10",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "tenacity>=9",
    "qamra-pdf",
    "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qamra_ai"]

[tool.uv.sources]
qamra-pdf = { workspace = true }
