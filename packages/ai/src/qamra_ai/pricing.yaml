# USD prices used by the cost ledger and the per-book budget guard. Code never hardcodes prices.
# Checked 2026-09-28 against the providers' pages (sources in docs/plans/addendum-03.md §1).
anthropic:  # per 1M tokens (platform.claude.com/docs/en/about-claude/pricing)
  claude-sonnet-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-4-5: {input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25}
  claude-opus-5: {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-opus-4-8: {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-fable-5-1: {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50}
gemini:  # direct Google adapter: per output image by size, plus per input image
  gemini-3.1-flash-image: {output: {1K: 0.067, 2K: 0.101, 4K: 0.151}, input_image: 0.0011}
  gemini-3-pro-image: {output: {1K: 0.134, 2K: 0.134, 4K: 0.24}, input_image: 0.0011}
  gemini-3.1-flash-lite-image: {output: {1K: 0.0336, 2K: 0.0336, 4K: 0.0336}, input_image: 0.0011}
openai:  # per 1M tokens (image models are token-billed)
  gpt-image-2.5-sunburst: {text_input: 5.00, image_input: 8.00, output: 30.00}
  gpt-image-2.5-flare: {text_input: 5.00, image_input: 8.00, output: 30.00}
  gpt-image-2: {text_input: 5.00, image_input: 8.00, output: 30.00}
fal:
  # Nano Banana 2: $0.08 per image at 1K; 0.5K ×0.75, 2K ×1.5, 4K ×2 (fal.ai/models/fal-ai/nano-banana-2)
  fal-ai/nano-banana-2: {per_image: 0.08, resolution: {"0.5K": 0.75, "1K": 1.0, "2K": 1.5, "4K": 2.0}}
  fal-ai/nano-banana-2/edit: {per_image: 0.08, resolution: {"0.5K": 0.75, "1K": 1.0, "2K": 1.5, "4K": 2.0}}
  # Nano Banana Pro (covers, Addendum 11 §6.4): $0.15 per image, 4K double; no 0.5K tier (billed as 1K)
  # (fal.ai/models/fal-ai/nano-banana-pro/edit, checked 2026-10-02)
  fal-ai/nano-banana-pro: {per_image: 0.15, resolution: {"0.5K": 1.0, "1K": 1.0, "2K": 1.0, "4K": 2.0}}
  fal-ai/nano-banana-pro/edit: {per_image: 0.15, resolution: {"0.5K": 1.0, "1K": 1.0, "2K": 1.0, "4K": 2.0}}
  # FLUX.2: first output megapixel, then per extra megapixel of input and output, rounded up
  fal-ai/flux-2-pro/edit: {first_mp: 0.03, extra_mp: 0.015, bill_inputs: true}
  fal-ai/flux-2-pro: {first_mp: 0.03, extra_mp: 0.015, bill_inputs: false}
  fal-ai/flux-2-flex/edit: {first_mp: 0.06, extra_mp: 0.06, bill_inputs: true}
  fal-ai/flux-2/edit: {first_mp: 0.012, extra_mp: 0.012, bill_inputs: true}
  # FLUX.2 [klein]: "$0.01 per megapixel" of input and output (fal model page, checked 2026-09-28). The 4B
  # weights are Apache 2.0 (the Classic hero edit); the 9B weights are non-commercial, fal's API only.
  fal-ai/flux-2/klein/4b/edit: {per_mp: 0.01, bill_inputs: true}
  fal-ai/flux-2/klein/4b: {per_mp: 0.01}
  fal-ai/flux-2/klein/9b/edit: {per_mp: 0.011, bill_inputs: true}
  # Upscalers
  fal-ai/seedvr/upscale/image: {per_mp: 0.001}  # per output megapixel
  fal-ai/recraft/upscale/crisp: {per_image: 0.004}
# Budget-guard estimate for fal endpoints not listed above (the admin may point at any endpoint).
fal_unknown_image_usd: 0.15
fal_unknown_upscale_usd: 0.02
