[project]
name = "qamra-core"
version = "0.1.0"
description = "Qamra shared core: settings, database models + migrations, object storage"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "boto3>=1.38",
    "structlog>=25",
]

[project.scripts]
qamra-migrate = "qamra_core.migrations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qamra_core"]
