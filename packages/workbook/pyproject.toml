[project]
name = "qamra-workbook"
version = "0.0.1"
description = "Qamra workbooks (Addendum 5 and 6): curriculum plans, puzzles, picture library and the page engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "qamra-pdf",
    # already installed with qamra-pdf; listed because the page engine imports them directly
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "pillow>=10",
    "playwright>=1.47",
    "pypdfium2>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qamra_workbook"]

[tool.uv.sources]
qamra-pdf = { workspace = true }
