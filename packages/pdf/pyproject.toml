[project]
name = "qamra-pdf"
version = "0.0.1"
description = "Qamra print page templates (HTML/CSS) and Playwright PDF renderer"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.47",
    "pillow>=10",
    "qrcode>=7.4",
    "pdfplumber>=0.11",
    "pypdf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qamra_pdf"]

# The page layout library (Addendum 11 §3) lives beside src/; wheels carry it inside the package.
[tool.hatch.build.targets.wheel.force-include]
"layouts" = "qamra_pdf/layouts"
