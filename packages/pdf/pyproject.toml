[project]
name = "qamra-pdf"
version = "0.0.1"
description = "Qamra print page templates (HTML/CSS) and Playwright PDF renderer"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.47",
    "pillow>=10",
    "qrcode>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qamra_pdf"]
