<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كتاب الصف — لوحة الجاهزية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
button,input{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1000px; background: #FBF6EC; display: flex">
  <aside style="width: 264px; flex-shrink: 0; background: #FFFDF8; border-left: 1px solid #E4D6BC; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px"><svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M21.32 5.01 A17 17 0 1 0 38.12 27.41 A14 14 0 0 1 21.32 5.01 Z" fill="#F2B33D"/><path d="M34 8 C34.6 11.2 35.8 12.4 39 13 C35.8 13.6 34.6 14.8 34 18 C33.4 14.8 32.2 13.6 29 13 C32.2 12.4 33.4 11.2 34 8 Z" fill="#16204A"/><path d="M6 44 Q15 39.5 24 43.5 Q33 39.5 42 44" fill="none" stroke="#16204A" stroke-width="3" stroke-linecap="round"/></svg><span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 22px; color: #16204A">قمرة</span><span style="padding: 2px 8px; border-radius: 999px; background: #16204A; color: #FBF6EC; font-size: 11px; font-weight: 700">روضات</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 16px; background: #F3EAD8"><strong style="font-size: 14px">كتاب صف الفراشات</strong><span style="font-size: 12px; color: #585C72">18 طفلاً · تخرّج 2027</span></div>
    <nav aria-label="كتاب الصف" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7"><a href="{{n.href}}" style="{{n.style}}">{{n.label}}</a></sc-for>
    </nav>
  </aside>

  <main style="flex-grow: 1; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #585C72">كتاب الصف · الخطوة 2 من 6</span><h1 style="font-size: 30px; color: #16204A">جاهزية الأطفال — 11 من 18 جاهزون</h1></div>
      <button style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #2E7A52; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>ذكّر 7 أهالي على واتساب</button>
    </div>

    <div style="display: flex; gap: 8px; align-items: center">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="6"><button aria-pressed="{{f.sel}}" style="{{f.style}}">{{f.label}} <span style="{{f.cs}}">{{f.count}}</span></button></sc-for>
      <div style="margin-right: auto; display: flex; gap: 14px; font-size: 12px; color: #585C72">
        <span>دعوة</span><span>·</span><span>موافقة</span><span>·</span><span>صورة</span><span>·</span><span>رسمة</span><span>·</span><span>شخصية معتمدة</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{kids}}" as="k" hint-placeholder-count="18">
        <article style="{{k.card}}">
          <div style="display: flex; align-items: center; gap: 8px">
            <div style="{{k.av}}"><dc-import name="Kid" w="40" hijab="{{k.hijab}}" hair-style="{{k.hair}}" skin="{{k.skin}}" outfit="{{k.outfit}}" look="{{k.look}}" hint-size="40px,47px"></dc-import></div>
            <strong style="font-size: 14px">{{k.name}}</strong>
          </div>
          <div aria-label="{{k.aria}}" style="display: flex; gap: 3px"><span style="{{k.s1}}"></span><span style="{{k.s2}}"></span><span style="{{k.s3}}"></span><span style="{{k.s4}}"></span><span style="{{k.s5}}"></span></div>
          <span style="{{k.chip}}">{{k.status}}</span>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [['لوحة التحكم', 'PortalDashboard.dc.html'], ['إعداد كتاب الصف', 'ClassSetup.dc.html'], ['جاهزية الأطفال', 'ClassReady.dc.html'], ['مخطط الصفحات', 'ClassPlanner.dc.html'], ['مراجعة الصفحات', 'ClassReview.dc.html'], ['الأغلفة الشخصية', 'ClassCovers.dc.html'], ['الطباعة والفاتورة', 'ClassPrint.dc.html']];
    const nav = items.map(([label, href], i) => ({ label, href, style: 'min-height:44px;padding:0 14px;border-radius:12px;display:flex;align-items:center;font-size:15px;' + (i === 2 ? 'background:#16204A;color:#FBF6EC;font-weight:700' : 'color:#1C2140') }));
    const fl = [['الكل', 18], ['بانتظار الدعوة', 1], ['بانتظار الموافقة', 2], ['بلا صورة', 2], ['بلا رسمة', 2], ['جاهز', 11]];
    const filters = fl.map(([label, count], i) => ({ label, count: String(count), sel: i === 0 ? 'true' : 'false', style: 'min-height:44px;padding:0 14px;border-radius:999px;font-size:14px;display:flex;align-items:center;gap:6px;' + (i === 0 ? 'background:#16204A;color:#FBF6EC;border:0;font-weight:700' : 'background:#FFFDF8;border:1.5px solid #E4D6BC;color:#1C2140'), cs: 'padding:1px 7px;border-radius:999px;font-size:12px;font-weight:700;' + (i === 0 ? 'background:#F2B33D;color:#0E1530' : 'background:#F3EAD8') }));
    const chip = (bg, fg) => 'align-self:flex-start;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;background:' + bg + ';color:' + fg;
    const ST = [null, ['مدعو', chip('#FCEFD2', '#9A620A')], ['وافق', chip('#E4E8F7', '#16204A')], ['صورة مرفوعة', chip('#EEEAF8', '#5A4A9C')], ['رسمة مرفوعة', chip('#EEEAF8', '#5A4A9C')], ['معتمد', chip('#DDEFE3', '#2E7A52')]];
    const data = [['يوسف', 5, 0, 'curly', '#C98F63', '#5B6FC0'], ['جنى', 5, 1, 'short', '#E8B98F', '#A99BD6'], ['ليان', 5, 1, 'short', '#E8B98F', '#E9826B'], ['آدم', 3, 0, 'short', '#F3CFAE', '#7FA38A'], ['سلمى', 5, 0, 'long', '#E8B98F', '#E9826B'], ['كرم', 1, 0, 'curly', '#8D5A3B', '#5B6FC0'],
      ['تالا', 2, 0, 'long', '#F3CFAE', '#A99BD6'], ['عمر', 5, 0, 'short', '#C98F63', '#7FA38A'], ['ريم', 5, 1, 'short', '#E8B98F', '#F2B33D'], ['زيد', 4, 0, 'short', '#F3CFAE', '#5B6FC0'], ['مريم', 5, 1, 'short', '#C98F63', '#7FA38A'], ['حمزة', 2, 0, 'curly', '#8D5A3B', '#E9826B'],
      ['لين', 5, 0, 'long', '#F3CFAE', '#A99BD6'], ['علي', 5, 0, 'short', '#E8B98F', '#5B6FC0'], ['نور', 3, 1, 'short', '#C98F63', '#E9826B'], ['سيف', 5, 0, 'curly', '#8D5A3B', '#7FA38A'], ['هيا', 5, 1, 'short', '#E8B98F', '#F2B33D'], ['بشير', 0, 0, 'short', '#F3CFAE', '#5B6FC0']];
    const seg = (on, cur) => 'flex:1;height:6px;border-radius:999px;background:' + (on ? '#16204A' : cur ? '#F2B33D' : '#E4D6BC');
    const kids = data.map(([name, s, hijab, hair, skin, outfit]) => {
      const st = s === 0 ? ['لم تُرسل الدعوة', chip('#F8DEDB', '#B3261E')] : ST[s];
      return {
        name, hijab: !!hijab, hair, skin, outfit, look: s >= 3 ? 'art' : 'photo', status: st[0], chip: st[1], aria: 'اكتمل ' + s + ' من 5',
        s1: seg(s >= 1, s === 0), s2: seg(s >= 2, s === 1), s3: seg(s >= 3, s === 2), s4: seg(s >= 4, s === 3), s5: seg(s >= 5, s === 4),
        card: 'display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:18px;background:#FFFDF8;border:' + (s === 5 ? '1px solid #E4D6BC' : '1.5px solid #DB9A1F'),
        av: 'width:40px;height:40px;border-radius:999px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex-shrink:0;background:' + (s >= 3 ? '#FCEFD2' : '#E4D6BC') + ';' + (s < 3 ? 'opacity:0.6' : '')
      };
    });
    return { nav, filters, kids };
  }
}
</script>
</body>
</html>
