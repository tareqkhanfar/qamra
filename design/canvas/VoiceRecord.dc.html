<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صوت أهلي — تسجيل صفحة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
button{font-family:inherit}
a{color:#16204A;text-decoration:none}
@keyframes qm-pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,0.45)}100%{box-shadow:0 0 0 22px rgba(179,38,30,0)}}
.qm-rec{animation:qm-pulse 1.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){.qm-rec{animation:none}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 900px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #E4D6BC">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
      <a href="MyBooks.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <strong style="font-size: 16px">صوت أهلي · ليان وصاحبها نونو</strong>
      <a href="VoiceInvite.dc.html" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #9A620A">ادعُ ستّي</a>
    </div>
    <div style="display: flex; gap: 3px; padding: 0 8px" aria-label="سُجّلت 6 من 24 صفحة"><sc-for list="{{dots}}" as="d" hint-placeholder-count="24"><span style="{{d}}"></span></sc-for></div>
  </header>

  <main style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="display: flex; gap: 12px; align-items: center">
      <div style="border-radius: 10px; overflow: hidden; flex-shrink: 0"><dc-import name="Scene" w="72" h="72" theme="night" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" companion="blob" kid-scale="0.5" hint-size="72px,72px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">الصفحة 7 من 24</strong><span style="font-size: 13px; color: #585C72">اقرئي النص بصوتك الطبيعي، ببطء</span></div>
    </div>
    <p style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.8; background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 20px; padding: 18px 20px">همس نونو: "انظري يا ليان! القمر اكتمل الليلة." فأمسكت ليان بيده، وقفزا معاً فوق أسطح الحارة.</p>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="font-size: 14px; font-weight: 600; margin-bottom: 6px">من يقرأ؟</legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{voices}}" as="v" hint-placeholder-count="5"><button aria-pressed="{{v.on}}" style="{{v.style}}">{{v.label}}</button></sc-for></div>
    </fieldset>

    <div role="status" style="background: #16204A; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; color: #FBF6EC; font-size: 14px"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #F28B82"></span>يسجّل الآن</span><span style="direction: ltr; font-variant-numeric: tabular-nums">0:12</span></div>
      <div aria-hidden="true" style="height: 48px; display: flex; align-items: center; gap: 3px"><sc-for list="{{wave}}" as="w" hint-placeholder-count="40"><span style="{{w}}"></span></sc-for></div>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
      <button style="width: 64px; min-height: 64px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: #16204A"><span style="width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #E4D6BC; background: #FFFDF8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></span>أعيدي</button>
      <button aria-label="إيقاف التسجيل" class="qm-rec" style="width: 88px; height: 88px; border-radius: 999px; border: 6px solid #F8DEDB; background: #B3261E; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 6px; background: #FFFFFF"></span></button>
      <button style="width: 64px; min-height: 64px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: #16204A"><span style="width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #E4D6BC; background: #FFFDF8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 5v14L6 12z"/></svg></span>اسمعي</button>
    </div>
    <a href="#" style="min-height: 52px; border-radius: 999px; background: #16204A; color: #FBF6EC; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">احفظ وانتقل للصفحة 8</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = Array.from({ length: 24 }, (_, i) => 'flex:1;height:6px;border-radius:999px;background:' + (i < 6 ? '#2E7A52' : i === 6 ? '#F2B33D' : '#E4D6BC'));
    const chip = (on) => 'min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;' + (on ? 'border:1.5px solid #16204A;background:#16204A;color:#FBF6EC;font-weight:700' : 'border:1.5px solid #E4D6BC;background:#FFFDF8;color:#1C2140');
    const voices = [['ماما', true], ['بابا', false], ['ستّي', false], ['سيدي', false], ['+ اسم آخر', false]].map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: chip(on) }));
    const wave = Array.from({ length: 40 }, (_, i) => { const h = i < 26 ? 8 + Math.round(Math.abs(Math.sin(i * 1.7) * 30 + Math.cos(i * 0.6) * 8)) : 4; return 'flex:1;border-radius:3px;height:' + h + 'px;background:' + (i < 26 ? '#F2B33D' : '#2B3872'); });
    return { dots, voices, wave };
  }
}
</script>
</body>
</html>
