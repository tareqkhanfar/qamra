<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ i: ((this.state && this.state.i) || 0) + 1 }), 3500);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const msgs = ['نختار ألوان سماء الليل…', 'نعلّم ليان كيف تطير بالصاروخ…', 'نرسم الكوكب الصغير الوحيد…', 'نرتّب الكلمات على الصفحات…', 'نضيف بعض النجوم الذهبية…'];
    const i = (this.state && this.state.i) || 0;
    return { message: msgs[i % msgs.length] };
  }
}
</script>
