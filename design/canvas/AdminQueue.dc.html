<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإدارة — طابور الاعتماد</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
button,input{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1000px; background: #FBF6EC; display: flex">
  <aside style="width: 232px; flex-shrink: 0; background: #0E1530; color: #FBF6EC; padding: 24px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px"><span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 22px">قمرة</span><span style="padding: 2px 8px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-size: 11px; font-weight: 700">إدارة</span></div>
    <nav aria-label="الإدارة" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a href="{{n.href}}" style="{{n.style}}">{{n.label}}<span style="{{n.badgeStyle}}">{{n.badge}}</span></a></sc-for>
    </nav>
  </aside>

  <section aria-label="الكتب بانتظار الاعتماد" style="width: 300px; flex-shrink: 0; border-left: 1px solid #E4D6BC; background: #FFFDF8; display: flex; flex-direction: column">
    <div style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 10px"><h2 style="font-size: 20px; color: #16204A">بانتظار الاعتماد (23)</h2><div style="display: flex; gap: 6px"><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #16204A; color: #FBF6EC; font-size: 13px; font-weight: 600">الكل</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4D6BC; background: transparent; font-size: 13px">مُعلَّم (5)</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4D6BC; background: transparent; font-size: 13px">روضات</button></div></div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{queue}}" as="q" hint-placeholder-count="7">
        <a href="#" style="{{q.row}}">
          <div style="border-radius: 4px 8px 8px 4px; overflow: hidden; border-right: 4px solid #0E1530; flex-shrink: 0"><dc-import name="Scene" w="48" h="48" theme="{{q.theme}}" hijab="{{q.hijab}}" kid-scale="0.65" hint-size="48px,48px"></dc-import></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><strong style="font-size: 14px">{{q.title}}</strong><span style="font-size: 12px; color: #585C72">{{q.meta}}</span></div>
          <span style="{{q.flagStyle}}">{{q.flag}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <main style="flex-grow: 1; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="font-size: 26px; color: #16204A">ليان ورحلة إلى القمر</h1><span style="font-size: 13px; color: #585C72">طلب فردي · غلاف مقوّى · ألوان مائية · 24 صفحة · طُلب قبل 2 س</span></div>
      <div style="display: flex; gap: 10px"><button style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #16204A; background: transparent; color: #16204A; font-weight: 700; font-size: 14px">إعادة رسم المحدد (2)</button><button style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #2E7A52; color: #FFFFFF; font-weight: 700; font-size: 14px">اعتماد وإرسال للطباعة</button></div>
    </div>

    <div style="display: flex; gap: 12px">
      <div style="flex: 1; background: #DDEFE3; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #1C2140">تطابق الوجه (متوسط)</span><strong style="font-size: 20px; color: #2E7A52">0.91</strong></div>
      <div style="flex: 1; background: #FCEFD2; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-size: 12px">صفحات مُعلَّمة آلياً</span><strong style="font-size: 20px; color: #9A620A">2</strong></div>
      <div style="flex: 1; background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-size: 12px">تكلفة التوليد</span><strong style="font-size: 20px; color: #16204A; direction: ltr; text-align: right">$[x.xx]</strong></div>
      <div style="flex: 1; background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-size: 12px">إعادات الأهل</span><strong style="font-size: 20px; color: #16204A">1 / 3</strong></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="12">
        <figure style="{{p.card}}">
          <div style="position: relative; border-radius: 8px; overflow: hidden"><dc-import name="Scene" w="160" h="160" theme="{{p.theme}}" pose="{{p.pose}}" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" kid-scale="0.6" hint-size="160px,160px"></dc-import><input type="checkbox" aria-label="{{p.aria}}" checked="{{p.flagged}}" style="position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; accent-color: #16204A"></div>
          <figcaption style="display: flex; justify-content: space-between; align-items: center; font-size: 12px"><span style="font-weight: 600">ص {{p.n}}</span><span style="{{p.noteStyle}}">{{p.note}}</span></figcaption>
        </figure>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [['طابور الاعتماد', 'AdminQueue.dc.html', '23'], ['الطلبات والطباعة', 'AdminOrders.dc.html', ''], ['محرر الثيمات', 'AdminThemes.dc.html', ''], ['التكلفة والتحويل', 'AdminMetrics.dc.html', '']];
    const nav = items.map(([label, href, badge], i) => ({ label, href, badge, badgeStyle: badge ? 'padding:1px 8px;border-radius:999px;background:#F2B33D;color:#0E1530;font-size:12px;font-weight:700' : 'display:none', style: 'min-height:44px;padding:0 12px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;font-size:15px;' + (i === 0 ? 'background:#22306A;color:#FBF6EC;font-weight:700' : 'color:#B9BEDA') }));
    const fl = (t, bg, fg) => ({ flag: t, flagStyle: t ? 'flex-shrink:0;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:' + bg + ';color:' + fg : 'display:none' });
    const queue = [
      { title: 'ليان ورحلة إلى القمر', meta: 'فردي · قبل 2 س', theme: 'space', hijab: true, ...fl('2 صفحات', '#FCEFD2', '#9A620A'), sel: true },
      { title: 'يوسف · يوم تخرّجي', meta: 'روضة [الاسم] · قبل 3 س', theme: 'grad', hijab: false, ...fl('', '', ''), sel: false },
      { title: 'جنى · يوم تخرّجي', meta: 'روضة [الاسم] · قبل 3 س', theme: 'grad', hijab: true, ...fl('', '', ''), sel: false },
      { title: 'كرم وموسم الزيتون', meta: 'فردي · قبل 4 س', theme: 'garden', hijab: false, ...fl('وجه 0.72', '#F8DEDB', '#B3261E'), sel: false },
      { title: 'سلمى وقارب الأحلام', meta: 'فردي · قبل 5 س', theme: 'sea', hijab: false, ...fl('', '', ''), sel: false },
      { title: 'آدم وحارس النجوم', meta: 'فردي · قبل 6 س', theme: 'night', hijab: false, ...fl('نص طويل', '#FCEFD2', '#9A620A'), sel: false },
      { title: 'مريم · يوم تخرّجي', meta: 'روضة [الاسم] · قبل 7 س', theme: 'grad', hijab: true, ...fl('', '', ''), sel: false }
    ].map((q) => ({ ...q, row: 'display:flex;gap:10px;align-items:center;min-height:64px;padding:8px 16px;border-bottom:1px solid #E4D6BC;' + (q.sel ? 'background:#E4E8F7;border-right:4px solid #16204A' : '') }));
    const th = ['night', 'night', 'space', 'space', 'space', 'night', 'space', 'space', 'space', 'night', 'space', 'night'];
    const po = ['front', 'wave', 'tilt', 'front', 'wave', 'tilt', 'wave', 'front', 'tilt', 'wave', 'front', 'tilt'];
    const flags = { 4: 'وجه 0.78', 9: 'نص يتجاوز' };
    const pages = th.map((theme, i) => {
      const f = flags[i];
      return {
        theme, pose: po[i], n: String(i + 1), flagged: !!f, aria: 'تحديد الصفحة ' + (i + 1), note: f || '0.9' + ((i * 3) % 7),
        noteStyle: f ? 'padding:1px 6px;border-radius:999px;background:#F8DEDB;color:#B3261E;font-weight:700' : 'color:#2E7A52;font-weight:600',
        card: 'margin:0;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:12px;background:#FFFDF8;border:' + (f ? '2px solid #B3261E' : '1px solid #E4D6BC')
      };
    });
    return { nav, queue, pages };
  }
}
</script>
</body>
</html>
