<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخطوة 7 — مراجعة الصفحات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button,input,textarea{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1100px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E4D6BC">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
      <a href="Landing.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <strong style="font-size: 16px">ليان ورحلة إلى القمر</strong>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px"><strong style="color: #16204A">مراجعة الصفحات</strong><span style="display: flex; align-items: center; gap: 6px; color: #585C72"><dc-import name="Moon" size="18" p="0.67" hint-size="18px,18px"></dc-import>الخطوة 8 من 12</span></div>
    <div style="height: 6px; border-radius: 999px; background: #F3EAD8; display: flex"><div style="width: 67%; background: #16204A; border-radius: 999px"></div></div>
  </header>

  <main style="padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #E4E8F7; font-size: 14px; line-height: 1.6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#33458F" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>هذه رسومات أولية. عدّل ما تريد، ثم نرسم النسخة النهائية بدقة عالية.</div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="8">
        <button aria-label="{{p.aria}}" style="{{p.btn}}">
          <div style="border-radius: 8px; overflow: hidden; opacity: 0.9"><dc-import name="Scene" w="80" h="80" theme="{{p.theme}}" pose="{{p.pose}}" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" kid-scale="0.62" hint-size="80px,80px"></dc-import></div>
          <span style="font-size: 12px; font-weight: 600">{{p.n}}</span>
        </button>
      </sc-for>
    </div>
    <button style="min-height: 44px; border: 0; background: transparent; color: #9A620A; font-weight: 700; font-size: 15px">عرض كل الصفحات (24)</button>

    <section aria-label="تحرير الصفحة 7" style="background: #FFFDF8; border: 2px solid #16204A; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column">
      <div style="position: relative"><dc-import name="Scene" w="354" h="220" theme="space" pose="wave" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" kid-scale="0.58" hint-size="354px,220px"></dc-import><span style="position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(14,21,48,0.8); color: #FBF6EC; font-size: 12px; font-weight: 600">صفحة 7 · مسودة</span></div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <label for="p7" style="font-size: 14px; font-weight: 600">نص الصفحة</label>
        <textarea id="p7" rows="3" style="padding: 12px 14px; border: 1.5px solid #E4D6BC; border-radius: 14px; background: #FFFFFF; font-size: 16px; line-height: 1.7; resize: none; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif">وصلت ليان إلى القمر، فوجدت كوكباً صغيراً يجلس وحيداً. قالت له: "مرحباً! هل تلعب معي؟"</textarea>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #585C72"><span>يُفضّل أقل من 180 حرفاً</span><span style="direction: ltr">96 / 180</span></div>
        <div style="display: flex; gap: 8px">
          <button style="flex-grow: 1; min-height: 48px; border-radius: 999px; border: 2px solid #16204A; background: transparent; color: #16204A; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>أعد رسم الصفحة</button>
          <button style="min-height: 48px; padding: 0 16px; border: 0; background: transparent; color: #585C72; font-weight: 600; font-size: 15px">استعادة الأصل</button>
        </div>
      </div>
    </section>
  </main>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 24px; background: rgba(251,246,236,0.97); border-top: 1px solid #E4D6BC; display: flex; gap: 8px">
    <a href="Create6.dc.html" style="min-height: 56px; padding: 0 16px; color: #16204A; font-weight: 600; font-size: 16px; display: flex; align-items: center">رجوع</a>
    <a href="Create8.dc.html" style="flex-grow: 1; min-height: 56px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">الصفحات جاهزة، ارسم الكتاب</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const th = ['night', 'night', 'space', 'space', 'space', 'space', 'space', 'night'];
    const po = ['front', 'wave', 'tilt', 'front', 'wave', 'tilt', 'wave', 'front'];
    const pages = th.map((theme, i) => {
      const sel = i === 6;
      return {
        theme, pose: po[i], n: String(i + 1), aria: 'صفحة ' + (i + 1),
        btn: 'display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:12px;background:#FFFDF8;color:#1C2140;border:' + (sel ? '2px solid #16204A' : '1px solid #E4D6BC')
      };
    });
    return { pages };
  }
}
</script>
</body>
</html>
