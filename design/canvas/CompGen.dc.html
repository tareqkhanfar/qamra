<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ارسم صاحبك — نحوّل الرسمة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#16204A;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#FBF6EC}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
a{color:#F5C465;text-decoration:none}
@keyframes qm-glow{0%,100%{opacity:.35}50%{opacity:.8}}
.qm-glow{animation:qm-glow 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.qm-glow{animation:none}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; background: #16204A; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 32px; box-sizing: border-box; gap: 22px">
  <div style="width: 100%; display: flex; justify-content: flex-start"><a href="Create4.dc.html" style="min-height: 44px; display: flex; align-items: center; font-weight: 600; color: #E4E8F7">أكمل الكتاب وسنخبرك</a></div>

  <div style="position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; margin-top: 12px">
    <div class="qm-glow" style="position: absolute; inset: 0; border-radius: 999px; background: radial-gradient(circle, rgba(242,179,61,0.35), transparent 65%)"></div>
    <dc-import name="Moon" size="260" p="{{p}}" lit="#FCEFD2" dark="#22306A" hint-size="260px,260px"></dc-import>
    <div style="position: absolute; bottom: -6px; left: -6px; transform: rotate(-6deg); box-shadow: 0 8px 20px rgba(0,0,0,0.35)"><dc-import name="Drawing" w="110" variant="blob" hint-size="110px,110px"></dc-import></div>
  </div>

  <div role="status" aria-live="polite" style="display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center">
    <h1 style="font-size: 30px">نونو يستيقظ…</h1>
    <p style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-size: 19px; font-weight: 600; color: #F5C465">{{message}}</p>
    <p style="font-size: 14px; color: #B9BEDA">كلما اكتمل القمر، اقترب نونو</p>
  </div>

  <div style="margin-top: auto; width: 100%; background: #22306A; border-radius: 20px; padding: 16px; display: flex; gap: 12px; align-items: center">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F5C465" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <p style="font-size: 14px; line-height: 1.6; color: #E4E8F7">قرابة دقيقة. يمكنك متابعة اختيار الأسلوب والحكاية بينما نرسمه.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.t = setInterval(() => this.setState({ i: ((this.state && this.state.i) || 0) + 1 }), 1800); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const i = (this.state && this.state.i) || 0;
    const msgs = ['نحافظ على ألوان ليان كما هي…', 'نرسم له عيناً تلمع…', 'نعلّمه كيف يلوّح…', 'نجهّزه ليدخل الحكاية…'];
    const steps = [0.2, 0.35, 0.5, 0.65, 0.8, 0.95];
    return { message: msgs[i % msgs.length], p: steps[i % steps.length] };
  }
}
</script>
</body>
</html>
