<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإدارة — الطلبات ودفعات الطباعة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
button,input{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 900px; background: #FBF6EC; display: flex">
  <aside style="width: 232px; flex-shrink: 0; background: #0E1530; color: #FBF6EC; padding: 24px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px"><span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 22px">قمرة</span><span style="padding: 2px 8px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-size: 11px; font-weight: 700">إدارة</span></div>
    <nav aria-label="الإدارة" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a href="{{n.href}}" style="{{n.style}}">{{n.label}}</a></sc-for>
    </nav>
  </aside>

  <main style="flex-grow: 1; padding: 28px 36px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center"><h1 style="font-size: 28px; color: #16204A">الطلبات ودفعات الطباعة</h1><button style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #16204A; color: #FBF6EC; font-weight: 700; font-size: 15px">إنشاء دفعة طباعة من المعتمد (14)</button></div>

    <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{batches}}" as="b" hint-placeholder-count="3">
        <div style="background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 16px; direction: ltr">{{b.id}}</strong><span style="{{b.chip}}">{{b.status}}</span></div>
          <span style="font-size: 13px; color: #585C72">{{b.meta}}</span>
          <div style="display: flex; gap: 8px"><a href="#" style="min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #E4D6BC; font-size: 13px; font-weight: 600; display: flex; align-items: center">ملف الطباعة PDF</a><a href="#" style="min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #E4D6BC; font-size: 13px; font-weight: 600; display: flex; align-items: center">ملصقات الشحن</a></div>
        </div>
      </sc-for>
    </section>

    <div style="display: flex; gap: 8px; align-items: center">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button style="{{t.style}}">{{t.label}}</button></sc-for>
      <label style="margin-right: auto; display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">بحث</span><input placeholder="بحث برقم الطلب أو الجوال" style="min-height: 44px; width: 280px; padding: 0 14px; border: 1.5px solid #E4D6BC; border-radius: 12px; background: #FFFDF8; font-size: 14px"></label>
    </div>

    <div style="background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 20px; overflow: hidden">
      <table style="width: 100%; border-collapse: collapse; font-size: 14px">
        <thead><tr style="background: #F3EAD8"><th style="text-align: right; padding: 12px 16px; font-weight: 600">الطلب</th><th style="text-align: right; padding: 12px 16px; font-weight: 600">العميل</th><th style="text-align: right; padding: 12px 16px; font-weight: 600">المنتج</th><th style="text-align: right; padding: 12px 16px; font-weight: 600">المدينة</th><th style="text-align: right; padding: 12px 16px; font-weight: 600">الدفع</th><th style="text-align: right; padding: 12px 16px; font-weight: 600">الحالة</th><th style="text-align: right; padding: 12px 16px; font-weight: 600">الدفعة</th></tr></thead>
        <tbody>
          <sc-for list="{{orders}}" as="o" hint-placeholder-count="7">
            <tr style="border-bottom: 1px solid #E4D6BC">
              <td style="padding: 12px 16px; font-weight: 600; direction: ltr; text-align: right">{{o.id}}</td>
              <td style="padding: 12px 16px">{{o.who}}</td>
              <td style="padding: 12px 16px">{{o.product}}</td>
              <td style="padding: 12px 16px">{{o.city}}</td>
              <td style="padding: 12px 16px; color: #585C72">{{o.pay}}</td>
              <td style="padding: 12px 16px"><span style="{{o.chip}}">{{o.status}}</span></td>
              <td style="padding: 12px 16px; direction: ltr; text-align: right; color: #585C72">{{o.batch}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [['طابور الاعتماد', 'AdminQueue.dc.html'], ['الطلبات والطباعة', 'AdminOrders.dc.html'], ['محرر الثيمات', 'AdminThemes.dc.html'], ['التكلفة والتحويل', 'AdminMetrics.dc.html']];
    const nav = items.map(([label, href], i) => ({ label, href, style: 'min-height:44px;padding:0 12px;border-radius:12px;display:flex;align-items:center;font-size:15px;' + (i === 1 ? 'background:#22306A;color:#FBF6EC;font-weight:700' : 'color:#B9BEDA') }));
    const chip = (bg, fg) => 'padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:' + bg + ';color:' + fg;
    const C = { print: chip('#F3EAD8', '#1C2140'), ship: chip('#E4E8F7', '#16204A'), done: chip('#DDEFE3', '#2E7A52'), new: chip('#FCEFD2', '#9A620A'), fail: chip('#F8DEDB', '#B3261E') };
    const batches = [
      { id: 'PB-0042', status: 'في المطبعة', chip: C.print, meta: '26 كتاباً · 19 مقوّى / 7 ورقي · أُرسلت اليوم 09:30' },
      { id: 'PB-0041', status: 'جاهزة للشحن', chip: C.ship, meta: '31 كتاباً · روضة [الاسم] 17 + أفراد 14' },
      { id: 'PB-0040', status: 'تم التسليم', chip: C.done, meta: '22 كتاباً · سُلّمت أمس' }
    ];
    const tabs = ['الكل', 'جديد', 'في المطبعة', 'مع المندوب', 'مرتجع'].map((label, i) => ({ label, style: 'min-height:44px;padding:0 16px;border-radius:999px;font-size:14px;' + (i === 0 ? 'background:#16204A;color:#FBF6EC;border:0;font-weight:700' : 'background:#FFFDF8;border:1.5px solid #E4D6BC;color:#1C2140') }));
    const orders = [
      ['QM-10231', 'أم ليان', 'مقوّى · رحلة إلى القمر', 'البيرة', 'عند الاستلام', 'جديد', C.new, '—'],
      ['QM-10230', 'روضة [الاسم]', '17 × مقوّى · يوم تخرّجي', 'رام الله', 'تحويل بنكي', 'في المطبعة', C.print, 'PB-0042'],
      ['QM-10227', 'أبو كرم', 'ورقي · موسم الزيتون', 'نابلس', 'عند الاستلام', 'في المطبعة', C.print, 'PB-0042'],
      ['QM-10221', 'أم سلمى', 'مقوّى · قارب الأحلام', 'عمّان', 'عند الاستلام', 'مع المندوب', C.ship, 'PB-0041'],
      ['QM-10219', 'أبو آدم', 'مقوّى · حارس النجوم', 'الخليل', 'عند الاستلام', 'مع المندوب', C.ship, 'PB-0041'],
      ['QM-10212', 'أم يوسف', 'رقمي', '—', 'مدفوع', 'تم التسليم', C.done, '—'],
      ['QM-10208', 'أم جود', 'مقوّى · رحلة إلى القمر', 'جنين', 'عند الاستلام', 'مرتجع — لم يُرد', C.fail, 'PB-0039']
    ].map(([id, who, product, city, pay, status, c, batch]) => ({ id, who, product, city, pay, status, chip: c, batch }));
    return { nav, batches, tabs, orders };
  }
}
</script>
</body>
</html>
