<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخطوة 2 — موافقة ولي الأمر</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button,input{font-family:inherit}
a{color:#9A620A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 900px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E4D6BC">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
      <a href="Landing.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <strong style="font-size: 16px">كتاب ليان</strong>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px"><strong style="color: #16204A">موافقة ولي الأمر</strong><span style="display: flex; align-items: center; gap: 6px; color: #585C72"><dc-import name="Moon" size="18" p="0.17" hint-size="18px,18px"></dc-import>الخطوة 2 من 12</span></div>
    <div style="height: 6px; border-radius: 999px; background: #F3EAD8; display: flex"><div style="width: 17%; background: #16204A; border-radius: 999px"></div></div>
  </header>

  <main style="padding: 24px 16px 120px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; gap: 14px; align-items: center">
      <div style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 20px; background: #DDEFE3; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2E7A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <h1 style="font-size: 26px; color: #16204A; line-height: 1.3">قبل أن نطلب صورة ليان، هذا ما نعد به</h1>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{points}}" as="p" hint-placeholder-count="4">
        <li style="background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 16px; padding: 16px; display: flex; gap: 12px">
          <span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px; background: #E4E8F7; color: #16204A; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">{{p.title}}</strong><span style="font-size: 14px; line-height: 1.65; color: #585C72">{{p.body}}</span></div>
        </li>
      </sc-for>
    </ol>
    <a href="Privacy.dc.html" style="font-weight: 600; font-size: 15px; min-height: 44px; display: flex; align-items: center">اقرأ سياسة الخصوصية كاملة</a>

    <label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 16px; background: #E4E8F7; border: 2px solid #16204A; font-size: 15px; line-height: 1.65">
      <input type="checkbox" checked style="flex-shrink: 0; width: 24px; height: 24px; margin: 2px 0 0; accent-color: #16204A">
      <span>أؤكد أنني <strong>ولي أمر ليان</strong> (أو الوصي القانوني عليها)، وأوافق على استخدام صورتها لرسم كتابها فقط.</span>
    </label>
    <label style="display: flex; gap: 12px; align-items: center; min-height: 44px; padding: 0 4px; font-size: 14px; color: #585C72">
      <input type="checkbox" style="width: 22px; height: 22px; accent-color: #16204A"> أرسلوا لي عروض الكتب الجديدة (اختياري)
    </label>
  </main>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 24px; background: rgba(251,246,236,0.97); border-top: 1px solid #E4D6BC; display: flex; gap: 8px">
    <a href="Create1.dc.html" style="min-height: 56px; padding: 0 16px; color: #16204A; font-weight: 600; font-size: 16px; display: flex; align-items: center; text-decoration: none">رجوع</a>
    <a href="Create3.dc.html" style="flex-grow: 1; min-height: 56px; border-radius: 999px; background: #16204A; color: #FBF6EC; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none">أوافق، لنكمل</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const points = [
      { n: '1', title: 'للرسم فقط', body: 'نستخدم الصورة لرسم شخصية ليان في كتابها، ولا شيء غير ذلك.' },
      { n: '2', title: 'تُحذف تلقائياً', body: 'نحذف الصورة الأصلية بعد اعتماد الكتاب، وبحد أقصى [عدد] يوماً.' },
      { n: '3', title: 'لا أحد يراها', body: 'لا تُنشر ولا تُشارك، ولا تُستخدم لتدريب أي نموذج ذكاء اصطناعي.' },
      { n: '4', title: 'القرار لك دائماً', body: 'يمكنك حذف ليان وكل بياناتها من حسابك بضغطة واحدة.' }
    ];
    return { points };
  }
}
</script>
</body>
</html>
