<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كتاب الصف — صفحة الصف الجماعية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#16204A;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#FBF6EC}
p{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 816px; height: 816px; position: relative; overflow: hidden; background: #16204A; display: flex; flex-direction: column; align-items: center; padding: 64px 56px 56px; box-sizing: border-box; gap: 18px">
  <svg width="816" height="816" viewBox="0 0 816 816" style="position: absolute; inset: 0" aria-hidden="true"><circle cx="660" cy="130" r="54" fill="#FCEFD2"/><g fill="#F2B33D"><circle cx="120" cy="110" r="3"/><circle cx="260" cy="70" r="2.5"/><circle cx="520" cy="96" r="2"/><path d="M180 150 C182 162 185 165 196 167 C185 169 182 172 180 184 C178 172 175 169 164 167 C175 165 178 162 180 150 Z"/></g><path d="M0 560 C200 520 600 530 816 560 L816 816 L0 816 Z" fill="#22306A"/><path d="M0 660 C220 630 600 640 816 660 L816 816 L0 816 Z" fill="#0E1530"/></svg>
  <p style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 40px; position: relative; text-align: center; line-height: 1.3">صف الفراشات تحت ضوء القمر<br><span style="font-size: 22px; color: #F5C465; font-weight: 600">[اسم الروضة] · 2027</span></p>
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 0; position: relative">
    <div style="display: flex; gap: 2px; align-items: flex-end">
      <sc-for list="{{row1}}" as="k" hint-placeholder-count="6"><div style="display: flex; flex-direction: column; align-items: center"><dc-import name="Kid" w="84" cap="{{true}}" hijab="{{k.hijab}}" hair-style="{{k.hair}}" skin="{{k.skin}}" outfit="{{k.outfit}}" pose="{{k.pose}}" hint-size="84px,98px"></dc-import></div></sc-for>
    </div>
    <div style="display: flex; gap: 2px; align-items: flex-end; margin-top: -30px">
      <sc-for list="{{row2}}" as="k" hint-placeholder-count="6"><div style="display: flex; flex-direction: column; align-items: center"><dc-import name="Kid" w="92" cap="{{true}}" hijab="{{k.hijab}}" hair-style="{{k.hair}}" skin="{{k.skin}}" outfit="{{k.outfit}}" pose="{{k.pose}}" hint-size="92px,107px"></dc-import></div></sc-for>
    </div>
    <div style="display: flex; gap: 0; align-items: flex-end; margin-top: -34px">
      <sc-for list="{{row3}}" as="k" hint-placeholder-count="6"><div style="display: flex; align-items: flex-end"><dc-import name="Kid" w="100" cap="{{true}}" hijab="{{k.hijab}}" hair-style="{{k.hair}}" skin="{{k.skin}}" outfit="{{k.outfit}}" pose="{{k.pose}}" hint-size="100px,117px"></dc-import><dc-import name="Companion" w="36" variant="{{k.comp}}" hint-size="36px,36px"></dc-import></div></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":816}}'>
class Component extends DCLogic {
  renderVals() {
    const skins = ['#C98F63', '#E8B98F', '#F3CFAE', '#8D5A3B'];
    const outfits = ['#5B6FC0', '#E9826B', '#7FA38A', '#A99BD6', '#F2B33D'];
    const hairs = ['short', 'long', 'curly'];
    const comps = ['blob', 'cat', 'robot'];
    const mk = (n, off) => Array.from({ length: n }, (_, i) => { const j = i + off; return { hijab: j % 4 === 1, hair: hairs[j % 3], skin: skins[j % 4], outfit: outfits[j % 5], pose: j % 3 === 0 ? 'wave' : j % 3 === 1 ? 'tilt' : 'front', comp: comps[j % 3] }; });
    return { row1: mk(7, 0), row2: mk(6, 7), row3: mk(5, 13) };
  }
}
</script>
</body>
</html>
