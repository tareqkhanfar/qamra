<!doctype html>

<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#16204A;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#FBF6EC}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}

</helmet>
<div dir="rtl" style="width: 1440px; height: 1000px; background: #16204A; display: flex; flex-direction: column; padding: 28px 48px; box-sizing: border-box; gap: 22px; position: relative; overflow: hidden">
  <svg width="1440" height="1000" viewBox="0 0 1440 1000" style="position: absolute; inset: 0" aria-hidden="true"><g fill="#F2B33D"><circle cx="120" cy="140" r="3"/><circle cx="1300" cy="120" r="2.5"/><circle cx="1360" cy="620" r="3"/><circle cx="80" cy="700" r="2"/><path d="M1200 60 C1202 72 1205 75 1216 77 C1205 79 1202 82 1200 94 C1198 82 1195 79 1184 77 C1195 75 1198 72 1200 60 Z"/></g></svg>
  <div style="display: flex; justify-content: space-between; align-items: center; position: relative">
    <div style="display: flex; flex-direction: column; gap: 2px"><a href="ClassReview.dc.html" style="font-size: 13px; color: #B9BEDA">→ مراجعة الصفحات</a><h1 style="font-size: 30px">الأغلفة الشخصية — 18 غلافاً</h1></div>
    <div style="display: flex; gap: 10px; align-items: center"><span style="font-size: 14px; color: #B9BEDA">اعتُمد 12 من 18</span><a href="ClassPrint.dc.html" style="min-height: 48px; padding: 0 22px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-weight: 700; font-size: 15px; display: flex; align-items: center">اعتماد الكل والمتابعة</a></div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 36px; position: relative">
    <button aria-label="الغلاف السابق" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid #2B3872; background: #22306A; color: #FBF6EC; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
    <div style="opacity: 0.45; transform: scale(0.8); border-radius: 6px 14px 14px 6px; overflow: hidden; border-right: 8px solid #0E1530; position: relative"><dc-import name="Scene" w="300" h="300" theme="grad" cap="{{true}}" companion="cat" hair-style="curly" skin="#C98F63" outfit="#5B6FC0" kid-scale="0.5" hint-size="300px,300px"></dc-import><span style="position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 28px; color: #16204A">يوسف</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="border-radius: 8px 20px 20px 8px; overflow: hidden; border-right: 12px solid #0E1530; box-shadow: 0 30px 70px rgba(0,0,0,0.5); position: relative">
        <dc-import name="Scene" w="440" h="440" theme="grad" cap="{{true}}" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" companion="blob" pose="wave" kid-scale="0.46" hint-size="440px,440px"></dc-import>
        <div style="position: absolute; top: 90px; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 46px; color: #16204A; line-height: 1.1">ليان</span><span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 700; font-size: 20px; color: #9A620A">ونونو في يوم التخرّج</span></div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center"><span style="padding: 6px 12px; border-radius: 999px; background: #DDEFE3; color: #2E7A52; font-size: 13px; font-weight: 700">معتمد</span><span style="font-size: 14px; color: #B9BEDA">3 من 18</span><button style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #2B3872; background: transparent; color: #FBF6EC; font-size: 14px">تعديل العنوان</button></div>
    </div>
    <div style="opacity: 0.45; transform: scale(0.8); border-radius: 6px 14px 14px 6px; overflow: hidden; border-right: 8px solid #0E1530; position: relative"><dc-import name="Scene" w="300" h="300" theme="grad" cap="{{true}}" companion="robot" hair-style="long" skin="#F3CFAE" outfit="#A99BD6" kid-scale="0.5" hint-size="300px,300px"></dc-import><span style="position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 28px; color: #16204A">سلمى</span></div>
    <button aria-label="الغلاف التالي" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: #F2B33D; color: #0E1530; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></button>
  </div>

  <div style="display: flex; gap: 8px; justify-content: center; position: relative">
    <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="18"><button aria-label="{{t.aria}}" style="{{t.style}}">{{t.name}}</button></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['يوسف', 'جنى', 'ليان', 'آدم', 'سلمى', 'كرم', 'تالا', 'عمر', 'ريم', 'زيد', 'مريم', 'حمزة', 'لين', 'علي', 'نور', 'سيف', 'هيا', 'بشير'];
    const ok = [0, 1, 2, 3, 4, 7, 8, 9, 12, 13, 15, 16];
    const thumbs = names.map((name, i) => ({ name, aria: 'غلاف ' + name, style: 'min-height:44px;padding:0 10px;border-radius:12px;font-size:13px;' + (i === 2 ? 'background:#F2B33D;color:#0E1530;border:0;font-weight:700' : ok.includes(i) ? 'background:#22306A;color:#FBF6EC;border:1px solid #2E7A52' : 'background:transparent;color:#B9BEDA;border:1px dashed #5B6FC0') }));
    return { thumbs };
  }
}
</script>
</body>
</html>
