<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قارئ الكتاب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#0E1530;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#FBF6EC}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
button,input{font-family:inherit}
a{color:#FBF6EC;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 900px; background: #0E1530; display: flex; flex-direction: column">
  <header style="height: 72px; padding: 0 32px; display: flex; align-items: center; gap: 16px">
    <a href="MyBooks.dc.html" aria-label="إغلاق القارئ" style="width: 44px; height: 44px; border-radius: 999px; background: #16204A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="font-size: 20px; flex-grow: 1">ليان وحارس النجوم</h1>
    <button style="min-height: 44px; padding: 0 16px; border: 1px solid #2B3872; border-radius: 999px; background: #16204A; color: #B9BEDA; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>استمع للحكاية · قريباً</button>
    <button aria-label="ملء الشاشة" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #16204A; color: #FBF6EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button aria-label="مشاركة" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #16204A; color: #FBF6EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  </header>

  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 40px">
    <button aria-label="الصفحة السابقة" style="width: 64px; height: 64px; border-radius: 999px; border: 1px solid #2B3872; background: #16204A; color: #FBF6EC; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
    <div style="display: flex; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5)">
      <dc-import name="Scene" w="560" h="560" theme="night" pose="wave" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" kid-scale="0.5" hint-size="560px,560px"></dc-import>
      <div style="width: 560px; height: 560px; box-sizing: border-box; padding: 72px; background: #FFFDF8; color: #1C2140; display: flex; flex-direction: column; justify-content: center; gap: 24px; background-image: linear-gradient(to left, rgba(22,32,74,0.10), transparent 40px)">
        <p style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-size: 30px; line-height: 1.8; font-weight: 600">لوّحت ليان للنجمة الصغيرة وقالت: "لا تخافي، سأبقى معك حتى يطلع الصباح."</p>
        <p style="font-size: 20px; line-height: 1.8; color: #585C72">فابتسمت النجمة، وأضاءت السماء كلها.</p>
        <span style="align-self: center; font-size: 15px; color: #585C72">— 13 —</span>
      </div>
    </div>
    <button aria-label="الصفحة التالية" style="width: 64px; height: 64px; border-radius: 999px; border: 0; background: #F2B33D; color: #0E1530; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></button>
  </main>

  <footer style="height: 96px; padding: 0 200px; display: flex; align-items: center; gap: 20px">
    <span style="font-size: 14px; color: #B9BEDA; white-space: nowrap">صفحة 12–13 من 20</span>
    <div style="flex-grow: 1; height: 6px; border-radius: 999px; background: #22306A; display: flex; position: relative"><div style="width: 62%; background: #F2B33D; border-radius: 999px"></div></div>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #B9BEDA; min-height: 44px">وضع الليل<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #F2B33D"></label>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
