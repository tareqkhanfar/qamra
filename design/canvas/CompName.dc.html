<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ارسم صاحبك — اسم الصاحب ونوعه</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
button,input{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 900px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E4D6BC">
    <a href="CompCrop.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
    <h1 style="font-size: 20px; color: #16204A; flex-grow: 1">عرّفنا على الصاحب</h1>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #585C72; padding-left: 8px"><dc-import name="Moon" size="18" p="0.33" hint-size="18px,18px"></dc-import>4 من 12</span>
  </header>

  <main style="padding: 20px 16px 120px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: center"><div style="transform: rotate(-3deg); box-shadow: 0 8px 20px rgba(22,32,74,0.18); border-radius: 6px; overflow: hidden"><dc-import name="Drawing" w="170" variant="blob" hint-size="170px,170px"></dc-import></div></div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="comp-name" style="font-size: 15px; font-weight: 600">ما اسمه؟</label>
      <input id="comp-name" value="نونو" style="min-height: 56px; padding: 0 16px; border: 1.5px solid #16204A; border-radius: 14px; background: #FFFFFF; font-size: 18px; outline: 3px solid #FCEFD2">
      <span style="font-size: 13px; color: #585C72">اسألوا ليان — هي أدرى باسمه</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 600; margin-bottom: 8px">ما هو؟</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
          <button aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 600; margin-bottom: 8px">كيف طبعه؟ <span style="font-weight: 400; color: #585C72">(اختياري)</span></legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{traits}}" as="t" hint-placeholder-count="5">
          <button aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </fieldset>
  </main>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 24px; background: rgba(251,246,236,0.97); border-top: 1px solid #E4D6BC; display: flex">
    <a href="CompGen.dc.html" style="flex-grow: 1; min-height: 56px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">حوّل الرسمة إلى نونو</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const big = (on) => 'min-height:56px;border-radius:16px;font-size:16px;' + (on ? 'border:2px solid #16204A;background:#E4E8F7;color:#16204A;font-weight:700' : 'border:1.5px solid #E4D6BC;background:#FFFDF8;color:#1C2140');
    const types = [['مخلوق', true], ['حيوان', false], ['روبوت', false], ['غير ذلك', false]].map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: big(on) }));
    const chip = (on) => 'min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;' + (on ? 'border:1.5px solid #16204A;background:#16204A;color:#FBF6EC;font-weight:600' : 'border:1.5px solid #E4D6BC;background:#FFFDF8;color:#1C2140');
    const traits = [['مضحك', true], ['شجاع', false], ['خجول', false], ['لطيف', true], ['فضولي', false]].map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: chip(on) }));
    return { types, traits };
  }
}
</script>
</body>
</html>
