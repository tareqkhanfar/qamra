<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حسابي — كتبي وأطفالي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
button{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1100px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 16px 16px 8px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column"><span style="font-size: 14px; color: #585C72">مساء الخير</span><h1 style="font-size: 26px; color: #16204A">أم ليان</h1></div>
    <button aria-label="الإشعارات" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E4D6BC; background: #FFFDF8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span style="position: absolute; top: 8px; left: 10px; width: 9px; height: 9px; border-radius: 999px; background: #B3261E; border: 2px solid #FFFDF8"></span></button>
  </header>

  <section aria-label="أطفالي" style="padding: 8px 0 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: center"><h2 style="font-size: 18px; color: #16204A">أطفالي</h2><a href="#" style="font-size: 14px; font-weight: 600; color: #9A620A; min-height: 44px; display: flex; align-items: center">إدارة</a></div>
    <div style="display: flex; gap: 14px; padding: 0 16px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 72px; height: 72px; border-radius: 999px; overflow: hidden; background: #FCEFD2; border: 3px solid #F2B33D; display: flex; align-items: flex-end; justify-content: center"><dc-import name="Kid" w="64" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" hint-size="64px,75px"></dc-import></div><span style="font-size: 14px; font-weight: 700">ليان</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 72px; height: 72px; border-radius: 999px; overflow: hidden; background: #E4E8F7; border: 3px solid transparent; display: flex; align-items: flex-end; justify-content: center"><dc-import name="Kid" w="64" hair-style="curly" outfit="#5B6FC0" hint-size="64px,75px"></dc-import></div><span style="font-size: 14px">كرم</span></div>
      <a href="Create1.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 72px; height: 72px; border-radius: 999px; border: 2px dashed #9A620A; display: flex; align-items: center; justify-content: center; color: #9A620A"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span style="font-size: 14px; color: #9A620A; font-weight: 600">طفل جديد</span></a>
    </div>
  </section>

  <div role="tablist" style="display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid #E4D6BC">
    <button role="tab" aria-selected="true" style="min-height: 48px; padding: 0 14px; border: 0; background: transparent; border-bottom: 3px solid #F2B33D; color: #16204A; font-weight: 700; font-size: 15px">كتب ليان (3)</button>
    <button role="tab" aria-selected="false" style="min-height: 48px; padding: 0 14px; border: 0; background: transparent; border-bottom: 3px solid transparent; color: #585C72; font-size: 15px">طلباتي</button>
  </div>

  <main style="padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 16px">
    <a href="Create8.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: #16204A; color: #FBF6EC">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #22306A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F2B33D" aria-hidden="true"><path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2 Z"/></svg></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 15px">نرسم "ليان وقارب الأحلام"</strong><div style="height: 6px; border-radius: 999px; background: #0E1530; display: flex"><div style="width: 40%; background: #F2B33D; border-radius: 999px"></div></div></div>
      <span style="font-size: 13px; color: #F5C465; font-weight: 600">40%</span>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{books}}" as="b" hint-placeholder-count="2">
        <a href="{{b.href}}" style="display: flex; flex-direction: column; gap: 8px; color: #1C2140">
          <div style="background: #F3EAD8; border-radius: 18px; padding: 14px; display: flex; justify-content: center">
            <div style="border-radius: 4px 10px 10px 4px; overflow: hidden; border-right: 6px solid #0E1530; box-shadow: 0 6px 16px rgba(22,32,74,0.18)"><dc-import name="Scene" w="120" h="120" theme="{{b.theme}}" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" kid-scale="0.62" hint-size="120px,120px"></dc-import></div>
          </div>
          <strong style="font-size: 15px; line-height: 1.4">{{b.title}}</strong>
          <span style="{{b.chip}}">{{b.status}}</span>
        </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="التنقل الرئيسي" style="position: absolute; bottom: 0; left: 0; right: 0; height: 80px; padding-bottom: 12px; box-sizing: border-box; background: #FFFDF8; border-top: 1px solid #E4D6BC; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Landing.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #585C72"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>الرئيسية</a>
    <a href="MyBooks.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: #16204A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1v13c3-1 6-.5 8 1 2-1.5 5-2 8-1V5c-3-1-6-.5-8 1z"/><path d="M12 6v13"/></svg>كتبي</a>
    <a href="Create1.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #585C72"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>كتاب جديد</a>
    <a href="Privacy.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #585C72"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>حسابي</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (bg, fg) => 'align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:' + bg + ';color:' + fg;
    const books = [
      { title: 'ليان ورحلة إلى القمر', theme: 'space', status: 'قيد الطباعة', chip: chip('#F3EAD8', '#1C2140'), href: 'Tracking.dc.html' },
      { title: 'ليان وحارس النجوم', theme: 'night', status: 'تم التوصيل', chip: chip('#DDEFE3', '#2E7A52'), href: 'Reader.dc.html' },
      { title: 'ليان وأصدقاء الحارة', theme: 'garden', status: 'بانتظار الطلب', chip: chip('#FCEFD2', '#9A620A'), href: 'Create9.dc.html' }
    ];
    return { books };
  }
}
</script>
</body>
</html>
