<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قمرة — خيارات الشعار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1100px; box-sizing: border-box; padding: 56px 64px; background: #FBF6EC; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 6px"><h1 style="font-size: 44px; color: #16204A">شعار قمرة — ثلاثة خيارات</h1><p style="font-size: 17px; color: #585C72">«ليالي القمرة»: سهرات العائلة تحت ضوء القمر، حين تحكي الجدّة. كل خيار يعمل بلون واحد، وبمقاس 24px، وعلى كعب الكتاب.</p></div>
    <p style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-size: 22px; font-weight: 600; color: #9A620A">حكاية طفلك… تحت ضوء القمر</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="font-size: 24px; color: #16204A">{{o.name}}</h2><span style="font-size: 13px; color: #585C72">{{o.tag}}</span></div>
        <div style="height: 230px; border-radius: 24px; background: #FFFDF8; border: 1px solid #E4D6BC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
          <div style="display: flex; align-items: center; gap: 14px">
            <svg width="92" height="92" viewBox="0 0 48 48" aria-hidden="true"><path d="{{o.p1}}" fill="{{o.c1}}" fill-rule="evenodd"></path><path d="{{o.p2}}" fill="{{o.c2}}"></path><path d="{{o.p3}}" fill="none" stroke="#16204A" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 76px; line-height: 1; color: #16204A">قمرة</span>
          </div>
          <span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.22em; color: #9A620A; direction: ltr">QAMRA</span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div style="height: 130px; border-radius: 20px; background: #16204A; display: flex; align-items: center; justify-content: center; gap: 10px">
            <svg width="52" height="52" viewBox="0 0 48 48" aria-hidden="true"><path d="{{o.p1}}" fill="{{o.c1}}" fill-rule="evenodd"></path><path d="{{o.p2}}" fill="{{o.c2d}}"></path><path d="{{o.p3}}" fill="none" stroke="#FBF6EC" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 42px; color: #FBF6EC">قمرة</span>
          </div>
          <div style="height: 130px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4D6BC; display: flex; align-items: center; justify-content: center; gap: 10px">
            <svg width="52" height="52" viewBox="0 0 48 48" aria-hidden="true"><path d="{{o.p1}}" fill="#111111" fill-rule="evenodd"></path><path d="{{o.p2}}" fill="{{o.c2m}}"></path><path d="{{o.p3}}" fill="none" stroke="#111111" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 42px; color: #111111">قمرة</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: stretch">
          <div style="flex-grow: 1; border-radius: 20px; background: #F3EAD8; display: flex; align-items: center; justify-content: space-around; padding: 16px">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 72px; height: 72px; border-radius: 20px; background: #16204A; display: flex; align-items: center; justify-content: center"><svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="{{o.p1}}" fill="{{o.c1}}" fill-rule="evenodd"></path><path d="{{o.p2}}" fill="{{o.c2d}}"></path><path d="{{o.p3}}" fill="none" stroke="#FBF6EC" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><span style="font-size: 12px; color: #585C72">أيقونة التطبيق</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="{{o.p1}}" fill="#16204A" fill-rule="evenodd"></path><path d="{{o.p2}}" fill="{{o.c2m2}}"></path><path d="{{o.p3}}" fill="none" stroke="#16204A" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 12px; color: #585C72">48px</span></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path d="{{o.p1}}" fill="#16204A" fill-rule="evenodd"></path><path d="{{o.p2}}" fill="{{o.c2m2}}"></path><path d="{{o.p3}}" fill="none" stroke="#16204A" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 12px; color: #585C72">24px</span></div>
          </div>
          <div aria-label="كعب الكتاب" style="width: 56px; height: 200px; border-radius: 6px; background: #16204A; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 0; box-sizing: border-box">
            <span style="writing-mode: vertical-rl; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 700; font-size: 16px; color: #FBF6EC">ليان ورحلة إلى القمر</span>
            <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><path d="{{o.p1}}" fill="{{o.c1}}" fill-rule="evenodd"></path><path d="{{o.p2}}" fill="{{o.c2d}}"></path><path d="{{o.p3}}" fill="none" stroke="#FBF6EC" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
        </div>
        <p style="font-size: 14px; line-height: 1.7; color: #585C72">{{o.why}}</p>
      </section>
    </sc-for>
  </div>
<p style="margin: 0">كتاب الص</p></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const CRES = 'M21.32 5.01 A17 17 0 1 0 38.12 27.41 A14 14 0 0 1 21.32 5.01 Z';
    const STAR = 'M34 8 C34.6 11.2 35.8 12.4 39 13 C35.8 13.6 34.6 14.8 34 18 C33.4 14.8 32.2 13.6 29 13 C32.2 12.4 33.4 11.2 34 8 Z';
    const opts = [
      { name: 'أ — هلال على صفحة', tag: 'مقترح', p1: CRES, p2: STAR, p3: 'M6 44 Q15 39.5 24 43.5 Q33 39.5 42 44', sw: 3, c1: '#F2B33D', c2: '#16204A', c2d: '#FBF6EC', c2m: '#111111', c2m2: '#16204A',
        why: 'هلال يستقر على صفحتي كتاب مفتوح، ونجمة صغيرة. يُقرأ "قمر + حكاية" من أول نظرة، ويبقى واضحاً بمقاس 24px.' },
      { name: 'ب — بدر ونجمة', tag: 'دافئ وبسيط', p1: 'M24 4 a20 20 0 1 0 0.001 0 Z M29 14 C29.8 18.2 31.3 19.7 35.5 20.5 C31.3 21.3 29.8 22.8 29 27 C28.2 22.8 26.7 21.3 22.5 20.5 C26.7 19.7 28.2 18.2 29 14 Z', p2: 'M16 25 a3 3 0 1 0 0.001 0 Z M22 33 a1.8 1.8 0 1 0 0.001 0 Z', p3: '', sw: 0, c1: '#F2B33D', c2: '#DB9A1F', c2d: '#DB9A1F', c2m: '#FFFFFF', c2m2: '#FBF6EC',
        why: 'بدر ليلة السهرة، ونجمة مفرّغة داخله. أبسط الخيارات وأقواها كختم على الغلاف الخلفي وكصورة حساب.' },
      { name: 'ج — قمرة في نافذة', tag: 'محلي ومميز', p1: 'M22.6 14 A11 11 0 1 0 33.5 31.3 A9 9 0 0 1 22.6 14 Z', p2: '', p3: 'M8 46 V22 A16 16 0 0 1 40 22 V46 M4 46 H44', sw: 3.5, c1: '#F2B33D', c2: '#16204A', c2d: '#FBF6EC', c2m: '#111111', c2m2: '#16204A',
        why: 'قنطرة شبّاك البيت العربي القديم، والقمر يطلّ منها. يحمل حنين "ليالي القمرة" ويبدو فريداً بين المنافسين.' }
    ];
    return { opts };
  }
}
</script>
</body>
</html>
