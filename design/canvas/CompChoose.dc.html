<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ارسم صاحبك — اختر صاحبك</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700}
p{margin:0}
button,input{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1000px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E4D6BC">
    <a href="CompName.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
    <h1 style="font-size: 20px; color: #16204A; flex-grow: 1">أيّهما نونو؟</h1>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #585C72; padding-left: 8px"><dc-import name="Moon" size="18" p="0.38" hint-size="18px,18px"></dc-import>4 من 12</span>
  </header>

  <main style="padding: 16px 16px 170px; display: flex; flex-direction: column; gap: 14px">
    <p style="font-size: 15px; color: #585C72; line-height: 1.6">رسمنا نونو بطريقتين. اختاري الأقرب لرسمة ليان.</p>
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
      <label style="{{o.card}}">
        <input type="radio" name="comp" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <div style="display: flex; align-items: center; gap: 10px">
          <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="border-radius: 8px; overflow: hidden; border: 1px solid #E4D6BC"><dc-import name="Drawing" w="96" variant="blob" hint-size="96px,96px"></dc-import></div><figcaption style="font-size: 12px; color: #585C72">رسمتها</figcaption></figure>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A620A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
          <div style="{{o.stage}}"><dc-import name="Companion" w="170" variant="blob" pose="{{o.pose}}" hint-size="170px,170px"></dc-import></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 16px">{{o.name}}</strong><span style="{{o.check}}">✓</span></div>
        <span style="font-size: 13px; color: #585C72">{{o.note}}</span>
      </label>
    </sc-for>
  </main>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 24px; background: rgba(251,246,236,0.97); border-top: 1px solid #E4D6BC; display: flex; flex-direction: column; gap: 8px">
    <a href="Create4.dc.html" style="min-height: 56px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">هذا نونو!</a>
    <button style="min-height: 48px; border-radius: 999px; border: 2px solid #16204A; background: transparent; color: #16204A; font-weight: 700; font-size: 15px">ارسمه من جديد · بقي 2 من 3</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (on) => 'position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:24px;background:#FFFDF8;border:' + (on ? '3px solid #F2B33D;box-shadow:0 8px 24px rgba(242,179,61,0.25)' : '1.5px solid #E4D6BC');
    const check = (on) => on ? 'width:28px;height:28px;border-radius:999px;background:#F2B33D;color:#0E1530;font-weight:800;display:flex;align-items:center;justify-content:center' : 'width:28px;height:28px;border-radius:999px;border:2px solid #E4D6BC;color:transparent;display:flex;align-items:center;justify-content:center';
    const opts = [
      { name: 'الخيار الأول — أقرب للرسمة', note: 'نفس الأرجل الثلاث والعين الواحدة والنجمتين', pose: 'front', card: card(true), check: check(true), stage: 'flex-grow:1;height:180px;border-radius:18px;background:#E4E8F7;display:flex;align-items:center;justify-content:center' },
      { name: 'الخيار الثاني — أكثر حركة', note: 'يلوّح بيده، وألوانه أنعم قليلاً', pose: 'wave', card: card(false), check: check(false), stage: 'flex-grow:1;height:180px;border-radius:18px;background:#FCEFD2;display:flex;align-items:center;justify-content:center' }
    ];
    return { opts };
  }
}
</script>
</body>
</html>
