<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الكتاب — صفحة الصف (كتب التخرّج)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FFFDF8;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
p{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 816px; height: 816px; position: relative; overflow: hidden; background: #FFFDF8; display: flex; flex-direction: column; align-items: center; padding: 96px 72px 60px; box-sizing: border-box; gap: 18px; text-align: center">
  <svg width="816" height="100" viewBox="0 0 816 100" style="position: absolute; top: 0; left: 0" aria-hidden="true"><path d="M0 16 Q408 110 816 16" fill="none" stroke="#9A620A" stroke-width="2"/><g><path d="M50 26 L76 30 L60 62 Z" fill="#E9826B"/><path d="M150 44 L178 48 L160 80 Z" fill="#7FA38A"/><path d="M260 56 L288 58 L272 90 Z" fill="#A99BD6"/><path d="M380 62 L408 62 L394 94 Z" fill="#F2B33D"/><path d="M500 60 L528 58 L516 90 Z" fill="#E9826B"/><path d="M620 50 L648 46 L638 78 Z" fill="#7FA38A"/><path d="M730 32 L756 26 L752 58 Z" fill="#A99BD6"/></g></svg>
  <div style="display: flex; align-items: center; gap: 16px"><div style="width: 72px; height: 72px; border-radius: 999px; border: 2px dashed #9A620A; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #9A620A">الشعار</div><div style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 800; font-size: 34px; color: #16204A">صف الفراشات · 2027</span><span style="font-size: 18px; color: #585C72">[اسم الروضة]</span></div></div>
  <div style="width: 100%; height: 250px; border-radius: 16px; background: #E4E8F7; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #33458F; font-weight: 600">صورة الصف الجماعية</div>
  <p style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.7; max-width: 600px">"أحبائي الفراشات، كنتم نور صفّنا طوال السنة. أنتم جاهزون للطيران إلى الصف الأول." — أ. رنا</p>
  <div style="display: flex; flex-direction: column; gap: 8px; width: 100%">
    <span style="font-size: 16px; font-weight: 700; color: #9A620A">أصدقائي في الصف</span>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 12px; font-size: 16px">
      <sc-for list="{{names}}" as="n" hint-placeholder-count="18"><span style="{{n.style}}">{{n.name}}</span></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":816}}'>
class Component extends DCLogic {
  renderVals() {
    const list = ['يوسف', 'جنى', 'ليان', 'آدم', 'سلمى', 'كرم', 'تالا', 'عمر', 'ريم', 'زيد', 'مريم', 'حمزة', 'لين', 'علي', 'نور', 'سيف', 'هيا', 'بشير'];
    const names = list.map((name) => ({ name, style: name === 'ليان' ? 'font-weight:800;color:#16204A;background:#FCEFD2;border-radius:999px;padding:2px 0' : 'padding:2px 0' }));
    return { names };
  }
}
</script>
</body>
</html>
