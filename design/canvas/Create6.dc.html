<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخطوة 6 — اختيار الحكاية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button,input{font-family:inherit}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1000px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E4D6BC">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
      <a href="Landing.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <strong style="font-size: 16px">كتاب ليان</strong>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px"><strong style="color: #16204A">الحكاية</strong><span style="display: flex; align-items: center; gap: 6px; color: #585C72"><dc-import name="Moon" size="18" p="0.58" hint-size="18px,18px"></dc-import>الخطوة 7 من 12</span></div>
    <div style="height: 6px; border-radius: 999px; background: #F3EAD8; display: flex"><div style="width: 58%; background: #16204A; border-radius: 999px"></div></div>
  </header>

  <main style="padding: 20px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="font-size: 26px; color: #16204A">إلى أين تذهب ليان؟</h1><p style="font-size: 15px; color: #585C72">اقترحنا لك ما يناسب عمرها واهتماماتها أولاً.</p></div>
    <sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
      <label style="{{t.card}}">
        <input type="radio" name="theme" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <div style="flex-shrink: 0; border-radius: 14px; overflow: hidden"><dc-import name="Scene" w="112" h="112" theme="{{t.theme}}" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" kid-scale="0.72" hint-size="112px,112px"></dc-import></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="{{t.tagStyle}}">{{t.tag}}</span>
          <h2 style="font-size: 19px; color: #16204A">{{t.title}}</h2>
          <p style="font-size: 13px; line-height: 1.6; color: #585C72">{{t.line}}</p>
        </div>
        <span style="{{t.check}}">✓</span>
      </label>
    </sc-for>
    <a href="Themes.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #9A620A">عرض كل العوالم (12)</a>
  </main>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 24px; background: rgba(251,246,236,0.97); border-top: 1px solid #E4D6BC; display: flex; gap: 8px">
    <a href="Create5.dc.html" style="min-height: 56px; padding: 0 16px; color: #16204A; font-weight: 600; font-size: 16px; display: flex; align-items: center">رجوع</a>
    <a href="Create7.dc.html" style="flex-grow: 1; min-height: 56px; border-radius: 999px; background: #16204A; color: #FBF6EC; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">اكتب الحكاية</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (on) => 'position:relative;display:flex;gap:12px;align-items:center;padding:10px;border-radius:20px;background:#FFFDF8;border:' + (on ? '3px solid #F2B33D' : '1.5px solid #E4D6BC');
    const check = (on) => on ? 'flex-shrink:0;width:28px;height:28px;border-radius:999px;background:#F2B33D;color:#0E1530;font-weight:800;display:flex;align-items:center;justify-content:center' : 'flex-shrink:0;width:28px;height:28px;border-radius:999px;border:2px solid #E4D6BC;color:transparent;display:flex;align-items:center;justify-content:center';
    const tag = (s) => s ? 'align-self:flex-start;padding:2px 8px;border-radius:999px;background:#FCEFD2;color:#9A620A;font-size:11px;font-weight:700' : 'display:none';
    const themes = [
      { theme: 'space', title: 'ليان ورحلة إلى القمر', line: 'لأنها تحب الفضاء. 24 صفحة.', tag: 'مقترح لليان', on: true },
      { theme: 'night', title: 'ليان وحارس النجوم', line: 'قصة قبل النوم عن الشجاعة. 20 صفحة.', tag: '', on: false },
      { theme: 'garden', title: 'ليان وأصدقاء الحارة', line: 'لأنها تحب الحيوانات. 16 صفحة.', tag: 'مقترح لليان', on: false },
      { theme: 'sea', title: 'ليان وقارب الأحلام', line: 'مغامرة بحرية وصديق جديد. 24 صفحة.', tag: '', on: false }
    ].map((t) => ({ ...t, card: card(t.on), check: check(t.on), tagStyle: tag(t.tag) }));
    return { themes };
  }
}
</script>
</body>
</html>
