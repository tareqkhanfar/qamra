<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مشهد من الكتاب — رسم أصلي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
  <svg width="100%" height="100%" viewBox="0 0 480 480" preserveAspectRatio="xMidYMax slice" style="position: absolute; inset: 0" aria-hidden="true">
    <g display="{{nightD}}">
      <rect width="480" height="480" fill="#1F2C63"></rect>
      <rect width="480" height="220" fill="#16204A"></rect>
      <circle cx="360" cy="96" r="44" fill="#FCEFD2"></circle>
      <circle cx="380" cy="84" r="40" fill="#16204A"></circle>
      <g fill="#F2B33D"><path d="M90 60 C92 74 96 78 110 80 C96 82 92 86 90 100 C88 86 84 82 70 80 C84 78 88 74 90 60 Z"></path><path d="M250 120 C251 127 253 129 260 130 C253 131 251 133 250 140 C249 133 247 131 240 130 C247 129 249 127 250 120 Z"></path><circle cx="170" cy="40" r="3"></circle><circle cx="300" cy="50" r="2.5"></circle><circle cx="40" cy="150" r="2.5"></circle><circle cx="440" cy="190" r="3"></circle><circle cx="200" cy="170" r="2"></circle></g>
      <path d="M0 330 C90 280 170 300 250 320 S400 290 480 310 L480 480 L0 480 Z" fill="#22306A"></path>
      <path d="M380 300 L380 250 L410 226 L440 250 L440 300 Z" fill="#0E1530"></path>
      <rect x="402" y="258" width="16" height="18" rx="3" fill="#F2B33D"></rect>
      <path d="M0 380 C120 350 220 370 300 390 S430 370 480 380 L480 480 L0 480 Z" fill="#0E1530"></path>
    </g>
    <g display="{{gardenD}}">
      <rect width="480" height="480" fill="#FCEFD2"></rect>
      <circle cx="96" cy="100" r="46" fill="#F2B33D"></circle>
      <path d="M0 300 C100 250 200 270 300 280 S420 250 480 260 L480 480 L0 480 Z" fill="#A9C7B1"></path>
      <g>
        <rect x="378" y="220" width="12" height="80" rx="5" fill="#6B4E34"></rect>
        <circle cx="366" cy="210" r="30" fill="#7FA38A"></circle><circle cx="400" cy="200" r="32" fill="#6E9579"></circle><circle cx="384" cy="176" r="26" fill="#7FA38A"></circle>
        <g fill="#3E6B4D"><circle cx="372" cy="200" r="3.5"></circle><circle cx="398" cy="186" r="3.5"></circle><circle cx="410" cy="214" r="3.5"></circle><circle cx="360" cy="222" r="3.5"></circle></g>
        <rect x="70" y="236" width="10" height="64" rx="4" fill="#6B4E34"></rect>
        <circle cx="62" cy="228" r="24" fill="#6E9579"></circle><circle cx="90" cy="222" r="24" fill="#7FA38A"></circle><circle cx="76" cy="202" r="20" fill="#6E9579"></circle>
      </g>
      <path d="M0 370 C120 340 240 360 330 372 S440 356 480 362 L480 480 L0 480 Z" fill="#7FA38A"></path>
      <g fill="#E9826B"><circle cx="150" cy="360" r="5"></circle><circle cx="330" cy="380" r="5"></circle><circle cx="420" cy="400" r="5"></circle></g>
    </g>
    <g display="{{seaD}}">
      <rect width="480" height="480" fill="#E4E8F7"></rect>
      <circle cx="380" cy="100" r="40" fill="#F2B33D"></circle>
      <path d="M40 90 q16 -14 32 0 q16 -14 32 0" fill="none" stroke="#5A4A9C" stroke-width="3" stroke-linecap="round"></path>
      <path d="M0 280 L480 280 L480 480 L0 480 Z" fill="#5B6FC0"></path>
      <path d="M340 250 L420 250 L404 276 L356 276 Z" fill="#E9826B"></path>
      <path d="M380 250 L380 190 L412 244 Z" fill="#FFFDF8"></path>
      <path d="M0 300 q30 -16 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#E4E8F7" stroke-width="4" stroke-linecap="round"></path>
      <path d="M0 360 C120 330 240 350 330 364 S440 350 480 356 L480 480 L0 480 Z" fill="#F3EAD8"></path>
    </g>
    <g display="{{spaceD}}">
      <rect width="480" height="480" fill="#0E1530"></rect>
      <circle cx="110" cy="120" r="54" fill="#E9826B"></circle>
      <ellipse cx="110" cy="124" rx="92" ry="18" fill="none" stroke="#F4B3A2" stroke-width="6" transform="rotate(-14 110 124)"></ellipse>
      <circle cx="380" cy="70" r="18" fill="#CBC1EA"></circle>
      <g fill="#F2B33D"><path d="M300 150 C302 162 305 165 316 167 C305 169 302 172 300 184 C298 172 295 169 284 167 C295 165 298 162 300 150 Z"></path><circle cx="220" cy="60" r="3"></circle><circle cx="440" cy="180" r="3"></circle><circle cx="40" cy="240" r="2.5"></circle><circle cx="250" cy="230" r="2"></circle><circle cx="420" cy="290" r="2.5"></circle></g>
      <path d="M0 380 C120 344 360 344 480 380 L480 480 L0 480 Z" fill="#CBC1EA"></path>
      <g fill="#A99BD6"><circle cx="120" cy="400" r="12"></circle><circle cx="360" cy="420" r="16"></circle></g>
    </g>
    <g display="{{gradD}}">
      <rect width="480" height="480" fill="#FBF6EC"></rect>
      <path d="M0 40 Q240 110 480 40" fill="none" stroke="#9A620A" stroke-width="2"></path>
      <g><path d="M30 46 L50 46 L40 70 Z" fill="#E9826B"></path><path d="M90 60 L110 62 L98 86 Z" fill="#7FA38A"></path><path d="M150 70 L172 72 L158 96 Z" fill="#A99BD6"></path><path d="M212 76 L234 76 L222 100 Z" fill="#F2B33D"></path><path d="M274 76 L296 74 L286 98 Z" fill="#E9826B"></path><path d="M336 70 L358 68 L348 92 Z" fill="#7FA38A"></path><path d="M398 60 L418 56 L412 80 Z" fill="#A99BD6"></path><path d="M450 46 L470 44 L464 68 Z" fill="#F2B33D"></path></g>
      <g fill="#F2B33D"><path d="M80 170 C82 182 85 185 96 187 C85 189 82 192 80 204 C78 192 75 189 64 187 C75 185 78 182 80 170 Z"></path><path d="M400 150 C401 158 403 160 410 161 C403 162 401 164 400 172 C399 164 397 162 390 161 C397 160 399 158 400 150 Z"></path></g>
      <rect x="0" y="380" width="480" height="100" fill="#16204A"></rect>
      <rect x="0" y="372" width="480" height="12" fill="#22306A"></rect>
    </g>
  </svg>
  <div style="position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; align-items: flex-end; gap: 4px">
    <sc-if value="{{hasComp}}" hint-placeholder-val="{{false}}"><div style="{{compWrap}}"><dc-import name="Companion" w="{{compW}}" variant="{{companion}}" pose="{{compPose}}" hint-size="{{compW}}px,{{compW}}px"></dc-import></div></sc-if>
    <dc-import name="Kid" w="{{kidW}}" skin="{{skin}}" hair="{{hair}}" outfit="{{outfit}}" hair-style="{{hairStyle}}" hijab="{{hijab}}" hijab-color="{{hijabColor}}" pose="{{pose}}" cap="{{cap}}" hint-size="{{kidW}}px,{{kidH}}px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":480,"min":80,"max":1200},"h":{"editor":"int","default":480,"min":80,"max":1200},"theme":{"editor":"enum","default":"night","options":["night","garden","sea","space","grad"]},"kidScale":{"editor":"range","default":0.55,"min":0.2,"max":0.9,"step":0.05},"skin":{"editor":"color","default":"#E8B98F"},"hair":{"editor":"color","default":"#3A2A22"},"outfit":{"editor":"color","default":"#E9826B"},"hairStyle":{"editor":"enum","default":"short","options":["short","long","curly"]},"hijab":{"editor":"boolean","default":false},"hijabColor":{"editor":"color","default":"#A99BD6"},"pose":{"editor":"enum","default":"front","options":["front","wave","tilt"]},"cap":{"editor":"boolean","default":false},"radius":{"editor":"int","default":0,"min":0,"max":40},"companion":{"editor":"enum","default":"","options":["","blob","cat","robot"]},"compPose":{"editor":"enum","default":"wave","options":["front","wave"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const w = p.w ?? 480, h = p.h ?? 480;
    const t = p.theme ?? 'night';
    const kidW = Math.round(Math.min(w, h) * (p.kidScale ?? 0.55));
    const d = (x) => (t === x ? 'inline' : 'none');
    return {
      rootStyle: 'position:relative;overflow:hidden;width:' + w + 'px;height:' + h + 'px;border-radius:' + (p.radius ?? 0) + 'px;background:#16204A',
      nightD: d('night'), gardenD: d('garden'), seaD: d('sea'), spaceD: d('space'), gradD: d('grad'),
      kidW, kidH: Math.round(kidW * 280 / 240),
      skin: p.skin ?? '#E8B98F', hair: p.hair ?? '#3A2A22', outfit: p.outfit ?? '#E9826B',
      hairStyle: p.hairStyle ?? 'short', hijab: !!p.hijab, hijabColor: p.hijabColor ?? '#A99BD6',
      pose: p.pose ?? 'front', cap: !!p.cap,
      companion: p.companion || '', hasComp: !!p.companion, compPose: p.compPose ?? 'wave',
      compW: Math.round(kidW * 0.78), compWrap: 'margin-bottom:' + Math.round(kidW * 0.02) + 'px'
    };
  }
}
</script>
</body>
</html>
