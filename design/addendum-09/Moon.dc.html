<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طور القمر — مؤشر تقدّم</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
  <svg width="100%" height="100%" viewBox="0 0 40 40" role="img" aria-label="{{label}}">
    <circle cx="20" cy="20" r="17" fill="{{dark}}" stroke="{{lit}}" stroke-width="1.5" stroke-opacity="0.55"></circle>
    <path d="{{d}}" fill="{{lit}}"></path>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":160,"min":12,"max":400},"p":{"editor":"range","default":0.6,"min":0,"max":1,"step":0.05},"lit":{"editor":"color","default":"#F2B33D","options":["#F2B33D","#FCEFD2","#16204A"]},"dark":{"editor":"color","default":"#22306A","options":["#22306A","#E4D6BC","#0E1530"]},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 160);
    const p = Math.max(0, Math.min(1, Number(this.props.p ?? 0.6)));
    const r = 17, cx = 20, cy = 20;
    const rx = (r * Math.abs(1 - 2 * p)).toFixed(2);
    const sweep = p > 0.5 ? 1 : 0;
    const d = p <= 0.001 ? '' : 'M' + cx + ' ' + (cy - r) + ' A' + r + ' ' + r + ' 0 0 1 ' + cx + ' ' + (cy + r) + ' A' + rx + ' ' + r + ' 0 0 ' + sweep + ' ' + cx + ' ' + (cy - r) + ' Z';
    return {
      rootStyle: 'width:' + size + 'px;height:' + size + 'px;flex-shrink:0;display:inline-block',
      d, lit: this.props.lit ?? '#F2B33D', dark: this.props.dark ?? '#22306A',
      label: 'اكتمل ' + Math.round(p * 100) + '%'
    };
  }
}
</script>
</body>
</html>
