<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإضافات — بعد المعاينة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button{font-family:inherit;cursor:pointer}
a{color:#16204A;text-decoration:none}
summary{cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1560px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E4D6BC">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
      <a href="Create9.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
      <strong style="font-size: 16px">ليان وموسم الزيتون</strong>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px"><strong style="color: #16204A">الإضافات</strong><span style="display: flex; align-items: center; gap: 6px; color: #585C72"><dc-import name="Moon" size="18" p="0.88" hint-size="18px,18px"></dc-import>اختياري</span></div>
  </header>

  <main style="padding: 20px 16px 130px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 14px; align-items: center; background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 20px; padding: 12px">
      <div style="flex-shrink: 0; border-radius: 4px 10px 10px 4px; overflow: hidden; border-right: 5px solid #0E1530"><dc-import name="Scene" w="72" h="72" theme="garden" hijab="{{true}}" hijab-color="#E9826B" outfit="#F2B33D" kid-scale="0.62" hint-size="72px,72px"></dc-import></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">قمرة كلاسيك · غلاف ورقي</strong><span style="font-size: 13px; color: #585C72">ألوان مائية · 20 صفحة · مع نسخة رقمية مجانية</span></div>
      <strong style="font-size: 16px">69 ₪</strong>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="font-size: 26px; color: #16204A">بدك تزيد الفرحة؟</h1><p style="font-size: 15px; color: #585C72">كلها اختيارية. تقدر تكمل بدونها.</p></div>

    <sc-for list="{{main}}" as="a" hint-placeholder-count="5">
      <button onClick="{{a.toggle}}" aria-pressed="{{a.on}}" style="{{a.card}}">
        <span style="{{a.iconBox}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"/></svg></span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: right">
          <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap"><strong style="font-size: 16px">{{a.name}}</strong><span style="{{a.tagStyle}}">{{a.tag}}</span></div>
          <span style="font-size: 13px; line-height: 1.5; color: #585C72">{{a.desc}}</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><strong style="font-size: 15px; white-space: nowrap">+{{a.price}} ₪</strong><span style="{{a.check}}">✓</span></div>
      </button>
    </sc-for>

    <details style="background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 18px; padding: 0 14px">
      <summary style="min-height: 56px; display: flex; align-items: center; font-weight: 700; font-size: 16px; color: #16204A">إضافات أخرى ({{moreCount}})</summary>
      <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px">
        <sc-for list="{{more}}" as="a" hint-placeholder-count="3">
          <button onClick="{{a.toggle}}" aria-pressed="{{a.on}}" style="{{a.card}}">
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: right"><strong style="font-size: 15px">{{a.name}}</strong><span style="font-size: 13px; color: #585C72">{{a.desc}}</span></div>
            <strong style="font-size: 15px; white-space: nowrap">+{{a.price}} ₪</strong>
            <span style="{{a.check}}">✓</span>
          </button>
        </sc-for>
      </div>
    </details>

    <div style="display: flex; gap: 10px; align-items: center; background: #DDEFE3; border-radius: 16px; padding: 12px 14px; font-size: 14px; color: #1C2140"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7A52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>النسخة الرقمية مشمولة مجاناً مع الكتاب المطبوع</div>
  </main>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 24px; background: rgba(251,246,236,0.97); border-top: 1px solid #E4D6BC; display: flex; gap: 12px; align-items: center">
    <div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #585C72">{{countLabel}}</span><strong style="font-size: 19px">{{total}} ₪</strong></div>
    <a href="Cart.dc.html" style="flex-grow: 1; min-height: 56px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">أضف للسلة</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const picked = s.picked || { box: true, copy: true };
    const toggle = (id) => () => this.setState({ picked: { ...picked, [id]: !picked[id] } });
    const card = (on) => 'display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;color:#1C2140;background:' + (on ? '#FFF6E0' : '#FFFDF8') + ';border:' + (on ? '2px solid #F2B33D' : '1.5px solid #E4D6BC');
    const check = (on) => 'width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;' + (on ? 'background:#F2B33D;color:#0E1530' : 'background:#FFFFFF;color:transparent;border:2px solid #C9BCA3;box-sizing:border-box');
    const iconBox = 'flex-shrink:0;width:48px;height:48px;border-radius:14px;background:#F3EAD8;display:flex;align-items:center;justify-content:center';
    const tag = (t) => t ? 'padding:2px 8px;border-radius:999px;background:#E4E8F7;color:#16204A;font-size:11px;font-weight:700' : 'display:none';
    const mk = (a) => ({ ...a, on: !!picked[a.id], card: card(!!picked[a.id]), check: check(!!picked[a.id]), iconBox, tagStyle: tag(a.tag), toggle: toggle(a.id) });
    const main = [
      { id: 'hard', name: 'ترقية لغلاف مقوّى', desc: 'يدوم سنوات، والأنسب للهدايا', price: 30, tag: 'الأكثر اختياراً', icon: 'M4 5h12a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3Z M4 16a3 3 0 0 1 3-3h12' },
      { id: 'box', name: 'علبة هدية وبطاقة', desc: 'جاهز للإهداء، ونكتب رسالتك على البطاقة', price: 15, tag: '', icon: 'M4 10h16v10H4Z M3 7h18v3H3Z M12 7v13 M12 7c-2-4-6-3-5 0 M12 7c2-4 6-3 5 0' },
      { id: 'copy', name: 'نسخة ثانية للجدة', desc: 'نفس الكتاب بنص السعر تقريباً', price: 35, tag: 'توفير', icon: 'M8 4h11v14H8Z M5 7v13h11' },
      { id: 'companion', name: 'رسمة ليان تصير صاحبها', desc: 'رسمتها تتحوّل لشخصية معها بكل الصفحات', price: 20, tag: 'مميّز', icon: 'M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8Z' },
      { id: 'coloring', name: 'نسخة تلوين من نفس القصة', desc: 'نفس الصفحات بالأبيض والأسود لتلوّنها ليان', price: 25, tag: '', icon: 'M4 20l4-1 11-11-3-3L5 16Z M14 6l3 3' }
    ].map(mk);
    const more = [
      { id: 'dedication', name: 'صفحة إهداء برسالتك', desc: 'سطرين منك بأول الكتاب', price: 5 },
      { id: 'voice', name: 'صوت أهلي', desc: 'سجّل القصة بصوتك، وتسمعها بمسح الرمز', price: 15 },
      { id: 'poster', name: 'بوستر الغلاف A3', desc: 'لغرفتها', price: 25 },
      { id: 'express', name: 'تجهيز سريع خلال 48 ساعة', desc: 'حسب توفر المطبعة', price: 20 }
    ].map(mk);
    const all = main.concat(more);
    const extras = all.filter((a) => a.on);
    const total = 69 + extras.reduce((n, a) => n + a.price, 0);
    return {
      main, more, total, moreCount: more.length,
      countLabel: extras.length ? 'الكتاب + ' + extras.length + ' إضافات' : 'الكتاب فقط'
    };
  }
}
</script>
</body>
</html>
