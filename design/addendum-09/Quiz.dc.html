<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أي كتاب يناسب طفلي؟</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FBF6EC;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1C2140}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;margin:0;font-weight:700;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button{font-family:inherit;cursor:pointer}
a{color:#16204A;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 960px; background: #FBF6EC; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E4D6BC">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
      <a href="Shop.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <strong style="font-size: 16px">أي كتاب يناسب طفلي؟</strong>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><strong style="color: #16204A">{{stepLabel}}</strong><dc-import name="Moon" size="22" p="{{moonP}}" hint-size="22px,22px"></dc-import></div>
  </header>

  <main style="padding: 24px 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-if value="{{showAge}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h1 style="font-size: 28px; color: #16204A">قديش عمر طفلك؟</h1>
        <sc-for list="{{ages}}" as="o" hint-placeholder-count="4">
          <button onClick="{{o.pick}}" style="min-height: 64px; padding: 0 20px; border-radius: 18px; border: 1.5px solid #E4D6BC; background: #FFFDF8; font-size: 18px; font-weight: 600; color: #16204A; text-align: right; display: flex; align-items: center; justify-content: space-between">{{o.label}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A620A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{showGoal}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h1 style="font-size: 28px; color: #16204A">شو بدك الكتاب يعمل؟</h1>
        <sc-for list="{{goals}}" as="o" hint-placeholder-count="3">
          <button onClick="{{o.pick}}" style="min-height: 76px; padding: 12px 20px; border-radius: 18px; border: 1.5px solid #E4D6BC; background: #FFFDF8; color: #16204A; text-align: right; display: flex; flex-direction: column; justify-content: center; gap: 2px"><strong style="font-size: 18px">{{o.label}}</strong><span style="font-size: 14px; color: #585C72">{{o.hint}}</span></button>
        </sc-for>
        <button onClick="{{back}}" style="align-self: flex-start; min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #16204A; font-weight: 600; font-size: 15px">رجوع</button>
      </div>
    </sc-if>

    <sc-if value="{{showPen}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h1 style="font-size: 28px; color: #16204A">طفلك بيمسك القلم؟</h1>
        <p style="font-size: 15px; color: #585C72">ما في جواب غلط. هيك بنعرف من وين نبدأ.</p>
        <sc-for list="{{pens}}" as="o" hint-placeholder-count="2">
          <button onClick="{{o.pick}}" style="min-height: 64px; padding: 0 20px; border-radius: 18px; border: 1.5px solid #E4D6BC; background: #FFFDF8; font-size: 18px; font-weight: 600; color: #16204A; text-align: right">{{o.label}}</button>
        </sc-for>
        <button onClick="{{back}}" style="align-self: flex-start; min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #16204A; font-weight: 600; font-size: 15px">رجوع</button>
      </div>
    </sc-if>

    <sc-if value="{{showResult}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <span style="align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: #DDEFE3; color: #2E7A52; font-size: 13px; font-weight: 700">الأنسب لطفلك</span>
        <div style="background: #16204A; color: #FBF6EC; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <h1 style="font-size: 26px; color: #FBF6EC; line-height: 1.3">{{rec.title}}</h1>
          <p style="font-size: 16px; line-height: 1.7; color: #E4E8F7">{{rec.why}}</p>
          <strong style="font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; font-size: 24px; color: #F5C465">{{rec.price}}</strong>
          <a href="{{rec.href}}" style="min-height: 56px; border-radius: 999px; background: #F2B33D; color: #0E1530; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">شوف الكتاب</a>
        </div>
        <div style="background: #FFFDF8; border: 1px solid #E4D6BC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: #585C72">وكمان بيناسبه</span>
          <strong style="font-size: 17px; color: #16204A">{{rec.alt}}</strong>
          <span style="font-size: 14px; color: #585C72">{{rec.altWhy}}</span>
        </div>
        <button onClick="{{restart}}" style="align-self: flex-start; min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #9A620A; font-weight: 700; font-size: 15px; text-decoration: underline">أعد الأسئلة</button>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const step = s.step || 0;
    const set = (patch) => () => this.setState(patch);
    const ages = [
      { id: '3', label: '3 سنين أو أقل' },
      { id: '4', label: '4 سنين' },
      { id: '5', label: '5 سنين' },
      { id: '6', label: '6–7 سنين' }
    ].map((o) => ({ ...o, pick: set({ age: o.id, step: 1 }) }));
    const goals = [
      { id: 'gift', label: 'هدية وذكرى تبقى', hint: 'قصة مطبوعة، طفلك بطلها' },
      { id: 'learn', label: 'يتعلّم الحروف والأرقام', hint: 'دوسية متدرّجة باسمه' },
      { id: 'family', label: 'وقت حلو مع العيلة', hint: 'أنشطة ومغامرات نعملها سوا' }
    ].map((o) => ({ ...o, pick: set({ goal: o.id, step: o.id === 'learn' ? 2 : 3 }) }));
    const pens = [
      { id: 'yes', label: 'نعم، بيمسكه وبيخربش' },
      { id: 'no', label: 'لسّا ما بيمسكه منيح' }
    ].map((o) => ({ ...o, pick: set({ pen: o.id, step: 3 }) }));

    const age = s.age || '5', goal = s.goal || 'gift', pen = s.pen || 'yes';
    let rec;
    if (goal === 'gift') {
      rec = { title: 'قصة قمرة، طفلك بطلها', why: 'كتاب مطبوع باسمه وشخصيته. أجمل هدية لعيد ميلاد أو مناسبة.', price: 'من 69 ₪', href: 'StoryProduct.dc.html', alt: 'مغامراتي مع عائلتي', altWhy: 'هدية بتجمع العيلة حول 12 مغامرة' };
    } else if (goal === 'family') {
      rec = { title: 'مغامراتي مع عائلتي', why: '12 مغامرة بالبيت والسوق والمطبخ والطبيعة، مع جواز سفر وملصقات.', price: '89 ₪', href: 'WorkbookProduct.dc.html', alt: 'قصة قمرة', altWhy: 'قصة مطبوعة بطلها طفلك' };
    } else if (age === '3' || pen === 'no') {
      rec = { title: 'رحلتي الأولى — المحطة 1', why: 'يبدأ بالتفكير وتدريب اليد والألوان قبل الحروف، على قد عمره.', price: '69 ₪', href: 'WorkbookProduct.dc.html', alt: 'قصة قمرة', altWhy: 'ليحب الكتب من صغره' };
    } else if (age === '4') {
      rec = { title: 'رحلتي الأولى — المحطة 2', why: 'أول الحروف والأرقام حتى 10، بمهمات وألعاب.', price: '69 ₪', href: 'WorkbookProduct.dc.html', alt: 'دوسية التأسيس — KG1', altWhy: 'إذا روضته بتمشي على منهج فصلي' };
    } else {
      rec = { title: 'دوسية التأسيس — KG2', why: 'عربي وإنجليزي ورياضيات بدوسية وحدة، جزء لكل فصل.', price: 'من 49 ₪ للجزء', href: 'WorkbookProduct.dc.html', alt: 'رحلتي الأولى — المحطة 3', altWhy: 'نفس المهارات بأسلوب ألعاب ومهمات' };
    }
    const labels = ['السؤال 1 من 3', 'السؤال 2 من 3', 'السؤال 3 من 3', 'النتيجة'];
    return {
      ages, goals, pens, rec,
      showAge: step === 0, showGoal: step === 1, showPen: step === 2, showResult: step === 3,
      stepLabel: labels[step], moonP: [0.15, 0.45, 0.7, 1][step],
      back: () => this.setState({ step: step === 3 && goal !== 'learn' ? 1 : Math.max(0, step - 1) }),
      restart: () => this.setState({ step: 0, age: null, goal: null, pen: null })
    };
  }
}
</script>
</body>
</html>
