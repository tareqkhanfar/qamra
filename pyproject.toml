[project]
name = "qamra"
version = "0.0.1"
description = "Qamra — personalized Arabic storybooks (monorepo root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qamra-ai",
    "qamra-pdf",
    "qamra-core",
    "qamra-api",
    "qamra-worker",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pypdf>=5",
    "fonttools>=4.66.0",
    "fakeredis>=2.30",
    "moto[s3]>=5.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/ai", "packages/pdf", "packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
qamra-ai = { workspace = true }
qamra-pdf = { workspace = true }
qamra-core = { workspace = true }
qamra-api = { workspace = true }
qamra-worker = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic text contains "ambiguous" unicode by design

[tool.ruff.lint.isort]
known-first-party = ["qamra_ai", "qamra_pdf", "qamra_core", "qamra_api", "qamra_worker"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["packages/ai/src", "packages/pdf/src", "packages/core/src", "apps/api/src", "apps/worker/src", "scripts"]
mypy_path = ["packages/ai/src", "packages/pdf/src", "packages/core/src", "apps/api/src", "apps/worker/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages/ai/tests", "packages/pdf/tests", "packages/core/tests", "apps/api/tests", "apps/worker/tests"]
pythonpath = ["packages/ai/tests", "apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
