# Qamra stack: `docker compose up --build` → http://localhost:${QAMRA_WEB_PORT:-3000}
# `edge` (nginx) is the only entry point; set QAMRA_BIND=0.0.0.0 to open it on all interfaces.
# Every other published port stays on 127.0.0.1. Secrets come from .env (see .env.example).
name: qamra

x-app-env: &app-env
  ENV: ${QAMRA_ENV:-dev}
  DATABASE_URL: postgresql+psycopg://qamra:${POSTGRES_PASSWORD:-qamra}@postgres:5432/qamra
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://s3:8333
  S3_REGION: us-east-1
  S3_BUCKET: qamra-private
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-qamra-dev}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-qamra-dev-secret-change-me}
  S3_SSE: ${S3_SSE:-AES256}
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
  BRAND_NAME_AR: ${BRAND_NAME_AR:-قمرة}
  BRAND_NAME_EN: ${BRAND_NAME_EN:-Qamra}
  BRAND_DOMAIN: ${BRAND_DOMAIN:-qamra.app}
  LOG_JSON: "true"

x-app: &app
  env_file:
    - path: .env
      required: false
  environment: *app-env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qamra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qamra}
      POSTGRES_DB: qamra
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${QAMRA_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qamra -d qamra"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${QAMRA_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local S3 (production uses Cloudflare R2). MinIO no longer publishes images; see docs/decisions.md.
  s3:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-qamra-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-qamra-dev-secret-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/qamra
        printf '{"identities":[{"name":"qamra","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /etc/qamra/s3.json
        chmod 644 /etc/qamra/s3.json
        exec /entrypoint.sh mini -dir=/data -s3.config=/etc/qamra/s3.json -bucket=qamra-private \
          -s3.encryptVolumeData -admin.ui=false
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:${QAMRA_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    build: { context: ., dockerfile: infra/docker/python.Dockerfile, target: api }
    image: qamra-api:dev
    command: ["sh", "-c", "qamra-migrate && qamra seed-themes"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    image: qamra-api:dev
    ports:
      - "127.0.0.1:${QAMRA_API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }

  worker:
    <<: *app
    build: { context: ., dockerfile: infra/docker/python.Dockerfile, target: worker }
    image: qamra-worker:dev
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }

  cron:
    <<: *app
    image: qamra-worker:dev
    command: ["sh", "-c", "exec rq cron qamra_worker.cron_config --url \"$$REDIS_URL\""]
    depends_on:
      worker: { condition: service_started }

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_BRAND_NAME_AR: ${BRAND_NAME_AR:-قمرة}
        NEXT_PUBLIC_BRAND_NAME_EN: ${BRAND_NAME_EN:-Qamra}
        NEXT_PUBLIC_BRAND_DOMAIN: ${BRAND_DOMAIN:-qamra.app}
        NEXT_PUBLIC_GOOGLE_LOGIN: ${NEXT_PUBLIC_GOOGLE_LOGIN:-0}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-}
        NEXT_PUBLIC_SALES_WHATSAPP: ${NEXT_PUBLIC_SALES_WHATSAPP:-}
        NEXT_PUBLIC_SALES_EMAIL: ${NEXT_PUBLIC_SALES_EMAIL:-}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-}
    image: qamra-web:dev
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  edge:
    image: nginx:1.30-alpine
    volumes:
      - ./infra/nginx/qamra.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${QAMRA_BIND:-127.0.0.1}:${QAMRA_WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
