# Original art styles. Never name living artists, studios or franchises in these guides.
watercolor:
  title_ar: ألوان مائية
  title_en: Watercolor
  guide: >-
    Soft hand-painted watercolor picture-book illustration. Gentle wet-edge washes, visible paper
    grain, warm evening palette of deep indigo night blues, moon-gold highlights and creamy paper
    whites, with sage and coral accents. Rounded friendly shapes, simple readable faces with
    expressive eyes, clean silhouettes. No text, letters or logos anywhere in the image.
crayon:
  title_ar: أقلام شمعية
  title_en: Soft crayon
  guide: >-
    Warm children's picture-book illustration in soft wax crayon and colored pencil. Visible
    textured strokes, slightly wobbly confident outlines, bright but gentle colors on a cream
    paper background. Cozy, playful and simple. No text, letters or logos anywhere in the image.
papercut:
  title_ar: قصاصات ورق
  title_en: Paper cut
  guide: >-
    Layered cut-paper collage picture-book illustration. Flat matte paper shapes with subtle
    drop shadows between layers, soft deckled edges, a limited palette of night blue, moon gold,
    cream, sage and coral. Simple rounded characters. No text, letters or logos anywhere in the image.
