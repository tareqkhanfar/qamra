# Original art styles. Each entry is only the painting MEDIUM: palette, setting, people and composition come
# from the house style (packages/ai/src/qamra_ai/prompts/style/qamra_style.md). Watercolor is the default
# and the recommended premium look (Addendum 3 §3). Never name living artists, studios or franchises.
watercolor:
  title_ar: ألوان مائية
  title_en: Watercolor
  guide: >-
    soft watercolor and gouache on warm textured paper: gentle wet-edge washes, soft gradients, a little
    visible paper grain and delicate hand-painted edges.
crayon:
  title_ar: أقلام شمعية
  title_en: Soft crayon
  guide: >-
    soft wax crayon and colored pencil on cream paper instead of watercolor: visible textured strokes,
    slightly wobbly confident outlines, gentle layered colors.
papercut:
  title_ar: قصاصات ورق
  title_en: Paper cut
  guide: >-
    layered cut-paper collage instead of watercolor: flat matte paper shapes with subtle drop shadows
    between layers and soft deckled edges, keeping the house palette.
