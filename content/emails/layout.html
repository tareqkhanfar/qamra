<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#FBF6EC;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF6EC;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" dir="{{ dir }}"
             style="max-width:560px;background:#FFFDF8;border:1px solid #E4D6BC;border-radius:20px;overflow:hidden;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;color:#1C2140;text-align:{{ align }};">
        <tr>
          <td style="background:#16204A;padding:20px 24px;">
            <span style="font-size:24px;font-weight:800;color:#FBF6EC;">{{ brand }}</span>
            <span style="font-size:18px;color:#F2B33D;">&nbsp;☾</span>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 24px 8px;font-size:16px;line-height:1.8;">
            {% for line in lines %}<p style="margin:0 0 14px;">{{ line }}</p>{% endfor %}
            {% if items %}
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:4px 0 16px;border-top:1px solid #E4D6BC;">
              {% for item in items %}
              <tr><td style="padding:8px 0;border-bottom:1px solid #E4D6BC;font-size:14px;">
                {% if item.url %}<a href="{{ item.url }}" style="color:#16204A;font-weight:700;">{{ item.label }}</a>{% else %}{{ item.label }}{% endif %}
              </td></tr>
              {% endfor %}
            </table>
            {% endif %}
          </td>
        </tr>
        {% if button %}
        <tr>
          <td style="padding:0 24px 24px;">
            <a href="{{ button.url }}" style="display:inline-block;background:#F2B33D;color:#0E1530;font-weight:700;font-size:16px;text-decoration:none;padding:14px 28px;border-radius:999px;">{{ button.label }}</a>
          </td>
        </tr>
        {% endif %}
        <tr>
          <td style="padding:16px 24px;background:#F3EAD8;font-size:13px;line-height:1.6;color:#585C72;">
            {{ footer }}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
