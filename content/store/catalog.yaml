  # ---- «دوسية التأسيس» (Addendum 5) ---------------------------------------------------------------------
  - slug: foundation-workbook
    line: workbook
    name_ar: دوسية التأسيس
    name_en: Foundation workbook
    description_ar: منهج متكامل للروضة في ثلاثة أجزاء، باسم طفلكم وشخصيته.
    description_en: A complete kindergarten curriculum in three volumes, with your child's name and character.
    option_names: [level, volume, interior, format]
    # sold now: Tareq reviewed every page himself (2026-09-30)
    features: {size: A4, binding: spiral, orderable: true}
    variant_matrix:
      levels: [kg1, kg2]
      # The volumes that render today, per level (packages/workbook). Every other variant is inserted
      # inactive: not listed, not sold, and the site never says it is "coming". When a volume lands, add it
      # here (fresh installs) and switch its variants on for the running store: Admin → الكتالوج → the
      # variant's «active», or `UPDATE product_variants SET active = true WHERE sku LIKE 'wb-kg1-%'`.
      # A set is active only when all three volumes of its level render.
      rendered: {kg1: ["1", "2", "3"], kg2: ["1", "2", "3"]}
      rows:
        - {volume: "1", interior: color, format: digital, price: {ILS: 29, JOD: 5.5}, cost: {ai_usd: 0.03}}
        - {volume: "2", interior: color, format: digital, price: {ILS: 29, JOD: 5.5}, cost: {ai_usd: 0.03}}
        - {volume: "3", interior: color, format: digital, price: {ILS: 29, JOD: 5.5}, cost: {ai_usd: 0.03}}
        - {volume: "1", interior: bw, format: spiral, price: {ILS: 49, JOD: 9.5}, cost: {print: 13, packaging: 2, ai_usd: 0.03}}  # placeholder
        - {volume: "2", interior: bw, format: spiral, price: {ILS: 49, JOD: 9.5}, cost: {print: 13, packaging: 2, ai_usd: 0.03}}  # placeholder
        - {volume: "3", interior: bw, format: spiral, price: {ILS: 49, JOD: 9.5}, cost: {print: 13, packaging: 2, ai_usd: 0.03}}  # placeholder
        - {volume: "1", interior: color, format: spiral, price: {ILS: 69, JOD: 13}, cost: {print: 24, packaging: 2, ai_usd: 0.03}}  # placeholder
        - {volume: "2", interior: color, format: spiral, price: {ILS: 69, JOD: 13}, cost: {print: 24, packaging: 2, ai_usd: 0.03}}  # placeholder
        - {volume: "3", interior: color, format: spiral, price: {ILS: 69, JOD: 13}, cost: {print: 24, packaging: 2, ai_usd: 0.03}}  # placeholder
        - {volume: set, interior: color, format: spiral, price: {ILS: 179, JOD: 34}, cost: {print: 72, packaging: 4, ai_usd: 0.03}}  # placeholder
        # the set as a PDF and in black and white (Addendum 9, WorkbookProduct design)
        - {volume: set, interior: color, format: digital, price: {ILS: 75, JOD: 14.5}, cost: {ai_usd: 0.03}}
        - {volume: set, interior: bw, format: spiral, price: {ILS: 129, JOD: 25}, cost: {print: 39, packaging: 4, ai_usd: 0.03}}  # placeholder

