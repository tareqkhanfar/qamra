# The store's starting catalog (Addendum 4 §4 and §7, Addendum 5 §6, Addendum 6 §8).
#
# `qamra seed-store` inserts rows that don't exist yet and never overwrites existing ones, so prices and
# costs edited in the admin stay as they are.
#
# - ILS prices come from the addenda.
# - JOD prices are suggestions at the pegged rate (1 JD ≈ 5.2 ₪, rounded to 0.5) until they are set in the admin.
# - COSTS ARE PLACEHOLDERS (marked "placeholder") until the printer, packaging and courier quotes arrive.
#   They exist so margins are computed from day one; replace them in the admin.
# - AI costs are USD estimates from docs/plans/addendum-04.md §3. Real costs come from generation_costs.

settings_note: prices and costs here are only the starting point; the admin is the source of truth

products:
  # ---- «قمرة كلاسيك»: template books, only the hero is adapted ---------------------------------------------
  - slug: classic-book
    line: classic
    name_ar: قمرة كلاسيك
    name_en: Qamra Classic
    description_ar: حكاية جاهزة برسوم جميلة، نرسم فيها طفلكم بطلًا في كل صفحة يظهر فيها.
    description_en: A ready-illustrated story where your child is drawn in as the hero.
    option_names: [format, size]
    features: {pages: 24, preview: true}
    variants:
      - {sku: classic-digital, options: {format: digital, size: "21x21"}, price: {ILS: 19, JOD: 4}, cost: {ai_usd: 0.35}}
      - {sku: classic-soft-21, options: {format: softcover, size: "21x21"}, price: {ILS: 69, JOD: 13}, cost: {print: 14, packaging: 3, ai_usd: 0.35}}  # placeholder
      - {sku: classic-hard-21, options: {format: hardcover, size: "21x21"}, price: {ILS: 99, JOD: 19}, cost: {print: 26, packaging: 3, ai_usd: 0.35}}  # placeholder

