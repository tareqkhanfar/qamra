slug: first-day
version: 3
title_ar: "{name} في أوّل يوم بالروضة"
title_en: "{name}'s First Day at Kindergarten"
# Cover lettering (Addendum 11 §2.3): gold-magic, candy-bright, night-glow, nature-fresh, heritage-tatreez
cover_title_style: nature-fresh
age_range: [3, 7]
is_b2b: false
active: true
catalog:
  status: available
  name_ar: أوّل يوم في الروضة
  name_en: First Day at Kindergarten
  tagline_ar: خطوة كبيرة في يوم جديد، وصاحب صغير يقول «أنا معك».
  tagline_en: A big step on a new day, with a little friend who says "I'm with you".
  description_ar: >-
    من صباح الحقيبة الجديدة إلى حكاية القمر في آخر النهار: يعيش طفلك يومه الأول في الروضة،
    يتغلّب على خوفه الصغير، ويكسب أصدقاء جددًا، ويعود إلى البيت متحمّسًا للغد.
  description_en: >-
    From the new-backpack morning to the moon story at the end of the day, your child lives their
    first kindergarten day, beats a little fear, makes new friends, and comes home excited for tomorrow.
  occasions: [first_day, values]
  values_ar: [الشجاعة, الصداقة, الفضول]
  values_en: [Courage, Friendship, Curiosity]
  tag: new
  rank: 10
  art: {scene: garden, outfit: "#E9826B", skin: "#C98F63", hair_style: curly, pose: wave}
  peek:
    - {scene: garden, outfit: "#E9826B", skin: "#C98F63", hair_style: curly, pose: front, kid_scale: 0.6}
    - {scene: night, outfit: "#E9826B", skin: "#C98F63", hair_style: curly, pose: tilt, kid_scale: 0.6, companion: blob}
    - {scene: garden, outfit: "#E9826B", skin: "#C98F63", hair_style: curly, pose: wave, kid_scale: 0.5}
  sample_child: {name_ar: يوسف, name_en: Yousef, gender: m}

companion_slot: true
default_companion:
  name_ar: قَمّور
  name_en: Qamour
  id: qamour  # shared sheet images: content/cast/qamour-<style>.png
  # Locked design (Addendum 11 §4.2): always this plump crescent, never a ball. Same text as the sheets in
  # docs/image-prompts.md (C1, C2, C7).
  description_en: >-
    a tiny friendly moon creature: a soft, plump crescent-moon body (a thick C shape opening to the
    right), pale honey-gold, softly glowing from inside, about the size of a house cat. Its face sits on
    the thick middle of the crescent: two small shiny black dot eyes, a tiny happy smile, round rosy
    cheeks, and a small five-pointed star-shaped golden freckle on its left cheek. Two stubby little
    arms, no legs. It floats a few centimeters above the ground with a faint trail of golden sparkles.
    The crescent shape never changes
  image: default-companion.png

# Template syntax: {name}, {companion}; gender variants {masculine/feminine}.
# Scenes and locations are English for the image model. Layouts (Addendum 3 §4):
#   full (text panel top/bottom/side) · split (art above, text below) · spread (two pages, even page first)
#   no_child: true = background plate without the hero or companion, drawn once per theme and cached.
locations:
  bedroom: >-
    the hero's small bedroom: cream limestone walls, an arched window with pale-blue wooden shutters,
    a low bed with an embroidered blanket, a small rug with a red-and-cream geometric pattern
  living_room: >-
    the family living room: floor cushions with embroidered pillows along the walls, a low round
    wooden table, a big arched window looking out on olive trees, patterned cement-tile floor
  street: >-
    a narrow sloping neighborhood street of warm limestone houses with arched doorways, potted
    geraniums and basil on the steps, an old olive tree beside a low stone wall
  gate: >-
    a small kindergarten in a two-storey limestone house with a bright turquoise gate, a lemon tree
    in the front yard, and colorful children's handprints painted on the wall
  classroom: >-
    a bright kindergarten classroom: low wooden tables and small chairs, floor cushions, low wooden
    shelves with colorful wooden toys, stacking cups and woven baskets of blocks, a big arched window, a
    soft pastel wall and a patterned tiled floor. Nothing in the room has writing: no posters, labels,
    charts, letters or numbers anywhere
  yard: >-
    the sunny kindergarten yard: a small slide, two swings, a sandbox, and a grapevine pergola
    giving soft shade

outfits:
  day:
    - key: plum  # not coral: a classmate wears coral
      en: >-
        a plum-purple long-sleeved t-shirt with a small gold crescent-moon patch, navy trousers and
        white sneakers, with a small mustard-yellow backpack
      en_f: >-
        a plum-purple long-sleeved dress with a small gold crescent-moon patch over navy leggings, white
        sneakers, with a small mustard-yellow backpack
      hijab_en: a soft cream hijab
    - key: sage
      en: >-
        a sage-green sweater with a small gold star patch, dark-blue jeans and white sneakers, with a
        small coral backpack
      en_f: >-
        a sage-green pinafore dress over a cream long-sleeved top and dark-blue leggings, white
        sneakers, with a small coral backpack
      hijab_en: a soft navy-blue hijab
  sleep:
    - key: moons
      en: light-blue pajamas with tiny golden moons

# Recurring side characters (Addendum 11 §4.3): one locked look per book. Scenes name them in `others`
# as {id}; sheet images: cast/<id>-<style>.png here, or the shared content/cast/<id>-<style>.png.
# The same id has the same description in every theme (tests check it).
cast:
  - id: teacher
    role: the teacher
    description_en: >-
      a kind woman in her early thirties, warm light-olive skin, a gentle round face, warm brown
      eyes and a soft smile, a sage-green hijab wrapped neatly, a long cream knitted cardigan over a
      dusty-rose ankle-length dress, a short wooden-bead necklace, flat brown shoes
  - id: classmates
    role: the four classmates
    description_en: >-
      four kindergarten classmates aged 5–6, each always drawn the same: (1) a boy with short
      curly black hair and round tortoiseshell glasses, mustard-yellow t-shirt and navy trousers; (2) a
      girl with a neat lavender hijab, coral long-sleeved dress and white sneakers; (3) a boy with
      straight light-brown hair and a cowlick, navy hoodie and gray trousers; (4) a girl with two puffy
      black pigtails tied with yellow ribbons, sky-blue pinafore dress over a white shirt. Skin tones
      vary within the Levantine range
  - id: mom
    role: the mother
    description_en: >-
      a woman in her early thirties, warm light-olive skin, kind almond-shaped brown eyes, a
      dusty-rose hijab, a long navy cardigan over a cream ankle-length dress, comfortable flat shoes
  - id: dad
    role: the father
    description_en: >-
      a man in his mid-thirties, warm olive skin, short black hair, a short neat black beard,
      warm brown eyes and laugh lines, a light-blue button-up shirt with the sleeves rolled up, beige
      trousers, brown leather shoes, a simple wristwatch
  - id: grandma
    role: the grandmother
    description_en: >-
      a woman in her late sixties with gentle wrinkles and a warm smile, a white embroidered
      headscarf, a traditional black Palestinian thobe with red cross-stitch tatreez on the chest panel
      and sleeves, a string of olive-wood prayer beads in her hand

blurb_ar: "حقيبةٌ جديدة، وبوّابةٌ زرقاء، وصاحبٌ صغير يهمس: «أنا {معكَ/معكِ}». حكاية {name} في أوّل يوم في الروضة."
blurb_en: "A new backpack, a blue gate, and a little friend who whispers: \"I'm with you.\" This is {name}'s first day at kindergarten."

for_parents:
  lesson_ar: >-
    الخطوةُ الأولى في مكانٍ جديد تحتاج شجاعةً صغيرة ويدًا تُمسك بيدنا. {يتعلّمُ/تتعلّمُ} {name} أنّ
    الخوف شعورٌ طبيعيّ يمرّ، وأنّ أصدقاءَ جددًا ينتظروننا خلف الأبواب.
  lesson_en: >-
    A first step into a new place takes a little courage and a hand to hold. {name} learns that fear is
    a normal feeling that passes, and that new friends are waiting behind new doors.
  questions_ar:
    - "ما أجملُ شيءٍ {فعلتَه/فعلتِه} في الروضة اليوم؟"
    - "إذا شعر صديقٌ جديد بالخوف، ماذا {تقولُ/تقولين} له؟"
  questions_en:
    - "What was the best thing you did at kindergarten today?"
    - "If a new friend feels scared, what would you say to them?"

cover:
  scene: >-
    The hero stands smiling at the open turquoise gate of the kindergarten in golden morning light,
    holding the straps of the backpack. A crescent moon is still faintly visible in the pale sky.
  location: gate
  time: morning
  companion_action: floats beside the hero's shoulder, waving happily

pages:
  - index: 1
    layout: full
    text_pos: top
    location: bedroom
    time: dawn
    outfit: sleep
    beat: wake-up excitement
    scene: >-
      The hero sits up in bed, stretching and smiling, eyes bright. The new backpack waits on a small
      chair by the bed; warm dawn light comes through the window.
    companion_action: peeks out from under the pillow, yawning
    text_ar: "فِي صَبَاحٍ مُشْرِقٍ، {اسْتَيْقَظَ/اسْتَيْقَظَتْ} {name} بَاكِرًا {وَقَلْبُهُ/وَقَلْبُهَا} يَرْقُصُ فَرَحًا. الْيَوْمُ أَوَّلُ يَوْمٍ فِي الرَّوْضَةِ!"
    text_en: "One bright morning, {name} woke up early, heart dancing. Today was the first day of kindergarten!"
  - index: 2
    layout: split
    location: bedroom
    time: morning
    beat: getting ready
    scene: >-
      The hero stands in front of a round wooden mirror in the new clothes, zipping up the backpack
      with a proud smile.
    companion_action: hides inside the open backpack, only its eyes showing
    text_ar: "{لَبِسَ/لَبِسَتْ} {name} {مَلَابِسَهُ/مَلَابِسَهَا} الْجَدِيدَةَ، {وَحَمَلَ/وَحَمَلَتْ} {حَقِيبَتَهُ/حَقِيبَتَهَا}. وَمِنْ دَاخِلِ الْحَقِيبَةِ هَمَسَ {companion}: «وَأَنَا قَادِمٌ {مَعَكَ/مَعَكِ}!»"
    text_en: "{name} put on new clothes and picked up the backpack. From inside, {companion} whispered: \"I'm coming too!\""
  - index: 3
    layout: spread
    text_pos: top
    location: living_room
    time: morning
    beat: family breakfast
    scene: >-
      A family breakfast on floor cushions around the low table: bread, za'atar with olive oil,
      labneh, olives and tea. The hero sits between Mama and Baba while the grandmother raises her tea
      glass in a cheerful toast; everyone is smiling at the hero.
    others: "{mom}, {dad} and {grandma}"
    others_count: 3
    companion_action: sits on the edge of the table, nibbling a tiny olive
    text_ar: "عَلَى الْفُطُورِ، {جَلَسَ/جَلَسَتْ} {name} مَعَ مَامَا وَبَابَا وَسِتِّي. قَالَتْ سِتِّي: «الرَّوْضَةُ {تَنْتَظِرُكَ يَا بَطَلُ/تَنْتَظِرُكِ يَا بَطَلَةُ}!» وَضَحِكَ الْجَمِيعُ."
    text_en: "At breakfast, {name} sat with Mama, Baba and Teta. Teta smiled: \"The kindergarten is waiting for you, little hero!\" And everyone laughed."
  - index: 4
    layout: full
    text_pos: side
    location: street
    time: morning
    beat: the walk
    scene: >-
      The hero walks down the street holding Mama's hand, skipping happily and pointing at the olive
      trees along the way.
    others: "{mom}"
    others_count: 1
    companion_action: floats at the hero's shoulder, pointing ahead
    text_ar: "فِي الطَّرِيقِ، {أَمْسَكَ/أَمْسَكَتْ} {name} بِيَدِ مَامَا، {وَعَدَّ/وَعَدَّتْ} أَشْجَارَ الزَّيْتُونِ وَاحِدَةً وَاحِدَةً: وَاحِدَةٌ، اثْنَتَانِ، ثَلَاثٌ!"
    text_en: "On the way, {name} held Mama's hand and counted the olive trees one by one: one, two, three!"
  - index: 5
    layout: full
    text_pos: bottom
    no_child: true
    location: gate
    time: morning
    beat: the kindergarten
    scene: >-
      The kindergarten seen from across the quiet street: the turquoise gate, the lemon tree heavy with
      yellow lemons, colorful handprints on the limestone wall, and soft morning sun.
    text_ar: "وَهَذِهِ هِيَ الرَّوْضَةُ! بَوَّابَتُهَا زَرْقَاءُ، وَفِي سَاحَتِهَا شَجَرَةُ لَيْمُونٍ، وَعَلَى جِدَارِهَا أَيَادٍ صَغِيرَةٌ مُلَوَّنَةٌ."
    text_en: "And here was the kindergarten! A blue gate, a lemon tree in the yard, and little colorful handprints on the wall."
  - index: 6
    layout: full
    text_pos: bottom
    location: gate
    time: morning
    beat: a little fear
    scene: >-
      At the open gate, the hero stands a little shy and unsure, holding the backpack straps tightly and
      looking in at the yard.
    companion_action: floats in front of the hero's face, giving an encouraging thumbs up
    text_ar: "عِنْدَ الْبَابِ {شَعَرَ/شَعَرَتْ} {name} بِقَلِيلٍ مِنَ الْخَوْفِ. فَقَالَ {companion}: «{لَا تَخَفْ/لَا تَخَافِي}، أَنَا {مَعَكَ/مَعَكِ} دَائِمًا!»"
    text_en: "At the door, {name} felt a little scared. {companion} said: \"Don't worry, I'm always with you!\""
  - index: 7
    layout: full
    text_pos: top
    location: classroom
    time: morning
    beat: warm welcome
    scene: >-
      Just inside the classroom door, a kind smiling teacher kneels down to greet the hero at eye level;
      the hero smiles back shyly.
    others: "{teacher}"
    others_count: 1
    companion_action: waves at the teacher from behind the hero
    text_ar: "اسْتَقْبَلَتِ الْمُعَلِّمَةُ {name} بِابْتِسَامَةٍ كَبِيرَةٍ وَقَالَتْ: «أَهْلًا {بِكَ/بِكِ} يَا {name}، كُنَّا {نَنْتَظِرُكَ/نَنْتَظِرُكِ}!»"
    text_en: "The teacher greeted {name} with a big smile: \"Welcome, {name}! We were waiting for you!\""
  - index: 8
    layout: spread
    text_pos: top
    location: classroom
    time: morning
    beat: discovering the classroom
    scene: >-
      A wide view of the cheerful classroom: children busy at the painting corner, the reading corner
      and the block corner. The hero stands in the middle with wide, amazed eyes, taking it all in.
    others: "{classmates}, two more children of different looks and {teacher}"
    others_count: 7
    companion_action: bounces excitedly on a pile of colorful cushions
    text_ar: "كَانَ الصَّفُّ مَلِيئًا بِالْأَلْوَانِ وَالْكُتُبِ وَالْمُكَعَّبَاتِ وَالْأَصْدِقَاءِ الْجُدُدِ. {فَتَحَ/فَتَحَتْ} {name} {عَيْنَيْهِ/عَيْنَيْهَا} عَلَى وُسْعِهِمَا {وَقَالَ/وَقَالَتْ}: «يَا لَلرَّوْعَةِ!»"
    text_en: "The classroom was full of colors, books, blocks and new friends. {name}'s eyes opened wide: \"Wow!\""
  - index: 9
    layout: full
    text_pos: side
    location: classroom
    time: morning
    beat: new friends
    scene: >-
      The hero sits on a soft rug building a tall tower of wooden blocks together with two other smiling
      children of different looks.
    others: "two of {classmates}, smiling"
    others_count: 2
    companion_action: carefully balances the last block on top of the tower
    text_ar: "{جَلَسَ/جَلَسَتْ} {name} مَعَ صَدِيقَيْنِ جَدِيدَيْنِ، وَبَنَوْا مَعًا بُرْجًا عَالِيًا مِنَ الْمُكَعَّبَاتِ. وَوَضَعَ {companion} الْمُكَعَّبَ الْأَخِيرَ… هُوبْ!"
    text_en: "{name} sat with two new friends, and together they built a tall tower of blocks. {companion} added the very last block... hop!"
  - index: 10
    layout: split
    location: classroom
    time: morning
    beat: the painting corner
    scene: >-
      At the easel in the painting corner, the hero paints a big round yellow moon with soft stars on a
      large sheet of paper, a little paint on one cheek.
    companion_action: holds up a tiny paint brush, admiring the moon
    text_ar: "فِي رُكْنِ الرَّسْمِ، {رَسَمَ/رَسَمَتْ} {name} قَمَرًا أَصْفَرَ كَبِيرًا {وَقَالَ/وَقَالَتْ}: «هَذَا قَمَرُنَا يَا {companion}!»"
    text_en: "In the art corner, {name} painted a big yellow moon: \"This is our moon, {companion}!\""
  - index: 11
    layout: full
    text_pos: top
    location: yard
    time: noon
    beat: playtime
    scene: >-
      The hero runs happily across the sunny yard with arms wide open; two children play on the swings
      in the background.
    others: "two of {classmates} on the swings in the background"
    others_count: 2
    companion_action: chases a yellow butterfly beside the hero
    text_ar: "فِي وَقْتِ اللَّعِبِ، {رَكَضَ/رَكَضَتْ} {name} فِي السَّاحَةِ كَالرِّيحِ، {وَضَحِكَ/وَضَحِكَتْ} حَتَّى احْمَرَّتْ {وَجْنَتَاهُ/وَجْنَتَاهَا}."
    text_en: "At playtime, {name} ran across the yard like the wind, laughing until both cheeks turned pink."
  - index: 12
    layout: full
    text_pos: bottom
    location: classroom
    time: noon
    beat: sharing
    scene: >-
      Children sit around a low table at snack time. The hero opens a lunchbox and offers apple slices
      to the smiling child sitting next to them.
    others: "two of {classmates} at the table"
    others_count: 2
    companion_action: sits on the table hugging a tiny grape with both arms
    text_ar: "فِي وَقْتِ الطَّعَامِ، {فَتَحَ/فَتَحَتْ} {name} عُلْبَةَ الطَّعَامِ {وَشَارَكَ/وَشَارَكَتْ} {صَدِيقَهُ/صَدِيقَتَهَا} شَرَائِحَ التُّفَّاحِ. الْمُشَارَكَةُ تَجْعَلُ الطَّعَامَ أَطْيَبَ!"
    text_en: "At snack time, {name} opened the lunchbox and shared apple slices with a friend. Sharing makes food taste better!"
  - index: 13
    layout: full
    text_pos: top
    location: classroom
    time: afternoon
    beat: story circle
    scene: >-
      Children sit in a circle on a big rug while the teacher reads a picture book whose cover shows only
      a big painted moon and no title. The hero listens with chin in hands, dreamy and happy.
    others: "{teacher} and {classmates}"
    others_count: 5
    companion_action: sits in the hero's lap with the same dreamy face
    text_ar: "ثُمَّ جَلَسَ الْجَمِيعُ فِي دَائِرَةٍ، وَقَرَأَتِ الْمُعَلِّمَةُ حِكَايَةً عَنِ الْقَمَرِ. {أَحَبَّ/أَحَبَّتْ} {name} الْحِكَايَةَ، وَأَحَبَّهَا {companion} أَيْضًا."
    text_en: "Then everyone sat in a circle, and the teacher read a story about the moon. {name} loved it, and so did {companion}."
  - index: 14
    layout: full
    text_pos: side
    location: classroom
    time: afternoon
    beat: tidying up
    scene: >-
      The hero and a friend carry colorful wooden blocks together into a big woven basket, smiling; the
      teacher gives a thumbs up in the background.
    others: "one of {classmates} and {teacher} in the background"
    others_count: 2
    companion_action: carries one tiny block on its head
    text_ar: "قَبْلَ نِهَايَةِ الْيَوْمِ، {سَاعَدَ/سَاعَدَتْ} {name} الْأَصْدِقَاءَ فِي تَرْتِيبِ الْأَلْعَابِ. قَالَتِ الْمُعَلِّمَةُ: «شُكْرًا {يَا بَطَلُ/يَا بَطَلَةُ}!»"
    text_en: "Before the day ended, {name} helped the friends tidy up the toys. The teacher said: \"Thank you, little helper!\""
  - index: 15
    layout: spread
    text_pos: top
    location: gate
    time: afternoon
    beat: going home proud
    scene: >-
      Afternoon at the turquoise gate. The hero runs toward Mama with open arms, holding up the moon
      painting; two friends wave goodbye and the teacher smiles from the yard.
    others: "{mom}, two of {classmates} waving, and {teacher}"
    others_count: 4
    companion_action: flies ahead like a little golden balloon
    text_ar: "عِنْدَمَا رَنَّ الْجَرَسُ، {رَكَضَ/رَكَضَتْ} {name} إِلَى مَامَا {رَافِعًا/رَافِعَةً} رَسْمَةَ الْقَمَرِ: «كَانَ يَوْمًا رَائِعًا! هَلْ أَعُودُ غَدًا؟»"
    text_en: "When the bell rang, {name} ran to Mama, holding up the moon painting: \"It was a wonderful day! Can I come back tomorrow?\""
  - index: 16
    layout: full
    text_pos: bottom
    location: living_room
    time: evening
    beat: telling the family
    scene: >-
      Evening in the living room lit by warm lamps. The hero stands on a cushion telling the story of the
      day with big excited gestures, while Baba and the grandmother listen and smile.
    others: "{dad} and {grandma}"
    others_count: 2
    companion_action: acts out the story beside the hero
    text_ar: "فِي الْمَسَاءِ، {حَكَى/حَكَتْ} {name} لِبَابَا وَسِتِّي عَنِ الْأَصْدِقَاءِ وَالْأَلْوَانِ وَالْحِكَايَةِ. قَالَ بَابَا: «{أَنْتَ شُجَاعٌ/أَنْتِ شُجَاعَةٌ} جِدًّا!»"
    text_en: "In the evening, {name} told Baba and Teta all about the friends, the colors and the story. Baba said: \"You were so brave!\""
  - index: 17
    layout: full
    text_pos: top
    location: bedroom
    time: night
    outfit: sleep
    beat: moonlit goodnight
    scene: >-
      The hero is tucked in bed, eyes half closed, smiling, lit by a big gentle moon through the window.
      The backpack rests ready by the door and the moon painting is pinned on the wall.
    companion_action: curls up on the pillow next to the hero, glowing softly like a night light
    text_ar: "وَفِي اللَّيْلِ، تَحْتَ ضَوْءِ الْقَمَرِ، {هَمَسَ/هَمَسَتْ} {name} لِـ{companion}: «غَدًا نَعُودُ إِلَى الرَّوْضَةِ مَعًا.» ثُمَّ {نَامَ/نَامَتْ} {مُبْتَسِمًا/مُبْتَسِمَةً}."
    text_en: "That night, under the moonlight, {name} whispered to {companion}: \"Tomorrow we go back together.\" And fell asleep smiling."
