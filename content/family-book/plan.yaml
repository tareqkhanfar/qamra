# «مغامراتي مع عائلتي» — the proposal plan (Addendum 7 §3). Format and rules: README.md in this folder.
#
#   uv run python -m qamra_workbook.family check      # must report 0 problems
#   uv run python scripts/family_proposal.py --pdf    # docs/family-book/proposal.md + out/family-book/proposal.pdf
#
# 112 pages (Tareq's order, 2026-09-28): front p1–5, twelve adventures (each an opening spread, its activities and «ذكرى اليوم»), back
# p110–112. {child}, {adult}, {member}, {family_name}, {city}; {masc/fem} pairs follow the child's gender.

title_ar: مغامراتي مع عائلتي
title_en: My Adventures with My Family

proposal:
  concept: |
    «مغامراتي مع عائلتي» كتاب أنشطة للأطفال من 3 إلى 7 سنوات ولعائلاتهم. الطفل لا يحلّ تمارين، بل يعيش مع عائلته اثنتي عشرة مغامرة حقيقية: في البيت والمطبخ والسوق والطبيعة، وفي الحكايات والمشاعر والمسؤولية والألعاب. كل مغامرة تنتهي بصفحة «ذكرى اليوم» وختم في «جواز سفر المغامر الصغير». وفي آخر الكتاب تحدّي العائلة الكبير لسبعة أيام، وشهادة المغامر باسم الطفل وعائلته.
    - **وقت عائلي لا واجب مدرسي:** نشاط من 5 إلى 20 دقيقة بأشياء موجودة في كل بيت، في المساء أو في عطلة نهاية الأسبوع أو في الإجازة. ويصلح هديةً تجمع العائلة.
    - **الطفل بطل الكتاب:** شخصيته المرسومة على الغلاف وفي الجواز والشهادة، واسمه في العناوين والمهمّات، مثل «مغامرة سلمى في السوق». ومدينة العائلة في مغامرتَي السوق والطبيعة.
    - **العائلة كما هي:** يكتب الأهل أسماء حتى 6 أفراد وأدوارهم (أم، أب، إخوة، جدّة، جدّ، خالة…)، فتظهر في المهمّات وصناديق الأهل. لا يفترض الكتاب وجود الأم والأب معًا: كل مهمّة تكون «مع» من يختاره الأهل. إضافة اختيارية: رسم أفراد العائلة من صورهم، بقواعد حماية الصور نفسها المطبّقة على صورة الطفل.
    - **صفحة لكل فكرة:** عنوان جذّاب، تعليمات للطفل في 10 كلمات أو أقل، مساحة واسعة للرسم والكتابة، وصندوق «هيا نفعلها معًا! 👨‍👩‍👧» للأهل من سطر إلى ثلاثة أسطر: ماذا نفعل، وماذا نسأل، وكيف نمدح.
    - **مستويان في أغلب الأنشطة:** ⭐ للصغار (3–4 سنوات) و⭐⭐ تحدٍّ للكبار (5–7 سنوات)، فيكبر الكتاب مع الطفل ويلعب به الإخوة معًا.
    - **مهارات مقصودة:** كل نشاط مربوط بمهارة أو أكثر من إحدى عشرة مهارة: التفكير، والملاحظة، والذاكرة، والعدّ، والتعبير، والمشاعر، وحلّ المشكلات، والإبداع، والمسؤولية، ومهارات الحياة، والتعاون مع الأهل. وتتغيّر نوعية النشاط من صفحة إلى التي تليها: رسم، عدّ، لصق، قصّ، حوار، حركة، طبخ، ملاحظة.
    - **آمن ومحلّي:** وصفات بلا مكسّرات ولا بيض نيء، مع تذكير بالحساسية في كل وصفة. الكبار يتولّون السكين والنار، ويرافقون الطفل في كل نشاط خارج البيت. نقود اللعب لا تشبه الشيكل ولا الدينار. والمحتوى يحترم العائلات المسلمة والمسيحية.
    - **ما في العلبة:** الكتاب بتجليد حلزوني يُفتح مسطّحًا، وورقة ملصقات، وورقتا كرتون للقصّ (نقود اللعب، وبطاقات الأسعار والوصفات والألعاب والأدوار، ودمى الأصابع).
  size: |
    **نوصي بمقاس 21×28 سم عموديًا.**
    - **مساحة لأيدٍ صغيرة:** الرسم بالألوان الشمعية والكتابة بخط كبير يحتاجان مساحة. مقاس القصص المربّع (21×21 سم) يضيّق صفحات القوائم والجداول والبطاقات.
    - **عمودي** لأن أغلب الصفحات قوائم وجداول تُقرأ من أعلى إلى أسفل. والكتاب مفتوحًا على الطاولة عرضه 42 سم فقط.
    - **بلا هدر إضافي:** يُطبع صفحتين على فرخ SRA3 في الطباعة الرقمية مثل A4 تمامًا، ويناسب التجليد الحلزوني وقوالب القصّ القياسية.
    - **أقصر من A4 بـ 1.7 سم**، فيدخل علبة الهدية وحقيبة الطفل بسهولة.

    **البدائل وأثرها على تكلفة الطباعة** (تقديرات إلى أن يصل عرض المطبعة):
    - **A4 (21×29.7 سم):** التكلفة نفسها تقريبًا (0 إلى +3%). هو الخيار الأول إن كانت قوالب المطبعة للقصّ والتجليد بمقاس A4.
    - **21×21 سم مربّع (مثل قصص قمرة):** أرخص بنحو 10–15%، لكن مساحة الكتابة والرسم أقل، والجداول تزدحم.
    - **A5 (14.8×21 سم):** أرخص بنحو 35–45%، لكنه صغير على طفل في الثالثة، ولا نوصي به.
    - **23×30 سم:** أغلى بنحو 15–25% لأن الهدر على الفرخ أكبر، والمساحة الإضافية لا يحتاجها الطفل.
  paper: |
    - **الصفحات الداخلية: ورق أوفست غير مطليّ 140 غم** (120 غم على الأقل). يمسك قلم الرصاص والألوان الخشبية والشمعية، ولا يتسرّب لون الأقلام العريضة إلى الوجه الآخر. الورق المطليّ اللامع يرفض الرصاص ويعكس الضوء.
    - **الغلاف: كرتون 350 غم مع سلفنة مطفية (مات)** على الوجه الخارجي، فيتحمّل الاستعمال اليومي ويُمسح بسهولة.
    - **ورقة الملصقات: ورق لاصق مطفي بحجم A4 مع قصّ نصفي (kiss-cut)** لأختام الجواز وملصقات المكافأة ورموز الروتين.
    - **ورقتا القصّ: كرتون 250–300 غم** (200 غم على الأقل)، مع تخريم للفصل إن كانت المطبعة تدعمه، وإلا فخطوط قصّ متقطّعة واضحة، والقصّ مع الكبار بمقصّ الأطفال.
    - **الطباعة:** ألوان كاملة على الوجهين، بألوان آمنة للطباعة (CMYK) وهامش قصّ 3 مم.
  binding: |
    - **تجليد حلزوني مزدوج (Wire-O) بلون كحلي قمرة:** يُفتح الكتاب مسطّحًا على الطاولة ويُطوى للخلف 360°، فيرسم الطفل ويكتب دون أن يمسك الصفحة. ورقة الملصقات وورقتا القصّ في جيب داخل الغلاف الخلفي.
    - **طباعة رقمية بالألوان الكاملة** للكميات الصغيرة (من نسخة واحدة إلى بضع مئات): بلا ألواح ولا تجهيز، وكل نسخة شخصية باسم الطفل وعائلته.
    - **طباعة أوفست** للطلبات الكبيرة (المؤسسات وهدايا الشركات): تجهيز ثابت (ألواح وضبط الماكينة) مقابل نسخة أرخص بكثير. الصفحات الشخصية (الغلاف والجواز و«عائلتي» والشهادة) تُطبع رقميًا وتُضاف إلى النسخ المطبوعة أوفست.
    - **نقطة التعادل** = تكلفة تجهيز الأوفست ÷ (تكلفة النسخة الرقمية − تكلفة نسخة الأوفست). مثال بأرقام افتراضية للتوضيح فقط: تجهيز 2,400 ₪، ونسخة رقمية 26 ₪، ونسخة أوفست 19 ₪، فالتعادل عند نحو 340 نسخة. نعيد الحساب بأرقام المطبعة الحقيقية عندما يصل عرض السعر.

front:
  - type: title-page
    title: "مغامرات {child} مع عائلتي"
    instruction: "هذا كتاب مغامراتك مع عائلة {family_name}"
  - type: toc
    title: خريطة المغامرات
    instruction: "{لوّن/لوّني} نجمة كل مغامرة {تنهيها/تنهينها}"  # draft: educator review
  - type: passport
    title: "جواز سفر {المغامر الصغير/المغامرة الصغيرة}"
    instruction: "{ألصق/ألصقي} ختمًا بعد كل مغامرة"
    parent:
      - "بعد كل مغامرة، {ساعدوه/ساعدوها} على لصق الختم من ورقة الملصقات، واحتفلوا معًا."
      - "امنحوا {child} شارة من الشارات السبع كلما {رأيتموه/رأيتموها} {يفكّر/تفكّر} أو {يبدع/تبدع} أو {يساعد/تساعد}."  # draft: educator review
  - type: my-family
    title: عائلتي
    instruction: "{اكتب/اكتبي} أسماء عائلتك {وارسم/وارسمي} وجوههم"
    parent:
      - "اكتبوا معًا أسماء من يعيش مع {child} ومن {يحبّهم/تحبّهم}: كل عائلة مختلفة وجميلة."
      - "هذه الأسماء تظهر في مهمّات الكتاب."
  - type: drawing
    title: هذا أنا!
    instruction: "{ارسم/ارسمي} نفسك قبل أن {تبدأ/تبدئي} المغامرات"
    parent:
      - "اكتبوا تاريخ اليوم تحت الرسمة، وقارنوها في آخر الكتاب برسمة {child} الجديدة."
    params: {frame: portrait, caption: "عمري اليوم:"}

sections:
  - id: home
    title_ar: بيتي مدرسة
    icon: 🏠
    hook: "في بيت عائلة {family_name} كنوز صغيرة مخبّأة في كل زاوية: أشكال وألوان وأشياء نعدّها. هيّا يا {child}، {جهّز/جهّزي} عينيك الذكيتين، ولنبدأ المغامرة!"
    badge: "{مستكشف/مستكشفة} البيت"
  - id: market
    title_ar: مغامرة السوق
    icon: 🛒
    hook: "سوق {city} مليء بالألوان والأصوات والروائح. معنا قائمة ومهمّة مهمّة: نشتري ما نحتاجه فقط!"
    badge: "{بطل/بطلة} السوق"
  - id: chef
    title_ar: "{الشيف الصغير/الشيف الصغيرة}"
    icon: 👩‍🍳
    hook: "ما اشتريناه من السوق نطبخه معًا! المطبخ اليوم مطبخ {child}: نغسل أيدينا، ونلبس المريلة، ونحضّر مع {adult} أطباقًا لذيذة وآمنة."
    badge: "{طبّاخ صغير/طبّاخة صغيرة}"
  - id: nature
    title_ar: "{مستكشف/مستكشفة} الطبيعة"
    icon: 🌿
    hook: "خلف الباب عالم كبير: أوراق وحجارة وطيور وأصوات. نحمل الكتاب ونخرج مع {adult}… بعيون {محقّق/محقّقة}!"
    badge: "{صديق/صديقة} الطبيعة"
  - id: day
    title_ar: يومي الجميل
    icon: ☀️
    hook: "الشمس تشرق، والقمر ينام… ثم يعود! ماذا نفعل في الصباح؟ وماذا نفعل قبل النوم؟ هيّا نرتّب يوم {child}."
    badge: "{صديق/صديقة} الوقت"
  - id: responsible
    title_ar: "{أنا مسؤول/أنا مسؤولة}"
    icon: ✅
    hook: "في بيت عائلة {family_name} لكل واحد مهمّة صغيرة. ما مهمّة {child}؟ هيّا نساعد ونجمع النجوم!"
    badge: "{طفل مسؤول/طفلة مسؤولة}"
  - id: feelings
    title_ar: مشاعري
    icon: 💛
    hook: "نفرح ونغضب ونخاف ونشتاق… كل المشاعر تزورنا. اليوم نتعرّف عليها، ونعرف ماذا نفعل عندما تكبر."
    badge: قلب شجاع
  - id: talk
    title_ar: "{احكِ لي/احكي لي}"
    icon: 🗣️
    hook: "في كل بيت حكايات كثيرة. اليوم {child} {يحكي/تحكي} والعائلة تسمع، ثم نتبادل الأدوار!"
    badge: "{حكّاء صغير/حكّاءة صغيرة}"
  - id: jobs
    title_ar: مهن عائلتي
    icon: 👷‍♀️
    hook: "من يخبز الخبز؟ ومن يعالج المرضى؟ وماذا يعمل أفراد عائلة {family_name}؟ اليوم {child} {صحفي صغير/صحفية صغيرة}!"
    badge: "{صحفي صغير/صحفية صغيرة}"
  - id: shop
    title_ar: متجري الصغير
    icon: 🏪
    hook: "افتتاح عظيم! {child} {يفتح/تفتح} متجرًا في البيت، والنقود نقود قمرة للّعب. من أول زبون؟"
    badge: "{تاجر صغير/تاجرة صغيرة}"
  - id: games
    title_ar: ليلة الألعاب العائلية
    icon: 🎲
    hook: "نطفئ الشاشات ونضحك معًا! الليلة ألعاب ذاكرة وأسئلة وحركة، ولوحة نقاط لعائلة {family_name}."
    badge: "{نجم/نجمة} الألعاب"
  - id: act
    title_ar: نمثّل ونحكي
    icon: 🎭
    hook: "كل حكاية تحتاج نهاية… و{child} {يعرفها/تعرفها}! نلبس الأدوار، ونحرّك الدمى، ونجد حلولًا ذكية."
    badge: "{فنان/فنانة}"

activities:
  # ---- 🏠 بيتي مدرسة (p6–15) ------------------------------------------------------------------------------
  - id: home-circles
    section: home
    title: صيد الدوائر في المطبخ
    goal: ملاحظة الأشكال في الأشياء اليومية وعدّها
    skills: [observation, counting]
    child_part: يبحث في المطبخ عن أشياء دائرية، ويشطبها في القائمة، ثم يرسم أجمل ما وجد
    parent_part: يتجوّل مع الطفل، ويسمّيان كل شيء دائري، ويسأل أيّها أكبر وأيّها أصغر
    together: true
    materials: [قلم رصاص, ألوان خشبية]
    minutes: 10
    levels: {simple: "3 أشياء دائرية", challenge: "5 أشياء، ويرتّبها من الأصغر إلى الأكبر"}
    pages:
      - type: scavenger-hunt
        title: صيد الدوائر في المطبخ
        instruction: "{ابحث/ابحثي} عن أشياء دائرية في المطبخ"
        parent:
          - "تجوّلوا مع {child} في المطبخ، وسمّوا معًا كل شيء دائري."
          - "اسألوا: أيّها أكبر؟ أيّها أصغر؟ كم دائرة وجدنا؟"
          - "امدحوا الملاحظة: «عيناك عينا {محقّق صغير/محقّقة صغيرة}!»"
        params: {shape: circle, find: 3, challenge: 2, examples: [plate, orange, clock]}
      - type: drawing
        title: أجمل دائرة وجدتها
        instruction: "{ارسم/ارسمي} أجمل شيء دائري {وجدته/وجدتِه}"
        parent: ["اطلبوا من {child} أن {يحكي/تحكي} لكم لماذا {اختاره/اختارته}."]
        params: {frame: circle, caption: "اسم الشيء الدائري:"}
  - id: home-colors
    section: home
    title: كنز الألوان
    goal: تمييز الألوان والمقارنة بين الكميات (أكثر وأقل)
    skills: [observation, counting, thinking]
    child_part: يجمع أشياء صغيرة من ثلاثة ألوان، ويلوّن مربّعًا لكل شيء، ثم يقارن أيّ لون أكثر
    parent_part: يختار مع الطفل مكانًا آمنًا للبحث، ويعيد الأشياء إلى أماكنها معه
    together: true
    materials: [سلة أو صحن, ألوان خشبية]
    minutes: 15
    levels: {simple: "3 ألوان وشيئان من كل لون", challenge: "4 ألوان، ويكتب العدد ويقول أيّها أكثر"}
    pages:
      - type: scavenger-hunt
        title: كنز الألوان
        instruction: "{اجمع/اجمعي} أشياء حمراء وصفراء وزرقاء"
        parent: ["ضعوا ما {يجمعه/تجمعه} {child} في سلة، وأعيدوه معًا إلى مكانه بعد اللعب."]
        params: {colors: [red, yellow, blue]}
      - type: counting
        title: أيّ لون أكثر؟
        instruction: "{لوّن/لوّني} مربّعًا لكل شيء، ثم {قارن/قارني}"
        parent: ["اسألوا: أيّ عمود أطول؟ إذن أيّ لون أكثر؟"]
        params: {mode: tally, colors: [red, yellow, blue], challenge_colors: [green], squares: 6}
  - id: home-shapes
    section: home
    title: أشكال في كل مكان
    goal: تصنيف الأشياء حسب الشكل
    skills: [thinking, observation]
    child_part: يربط كل شيء في الصور بشكله (دائرة، مربّع، مثلث)
    materials: [قلم رصاص]
    minutes: 5
    levels: {simple: "دائرة ومربّع", challenge: "دائرة ومربّع ومثلث ومستطيل"}
    pages:
      - type: sort-choose
        title: كل شيء إلى بيته
        instruction: "{صِل/صِلي} كل شيء بشكله"
        params: {groups: [circle, square, triangle]}
  - id: home-tray
    section: home
    title: صينية الذاكرة
    goal: تقوية الذاكرة البصرية
    skills: [memory, observation, cooperation]
    child_part: ينظر إلى صينية فيها 5 أشياء، يغمض عينيه، ثم يقول ما الذي اختفى ويرسمه
    parent_part: يرتّب الأشياء على الصينية، ويخفي واحدًا في كل جولة، ثم يتبادلان الأدوار
    together: true
    materials: [صينية, 5 أشياء صغيرة من البيت, منشفة]
    minutes: 10
    levels: {simple: "3 أشياء على الصينية", challenge: "6 أشياء، ويختفي شيئان"}
    pages:
      - type: drawing
        title: ماذا اختفى؟
        instruction: "{ارسم/ارسمي} الشيء الذي اختفى عن الصينية"
        parent:
          - "ضعوا الأشياء، وغطّوها بمنشفة، وأخفوا واحدًا."
          - "بدّلوا الأدوار: {دعوه/دعوها} {يخفي/تخفي} شيئًا وأنتم تخمّنون."
        params: {frame: tray, spots: 3, challenge_spots: 3, caption: "ما اسمه؟"}
  - id: home-sounds
    section: home
    title: أصوات البيت
    goal: التركيز والإنصات
    skills: [observation, memory]
    child_part: يجلس دقيقة بصمت، ثم يرسم كل ما سمعه (ماء، باب، عصفور…)
    materials: [ألوان خشبية]
    minutes: 5
    levels: {simple: "3 أصوات", challenge: "5 أصوات، ويقول أيّها قريب وأيّها بعيد"}
    pages:
      - type: observation-journal
        title: أصوات البيت
