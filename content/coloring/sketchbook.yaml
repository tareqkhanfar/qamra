# «دَفْتَري» (My Sketchbook): the 46 content pages in book order (qamra_workbook.coloring.sketch draws the art).
# The page template adds the title page in front and «عن قمرة» at the end: 48 interior pages (wire-o).
#
# kind:  blank     a framed page to draw anything (prompt "")
#        prompt    a drawing prompt with small decorations that belong to it
#        finish    «أَكْمِلِ الرَّسْمَةَ»: a half-drawing the child finishes
#        date      the first page: the child's name, the age and the date (writing lines: sketch.DATE_LINES)
#        favourite «رَسْمَتي المُفَضَّلَةُ»: a gallery frame
# art:   a key of sketch.ART (an SVG of 186 × 238 mm: the frame, its decorations, the half-drawing)
# prompt_ar: fully vowelized; {masc/fem} variants by the child's gender; {child} / {child:gen} for the name.
title_ar: دَفْتَري
title_en: My Sketchbook
pages:
  - id: my-sketchbook
    kind: date
    art: date-cake
    prompt_ar: "دَفْتَرُ {child:gen}"
    prompt_en: "{child}'s Sketchbook"
    lines_ar: ["عُمْري ... سَنَواتٍ", "التّاريخُ"]
    lines_en: ["I am ... years old", "Date"]
  - id: draw-yourself
    kind: prompt
    art: mirror
    prompt_ar: "{ارْسُمْ/ارْسُمي} نَفْسَ{كَ/كِ}"
    prompt_en: Draw yourself
  - id: blank-01
    kind: blank
