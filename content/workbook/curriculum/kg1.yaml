# «دوسية التأسيس» — KG1 (ages 4–5): the curriculum plan (Addendum 5 §2).
# One page per line. Check: uv run python -m qamra_workbook.plan check kg1
# Render: uv run python -m qamra_workbook.plan render kg1  (writes docs/workbook/plan-kg1.md and educator-kg1.md)
level: kg1
age: "4–5"
title_ar: "دوسية التأسيس — المستوى الأول"
title_en: "Foundation Workbook — KG1"
letter_order: [أ, ب, ت, ث, ج, ح, خ, د, ذ, ر, ز, س, ش, ص, ض, ط, ظ, ع, غ, ف, ق, ك, ل, م, ن, ه, و, ي]
independent_writing: [أ, ب, ت, ث, د, ذ, ر, ز, ل, ن]  # the simple shapes (decision 2); the rest are traced
progression_notes: |
  KG1 is the gentler level: the same scope and volume split as KG2, with more pen practice, bigger tracing, less writing and lower difficulty. Its Arabic goal is recognition and tracing (decision 2 of 28 September 2026): the child meets and traces all 28 letters and writes alone only the simple shapes. KG2 comes back to every letter in more depth.

  - **The year.** Hands first, then letters and numbers, then sounds. V1 builds pen control and meets 9 letters and the numbers 1–5, then zero. V2 adds 10 letters, the numbers 6–10, shapes, patterns and position words. V3 finishes the alphabet, listens to the three short vowels at the very end, recognizes and traces a few picture words, and adds and subtracts within 5 with pictures.
  - **Pen skills come before letters and numbers.** V1 weeks 1–3 lead with pen skills (3 pen pages a week): straight lines, then arcs, waves and zigzags, then circles, spirals and shapes, then mazes, lanes and dot-to-dot. Each stroke comes before a letter needs it:
    - vertical lines (V1 p7) before alif (p13);
    - arcs and waves before ب and ج;
    - teeth strokes (V2 p27) before س (V2 p31);
    - small closed loops (V2 p38) before ص and ط;
    - joined right-to-left strokes open V3.

    After that, pen practice continues at about one page a week to the end of V3.
  - **Per letter: meet, trace, recognize.** Every letter follows the §3 sequence without the writing step. The child meets the letter with 1–2 pictures and colors it (`letter-intro`), traces it big and then smaller (`letter-trace`), finds it among others (`find-letter`) and matches letter, picture and word (`match-letter-picture`). The unit's `unit-review` comes last.
  - **Writing alone only for the simple shapes.**
    - Ten letters also get a `letter-write` page, with guided rows and then one short independent row: ا ب ت ث د ذ ر ز ل ن.
    - Each is one or two plain strokes (a line, a shallow bowl, an angle or a short curve) plus dots, with no closed loop, no teeth and no long tail.
    - The other 18 letters (ج ح خ س ش ص ض ط ظ ع غ ف ق ك م ه و ي) are traced and recognized only. So V2, the volume of teeth, loops and tails, writes only ر and ز.
    - The one exception is the child's own name: the V3 name page invites them to try writing it alone.
  - **A light review week after every 4–5 letters.** Nothing new comes that week: no letter, number or English letter. The child plays with the last group of letters (a color-by-letter picture, then a review of the whole group), the other subjects close the units that just ended, and the week has fewer pages than usual (7–9):
    - V1 week 7, after أ ب ت ث;
    - V2 week 5, after ر ز س ش, and week 9, after ص ض ط ظ;
    - V3 week 4, after ف ق ك ل, and week 8, after م ن ه و ي.

    The last group of V1 (ج ح خ د ذ) and of V2 (ع غ) comes back in the term's last week, with the term review.
  - **Per number.** `number-intro`, then `number-trace`, `count-and-circle`, `number-write`, then applying it (`number-quantity-match` or `compare`), then the review. Counting starts at 1: V1 meets 1–5 first and then zero, as «nothing» (an empty basket once the five apples are eaten). This follows decision 5 for KG2, and it suits younger children even more.
  - **Recognition before production.**
    - Every letter is seen, heard in pictures and colored before it is traced.
    - Circling the right numeral comes before writing it.
    - English is recognition-first. The `en-letter` page only traces in V1 and adds one short written row from V2. English practice pages are find, match and color, never independent writing.
  - **Writing sized for 4–5-year-olds.**
    - Tracing is extra-large in V1–V2 (xl, then l) and large in V3 (l, then m).
    - A `letter-write` page is mostly guided: 2–3 traced rows and one short independent row per letter.
    - The letters of one shape family share their find and match pages, and their write page when they have one.
    - Words are never written alone. V3 traces two dotted words, once.
  - **Easy to hard, never all at once.**
    - Difficulty is 1–2 in V1 (one page at 3), mostly 2 with some 1 and 3 in V2, and 2–3 in V3.
    - It reaches 4 only once, on V3's story subtraction.
    - New strands start one at a time. V1 opens with pen, thinking and colors; alif follows in week 2; numbers and English start in week 4.
  - **Letter order: alphabetical (أ ب ت ث …), confirmed by decision 1.**
    - It is the order Levantine parents, alphabet songs and most local KG books use, so home and school reinforce each other.
    - The traditional order already groups most letters by base shape (ب ت ث، ج ح خ، د ذ، ر ز، س ش، ص ض، ط ظ، ع غ، ف ق). Each unit therefore teaches one stroke, and its find page contrasts the dots.
    - The letters without a family (ك ل م ن ه و ي) come last, when pen control is strongest.
    - The cost: frequent letters (م ن ل) arrive late. So the word pages sit at the very end, and their words use letters from all three volumes.
  - **Vowels: listening only, at the very end (decision 3).**
    - Fatha, damma and kasra come in V3 weeks 9–10, after all 28 letters and the last review week. The child hears each vowel on letters they know (بَ بُ بِ، دَ دُ دِ، رَ رُ رِ), sees its mark and points to the one they hear.
    - There are no syllable pages and no syllable writing.
    - Sukun is not in KG1 at all: it moves to KG2. Tanween and shadda wait for Grade 1.
    - The two word pages are recognition, not reading: the child hears a picture's name and finds its first letter. One more page traces two dotted words (أسد، قمر).
    - There are no sentences in KG1 (decision 4).
  - **Letter positions (V2) stay light.** Two pages show ب and ت at the beginning, middle and end of a word, and the week 5 review week reviews them.
  - **Reviews and assessments.**
    - Every unit ends with a `unit-review`.
    - The last week of each volume has a cross-subject review, then five short assessments.
    - The first is the pen-skills check (decision 9): the child traces two lines or shapes while the teacher or parent fills a short checklist (pen grip, pressure, direction). Arabic, math, English and thinking follow, each with a score box.
    - The certificate is the last page of V3.
  - **Deliberately left for KG2:**
    - writing the other 18 letters alone, and writing words alone;
    - sukun, syllables and decoding, long vowels, ال and ة (tanween and shadda wait for Grade 1);
    - letter positions for most letters;
    - reading sentences;
    - numbers beyond 10, and adding or subtracting beyond 5 or without pictures;
    - English beyond letters and picture vocabulary.
interleaving_notes: |
  - **Pace.**
    - V1 is 12 weeks of 9–11 pages. V2 and V3 are 11 weeks of mostly 11–12 pages, about two pages a school day;
      V3's two vowel weeks are lighter (8–9).
    - Review weeks are lighter, with 7–9 pages.
    - Some pages are light: the owner page, the contents page, the openers and the blank back of the cut-and-paste sheet.
    - Each page carries its week number.
  - **Short blocks.** Apart from the four front-matter pages, no subject ever runs more than two pages in a row (the checker allows four). A typical week reads: Arabic, math, English, Arabic, pen, math, thinking, Arabic, English, math.
  - **Every week is a mix.** Each week covers 3–5 subjects:
    - Arabic 2–5 pages from V1 week 2, the anchor, on most days;
    - math 1–3;
    - English 1–3 from V1 week 4;
    - pen and thinking 1–3 together (4–5 in V1 weeks 1–3).

    V1 weeks 1–3 have three pen pages each. From V1 week 4, pen settles at about one page a week.
  - **Staggered starts.** V1 opens with pen, thinking and color pages. Alif follows in week 2, and numbers and English in week 4, so the child takes on one new routine at a time. In V2 and V3 every subject runs from week 1.
  - **Units spread over days.** A two-letter unit runs over two to three weeks, woven between other subjects. Each letter is met, traced and practiced on different days, then revisited in the review.
  - **Review weeks.** V1 week 7, V2 weeks 5 and 9 and V3 weeks 4 and 8 introduce nothing new. Each brings back the last 4–5 letters, closes the units that just ended in the other subjects, and has fewer pages than an average week (the checker enforces it).
  - **Term end.** Each volume's last week has the cross-subject review, the pen-skills check and the four subject assessments. V3 ends with the certificate.
  - **One cut-and-paste activity per volume**, on the front of a sheet whose back is blank (V1 p65, V2 p59, V3 p59).
  - **Balance.**
    - Across the year: Arabic 35%, math 21%, English 17%, pen and thinking 22%, front matter and cross-subject reviews 5%.
    - V1 leans on pen and math (pen + thinking 28%, math 23%).
    - V2 and V3 lean on Arabic (37% and 39%). The tracing-only letters need no write page, and the review weeks spread the load.
    - V3's English (22%) carries the ten vocabulary units.
alignment_notes: |
  This is our general reading of what Palestinian and Jordanian kindergartens expect in the first KG year (البستان / الروضة الأولى). It is in our own words and not taken from any official curriculum text. An educator should confirm it against the framework each school follows.

  - **Fine-motor and pre-writing readiness.** As far as we know, both systems put hand strength and pencil control before formal writing. The plan starts with lines, curves, mazes and coloring inside borders, has one cutting activity per volume and keeps writing mostly traced. Each volume ends with a short pen-skills check that the teacher or parent observes (grip, pressure, direction).
  - **Letter and sound awareness.**
    - The first KG year is usually about knowing letters, their sounds and first-sound pictures, not formal reading or writing.
    - The plan meets and traces all 28 letters with pictures and coloring, and writes alone only ten simple shapes. It reviews every 4–5 letters, touches letter positions lightly, and only listens to the three short vowels at the end of the year.
    - Some programs cover only part of the alphabet in KG1. A school can slow down using the week markers and the review weeks.
  - **Numbers to 10.**
    - KG1 commonly expects counting, one-to-one matching, number and quantity, comparing amounts, colors, shapes, patterns and position words, but not formal arithmetic.
    - The plan stays within 0–10 and starts counting at 1, with zero after 5. It adds and subtracts only with pictures within 5.
  - **Early English exposure.**
    - Many private kindergartens in both countries teach the English alphabet and picture vocabulary; public expectations vary.
    - The plan keeps English to letters and picture vocabulary, and parents may leave it out (§5).
  - **Social-emotional readiness.**
    - The child's own name (in Arabic and English), handprint, character and certificate make the book theirs. The handprint in V2 and V3 invites "see how I have grown".
    - First-person "I can" wording (أتعرّف، أرسم، أكتب), short daily sessions, family words and a drawing of "me and my friends at kindergarten" support confidence and belonging.
  - **Local and familiar.**
    - Picture words are everyday Levantine things (زيتون، رمان، خيار، خسّة، خروف), with no brands and no text in the pictures. The ط pictures are a kite (طائرة ورقية) and a table (طاولة), not an airplane (decision 7).
    - Skills show Arabic-Indic digits (١٢٣) as local KG books do; the digit style is a parent option (§5).
progression_notes_ar: |
  المستوى الأول هو المستوى الألطف: المحتوى وتقسيم الأجزاء كما في المستوى الثاني، لكن مع تدريب أكثر على القلم، وتتبّع بحجم أكبر، وكتابة أقل، وصعوبة أخفّ. وهدفه في العربية التعرّف والتتبّع (القرار ٢ من قرارات ٢٨ أيلول ٢٠٢٦): يتعرّف الطفل على الحروف الثمانية والعشرين كلها ويتتبّعها، ولا يكتب وحده إلا الحروف البسيطة الشكل. ثم يعود المستوى الثاني إلى كل الحروف بعمق أكبر.

  - **السنة كلها.** اليد أولًا، ثم الحروف والأعداد، ثم الأصوات. الجزء الأول يبني التحكّم بالقلم، ويقدّم تسعة حروف والأعداد من ١ إلى ٥ ثم الصفر. والجزء الثاني يضيف عشرة حروف، والأعداد من ٦ إلى ١٠، والأشكال والأنماط وكلمات المكان. والجزء الثالث يكمل الحروف، ويستمع الطفل في آخره إلى الحركات القصيرة الثلاث، ويتعرّف على بعض الكلمات المصوّرة ويتتبّعها، ويجمع ويطرح بالصور حتى ٥.
  - **مهارات القلم قبل الحروف والأعداد.** تبدأ الأسابيع الثلاثة الأولى من الجزء الأول بمهارات القلم (ثلاث صفحات في الأسبوع): الخطوط المستقيمة، ثم الأقواس والأمواج والخطوط المتعرّجة، ثم الدوائر والحلزون والأشكال، ثم المتاهات والممرات وتوصيل النقاط. وتأتي كل حركة قبل أن يحتاجها حرف:
    - الخطوط العمودية (الجزء الأول، ص ٧) قبل الألف (ص ١٣)؛
    - الأقواس والأمواج قبل الباء والجيم؛
    - الأسنان الصغيرة (الجزء الثاني، ص ٢٧) قبل السين (ص ٣١)؛
    - الحلقات الصغيرة المغلقة (الجزء الثاني، ص ٣٨) قبل الصاد والطاء؛
    - الخطوط المتصلة من اليمين إلى اليسار في أول الجزء الثالث.

    بعد ذلك يستمر التدريب على القلم بنحو صفحة في الأسبوع حتى آخر الجزء الثالث.
  - **لكل حرف: أتعرّف، أتتبّع، أميّز.** يمرّ كل حرف بالتسلسل الثابت دون خطوة الكتابة: يتعرّف الطفل على الحرف مع صورة أو صورتين ويلوّنه (صفحة «أتعرّف على الحرف»)، ثم يتتبّعه كبيرًا ثم أصغر («تتبّع الحرف»)، ثم يجده بين حروف أخرى («أجد الحرف»)، ثم يصل الحرف بالصورة والكلمة («الحرف والصورة والكلمة»). وتأتي مراجعة الوحدة في آخرها.
  - **الكتابة المستقلة للحروف البسيطة الشكل فقط.**
    - لعشرة حروف فقط صفحة «كتابة الحرف»، فيها أسطر موجّهة ثم سطر قصير يكتبه الطفل وحده: ا ب ت ث د ذ ر ز ل ن.
    - كل واحد منها حركة أو حركتان بسيطتان (خط، أو قوس مفتوح، أو زاوية، أو انحناءة قصيرة) مع النقاط، بلا حلقة مغلقة ولا أسنان ولا ذيل طويل.
    - أمّا الحروف الثمانية عشر الأخرى (ج ح خ س ش ص ض ط ظ ع غ ف ق ك م ه و ي) فيتتبّعها الطفل ويتعرّف عليها فقط. ولهذا لا يكتب وحده في الجزء الثاني، وهو جزء الأسنان والحلقات والذيول، إلا الراء والزاي.
    - الاستثناء الوحيد اسم الطفل: صفحة الاسم في الجزء الثالث تدعوه إلى أن يحاول كتابته وحده.
  - **أسبوع مراجعة خفيف بعد كل ٤–٥ حروف.** لا يأتي فيه شيء جديد: لا حرف ولا عدد ولا حرف إنجليزي. يلعب الطفل بحروف المجموعة الأخيرة (صورة يلوّنها حسب الحرف، ثم مراجعة للمجموعة كلها)، وتُختم في المواد الأخرى الوحدات التي انتهت للتوّ، وصفحات الأسبوع أقل من المعتاد (٧–٩ صفحات):
    - الجزء الأول: الأسبوع ٧، بعد أ ب ت ث؛
    - الجزء الثاني: الأسبوع ٥ بعد ر ز س ش، والأسبوع ٩ بعد ص ض ط ظ؛
    - الجزء الثالث: الأسبوع ٤ بعد ف ق ك ل، والأسبوع ٨ بعد م ن ه و ي.

    وتعود المجموعة الأخيرة من الجزء الأول (ج ح خ د ذ) ومن الجزء الثاني (ع غ) في الأسبوع الأخير من الفصل، مع مراجعة الفصل.
  - **لكل عدد.** أتعرّف على العدد، ثم أتتبّعه، ثم أعدّ وأحوّط، ثم أكتبه، ثم أطبّقه (العدد والكمية، أو المقارنة)، ثم المراجعة. ويبدأ العدّ بالواحد: يتعرّف الطفل في الجزء الأول على الأعداد من ١ إلى ٥ أولًا، ثم على الصفر بمعنى «لا شيء» (سلة فارغة بعد أن أكلنا التفاحات الخمس). هكذا قرّرنا للمستوى الثاني (القرار ٥)، وهو أنسب من باب أولى للأطفال الأصغر سنًّا.
  - **التعرّف قبل الإنتاج.**
    - يرى الطفل كل حرف ويسمعه في الصور ويلوّنه قبل أن يتتبّعه.
    - يحوّط الرقم الصحيح قبل أن يكتبه.
    - الإنجليزية تبدأ بالتعرّف: صفحة الحرف الإنجليزي تتبّع فقط في الجزء الأول، وتضيف سطرًا قصيرًا للكتابة ابتداءً من الجزء الثاني. أمّا صفحات التدريب الإنجليزية فبحث وتوصيل وتلوين، ولا كتابة مستقلة فيها.
  - **كتابة على مقاس طفل في الرابعة والخامسة.**
    - التتبّع كبير جدًّا في الجزأين الأول والثاني ثم يصغر قليلًا، وكبير في الجزء الثالث ثم متوسط.
    - صفحة «كتابة الحرف» موجّهة في معظمها: سطران أو ثلاثة للتتبّع، ثم سطر قصير يكتبه الطفل وحده لكل حرف.
    - حروف العائلة الواحدة تشترك في صفحتي البحث والتوصيل، وفي صفحة الكتابة إن كانت لها.
    - لا يكتب الطفل الكلمات وحده أبدًا: في الجزء الثالث يتتبّع كلمتين منقّطتين مرة واحدة.
  - **من السهل إلى الصعب، دون أن يأتي كل شيء معًا.**
    - الصعوبة ١–٢ في الجزء الأول (صفحة واحدة بدرجة ٣)، و٢ في معظم الجزء الثاني مع صفحات قليلة بدرجة ١ أو ٣، و٢–٣ في الجزء الثالث.
    - لا تصل الصعوبة إلى ٤ إلا مرة واحدة: قصة الطرح المصوّرة في الجزء الثالث.
    - تبدأ المواد الجديدة واحدة بعد الأخرى: يفتتح الجزء الأول بالقلم والتفكير والألوان، ثم الألف في الأسبوع الثاني، ثم الأعداد والإنجليزية في الأسبوع الرابع.
  - **ترتيب الحروف أبجدي (أ ب ت ث …)، كما أكّد القرار ١.**
    - هو الترتيب الذي يعرفه الأهل في بلادنا، وتعتمده أناشيد الحروف ومعظم كتب الروضات المحلية، فيتعاون البيت والروضة.
    - يجمع الترتيب التقليدي معظم الحروف حسب شكلها الأساسي (ب ت ث، ج ح خ، د ذ، ر ز، س ش، ص ض، ط ظ، ع غ، ف ق)، فتعلّم كل وحدة حركة واحدة، وتقارن صفحة البحث بين النقاط.
    - الحروف التي ليست لها عائلة (ك ل م ن ه و ي) تأتي في الآخر، حين يكون التحكّم بالقلم في أفضل حالاته.
    - الثمن أن حروفًا كثيرة الاستعمال (م ن ل) تأتي متأخرة، ولذلك وُضعت صفحات الكلمات في آخر السنة، وكلماتها من حروف الأجزاء الثلاثة.
  - **الحركات: استماع فقط، في الآخر تمامًا (القرار ٣).**
    - تأتي الفتحة والضمة والكسرة في الأسبوعين ٩ و١٠ من الجزء الثالث، بعد الحروف الثمانية والعشرين وبعد آخر أسبوع مراجعة. يسمع الطفل كل حركة على حروف يعرفها (بَ بُ بِ، دَ دُ دِ، رَ رُ رِ)، ويرى شكلها، ويشير إلى الحركة التي يسمعها.
    - لا صفحات مقاطع ولا كتابة مقاطع.
    - السكون ليس في هذا المستوى أبدًا، فقد انتقل إلى المستوى الثاني. والتنوين والشدّة مؤجّلان إلى الصف الأول.
    - صفحتا الكلمات تعرّف لا قراءة: يسمع الطفل اسم الصورة ويجد أول حرف فيه. وفي صفحة ثالثة يتتبّع كلمتين منقّطتين (أسد، قمر).
    - لا جمل في هذا المستوى (القرار ٤).
  - **مواقع الحرف في الكلمة (الجزء الثاني) بقدر خفيف.** صفحتان تعرضان الباء والتاء في أول الكلمة ووسطها وآخرها، ويراجعهما أسبوع المراجعة الخامس.
  - **المراجعات والتقييمات.**
    - تنتهي كل وحدة بصفحة مراجعة.
    - في الأسبوع الأخير من كل جزء مراجعة شاملة لكل المواد، ثم خمسة تقييمات قصيرة.
    - أولها تقييم مهارات القلم (القرار ٩): يتتبّع الطفل خطّين أو شكلين، بينما تملأ المعلّمة أو الأهل قائمة ملاحظة قصيرة (مسكة القلم، والضغط، والاتجاه). ثم تقييمات العربية والرياضيات والإنجليزية والتفكير، ولكلٍّ منها مربّع صغير للدرجة.
    - الشهادة هي الصفحة الأخيرة في الجزء الثالث.
  - **ما تركناه عمدًا للمستوى الثاني:**
    - أن يكتب الطفل وحده الحروف الثمانية عشر الأخرى والكلمات؛
    - السكون، والمقاطع وقراءتها، والمدود، و«ال» والتاء المربوطة (أمّا التنوين والشدّة فللصف الأول)؛
    - مواقع معظم الحروف في الكلمة؛
    - قراءة الجمل؛
    - الأعداد بعد ١٠، والجمع والطرح بعد ٥ أو من دون صور؛
    - ما يتجاوز الحروف والمفردات المصوّرة في الإنجليزية.
interleaving_notes_ar: |
  - **الإيقاع.**
    - الجزء الأول ١٢ أسبوعًا، في كل أسبوع ٩–١١ صفحة. والجزآن الثاني والثالث ١١ أسبوعًا، في معظم أسابيعهما ١١–١٢ صفحة، أي نحو صفحتين في اليوم الدراسي، وأسبوعا الحركات في الجزء الثالث أخفّ (٨–٩ صفحات).
    - أسابيع المراجعة أخفّ، فيها ٧–٩ صفحات.
    - بعض الصفحات خفيفة: صفحة صاحب الكتاب، والفهرس، وصفحات الافتتاح، والظهر الفارغ لورقة القصّ واللصق.
    - على كل صفحة رقم أسبوعها.
  - **كتل قصيرة.** باستثناء صفحات البداية الأربع، لا تتوالى أكثر من صفحتين من مادة واحدة أبدًا (والمدقّق الآلي يسمح بأربع). والأسبوع المعتاد يسير هكذا: عربية، رياضيات، إنجليزية، عربية، قلم، رياضيات، تفكير، عربية، إنجليزية، رياضيات.
  - **كل أسبوع مزيج.** يغطّي كل أسبوع ٣–٥ مواد:
    - العربية ٢–٥ صفحات ابتداءً من الأسبوع الثاني في الجزء الأول، وهي المحور في معظم الأيام؛
    - الرياضيات ١–٣؛
    - الإنجليزية ١–٣ ابتداءً من الأسبوع الرابع في الجزء الأول؛
    - القلم والتفكير معًا ١–٣ (و٤–٥ في الأسابيع الثلاثة الأولى من الجزء الأول).

    في كل أسبوع من الأسابيع الثلاثة الأولى من الجزء الأول ثلاث صفحات للقلم، ثم يستقر القلم على نحو صفحة في الأسبوع ابتداءً من الأسبوع الرابع.
  - **بدايات متدرّجة.** يفتتح الجزء الأول بصفحات القلم والتفكير والألوان، ثم تأتي الألف في الأسبوع الثاني، ثم الأعداد والإنجليزية في الأسبوع الرابع، فيتعوّد الطفل على روتين جديد واحد في كل مرة. وفي الجزأين الثاني والثالث تبدأ كل المواد من الأسبوع الأول.
  - **الوحدة موزّعة على أيام.** تمتدّ وحدة الحرفين على أسبوعين أو ثلاثة، متداخلة مع المواد الأخرى: يتعرّف الطفل على الحرف ويتتبّعه ويتدرّب عليه في أيام مختلفة، ثم يعود إليه في المراجعة.
  - **أسابيع المراجعة.** الأسبوع ٧ في الجزء الأول، والأسبوعان ٥ و٩ في الجزء الثاني، والأسبوعان ٤ و٨ في الجزء الثالث لا يُقدَّم فيها شيء جديد. يعود كل منها إلى آخر ٤–٥ حروف، ويختم الوحدات التي انتهت للتوّ في المواد الأخرى، وصفحاته أقل من متوسط الأسبوع (والمدقّق الآلي يتأكّد من ذلك).
  - **آخر الفصل.** في الأسبوع الأخير من كل جزء المراجعة الشاملة، وتقييم مهارات القلم، وتقييمات المواد الأربع. ويُختم الجزء الثالث بالشهادة.
  - **نشاط قصّ ولصق واحد في كل جزء**، على وجه ورقة ظهرها فارغ (الجزء الأول ص ٦٥، والجزء الثاني ص ٥٩، والجزء الثالث ص ٥٩).
  - **التوازن.**
    - على مدار السنة: العربية ٣٥٪، والرياضيات ٢١٪، والإنجليزية ١٧٪، والقلم والتفكير ٢٢٪، وصفحات البداية والمراجعات الشاملة ٥٪.
    - يميل الجزء الأول إلى القلم والرياضيات (القلم والتفكير ٢٨٪، والرياضيات ٢٣٪).
    - ويميل الجزآن الثاني والثالث إلى العربية (٣٧٪ و٣٩٪). الحروف التي تُتتبّع فقط لا تحتاج إلى صفحة كتابة، وأسابيع المراجعة توزّع الحمل.
    - وتحمل الإنجليزية في الجزء الثالث (٢٢٪) وحدات المفردات العشر.
alignment_notes_ar: |
  هذه قراءتنا العامة لما تتوقّعه رياض الأطفال في فلسطين والأردن في السنة الأولى (البستان / الروضة الأولى)، بكلماتنا نحن، وليست منقولة من أي نص منهاج رسمي. نرجو من المربّية مطابقتها مع الإطار الذي تتّبعه كل روضة.

  - **الاستعداد الحركي الدقيق وما قبل الكتابة.** على حدّ علمنا، يقدّم النظامان قوة اليد والتحكّم بالقلم على الكتابة الرسمية. لذلك تبدأ الخطة بالخطوط والمنحنيات والمتاهات والتلوين داخل الحدود، وفيها نشاط قصّ واحد في كل جزء، وأكثر الكتابة فيها تتبّع. ويُختم كل جزء بتقييم قصير لمهارات القلم تلاحظه المعلّمة أو الأهل (مسكة القلم، والضغط، والاتجاه).
  - **الوعي بالحروف وأصواتها.**
    - تدور السنة الأولى في الروضة عادةً حول معرفة الحروف وأصواتها وصور تبدأ بها، لا حول القراءة والكتابة الرسمية.
    - تعرّف الخطة الطفل على الحروف الثمانية والعشرين كلها بالصور والتلوين، فيتتبّعها كلها ولا يكتب وحده إلا عشرة حروف بسيطة الشكل. وتراجع بعد كل ٤–٥ حروف، وتلمس مواقع الحرف في الكلمة لمسًا خفيفًا، ويكتفي الطفل بالاستماع إلى الحركات القصيرة الثلاث في آخر السنة.
    - بعض البرامج لا تغطّي في هذه السنة إلا جزءًا من الحروف، ويمكن للروضة أن تبطئ الإيقاع مستعينة بأرقام الأسابيع وأسابيع المراجعة.
  - **الأعداد حتى ١٠.**
    - يُتوقّع عادةً في هذه السنة: العدّ، والتقابل واحدًا لواحد، والعدد والكمية، ومقارنة الكميات، والألوان والأشكال والأنماط وكلمات المكان، دون حساب رسمي.
    - تبقى الخطة ضمن ٠–١٠، ويبدأ العدّ بالواحد ويأتي الصفر بعد الخمسة. ولا جمع ولا طرح إلا بالصور وحتى ٥.
  - **تعرّف مبكر على الإنجليزية.**
    - تعلّم رياض خاصة كثيرة في البلدين الحروف الإنجليزية ومفردات مصوّرة، وتختلف توقّعات الروضات الحكومية.
    - تكتفي الخطة بالحروف والمفردات المصوّرة، ويمكن للأهل الاستغناء عن الإنجليزية.
  - **الاستعداد الاجتماعي والعاطفي.**
    - اسم الطفل (بالعربية والإنجليزية)، وبصمة يده، وشخصيته، وشهادته تجعل الكتاب كتابه. وبصمة اليد في الجزأين الثاني والثالث تقول له: «انظر كم كبرت!».
    - صيغة المتكلّم «أنا أستطيع» (أتعرّف، أرسم، أكتب)، والجلسات اليومية القصيرة، وكلمات العائلة، ورسمة «أنا وأصدقائي في الروضة» تدعم الثقة والانتماء.
  - **محلي ومألوف.**
    - كلمات الصور أشياء يومية من بيئتنا (زيتون، رمان، خيار، خسّة، خروف)، بلا علامات تجارية ولا نص داخل الصور. وصورتا الطاء طائرة ورقية وطاولة (القرار ٧).
    - تعرض المهارات الأرقام الهندية (١٢٣) كما في كتب الروضات المحلية، وشكل الأرقام خيار للأهل.
changes_ar:
  - "الكتابة المستقلة للحروف البسيطة الشكل فقط: ا ب ت ث د ذ ر ز ل ن. أمّا الحروف الثمانية عشر الأخرى فتتبّع وتعرّف، ولم تعد لها صفحة «كتابة الحرف»."
  - "أسبوع مراجعة خفيف بعد كل ٤–٥ حروف، لا يُقدَّم فيه شيء جديد: الأسبوع ٧ في الجزء الأول، والأسبوعان ٥ و٩ في الجزء الثاني، والأسبوعان ٤ و٨ في الجزء الثالث."
  - "الفتحة والضمة والكسرة تعرّف صوتي فقط، في الأسبوعين ٩ و١٠ من الجزء الثالث بعد الحروف كلها، بلا صفحات مقاطع ولا كتابتها. والسكون انتقل كله إلى المستوى الثاني."
  - "صفحات الكلمات في آخر الجزء الثالث صارت تعرّفًا (أسمع اسم الصورة وأجد أول حرف فيه) وتتبّعًا لكلمتين منقّطتين، بلا قراءة ولا كتابة مستقلة. ولا جمل في هذا المستوى، كما كان."
  - "العدّ يبدأ بالواحد: الأعداد من ١ إلى ٥ أولًا، ثم الصفر بمعنى «لا شيء»، كما قرّرنا للمستوى الثاني."
  - "كلمتا الطاء: «طائرة ورقية» بدل «طائرة»، و«طاولة» بدل «طاووس»."
  - "تقييم مهارات القلم في آخر كل جزء: قائمة ملاحظة قصيرة للمعلّمة أو الأهل (مسكة القلم، والضغط، والاتجاه) ومهمّتا تتبّع."
  - "عدد الصفحات الآن: ١٢٠ للجزء الأول، و١١٦ للثاني، و١١٤ للثالث. وترتيب الحروف الأبجدي باقٍ كما هو."
  - "كل ملاحظات التدرّج والتنويع والمواءمة مترجمة إلى العربية في هذه النسخة."
