  - volume: 3
    term: 3
    weeks: 11
    title_ar: الجزء الثالث — أكمل حروفي وأبدأ القراءة
    title_v: "الجُزْءُ الثّالِثُ — أُكْمِلُ حُروفي وَأَبْدَأُ القِراءَةَ"
    objectives:
      pen: ["يرسم خطوط الوصل بين الحروف بخط ثابت", "يصل النقاط من ١ إلى ٢٠ بالترتيب", "يتتبّع مسارات طويلة فيها منعطفات ويلوّن الأجزاء الصغيرة بدقّة"]
      arabic: ["يتعرّف على الحروف من الفاء إلى الياء ويكتبها، فيكتمل عنده الحروف الثمانية والعشرون", "يقرأ الحرف مع الفتحة والضمة والكسرة والسكون", "يقرأ المقاطع القصيرة والطويلة (المدّ) ويركّب مقطعًا من حرف وحركة", "يقرأ كلمات بسيطة من ثلاثة أو أربعة حروف ويصلها بصورها، وكلمات قليلة مألوفة تبدأ بـ«ال» في آخر الجزء", "يكتب كلمات قصيرة على الخط المنقّط ثم وحده", "يقرأ جملة قصيرة من كلمتين ويصلها بصورتها"]
      math: ["يعدّ حتى ٢٠ ويقرأ الأعداد ١١–٢٠ ويتتبّعها، ويرى العشرات والآحاد بالصور فقط", "يقارن بين عددين حتى ٢٠ ويكمل الأعداد الناقصة على خط الأعداد", "يجمع مجموعتين من الصور حتى ١٠ ويكتب جملة الجمع", "يطرح بالصور حتى ١٠ ويكتب جملة الطرح", "يحلّ مسألة مصوّرة بسيطة ويختار بين الجمع والطرح"]
      english: ["يتعرّف على الحروف من S إلى Z كبيرة وصغيرة ويكتبها", "يسمّي كلمات من عشر مجموعات مفردات: الأعداد، الألوان، الأشكال، العائلة، أعضاء الجسم، الحيوانات، الفواكه، الطعام، الألعاب، أدوات المدرسة", "يقرأ كلمات إنجليزية قصيرة مثل cat وsun وbus ويصلها بصورها", "يقرأ جملة قصيرة جدًّا مثل I see a cat ويصلها بصورتها"]
      thinking: ["يحلّ متاهات صعبة ويلاحظ ٧ فروق بين صورتين", "يصنّف الأشياء حسب صفتين معًا (اللون والشكل)", "يكمل نمطًا متزايدًا ويتذكّر ترتيب ٥ صور", "يربط السبب بالنتيجة ويرسم حلًّا لمشكلة بسيطة"]
