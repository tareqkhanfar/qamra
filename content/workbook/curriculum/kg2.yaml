    objectives:
      pen: ["يرسم الحلزونات ويتتبّع مسارًا ضيّقًا دون أن يلمس الحواف", "يرسم أشكالًا صغيرة بين سطرين استعدادًا للكتابة على السطر", "يصل النقاط بترتيب الحروف الهجائية"]
      arabic: ["يميّز شكل الحرف في أول الكلمة ووسطها وآخرها للحروف التي تعلّمها", "يتعرّف على الحروف من الراء إلى الغين شكلًا وصوتًا ويربط كل حرف بصورتين تبدآن به", "يتتبّع كل حرف ويكتبه مستقلًّا ويميّز بين الحرفين المتشابهين بالنقاط (ر/ز، س/ش، ص/ض، ط/ظ، ع/غ)", "يجد الحرف بين حروف أخرى ويصل الحرف بالصورة والكلمة"]
      math: ["يتعرّف على الأعداد من ٦ إلى ١٠ ويتتبّعها ويكتبها", "يعدّ مجموعة حتى ١٠ أشياء ويطابقها مع العدد", "يقارن بين عددين حتى ١٠ ويرتّب الأعداد من ١ إلى ١٠", "يسمّي الدائرة والمربع والمثلث والمستطيل", "يستخدم كلمات المواقع: فوق/تحت، داخل/خارج، أمام/خلف، يمين/يسار", "يكمل نمطًا من ثلاثة عناصر (ABC)"]
      english: ["يتعرّف على الحروف من I إلى R كبيرة وصغيرة", "يتتبّع الحروف I–R ويكتبها", "يربط كل حرف بصورة وكلمة تبدأ به (insect, jar, kite…)", "يجد الحرف بين حروف أخرى ويطابقه مع صورته"]
      thinking: ["يجد الشيء المختلف ويشرح سبب اختلافه", "يصنّف الصور في مجموعات حسب النوع", "يرتّب صور قصة قصيرة حسب تسلسل أحداثها", "يحلّ متاهة متوسطة ويلاحظ ٥ فروق بين صورتين", "يتذكّر أيّ الصور اختفت من مجموعة من ٦ صور"]
