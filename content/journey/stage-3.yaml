# «رحلتي الأولى للتعلّم» — the print layer of stage 3 (qamra_workbook.journey_book): how each page of the
# plan (content/journey/plan.yaml) prints. See stage-1.yaml for the format. Letter pages reuse the دوسية's
# finger-trace, letter-trace, find-letter, en-letter, unit-review, letter-position and name-trace; the
# harakat, syllables, words and sentences are the journey's own pages (render/pages/journey_letters.py).
#
# draft: educator review — every title, instruction, «فِي هذه المحطة» line and audio script is a draft note
# for the educator (Tareq reviewed the pages himself; nothing here gates the site).
#
#   uv run python -m qamra_workbook.journey_book check
#   uv run python -m qamra_workbook.render.journey --stage 3 --book

stage: 3
title_ar: "المحطة الثالثة: أقرأ وأكتب وأحلّ"
cover:
  front: {subtitle: "أقرأ وأكتب وأحلّ", kicker: "رحلة {child}"}  # draft: educator review
  back:  # draft: educator review
    blurb: "في المحطة الثالثة {يُكمل/تُكمل} {child} الحروف الثمانية والعشرين، {ويقرأ بالحركات، ويركّب المقاطع كلمات، ويكتب على السطر ثم وحده، ويقرأ كلمات وجملًا قصيرة بالإنجليزية، ويجمع ويطرح بالصور، ثم ينال/وتقرأ بالحركات، وتركّب المقاطع كلمات، وتكتب على السطر ثم وحدها، وتقرأ كلمات وجملًا قصيرة بالإنجليزية، وتجمع وتطرح بالصور، ثم تنال} شهادة إتمام الرحلة."
    points: ["120 صفحة ملوّنة بالكامل، من الحرف إلى الكلمة والجملة", "رموز QR لسماع الحروف والحركات والكلمات", "تقييم ختامي وبطاقة ملاحظة للأهل وشهادة باسم {child}"]

pages:
  # ---- البداية
  1: {type: journey-owner, title: "هَذا الكِتابُ لِـ {child}", instruction: "{ضَعْ كَفَّكَ/ضَعي كَفَّكِ} هُنا", params: {subtitle: "المَحَطَّةُ الثّالِثَةُ: أَقْرَأُ وَأَكْتُبُ وَأَحُلُّ", lines: ["عُمْري", "بَدَأْتُ رِحْلَتي فِي"]}}  # draft: educator review
  2: {title: "خَريطَةُ رِحْلَةِ {child}: المَحَطَّةُ الثّالِثَةُ", instruction: "المَحَطَّةُ الثّالِثَةُ تَبْدَأُ! {ضَعْ مُلْصَقَكَ/ضَعي مُلْصَقَكِ} عِنْدَ «أُفَكِّرُ»", params: {stops: [أفكر, ألاحظ, أسمع, "أحرّك يدي", "أمسك القلم", أتتبع, أكتب, أقرأ, "أحل وأبدع"]}}  # draft: educator review

  # ---- 🧠 + 👀
  3: {type: journey-opener, title: "أُفَكِّرُ وَأُلاحِظُ: تَحَدِّياتٌ أَكْبَرُ", instruction: "{خُذْ بَطَلَكَ/خُذي بَطَلَتَكِ} إِلى «أُفَكِّرُ» ثُمَّ «أُلاحِظُ»", params: {here: [أفكر, ألاحظ], inside: ["أُرَتِّبُ قِصَّةً مِنْ سِتِّ صُوَرٍ", "أَتَذَكَّرُ سِتَّ صُوَرٍ", "أَتْبَعُ الطَّريقَ الصَّحيحَ بَيْنَ أَرْبَعَةٍ"]}}  # draft: educator review
  4: {type: journey-story, title: "مَوْسِمُ الزَّيْتونِ", instruction: "{رَتِّبْ/رَتِّبي} صُوَرَ قِطافِ الزَّيْتونِ، ثُمَّ {احْكِ/احْكي} قِصَّتَها", params: {story: olive}}  # draft: educator review
  5: {title: "سِتُّ صُوَرٍ", instruction: "{انْظُرْ/انْظُري} دَقيقَةً {وَاحْفَظِ/وَاحْفَظي} الصُّوَرَ، ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [moon, key, apple, cat, ball, sun]}}  # draft: educator review
  6: {title: "ماذا اخْتَفى؟", instruction: "أَيُّ صورَتَيْنِ اخْتَفَتا؟ {ضَعْ/ضَعي} حَوْلَهُما دائِرَتَيْنِ", params: {shown: [moon, apple, ball, sun], choices: [key, cat, fish, duck], answer: [key, cat]}}  # draft: educator review
  7: {title: "مَتاهَةُ القَلْعَةِ", instruction: "{جِدِ/جِدي} الطَّريقَ المَفْتوحَ إِلى القَلْعَةِ {وَارْسُمْهُ/وَارْسُميهِ}", params: {seed: 307, cols: 7, rows: 7, runner: knight, goal: castle}}  # draft: educator review
  8: {type: journey-tangled, title: "{ساعِدْ/ساعِدي} {child:acc} لِلْوُصولِ إِلى المَكْتَبَةِ", instruction: "أَيُّ طَريقٍ يَصِلُ إِلى المَكْتَبَةِ؟ {اتْبَعْهُ/اتْبَعيهِ} {بِإِصْبَعِكَ/بِإِصْبَعِكِ}", params: {to: [library, garden, house, stall], answer: library}}  # draft: educator review
  9: {title: "ماذا تَعَلَّمْتُ؟", instruction: "ثَلاثُ مُهِمّاتٍ: {رَتِّبْ/رَتِّبي}، {وَتَذَكَّرْ/وَتَذَكَّري}، ثُمَّ {اتْبَعِ/اتْبَعي} الطَّريقَ", params: {tasks: [sequence-6, memory-6, maze], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 👂 + ✋
  10: {type: journey-opener, title: "أَسْمَعُ وَأُحَرِّكُ يَدي", instruction: "{امْشِ بِإِصْبَعِكَ/امْشي بِإِصْبَعِكِ} إِلى «أَسْمَعُ» ثُمَّ «أُحَرِّكُ يَدي»", params: {here: [أسمع, "أحرّك يدي"], inside: ["أَسْمَعُ الكَلِماتِ الَّتي تَتَشابَهُ فِي آخِرِها", "أُصَفِّقُ لِكَلِماتٍ طَويلَةٍ", "أَرْسُمُ جُسورًا وَحَلَقاتٍ صَغيرَةً"]}}  # draft: educator review
  11:  # draft: educator review
    type: journey-rhyme
    title: "كَلِماتٌ تَتَشابَهُ فِي آخِرِها"
    instruction: "{اسْمَعْ/اسْمَعي} آخِرَ كُلِّ كَلِمَةٍ، {وَلَوِّنِ/وَلَوِّني} الكَلِمَتَيْنِ المُتَشابِهَتَيْنِ"
    params: {pairs: [[moon, tree], [door, book], [fish, duck]], odd: [cat, sun, house]}
    audio: {say: "الأول: قَمَر، شَجَر، قِطَّة. الثاني: باب، كِتاب، شَمْس. الثالث: سَمَكَة، بَطَّة، بَيْت.", show: ["قَمَر", "شَجَر", "باب", "كِتاب"], tts: true}
  12:  # draft: educator review
    type: journey-claps
    title: "كَلِماتٌ طَويلَةٌ"
    instruction: "{صَفِّقْ/صَفِّقي} لِلْكَلِمَةِ بِبُطْءٍ، {وَلَوِّنْ/وَلَوِّني} دائِرَةً لِكُلِّ تَصْفيقَةٍ"
    params: {words: [butterfly, hen, orange, car], claps: [3, 3, 4, 3]}
    audio: {say: "فَراشَة: فَ، را، شَة. دَجاجَة: دَ، جا، جَة. بُرْتُقالَة: بُرْ، تُ، قا، لَة. سَيّارَة: سَيْ، يا، رَة.", show: ["فَراشَة", "دَجاجَة", "بُرْتُقالَة", "سَيّارَة"], tts: true}
  13: {type: journey-bridges, title: "جُسورٌ صَغيرَةٌ", instruction: "{صِلْ/صِلي} كُلَّ صورَةٍ بِصَديقِها بِجُسورٍ صَغيرَةٍ", params: {count: 6, rise: 8}}  # draft: educator review
  14: {type: pen-lines, title: "دَوّاماتُ الرّيحِ", instruction: "{دَوِّرِ/دَوِّري} القَلَمَ كَالرّيحِ {وَارْسُمْ/وَارْسُمي} حَلَقاتٍ صَغيرَةً مُتَّصِلَةً", params: {line: loops}}  # draft: educator review
  15:  # draft: educator review
    title: "ماذا تَعَلَّمْتُ؟"
    instruction: "{اسْمَعْ/اسْمَعي} {وَصَفِّقْ/وَصَفِّقي}، ثُمَّ {ارْسُمِ/ارْسُمي} الجُسورَ"
    params: {tasks: [rhyme, syllables, joins], cheer: "رائِعٌ يا {child}!"}
    audio: {say: "قَمَر، شَجَر، قِطَّة: أيّها تتشابه؟ فَراشَة: فَ، را، شَة.", show: ["قَمَر", "شَجَر", "فَراشَة"], tts: true}

  # ---- 🔺 + 🔵
  16: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: أَشْكالٌ وَأَنْماطٌ", instruction: "مَحَطَّةٌ جَديدَةٌ! {أَوْصِلْ بَطَلَكَ/أَوْصِلي بَطَلَتَكِ} إِلى «أُمْسِكُ القَلَمَ»", params: {here: ["أمسك القلم"], inside: ["أَبْني صورَةً مِنَ الأَشْكالِ", "أَمْزُجُ لَوْنَيْنِ", "أُكْمِلُ نَمَطًا يَكْبُرُ"]}}  # draft: educator review
  17: {type: journey-shape-build, title: "أَبْني بِالأَشْكالِ", instruction: "{ابْنِ/ابْني} صورَةً جَديدَةً مِنَ الأَشْكالِ، ثُمَّ {لَوِّنْها/لَوِّنيها}"}  # draft: educator review
  18: {type: journey-color-mix, title: "أَلْوانٌ تَمْتَزِجُ", instruction: "{اخْلِطِ/اخْلِطي} اللَّوْنَيْنِ، ثُمَّ {لَوِّنِ/لَوِّني} الدّائِرَةَ الفارِغَةَ بِالنَّتيجَةِ", params: {mixes: [[yellow, blue, green], [red, yellow, orange], [red, blue, purple]]}}  # draft: educator review
  19: {type: journey-growing-pattern, title: "نَمَطٌ يَكْبُرُ", instruction: "كَيْفَ يَكْبُرُ النَّمَطُ؟ {ارْسُمِ/ارْسُمي} الخُطْوَةَ التّالِيَةَ", params: {steps: 3}}  # draft: educator review
  20: {title: "نَمَطٌ بِقاعِدَةٍ", instruction: "{اصْنَعْ/اصْنَعي} نَمَطًا بِالأَشْكالِ، ثُمَّ {اشْرَحْ/اشْرَحي} قاعِدَتَهُ", params: {slots: 10, stickers: [star, heart, circle]}}  # draft: educator review
  21: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{ابْنِ/ابْني} شَكْلًا، {وَاخْلِطْ/وَاخْلِطي} لَوْنَيْنِ، ثُمَّ {أَكْمِلِ/أَكْمِلي} النَّمَطَ", params: {tasks: [build-shape, mix-colors, growing-pattern], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 🎨
  22: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: التَّلْوينُ الذَّكِيُّ", instruction: "حانَ وَقْتُ التَّلْوينِ! {لَوِّنْ/لَوِّني} نَجْمَةً عَلى الخَريطَةِ", params: {here: ["أمسك القلم"], inside: ["أُلَوِّنُ حَسَبَ الرَّقْمِ", "أُلَوِّنُ حَسَبَ الحَرْفِ"]}}  # draft: educator review
  23: {type: journey-key-coloring, title: "{لَوِّنْ/لَوِّني} حَسَبَ الرَّقْمِ", instruction: "لِكُلِّ رَقْمٍ لَوْنٌ: {انْظُرْ/انْظُري} إِلى المِفْتاحِ {وَلَوِّنْ/وَلَوِّني}", params: {key: {"1": yellow, "2": red, "3": blue, "4": green, "5": orange, "6": purple}}}  # draft: educator review
  24: {type: journey-key-coloring, title: "{لَوِّنْ/لَوِّني} حَسَبَ الحَرْفِ", instruction: "{اقْرَأِ/اقْرَئي} الحَرْفَ، ثُمَّ {لَوِّنْهُ/لَوِّنيهِ} كَما فِي المِفْتاحِ", params: {key: {ب: red, ت: blue, ث: green}}}  # draft: educator review
  25: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{لَوِّنْ/لَوِّني} مَرَّةً حَسَبَ الرَّقْمِ، وَمَرَّةً حَسَبَ الحَرْفِ", params: {tasks: [number-key, letter-key], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 🔤 الحروف العربية: ض–ي, then positions, harakat, syllables and words
  26: {type: journey-opener, title: "أَتَتَبَّعُ: بَقِيَّةُ الحُروفِ وَالقِراءَةُ", instruction: "بَقِيَّةُ الحُروفِ تَنْتَظِرُ! {حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أَتَتَبَّعُ»", params: {here: [أتتبع], inside: ["أُكْمِلُ الحُروفَ الثَّمانِيَةَ وَالعِشْرينَ", "أَقْرَأُ بِالفَتْحَةِ وَالضَّمَّةِ وَالكَسْرَةِ", "أُرَكِّبُ المَقاطِعَ كَلِماتٍ"]}}  # draft: educator review
  27: {type: journey-finger-trace, title: "حَرْفُ الضّادِ: ضِفْدَع", instruction: "{اسْمَعِ/اسْمَعي} الضّادَ فِي «ضِفْدَع»، ثُمَّ {تَتَبَّعْها/تَتَبَّعيها} {بِإِصْبَعِكَ/بِإِصْبَعِكِ}", params: {letter: ض, form: isolated, word: frog}, audio: {key: "letter:ar:ض", title: "حَرْفُ الضّاد", say: "ضاد. ضِفْدَع. ضِرْس.", show: ["ض", "ضِفْدَع"], tts: true}}  # draft: educator review
  28: {title: "الضّادُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الضّادَ بِالقَلَمِ، ثُمَّ {اكْتُبْها/اكْتُبيها} {وَحْدَكَ/وَحْدَكِ}", params: {letter: ض, sizes: [xl, l, m]}}  # draft: educator review
  29: {title: "الصّادُ أَمِ الضّادُ؟", instruction: "بِالأَحْمَرِ {لَوِّنِ/لَوِّني} الصّادَ، وَبِالأَزْرَقِ الضّادَ", params: {letters: [ص, ض], distractors: [س, ط]}}  # draft: educator review
  30: {type: journey-finger-trace, title: "حَرْفُ الطّاءِ: طائِرَة", instruction: "{اسْمَعْ/اسْمَعي} «طائِرَة»، ثُمَّ {مَرِّرْ إِصْبَعَكَ/مَرِّري إِصْبَعَكِ} عَلى الطّاءِ", params: {letter: ط, form: isolated, word: plane}, audio: {key: "letter:ar:ط", title: "حَرْفُ الطّاء", say: "طاء. طائِرَة. طَبْل.", show: ["ط", "طائِرَة"], tts: true}}  # draft: educator review
  31: {title: "الطّاءُ بِالقَلَمِ", instruction: "{انْظُرْ/انْظُري} إِلى النَّموذَجِ، {وَتَتَبَّعِ/وَتَتَبَّعي} الطّاءَ، ثُمَّ {اكْتُبْها/اكْتُبيها}", params: {letter: ط, sizes: [xl, l, m]}}  # draft: educator review
  32: {type: journey-finger-trace, title: "حَرْفُ الظّاءِ: ظَرْف", instruction: "الظّاءُ طاءٌ فَوْقَها نُقْطَةٌ! {اسْمَعِ/اسْمَعي} الفَرْقَ {وَتَتَبَّعْها/وَتَتَبَّعيها}", params: {letter: ظ, form: isolated, word: envelope}, audio: {key: "letter:ar:ظ", title: "حَرْفُ الظّاء", say: "ظاء. ظَرْف. ظِلّ.", show: ["ظ", "ظَرْف"], tts: true}}  # draft: educator review
  33: {title: "الظّاءُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الظّاءَ، {وَلا تَنْسَ/وَلا تَنْسَيْ} نُقْطَتَها فَوْقَها", params: {letter: ظ, sizes: [xl, l, m]}}  # draft: educator review
  34: {title: "الطّاءُ أَمِ الظّاءُ؟", instruction: "{لَوِّنْ/لَوِّني} كُلَّ طاءٍ بِالأَحْمَرِ، وَكُلَّ ظاءٍ بِالأَزْرَقِ", params: {letters: [ط, ظ], distractors: [ص, ض]}}  # draft: educator review
  35: {type: journey-finger-trace, title: "حَرْفُ العَيْنِ: عِنَب", instruction: "{قُلْ/قُولي}: عَيْن، عِنَب، ثُمَّ {تَتَبَّعِ/تَتَبَّعي} العَيْنَ {بِإِصْبَعِكَ/بِإِصْبَعِكِ}", params: {letter: ع, form: isolated, word: grapes}, audio: {key: "letter:ar:ع", title: "حَرْفُ العَيْن", say: "عَيْن. عِنَب. عَصا.", show: ["ع", "عِنَب"], tts: true}}  # draft: educator review
  36: {title: "العَيْنُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} العَيْنَ بِبُطْءٍ، ثُمَّ {اكْتُبْها/اكْتُبيها} بِجانِبِ النَّموذَجِ", params: {letter: ع, sizes: [xl, l, m]}}  # draft: educator review
  37: {type: journey-finger-trace, title: "حَرْفُ الغَيْنِ: غَيْمَة", instruction: "{اسْمَعْ/اسْمَعي} «غَيْمَة»، ثُمَّ {الْمِسْ/الْمِسي} نُقْطَةَ الغَيْنِ", params: {letter: غ, form: isolated, word: cloud}, audio: {key: "letter:ar:غ", title: "حَرْفُ الغَيْن", say: "غَيْن. غَيْمَة. غَزال.", show: ["غ", "غَيْمَة"], tts: true}}  # draft: educator review
