# «رحلتي الأولى للتعلّم» — the print layer of stage 3 (qamra_workbook.journey_book): how each page of the
# plan (content/journey/plan.yaml) prints. See stage-1.yaml for the format. Letter pages reuse the دوسية's
# finger-trace, letter-trace, find-letter, en-letter, unit-review, letter-position and name-trace; the
# harakat, syllables, words and sentences are the journey's own pages (render/pages/journey_letters.py).
#
# draft: educator review — every title, instruction, «فِي هذه المحطة» line and audio script is a draft note
# for the educator (Tareq reviewed the pages himself; nothing here gates the site).
#
#   uv run python -m qamra_workbook.journey_book check
#   uv run python -m qamra_workbook.render.journey --stage 3 --book

stage: 3
title_ar: "المحطة الثالثة: أقرأ وأكتب وأحل"
cover:
  front: {subtitle: "أقرأ وأكتب وأحل", kicker: "رحلة {child}"}  # draft: educator review
  back:  # draft: educator review
    blurb: "في المحطة الثالثة {يُكمل/تُكمل} {child} الحروف الثمانية والعشرين، {ويقرأ بالحركات، ويركّب المقاطع كلمات، ويكتب على السطر ثم وحده، ويقرأ كلمات وجملًا قصيرة بالإنجليزية، ويجمع ويطرح بالصور، ثم ينال/وتقرأ بالحركات، وتركّب المقاطع كلمات، وتكتب على السطر ثم وحدها، وتقرأ كلمات وجملًا قصيرة بالإنجليزية، وتجمع وتطرح بالصور، ثم تنال} شهادة إتمام الرحلة."
    points: ["120 صفحة ملوّنة بالكامل، من الحرف إلى الكلمة والجملة", "رموز QR لسماع الحروف والحركات والكلمات", "تقييم ختامي وبطاقة ملاحظة للأهل وشهادة باسم {child}"]

pages:
  # ---- البداية
  1: {type: journey-owner, title: "هَذا الكِتابُ لِـ {child}", instruction: "{ضَعْ كَفَّكَ/ضَعي كَفَّكِ} هُنا", params: {subtitle: "المَحَطَّةُ الثّالِثَةُ: أَقْرَأُ وَأَكْتُبُ وَأَحُلُّ", lines: ["عُمْري", "بَدَأْتُ رِحْلَتي فِي"]}}  # draft: educator review
  2: {title: "خَريطَةُ رِحْلَةِ {child}: المَحَطَّةُ الثّالِثَةُ", instruction: "{ضَعْ مُلْصَقَكَ/ضَعي مُلْصَقَكِ} عِنْدَ «أُفَكِّرُ»", params: {stops: [أفكر, ألاحظ, أسمع, "أحرّك يدي", "أمسك القلم", أتتبع, أكتب, أقرأ, "أحل وأبدع"]}}  # draft: educator review

  # ---- 🧠 + 👀
  3: {type: journey-opener, title: "أُفَكِّرُ وَأُلاحِظُ: تَحَدِّياتٌ أَكْبَرُ", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أُفَكِّرُ» ثُمَّ «أُلاحِظُ»", params: {here: [أفكر, ألاحظ], inside: ["أُرَتِّبُ قِصَّةً مِنْ سِتِّ صُوَرٍ", "أَتَذَكَّرُ سِتَّ صُوَرٍ", "أَتْبَعُ الطَّريقَ الصَّحيحَ بَيْنَ أَرْبَعَةٍ"]}}  # draft: educator review
  4: {type: journey-story, title: "مَوْسِمُ الزَّيْتونِ", instruction: "{رَتِّبِ/رَتِّبي} الصُّوَرَ السِّتَّ {وَاحْكِ/وَاحْكي} القِصَّةَ", params: {story: olive}}  # draft: educator review
  5: {title: "سِتُّ صُوَرٍ", instruction: "{تَذَكَّرِ/تَذَكَّري} الصُّوَرَ السِّتَّ ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [moon, key, apple, cat, ball, sun]}}  # draft: educator review
  6: {title: "ماذا اخْتَفى؟", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ الصّورَتَيْنِ المُخْتَفِيَتَيْنِ", params: {shown: [moon, apple, ball, sun], choices: [key, cat, fish, duck], answer: [key, cat]}}  # draft: educator review
  7: {title: "مَتاهَةُ القَلْعَةِ", instruction: "{ارْسُمِ/ارْسُمي} الطَّريقَ {وَتَجَنَّبِ/وَتَجَنَّبي} الطُّرُقَ المَسْدودَةَ", params: {seed: 307, cols: 7, rows: 7, runner: knight, goal: castle}}  # draft: educator review
  8: {type: journey-tangled, title: "{ساعِدْ/ساعِدي} {child} لِلْوُصولِ إِلى المَكْتَبَةِ", instruction: "{اتْبَعِ/اتْبَعي} الطَّريقَ الصَّحيحَ بَيْنَ الطُّرُقِ المُتَشابِكَةِ", params: {to: [library, garden, house, stall], answer: library}}  # draft: educator review
  9: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{رَتِّبْ وَتَذَكَّرْ وَاتْبَعِ/رَتِّبي وَتَذَكَّري وَاتْبَعي} الطَّريقَ", params: {tasks: [sequence-6, memory-6, maze], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 👂 + ✋
  10: {type: journey-opener, title: "أَسْمَعُ وَأُحَرِّكُ يَدي", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أَسْمَعُ» ثُمَّ «أُحَرِّكُ يَدي»", params: {here: [أسمع, "أحرّك يدي"], inside: ["أَسْمَعُ الكَلِماتِ الَّتي تَتَشابَهُ فِي آخِرِها", "أُصَفِّقُ لِكَلِماتٍ طَويلَةٍ", "أَرْسُمُ جُسورًا وَحَلَقاتٍ صَغيرَةً"]}}  # draft: educator review
  11:  # draft: educator review
    type: journey-rhyme
    title: "كَلِماتٌ تَتَشابَهُ فِي آخِرِها"
    instruction: "{اسْتَمِعْ وَلَوِّنِ/اسْتَمِعي وَلَوِّني} الكَلِمَتَيْنِ المُتَشابِهَتَيْنِ"
    params: {pairs: [[moon, tree], [door, book], [fish, duck]], odd: [cat, sun, house]}
    audio: {say: "الأول: قَمَر، شَجَر، قِطَّة. الثاني: باب، كِتاب، شَمْس. الثالث: سَمَكَة، بَطَّة، بَيْت.", show: ["قَمَر", "شَجَر", "باب", "كِتاب"], tts: true}
  12:  # draft: educator review
    type: journey-claps
    title: "كَلِماتٌ طَويلَةٌ"
    instruction: "{صَفِّقْ/صَفِّقي} لِكُلِّ مَقْطَعٍ {وَلَوِّنِ/وَلَوِّني} الدَّوائِرَ"
    params: {words: [butterfly, hen, orange, car], claps: [3, 3, 4, 3]}
    audio: {say: "فَراشَة: فَ، را، شَة. دَجاجَة: دَ، جا، جَة. بُرْتُقالَة: بُرْ، تُ، قا، لَة. سَيّارَة: سَيْ، يا، رَة.", show: ["فَراشَة", "دَجاجَة", "بُرْتُقالَة", "سَيّارَة"], tts: true}
  13: {type: journey-bridges, title: "جُسورٌ صَغيرَةٌ", instruction: "{ارْسُمْ/ارْسُمي} جُسورًا صَغيرَةً بَيْنَ النِّقاطِ", params: {count: 6, rise: 8}}  # draft: educator review
  14: {type: pen-lines, title: "دَوّاماتُ الرّيحِ", instruction: "{ارْسُمْ/ارْسُمي} حَلَقاتٍ صَغيرَةً مُتَّصِلَةً", params: {line: loops}}  # draft: educator review
  15:  # draft: educator review
    title: "ماذا تَعَلَّمْتُ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} لِلْقافِيَةِ {وَارْسُمِ/وَارْسُمي} الجُسورَ"
    params: {tasks: [rhyme, syllables, joins], cheer: "رائِعٌ يا {child}!"}
    audio: {say: "قَمَر، شَجَر، قِطَّة: أيّها تتشابه؟ فَراشَة: فَ، را، شَة.", show: ["قَمَر", "شَجَر", "فَراشَة"], tts: true}

  # ---- 🔺 + 🔵
  16: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: أَشْكالٌ وَأَنْماطٌ", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أُمْسِكُ القَلَمَ»", params: {here: ["أمسك القلم"], inside: ["أَبْني صورَةً مِنَ الأَشْكالِ", "أَمْزُجُ لَوْنَيْنِ", "أُكْمِلُ نَمَطًا يَكْبُرُ"]}}  # draft: educator review
  17: {type: journey-shape-build, title: "أَبْني بِالأَشْكالِ", instruction: "{ابْنِ/ابْني} صورَةً مِنَ الأَشْكالِ {وَلَوِّنْها/وَلَوِّنيها}"}  # draft: educator review
  18: {type: journey-color-mix, title: "أَلْوانٌ تَمْتَزِجُ", instruction: "{امْزُجِ/امْزُجي} اللَّوْنَيْنِ {وَلَوِّنِ/وَلَوِّني} النَّتيجَةَ", params: {mixes: [[yellow, blue, green], [red, yellow, orange], [red, blue, purple]]}}  # draft: educator review
  19: {type: journey-growing-pattern, title: "نَمَطٌ يَكْبُرُ", instruction: "{ارْسُمِ/ارْسُمي} الخُطْوَةَ التّالِيَةَ فِي النَّمَطِ", params: {steps: 3}}  # draft: educator review
  20: {title: "نَمَطٌ بِقاعِدَةٍ", instruction: "{اصْنَعْ نَمَطًا وَقُلْ/اصْنَعي نَمَطًا وَقُولي} قاعِدَتَهُ", params: {slots: 10, stickers: [star, heart, circle]}}  # draft: educator review
  21: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{ابْنِ شَكْلًا وَأَكْمِلِ/ابْني شَكْلًا وَأَكْمِلي} النَّمَطَ", params: {tasks: [build-shape, mix-colors, growing-pattern], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 🎨
  22: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: التَّلْوينُ الذَّكِيُّ", instruction: "{لَوِّنِ/لَوِّني} النَّجْمَةَ عَلى الخَريطَةِ", params: {here: ["أمسك القلم"], inside: ["أُلَوِّنُ حَسَبَ الرَّقْمِ", "أُلَوِّنُ حَسَبَ الحَرْفِ"]}}  # draft: educator review
  23: {type: journey-key-coloring, title: "{لَوِّنْ/لَوِّني} حَسَبَ الرَّقْمِ", instruction: "{لَوِّنْ/لَوِّني} كُلَّ رَقْمٍ بِلَوْنِهِ فِي المِفْتاحِ", params: {key: {"1": yellow, "2": red, "3": blue, "4": green, "5": orange, "6": purple}}}  # draft: educator review
  24: {type: journey-key-coloring, title: "{لَوِّنْ/لَوِّني} حَسَبَ الحَرْفِ", instruction: "{لَوِّنْ/لَوِّني} كُلَّ حَرْفٍ بِلَوْنِهِ فِي المِفْتاحِ", params: {key: {ب: red, ت: blue, ث: green}}}  # draft: educator review
  25: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{لَوِّنْ/لَوِّني} حَسَبَ الرَّقْمِ وَالحَرْفِ", params: {tasks: [number-key, letter-key], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 🔤 الحروف العربية: ض–ي, then positions, harakat, syllables and words
  26: {type: journey-opener, title: "أَتَتَبَّعُ: بَقِيَّةُ الحُروفِ وَالقِراءَةُ", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أَتَتَبَّعُ»", params: {here: [أتتبع], inside: ["أُكْمِلُ الحُروفَ الثَّمانِيَةَ وَالعِشْرينَ", "أَقْرَأُ بِالفَتْحَةِ وَالضَّمَّةِ وَالكَسْرَةِ", "أُرَكِّبُ المَقاطِعَ كَلِماتٍ"]}}  # draft: educator review
  27: {type: journey-finger-trace, title: "حَرْفُ الضّادِ: ضِفْدَع", instruction: "{اسْتَمِعْ وَمَرِّرْ إِصْبَعَكَ/اسْتَمِعي وَمَرِّري إِصْبَعَكِ} عَلى الضّادِ", params: {letter: ض, form: isolated, word: frog}, audio: {key: "letter:ar:ض", title: "حَرْفُ الضّاد", say: "ضاد. ضِفْدَع. ضِرْس.", show: ["ض", "ضِفْدَع"], tts: true}}  # draft: educator review
  28: {title: "الضّادُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الضّادَ ثُمَّ {اكْتُبْها/اكْتُبيها} بِجانِبِ النَّموذَجِ", params: {letter: ض, sizes: [xl, l, m]}}  # draft: educator review
  29: {title: "الصّادُ أَمِ الضّادُ؟", instruction: "{لَوِّنِ/لَوِّني} الصّادَ بِالأَحْمَرِ وَالضّادَ بِالأَزْرَقِ", params: {letters: [ص, ض], distractors: [س, ط]}}  # draft: educator review
  30: {type: journey-finger-trace, title: "حَرْفُ الطّاءِ: طائِرَة", instruction: "{اسْتَمِعْ وَمَرِّرْ إِصْبَعَكَ/اسْتَمِعي وَمَرِّري إِصْبَعَكِ} عَلى الطّاءِ", params: {letter: ط, form: isolated, word: plane}, audio: {key: "letter:ar:ط", title: "حَرْفُ الطّاء", say: "طاء. طائِرَة. طَبْل.", show: ["ط", "طائِرَة"], tts: true}}  # draft: educator review
  31: {title: "الطّاءُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الطّاءَ ثُمَّ {اكْتُبْها/اكْتُبيها} بِجانِبِ النَّموذَجِ", params: {letter: ط, sizes: [xl, l, m]}}  # draft: educator review
  32: {type: journey-finger-trace, title: "حَرْفُ الظّاءِ: ظَرْف", instruction: "{اسْتَمِعْ وَقارِنِ/اسْتَمِعي وَقارِني} الظّاءَ بِالطّاءِ", params: {letter: ظ, form: isolated, word: envelope}, audio: {key: "letter:ar:ظ", title: "حَرْفُ الظّاء", say: "ظاء. ظَرْف. ظِلّ.", show: ["ظ", "ظَرْف"], tts: true}}  # draft: educator review
  33: {title: "الظّاءُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الظّاءَ ثُمَّ {ضَعْ/ضَعي} نُقْطَتَها", params: {letter: ظ, sizes: [xl, l, m]}}  # draft: educator review
  34: {title: "الطّاءُ أَمِ الظّاءُ؟", instruction: "{لَوِّنِ/لَوِّني} الطّاءَ بِالأَحْمَرِ وَالظّاءَ بِالأَزْرَقِ", params: {letters: [ط, ظ], distractors: [ص, ض]}}  # draft: educator review
  35: {type: journey-finger-trace, title: "حَرْفُ العَيْنِ: عِنَب", instruction: "{اسْتَمِعْ وَمَرِّرْ إِصْبَعَكَ/اسْتَمِعي وَمَرِّري إِصْبَعَكِ} عَلى العَيْنِ", params: {letter: ع, form: isolated, word: grapes}, audio: {key: "letter:ar:ع", title: "حَرْفُ العَيْن", say: "عَيْن. عِنَب. عَصا.", show: ["ع", "عِنَب"], tts: true}}  # draft: educator review
  36: {title: "العَيْنُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} العَيْنَ ثُمَّ {اكْتُبْها/اكْتُبيها} بِجانِبِ النَّموذَجِ", params: {letter: ع, sizes: [xl, l, m]}}  # draft: educator review
  37: {type: journey-finger-trace, title: "حَرْفُ الغَيْنِ: غَيْمَة", instruction: "{اسْتَمِعْ وَضَعِ/اسْتَمِعي وَضَعي} النُّقْطَةَ فَوْقَ الغَيْنِ", params: {letter: غ, form: isolated, word: cloud}, audio: {key: "letter:ar:غ", title: "حَرْفُ الغَيْن", say: "غَيْن. غَيْمَة. غَزال.", show: ["غ", "غَيْمَة"], tts: true}}  # draft: educator review
  38: {title: "الغَيْنُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الغَيْنَ ثُمَّ {ضَعْ/ضَعي} نُقْطَتَها", params: {letter: غ, sizes: [xl, l, m]}}  # draft: educator review
  39: {title: "العَيْنُ أَمِ الغَيْنُ؟", instruction: "{لَوِّنِ/لَوِّني} العَيْنَ بِالأَحْمَرِ وَالغَيْنَ بِالأَزْرَقِ", params: {letters: [ع, غ], distractors: [ح, خ]}}  # draft: educator review
  40: {type: journey-match-letters, title: "مُراجَعَةٌ: ض ط ظ ع غ", instruction: "{صِلِ/صِلي} الحَرْفَ بِالكَلِمَةِ وَبِالصّورَةِ", params: {letters: [ض, ط, ظ, ع, غ], words: [ضفدع, طبل, ظرف, عين, غيمة]}}  # draft: educator review
