title_ar: رحلتي الأولى للتعلّم
title_en: My First Learning Journey
idea: |
  «رحلتي الأولى للتعلّم» is a readiness-first learning journey for ages 3–6. It comes as three stages («محطات») of up to 120 full-colour pages each, sold separately or as a set. The child is the explorer. Their own character from the cover walks a journey map of nine stops: أفكر 🧠 → ألاحظ 👀 → أسمع 👂 → أحرّك يدي ✋ → أمسك القلم ✏️ → أتتبع → أكتب → أقرأ → أحل وأبدع 🌈. **Every stage walks the whole map.** Every section appears in every stage, with fewer pages each, so the child fills the same map three times, each time at a higher level. Every section starts on the map with the character at the section's stop (the child moves a sticker there) and ends with «ماذا تعلمت؟», a short review that mixes the new skills with earlier ones and ends with «رائع يا {child}!». Two small neighbouring sections may share one opener page and one «ماذا تعلمت؟» page.

  Every page is a **mission**. It has one or two goals, a big title and an instruction of at most 7 words for a parent to read aloud. The pictures are big, and the task uses every one of them. A solved example appears whenever a format is new, and there is plenty of room to work. Formats rotate: never more than two pages of the same type in a row, and every spread mixes activities. Listening pages, Arabic letters and English letters carry a QR code that plays the sound or word. Every page still works without audio, because the parent can read the instruction.

  **Stage 1 (3–4)** is all readiness, before any letter: thinking games, eye-leads-hand paths, listening and sounds, pre-writing lines, shapes and colours, patterns and smart colouring. Its Arabic, writing and English stops have no letters: the eyes and a finger learn to move from right to left, the pen draws shapes on a writing line, and the ear meets its first English words. Math counts quantities 1–5 first; then the child recognises the numerals 1–5 by sight and matches each one to its quantity. Stage 1 never writes a letter or a numeral, and it ends with a mini-certificate. **Stage 2 (4–5)** adds harder thinking, first sounds, the first 14 Arabic letters (أ–ص), writing levels 3–5, English A–N with five vocabulary units, and numbers 1–10: the numerals 1–5 are now traced and written, and 6–10 start again from quantities. It ends with a mini-certificate. **Stage 3 (5–6)** covers the last 14 letters (ض–ي), letter positions, the harakat, syllables, words and picture-words. It finishes the writing progression (levels 5–7) and English (O–Z, the last vocabulary units, very short sentences), adds addition and subtraction with pictures and thinking challenges, and closes with the final assessment and the certificate.

  **One new letter at a time.** A page brings at most one new letter. Each Arabic letter has its own finger-trace page (meet it, hear it, link it to a picture, trace it with a finger) and its own letter-trace page (the pen, then writing next to the model). When two or three letters are known, a find-letter page sets them side by side (ب ت ث by their dots). Only review pages put four letters or more together.

  **How it differs from «دوسية التأسيس».** The دوسية is a school-term workbook for KG1/KG2 (4–6). Its subjects are interleaved week by week, with assessments and units, and it is built for kindergartens term by term. «رحلتي الأولى» is a game and adventure book for parents at home and for nurseries. It starts at age 3, before any letter, and follows the readiness order: think, observe and listen before using the hand; the hand before the pen; tracing before writing; writing before reading. Its sections are stops on an adventure, not school subjects. It has no weeks or grades. Progress shows on the map, with stickers and certificates. The interior is full colour only, because smart colouring needs printed colour models.

  **Personalisation.** The child's name and character appear on the cover, on the «هذا الكتاب لـ {child}» page and on the journey map. Some missions use the child's name. Stages 2–3 add name tracing in Arabic and English, and every stage ends with a personal certificate. Instructions are written in the masculine form; the engine prints the feminine form for girls (لوّني، ارسمي), as the storybooks do. On the printed page every title and instruction is fully vowelised. This plan shows them lightly vowelised so they are easy to review.

  **Numerals.** Arabic and math pages print Hindi numerals (١٢٣) by default; a parent can ask for 123 instead. English pages always print 123. The page numbers and the section chip follow the parent's choice on every page. The plan writes numbers as 1, 2, 3.
skill_order: |
  **Across the stages.** Each stage walks the whole journey map in the same order at a higher level, and each stage starts where the previous one stopped.
  - Stage 1 builds readiness: attention, observation, listening, the hand and the crayon. Its Arabic, writing and English stops prepare the eye, the pen and the ear without any letter.
  - Stage 2 turns that readiness into first letters, first sounds and first written numerals.
  - Stage 3 turns letters into reading and writing, and quantities into adding and taking away.
  - The readiness sections (thinking, eye-hand, listening, hand, shapes and colours, patterns, smart colouring) stay short in stages 2 and 3, at a higher level each time. The map stays whole, and each small section builds on what came before it: stage 2 colours by first sounds, stage 3 colours by numerals and letters.

  **Within stage 1.** The stage moves from the eye and the ear to the hand, then to the pen:
  1. Thinking comes first: observation, then memory (look/recall pairs), then logic and sequencing, then discrimination (big/small, long/short) and sorting by use.
  2. Eye-leads-hand paths run from a wide straight road to a maze, a shortest path and two overlapping paths. The child steers with the eye before holding a line with the pen.
  3. Listening runs from animal and object sounds to loud/soft and fast/slow, then to choosing the picture whose name you hear and same/different sounds.
  4. The hand warms up with dotted lines and themed drills (rain, grass, waves, mountains), then dot-to-dot, complete-the-shape and a spiral path. The lines are writing level 1.
  5. Shapes and colours come before patterns, and patterns before smart colouring. «لوّن كل الدوائر» only makes sense once the circle is known, and an AB pattern needs shapes and colours the child can name. Shapes are traced at writing level 2.
  6. The Arabic stop («أتتبع») trains the reading direction without letters: the eyes and a finger move from right to left, and the child matches boats by their dots (one below, two above, three above), the way ب ت ث will differ in stage 2. The writing stop («أكتب») puts shapes and the boat curve on a writing line, from right to left (level 2). The English stop («أقرأ») is for the ear: animals and colours, heard and pointed at.
  7. Quantities 1–5 are counted with objects, dots and fingers first. Only then does the child meet the numerals 1–5 by sight and match them to quantities: circle the right numeral out of three, join each numeral to its group. Stage 1 never traces or writes a numeral. Math concepts (many/few, same amount, above/below, near/far, inside/outside) come alongside.

  **Within stage 2.** First sounds come before letters: the child hears /b/ in بطة, and colours by that sound, before seeing ب. Each Arabic letter follows the same order, one new letter per page:
  1. meet it, hear it (QR), link it to a picture and trace it with a finger (finger-trace);
  2. trace it with the pen (dotted, with a start dot and arrows), then write it next to the model (letter-trace);
  3. once two or three letters are known: find them among others, pick the right one, spot them in words and colour them (find-letter);
  4. review every four or five letters (unit-review).

  Step 11 of §4.9 («write the letter alone») is held back to stage 3, so stage 2 never goes past writing level 5.

  Letters come in shape families (ب ت ث، ج ح خ، د ذ، ر ز، س ش ص), so the second and third letters of a family reuse the stroke the child already knows, and each family ends on one find-letter page that tells them apart. The writing section then practises the same letters on writing levels 3–5 (trace → complete → write next to the model), three letters per page. English letters come two at a time, each pair followed by a vocabulary unit or a review. Numbers: the numerals 1–5, known by sight since stage 1, are now traced and written. Numbers 6–10 start with quantity pages, then the numeral is met, traced and written.

  **Within stage 3.** The last 14 letters follow the same method, one new letter per page, with a find-letter page for each pair of look-alike letters (ص ض، ط ظ، ع غ، ف ق). Once all 28 letters are known, the stage moves through:
  1. letter positions (beginning, middle, end);
  2. فتحة، ضمة، كسرة، سكون;
  3. reading and building syllables;
  4. reading simple words and picture-words;
  5. writing words, dotted and then alone.

  Writing finishes the progression: next to the model → on the line → with no model. Independent word writing comes only after the first no-model page. English finishes O–Z with the last vocabulary units, reads simple words, then very short sentences built from those words. Math adds and takes away with pictures, within 5 and then within 10. Thinking challenges and the final assessment (child tasks and the parent/teacher checklist) close the journey before the certificate.
difficulty_notes: |
  Difficulty runs from 1 to 5.
  - **1:** one step, 2–4 big pictures, a solved example.
  - **2:** one step with more choices or a longer line.
  - **3:** two steps, or 5–6 items to hold in mind.
  - **4:** several steps, small details or a longer sequence.
  - **5:** independent work with no model.

  **Stage 1 (3–4): levels 1–2.**
  - Pages have 2–4 big pictures and one action (circle, colour, draw a line).
  - Paths are wide, with at most one dead end.
  - Memory pages have 3 then 4 items, and spot-the-difference has 3 differences.
  - Patterns start as AB, then one three-colour pattern, then the child's own AB pattern.
  - Numerals come only after counting: the child picks the right numeral out of three, never more.
  - Most sections start at 1 and end at 2.

  **Stage 2 (4–5): levels 2–3.**
  - Four-panel stories, 5 memory items, ABB patterns, sorting by two attributes, and a maze with 3 dead ends.
  - Each letter starts at 2 (meeting it, finger-tracing) and reaches 3 with the pen and the find-letter pages.
  - Writing moves from level 3 (trace the letter) to level 5 (write next to the model).
  - Numerals go to 10, with before/after and more/less.

  **Stage 3 (5–6): levels 3–5.**
  - Letters still come one at a time, then in three positions.
  - The four harakat, then building syllables into words, then reading picture-words.
  - Writing moves to the line, then to no model at all (level 5).
  - English moves to words and very short sentences, and math adds and subtracts within 10.
  - The challenges have 6 memory items, 4 tangled paths, a growing pattern, 5 differences, a 3-clue riddle and a 6-panel story.

  Between neighbouring mission pages in a section, the level rises by at most one step. «ماذا تعلمت؟» is never harder than the section's hardest page, so every section ends on a success. Structural pages (owner page, map, section openers, certificates) are marked 1 because they are not tasks, so every stage's easiest page shows as 1.
writing_notes: |
  The writing progression (§4.10) has seven levels:
  1. trace a line
  2. trace a shape
  3. trace the letter
  4. complete the letter
  5. write next to the model
  6. write on the line
  7. write with no model

  Each level is practised on `write-progression` pages (params.level). A new level starts only after at least 3 pages at the level before it, and those pages are spread out with other activities in between, never more than two in a row. A writing page practises at most three letters, all of them already met.

  Where each level is practised (the generated table below counts the same pages):

  | Level | Stage | Pages |
  |---|---|---|
  | 1: trace a line | stage 1, hand | 4 |
  | 2: trace a shape | stage 1: 3 in shapes and colours, 2 on the writing stop | 5 |
  | 3: trace the letter | stage 2, writing | 3 |
  | 4: complete the letter | stage 2, writing | 3 |
  | 5: write next to the model | 1 in stage 2, 2 in stage 3 | 3 |
  | 6: write on the line | stage 3, writing | 3 |
  | 7: write with no model | stage 3, writing | 2 |

  Around these pages, the child gets more pen practice before each new level:
  - **Stage 1.** Before level 2, the child traces lines on 4 themed drills (rain, grass, waves, mountains). Around level 2, they trace shapes on 6 shape pages, trace a boat curve with a finger and complete half-shapes. On the writing stop, shapes and boat curves sit on a writing line and run from right to left. No letter and no numeral is written.
  - **Stage 2.** Every letter gets a finger-trace page and a letter-trace page (the pen, then writing next to the model) before the writing section. By the first level 4 page, each letter on it has been traced three times: with a finger, with the pen and on a level 3 page.
  - **Stage 3.** The last 14 letters get the same finger-trace → letter-trace sequence, then a dotted word to trace and copy. The writing section writes the new letters next to the model (level 5), all kinds of letters on the line (level 6), and finally with no model (level 7): the first letter of three pictures, then three dictated letters.
    - Independent word writing («أكتب الكلمة وحدي») comes after the first level 7 page, never before.
    - The child's name is traced and then copied in Arabic and in English.

  **Step 11 of the letter method («write the letter alone»).** For stage 2 letters this step is deliberately held back to stage 3, so stage 2 never goes past level 5. Stage 3 reaches it through level 7 and word writing.

  Writing lines are largest in stage 1 and get smaller in each stage. In stage 2 a letter is never written without a model. Writing with no model begins in stage 3, after 3 pages at level 5 and 3 at level 6.
