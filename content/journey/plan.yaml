# «رحلتي الأولى للتعلّم» — the journey plan (Addendum 6 §3).
# One page per line. Check: uv run python -m qamra_workbook.journey check
# Render docs/journey/plan.md: uv run python -m qamra_workbook.journey render
title_ar: رحلتي الأولى للتعلّم
title_en: My First Learning Journey
idea: |
  «رحلتي الأولى للتعلّم» is a readiness-first learning journey for ages 3–6. It comes as three stages («محطات») of 110–120 full-colour pages each, sold separately or as a set. The child is the explorer. Their own character from the cover walks a journey map of nine stops: أفكر 🧠 → ألاحظ 👀 → أسمع 👂 → أحرّك يدي ✋ → أمسك القلم ✏️ → أتتبع → أكتب → أقرأ → أحل وأبدع 🌈. The map opens every stage. Every section starts on the map with the character at the section's stop (the child moves a sticker there) and ends with «ماذا تعلمت؟», a short review that mixes the new skills with earlier ones and ends with «رائع يا {child}!».

  Every page is a **mission**. It has one or two goals, a big title and an instruction of at most 7 words for a parent to read aloud. The pictures are big, and the task uses every one of them. A solved example appears whenever a format is new, and there is plenty of room to work. Formats rotate: never more than two pages of the same type in a row, and every spread mixes activities. Listening pages, Arabic letters and English letters carry a QR code that plays the sound or word. Every page still works without audio, because the parent can read the instruction.

  **Stage 1 (3–4)** is all readiness, before any letter: thinking games, eye-leads-hand paths, listening and sounds, pre-writing lines, shapes and colours, patterns, smart colouring and quantities 1–5. It has no letters and no written numerals, and it ends with a mini-certificate. **Stage 2 (4–5)** adds harder thinking, first sounds, the first 14 Arabic letters (أ–ص) with the full multi-step method, writing levels 3–5, English A–N, and numbers 1–10 (always quantity first). It ends with a mini-certificate. **Stage 3 (5–6)** covers the last 14 letters (ض–ي), letter positions, the harakat, syllables, words and picture-words. It then finishes the writing progression (levels 5–7) and English (O–Z, the 10 vocabulary units, very short sentences), and adds addition and subtraction with pictures and thinking challenges. The book closes with the final assessment and the certificate.

  **How it differs from «دوسية التأسيس».** The دوسية is a school-term workbook for KG1/KG2 (4–6). Its subjects are interleaved week by week, with assessments and units, and it is built for kindergartens term by term. «رحلتي الأولى» is a game and adventure book for parents at home and for nurseries. It starts at age 3, before any letter, and follows the readiness order: think, observe and listen before using the hand; the hand before the pen; tracing before writing; writing before reading. Its sections are stops on an adventure, not school subjects. It has no weeks or grades. Progress shows on the map, with stickers and certificates. The interior is full colour only, because smart colouring needs printed colour models.

  **Personalisation.** The child's name and character appear on the cover, on the «هذا الكتاب لـ {child}» page and on the journey map. Some missions use the child's name. Stages 2–3 add name tracing in Arabic and English, and every stage ends with a personal certificate. Instructions are written in the masculine form; the engine prints the feminine form for girls (لوّني، ارسمي), as the storybooks do. On the printed page every title and instruction is fully vowelised. This plan shows them lightly vowelised so they are easy to review. Numerals print in the digit style the parent chooses at checkout (Arabic-Indic ١٢٣ by default, or 123), as in «دوسية التأسيس». The plan writes them as 1, 2, 3.
skill_order: |
  **Across the stages.** Each stage walks the journey map in the same order at a higher level, and each stage starts where the previous one stopped.
  - Stage 1 builds readiness: attention, observation, listening, the hand and the crayon.
  - Stage 2 turns that readiness into first letters, first sounds and first numerals.
  - Stage 3 turns letters into reading and writing, and quantities into adding and taking away.
  - Stage 1 visits the stops أفكر → ألاحظ → أسمع → أحرّك يدي → أمسك القلم → أحل وأبدع. Stage 2 visits أفكر → أسمع → أتتبع → أكتب → أقرأ → أحل وأبدع. Stage 3 visits أتتبع → أكتب → أقرأ → أحل وأبدع.
  - Sections a stage no longer needs as whole blocks live on inside other pages: mazes and paths in thinking games; pen control in finger-tracing and tracing; smart colouring on letter and number pages.

  **Within stage 1.** The stage moves from the eye and the ear to the hand, then to the pen:
  1. Thinking comes first: observation, then memory (look/recall pairs), then logic and sequencing, then discrimination (big/small, long/short) and sorting by use.
  2. Eye-leads-hand paths run from a wide straight road to a maze, a shortest path and two overlapping paths. The child steers with the eye before holding a line with the pen.
  3. Listening runs from animal and object sounds to loud/soft and fast/slow, then to choosing the picture whose name you hear and same/different sounds.
  4. The hand warms up with dotted lines and themed drills (rain, grass, waves, mountains), then dot-to-dot, complete-the-shape and drawing inside borders. These are writing levels 1–2.
  5. Shapes and colours come before patterns, and patterns before smart colouring. «لوّن كل الدوائر» only makes sense once the circle is known, and an AB pattern needs shapes and colours the child can name.
  6. Quantities 1–5 are counted with objects and dots, never with written numerals. Math concepts (many/few, same amount, above/below, inside/outside, near/far) come alongside.

  **Within stage 2.** First sounds come before letters: the child hears /b/ in بطة before seeing ب. Each Arabic letter follows the same order:
  1. meet it, hear it (QR) and link it to a picture (letter-intro, which also has the pictures to colour);
  2. trace it with a finger (a big solid path with arrows);
  3. trace it with the pen (dotted, with a start dot and arrows);
  4. practise it next to a model (letter-write);
  5. find it and identify it (find-letter);
  6. recognise it in words and colour by its sound (match-letter-picture, smart colouring);
  7. review it (unit-review).

  Step 11 of §4.9 («write the letter alone») is held back to stage 3, so stage 2 never goes past writing level 5.

  Letters come in shape families (ب ت ث، ج ح خ، د ذ، ر ز، س ش ص), so the second and third letters of a family reuse the stroke the child already knows. The writing section then practises the same letters on writing levels 3–5 (trace → complete → write next to the model). English letters come after the Arabic ones, two at a time with a practice page after each pair. Numbers 6–10 always start with a quantity page, then the numeral is met, traced and written. Numbers 1–5 were counted in stage 1, so stage 2 goes straight to their numerals.

  **Within stage 3.** The last 14 letters follow the same method in groups of four, a faster pace for 5–6-year-olds. Once all 28 letters are known, the stage moves through:
  1. letter positions (beginning, middle, end);
  2. فتحة، ضمة، كسرة، سكون;
  3. reading and building syllables;
  4. reading simple words and picture-words;
  5. writing words, dotted and then alone.

  Writing finishes the progression: next to the model → on the line → with no model. Independent word writing comes only after the first no-model page. English finishes O–Z, then the 10 vocabulary units and very short sentences built from those words. Math adds and takes away with pictures, within 5 and then within 10. Thinking challenges and the final assessment (child tasks and the parent/teacher checklist) close the journey before the certificate.
difficulty_notes: |
  Difficulty runs from 1 to 5.
  - **1:** one step, 2–4 big pictures, a solved example.
  - **2:** one step with more choices or a longer line.
  - **3:** two steps, or 5–6 items to hold in mind.
  - **4:** several steps, small details or a longer sequence.
  - **5:** independent work with no model.

  **Stage 1 (3–4): levels 1–2, average 1.7.**
  - Pages have 2–4 big pictures and one action (circle, colour, draw a line).
  - Paths are wide, with at most one dead end.
  - Memory pages have 3 then 4 items, and spot-the-difference has 3 differences.
  - Patterns start as AB, then one three-colour pattern, then the child's own AB pattern.
  - Most sections start at 1 and end at 2, and 12 pages carry a solved example.

  **Stage 2 (4–5): levels 2–3, average 2.5.**
  - Four-panel stories, 5 memory items, ABB patterns, sorting by two attributes, and a maze with 3 dead ends.
  - Each letter starts at 2 (meeting it, finger-tracing) and reaches 3 with pen tracing, finding and practising.
  - Writing moves from level 3 (trace the letter) to level 5 (write next to the model).
  - Numerals go to 10, with before/after and more/less.

  **Stage 3 (5–6): levels 3–5, average 3.5.**
  - Letters come in groups of four, and in three positions.
  - The four harakat, then building syllables into words, then reading picture-words.
  - Writing moves to the line, then to no model at all (level 5).
  - English moves to words and very short sentences, and math adds and subtracts within 10.
  - The thinking challenges have 5 differences, 4 tangled paths, a growing pattern, a 3-clue riddle and a 6-panel story.

  Between neighbouring mission pages in a section, the level rises by at most one step. «ماذا تعلمت؟» is never harder than the section's hardest page, so every section ends on a success. Structural pages (owner page, map, section openers, certificates) are marked 1 because they are not tasks, so every stage's easiest page shows as 1. The averages above count mission pages only.
writing_notes: |
  The writing progression (§4.10) has seven levels:
  1. trace a line
  2. trace a shape
  3. trace the letter
  4. complete the letter
  5. write next to the model
  6. write on the line
  7. write with no model

  Each level is practised on `write-progression` pages (params.level). A new level starts only after at least 3 pages at the level before it, and those pages are spread out with other activities in between, never more than two in a row.

  Where each level is practised (the generated table below counts the same pages):

  | Level | Stage | Pages |
  |---|---|---|
  | 1: trace a line | stage 1, hand | 4 |
  | 2: trace a shape | stage 1, shapes and colours | 4 |
  | 3: trace the letter | stage 2, writing | 3 |
  | 4: complete the letter | stage 2, writing | 3 |
  | 5: write next to the model | 2 in stage 2, 2 in stage 3 | 4 |
  | 6: write on the line | stage 3, writing | 3 |
  | 7: write with no model | stage 3, writing | 3 |

  Around these pages, the child gets more pen practice before each new level:
  - **Stage 1.** Before level 2, the child traces lines on 4 themed drills (rain, grass, waves, mountains). Before and alongside level 2, they trace shapes with a finger and on 6 shape pages, complete half-shapes and colour inside borders.
  - **Stage 2.** Every letter gets a finger-trace, a pen-trace (letter-trace) and practice next to the model (letter-write). By the first level 4 page, each of the 14 letters has been traced three times: with a finger, with the pen (letter-trace) and on a level 3 page.
  - **Stage 3.** The last 14 letters get the same finger-trace → letter-trace → letter-write (next to the model) sequence, then a dotted word to trace and copy. The writing section then covers the new letters at level 5, all letters on the line (level 6), and finally no model (level 7).
    - At level 7 the child writes the first letter of 8 pictures and 6 dictated letters, so all 14 new letters are written alone, and then their own name.
    - Independent word writing («أكتب الكلمة وحدي») comes after the first level 7 page, never before.

  **Step 11 of the letter method («write the letter alone»).** For stage 2 letters this step is deliberately held back to stage 3, so stage 2 never goes past level 5. Stage 3 reaches it for all letters, through level 7 and word writing.

  Writing lines are largest in stage 1 and get smaller in each stage. In stage 2 a letter is never written without a model. Writing with no model begins in stage 3, after 4 pages at level 5 and 3 at level 6.
