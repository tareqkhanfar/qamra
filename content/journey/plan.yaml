      writing: ["مستوى الكتابة 3: يتتبع الحرف", "مستوى الكتابة 4: يكمل الحرف الناقص", "مستوى الكتابة 5: يكتب الحرف بجانب النموذج", "يتتبع اسمه بالعربية"]
