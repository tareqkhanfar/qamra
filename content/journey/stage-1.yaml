# «رحلتي الأولى للتعلّم» — the print layer of stage 1 (qamra_workbook.journey_book): how each page of the
# plan (content/journey/plan.yaml) prints. The plan says what a page teaches; this file gives the printed,
# vowelised title and instruction ({masc/fem} variants, {child}), the engine page type when it differs, the
# render params and the audio item its QR plays.
#
# draft: educator review — every title, instruction, «في هذه المحطة» line, riddle and audio script in this
# file is a draft for the educator. Nothing educational is printed for sale before the educator signs the plan
# and the letter shapes (Tareq's decisions of 2026-09-28). Write numbers as 1, 2, 3: the page prints them in
# its numerals.
#
#   uv run python -m qamra_workbook.journey_book check     # this file against the plan and the engine
#   uv run python -m qamra_workbook.render.journey --stage 1 --book

stage: 1
title_ar: "المحطة الأولى: أستعدّ للرحلة"
cover:
  front: {subtitle: "أستعدّ للرحلة", kicker: "رحلة {child}"}  # draft: educator review
  back:  # draft: educator review
    blurb: "في المحطة الأولى {يستعدّ/تستعدّ} {child} للتعلّم باللعب: التفكير والملاحظة والاستماع، ثم تحريك اليد ومسك القلم، والأشكال والألوان والكميات من 1 إلى 5. لا حروف ولا كتابة أرقام بعد: الاستعداد أولًا."
    points: ["118 صفحة ملوّنة بالكامل، في كل صفحة مهمّة واحدة", "رموز QR لسماع الأصوات والكلمات", "خريطة رحلة وملصقات وشهادة باسم {child}"]

pages:
  # ---- البداية
  1: {type: journey-owner, title: "هذا الكِتابُ لِـ {child}", instruction: "{ضَعْ كَفَّكَ/ضَعي كَفَّكِ} هُنا", params: {subtitle: "المحطة الأولى: أستعدّ للرحلة", lines: ["عُمْري", "بَدَأْتُ رِحْلَتي في"]}}  # draft: educator review
  2: {title: "خَريطَةُ رِحْلَةِ {child}", instruction: "{ضَعْ مُلْصَقَكَ/ضَعي مُلْصَقَكِ} عِنْدَ البِدايَةِ", params: {stops: [أفكر, ألاحظ, أسمع, "أحرّك يدي", "أمسك القلم", أتتبع, أكتب, أقرأ, "أحل وأبدع"]}}  # draft: educator review

  # ---- 🧠 أدرّب عقلي
  3: {type: journey-opener, title: "أُفَكِّرُ: أُدَرِّبُ عَقْلي", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إلى «أُفَكِّرُ»", params: {stop: أفكر, inside: ["أُلاحِظُ وَأَجِدُ المُخْتَلِفَ", "أَتَذَكَّرُ الصُّوَرَ", "أُرَتِّبُ القِصَّةَ وَأُصَنِّفُ"]}}  # draft: educator review
  4: {title: "مَنِ المُخْتَلِفُ؟", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ المُخْتَلِفِ", params: {seed: 6, rules: [same, same, same], sizes: [4, 4, 4]}}  # draft: educator review
  5: {title: "تَوْأَمانِ!", instruction: "{لَوِّنِ/لَوِّني} الصّورَتَيْنِ المُتَطابِقَتَيْنِ", params: {picture: cat, bows: [red, blue, red, none], bow_at: [50, 86]}}  # draft: educator review
  6: {title: "كَبيرٌ وَصَغيرٌ", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ الكَبيرِ", params: {concept: big-small}}  # draft: educator review
  7: {title: "{انْظُرْ وَتَذَكَّرْ/انْظُري وَتَذَكَّري}", instruction: "{انْظُرْ/انْظُري} جَيِّدًا ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [sun, ball, duck]}}  # draft: educator review
  8: {title: "{ماذا رَأَيْتَ؟/ماذا رَأَيْتِ؟}", instruction: "{لَوِّنِ/لَوِّني} الصُّوَرَ الَّتي {رَأَيْتَها/رَأَيْتِها}", params: {choices: [sun, ball, duck, cat, apple, car], answer: [sun, ball, duck]}}  # draft: educator review
  9: {title: "ماذا يَنْقُصُ؟", instruction: "{صِلْ/صِلي} كُلَّ صورَةٍ بِالجُزْءِ النّاقِصِ", params: {items: ["car:wheel", "rabbit:ear", "house:door"]}}  # draft: educator review
  10: {title: "مِنَ المَجْموعَةِ نَفْسِها", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ ما يُناسِبُ المَجْموعَةَ", params: {group: "فَواكِهُ", shown: [apple, banana, grapes], choices: [orange, shoe, car], answer: orange}}  # draft: educator review
  11: {title: "قِصَّةُ البِذْرَةِ", instruction: "{رَتِّبِ/رَتِّبي} الصُّوَرَ كَما حَدَثَتْ", params: {story: seed}}  # draft: educator review
  12: {title: "طَويلٌ وَقَصيرٌ", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ الأَطْوَلِ", params: {concept: long-short}}  # draft: educator review
  13: {title: "أَرْبَعُ صُوَرٍ", instruction: "{تَذَكَّرِ/تَذَكَّري} الصُّوَرَ ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [cat, tree, ball, car]}}  # draft: educator review
  14: {title: "أَيُّ صورَةٍ اخْتَفَتْ؟", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ الصّورَةِ المُخْتَفِيَةِ", params: {shown: [cat, tree, car], choices: [ball, apple, duck], answer: [ball]}}  # draft: educator review
  15: {title: "ما نَأْكُلُهُ وَما نَلْبَسُهُ", instruction: "{صِلْ/صِلي} كُلَّ صورَةٍ بِالسَّلَّةِ المُناسِبَةِ", params: {groups: [{label: "نَأْكُلُهُ", icon: plate}, {label: "نَلْبَسُهُ", icon: sun-hat}], items: [[apple, 0], [hat, 1], [bread, 0], [shoe, 1], [banana, 0], [sock, 1]]}}  # draft: educator review
  16: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{لَوِّنْ/لَوِّني} نَجْمَةً لِكُلِّ مُهِمَّةٍ {تُتْقِنُها/تُتْقِنينَها}", params: {tasks: [odd-one-out, big-small, gone], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 👀 عيني تقود يدي
  17: {type: journey-opener, title: "أُلاحِظُ: عَيْني تَقودُ يَدي", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إلى «أُلاحِظُ»", params: {stop: ألاحظ, inside: ["أَتْبَعُ الطَّريقَ بِعَيْني ثُمَّ بِقَلَمي", "أَحُلُّ مَتاهَةً", "أَجِدُ الظِّلَّ وَالطَّريقَ الأَقْصَرَ"]}}  # draft: educator review
  18: {title: "الفَراشَةُ وَالزَّهْرَةُ", instruction: "{ارْسُمْ/ارْسُمي} خَطًّا مِنَ الفَراشَةِ إلى الزَّهْرَةِ", params: {path: straight, words: [butterfly, flower]}}  # draft: educator review
  19: {title: "السَّيّارَةُ تَعودُ إلى البَيْتِ", instruction: "{ساعِدِ/ساعِدي} السَّيّارَةَ لِتَصِلَ إلى البَيْتِ", params: {path: curve, words: [car, house]}}  # draft: educator review
  20: {title: "طَعامُ الحَيَواناتِ", instruction: "{صِلْ/صِلي} كُلَّ حَيَوانٍ بِطَعامِهِ", params: {pairs: [[rabbit, carrot], [bee, flower], [cow, grass]]}}  # draft: educator review
  21: {title: "الأَرْنَبُ الجائِعُ", instruction: "{ساعِدِ/ساعِدي} الأَرْنَبَ لِيَصِلَ إلى الجَزَرَةِ", params: {seed: 21, cols: 3, rows: 3, runner: rabbit, goal: carrot}}  # draft: educator review
  22: {title: "{ساعِدْ/ساعِدي} {child} لِلْوُصولِ إلى الحَديقَةِ", instruction: "{ارْسُمِ/ارْسُمي} الطَّريقَ دونَ لَمْسِ الأَشْجارِ", params: {seed: 19, cols: 5, rows: 5, goal: garden}}  # draft: educator review
  23: {title: "أَيْنَ ظِلّي؟", instruction: "{صِلْ/صِلي} كُلَّ طِفْلٍ بِظِلِّهِ", params: {items: [{figure: boy, outfit: "#6E95DB", prop: ball, name: "ولد وكرة"}, {figure: girl, outfit: "#E98AA6", prop: balloon, name: "بنت وبالون"}, {figure: boy, outfit: "#86BF72", prop: kite, name: "ولد وطائرة ورقية"}]}}  # draft: educator review
  24: {title: "الطَّريقُ الأَقْصَرُ", instruction: "{لَوِّنِ/لَوِّني} الطَّريقَ الأَقْصَرَ إلى الرَّوْضَةِ", params: {to: school}}  # draft: educator review
  25: {title: "لِمَنِ البالونُ؟", instruction: "{اتْبَعْ/اتْبَعي} كُلَّ خَيْطٍ إلى صاحِبِهِ", params: {from: [red, blue], to: [boy, girl]}}  # draft: educator review
  26: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{اتْبَعِ/اتْبَعي} الطَّريقَ {وَصِلِ/وَصِلي} الصُّوَرَ", params: {tasks: [trace-path, connect-pairs], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 👂 أسمع وأميّز (every page plays its audio item; the scripts are what staff record, in order)
  27: {type: journey-opener, title: "أَسْمَعُ: أَسْمَعُ وَأُمَيِّزُ", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إلى «أَسْمَعُ»", params: {stop: أسمع, inside: ["أُمَيِّزُ أَصْواتَ الحَيَواناتِ وَالأَشْياءِ", "العالي وَالمُنْخَفِضُ، السَّريعُ وَالبَطيءُ", "أَسْمَعُ الكَلِمَةَ وَأَجِدُ صورَتَها"]}}  # draft: educator review
  28:  # draft: educator review
    type: listen-rows
    title: "مَنْ يُصْدِرُ هذا الصَّوْتَ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} {وَضَعْ/وَضَعي} دائِرَةً حَوْلَ الحَيَوانِ"
    params: {rows: [[cow, cat, rooster], [sheep, cat, duck], [dog, cow, rooster]], answers: [cow, cat, rooster]}
    audio: {say: "الصوت الأول: بقرة تخور. الصوت الثاني: قطة تموء. الصوت الثالث: ديك يصيح.", show: ["بَقَرَة", "قِطَّة", "دِيك"]}
  29:  # draft: educator review
    title: "عالٍ أَمْ مُنْخَفِضٌ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي}: عالٍ أَمْ مُنْخَفِضٌ؟"
    params: {rows: [{sound: drum, loud: true}, {sound: bell, loud: false}, {sound: whistle, loud: true}, {sound: cat, loud: false}]}
    audio: {say: "الأول: طبل عالٍ. الثاني: جرس صغير بهدوء. الثالث: صفّارة عالية. الرابع: قطة تموء بهدوء.", show: ["طَبْل", "جَرَس", "صَفّارَة", "قِطَّة"]}
  30:  # draft: educator review
    type: listen-rows
    title: "أَصْواتُ البَيْتِ"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} {وَضَعْ/وَضَعي} دائِرَةً حَوْلَ المَصْدَرِ"
    params: {rows: [[bell, phone, faucet], [clock, phone, cat], [drum, bell, faucet]], answers: [bell, phone, faucet]}
    audio: {say: "الأول: جرس الباب. الثاني: رنين الهاتف. الثالث: ماء الحنفية.", show: ["جَرَس", "هاتِف", "حَنَفِيَّة"]}
  31:  # draft: educator review
    title: "سَريعٌ أَمْ بَطيءٌ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي}: أَرْنَبٌ أَمْ سُلَحْفاةٌ؟"
    params: {rows: [{sound: drum, fast: true}, {sound: drum, fast: false}, {sound: shoe, fast: true}, {sound: shoe, fast: false}]}
    audio: {say: "الأول: طبل سريع. الثاني: طبل بطيء. الثالث: خطوات سريعة. الرابع: خطوات بطيئة.", show: ["سَريع", "بَطيء", "سَريع", "بَطيء"]}
  32:  # draft: educator review
    type: listen-rows
    title: "{اسْمَعِ/اسْمَعي} الكَلِمَةَ"
    instruction: "{لَوِّنِ/لَوِّني} الصّورَةَ الَّتي {سَمِعْتَها/سَمِعْتِها}"
    params: {rows: [[ball, moon], [cat, duck], [tree, sun]], answers: [ball, cat, sun], style: line}
    audio: {title: "اسْمَعِ الكَلِمَةَ", say: "كُرَة. قِطَّة. شَمْس.", show: ["كُرَة", "قِطَّة", "شَمْس"], tts: true}
  33:  # draft: educator review
    type: same-different
    title: "مُتَشابِهانِ أَمْ مُخْتَلِفانِ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} لِلصَّوْتَيْنِ {وَاخْتَرْ/وَاخْتاري}"
    params: {pairs: [[rooster, rooster], [cat, cow], [bell, bell], [drum, whistle]]}
    audio: {say: "الأول: ديك ثم ديك. الثاني: قطة ثم بقرة. الثالث: جرس ثم جرس. الرابع: طبل ثم صفّارة."}
  34:  # draft: educator review
    title: "ماذا تَعَلَّمْتُ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} {وَأَشِرْ/وَأَشيري} إلى الصّورَةِ الصَّحيحَةِ"
    params: {tasks: [animal-sound, loud-soft, word], cheer: "رائِعٌ يا {child}!"}
    audio: {say: "الأول: بقرة تخور. الثاني: طبل عالٍ. الثالث: كلمة «شَمْس».", show: ["بَقَرَة", "طَبْل", "شَمْس"]}

  # ---- ✋ أدرّب يدي (writing level 1: lines)
  35: {type: journey-opener, title: "أُحَرِّكُ يَدي: أُدَرِّبُ يَدي", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إلى «أُحَرِّكُ يَدي»", params: {stop: "أحرّك يدي", inside: ["لُعْبَةُ الأَصابِعِ قَبْلَ القَلَمِ", "أَتَتَبَّعُ الخُطوطَ مِنَ اليَمينِ", "أَرْسُمُ المَطَرَ وَالعُشْبَ وَالأَمْواجَ"]}}  # draft: educator review
  36: {title: "الطَّريقُ المُسْتَقيمُ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الخَطَّ مِنَ اليَمينِ إلى اليَسارِ", params: {level: 1, target: horizontal, rows: 4, from: car, to: house}}  # draft: educator review
  37: {title: "المَطَرُ يَنْزِلُ", instruction: "{ارْسُمْ/ارْسُمي} قَطَراتِ المَطَرِ مِنَ الغَيْمَةِ", params: {theme: rain, clouds: 3, lines: 3}}  # draft: educator review
  38: {title: "الزُّحْليقَةُ", instruction: "{انْزِلْ/انْزِلي} عَلى الزُّحْليقَةِ مِنَ الأَعْلى", params: {level: 1, target: diagonal, rows: 4}}  # draft: educator review
  39: {title: "العُشْبُ الأَخْضَرُ", instruction: "{ارْسُمْ/ارْسُمي} عُشْبًا قَصيرًا تَحْتَ الأَرْنَبِ", params: {theme: grass, lines: 12}}  # draft: educator review
  40: {title: "قَفَزاتُ الأَرْنَبِ", instruction: "{تَتَبَّعْ/تَتَبَّعي} قَفَزاتِ الأَرْنَبِ", params: {level: 1, target: arcs, rows: 3, from: rabbit}}  # draft: educator review
  41: {title: "أَمْواجُ البَحْرِ", instruction: "{ارْسُمِ/ارْسُمي} الأَمْواجَ تَحْتَ القارِبِ", params: {theme: waves, rows: 3}}  # draft: educator review
  42: {title: "سِياجُ الحَديقَةِ", instruction: "{أَكْمِلِ/أَكْمِلي} السِّياجَ بِخُطوطٍ واقِفَةٍ وَنائِمَةٍ", params: {level: 1, target: fence, rows: 2}}  # draft: educator review
  43: {title: "الجِبالُ العالِيَةُ", instruction: "{ارْسُمْ/ارْسُمي} قِمَمَ الجِبالِ", params: {theme: mountains, rows: 2}}  # draft: educator review
  44: {type: dot-picture, title: "مَنْ يَخْتَبِئُ في النِّقاطِ؟", instruction: "{صِلِ/صِلي} النِّقاطَ لِتَظْهَرَ السَّمَكَةُ", params: {picture: fish, part: 2, dots: 12}}  # draft: educator review
  45: {title: "نِصْفُ الصّورَةِ", instruction: "{أَكْمِلِ/أَكْمِلي} النِّصْفَ المُنَقَّطَ", params: {items: [balloon, apple, sun]}}  # draft: educator review
  46: {title: "ماذا نَسِيَ الرَّسّامُ؟", instruction: "{ارْسُمِ/ارْسُمي} الجُزْءَ النّاقِصَ", params: {items: [{picture: sun, drop: [0], missing: "الأشعّة"}, {picture: cat, drop: [8], missing: "الشوارب"}, {picture: flower, drop: [0, 1], missing: "الساق والأوراق"}]}}  # draft: educator review
  47: {type: spiral-path, title: "بَيْتُ الحَلَزونِ", instruction: "{امْشِ/امْشي} داخِلَ الطَّريقِ دونَ أَنْ {تَخْرُجَ/تَخْرُجي}", params: {from: snail, to: leaf}}  # draft: educator review
  48: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{ارْسُمْ/ارْسُمي} مَطَرًا وَعُشْبًا وَأَمْواجًا", params: {tasks: [beach, pen-lines], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

