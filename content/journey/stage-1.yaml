# «رحلتي الأولى للتعلّم» — the print layer of stage 1 (qamra_workbook.journey_book): how each page of the
# plan (content/journey/plan.yaml) prints. The plan says what a page teaches; this file gives the printed,
# vowelised title and instruction ({masc/fem} variants, {child}; {child:acc} for an object, «{ساعِدْ/ساعِدي}
# {child:acc}» → «أبا بكر», while «يا {child}» needs no mark; {child:gen} after a preposition or owning a
# noun, «رِحْلَةِ {child:gen}» → «أبي بكر»), the engine page type when it differs, the
# render params and the audio item its QR plays.
#
# draft: educator review — every title, instruction, «في هذه المحطة» line, riddle and audio script in this
# file is a draft for the educator. Nothing educational is printed for sale before the educator signs the plan
# and the letter shapes (Tareq's decisions of 2026-09-28). Write numbers as 1, 2, 3: the page prints them in
# its numerals.
#
#   uv run python -m qamra_workbook.journey_book check     # this file against the plan and the engine
#   uv run python -m qamra_workbook.render.journey --stage 1 --book

stage: 1
title_ar: "المحطة الأولى: أستعدّ للرحلة"
cover:
  front: {subtitle: "أستعدّ للرحلة", kicker: "رحلة {child:gen}"}  # draft: educator review
  back:  # draft: educator review
    blurb: "في المحطة الأولى {يستعدّ/تستعدّ} {child} للتعلّم باللعب: التفكير والملاحظة والاستماع، ثم تحريك اليد ومسك القلم، والأشكال والألوان والكميات من 1 إلى 5. لا حروف ولا كتابة أرقام بعدُ؛ الاستعداد أولًا."
    points: ["118 صفحة ملوّنة بالكامل، في كل صفحة مهمّة واحدة", "رموز QR لسماع الأصوات والكلمات", "خريطة رحلة وملصقات وشهادة باسم {child:gen}"]

pages:
  # ---- البداية
  1: {type: journey-owner, title: "هَذا الكِتابُ لِـ {child:gen}", instruction: "{ضَعْ كَفَّكَ/ضَعي كَفَّكِ} هُنا", params: {subtitle: "المَحَطَّةُ الأولى: أَسْتَعِدُّ لِلرِّحْلَةِ", lines: ["عُمْري", "بَدَأْتُ رِحْلَتي في"]}}  # draft: educator review
  2: {title: "خَريطَةُ رِحْلَةِ {child:gen}", instruction: "{أَلْصِقْ مُلْصَقَ بَطَلِكَ/أَلْصِقي مُلْصَقَ بَطَلَتِكِ} عِنْدَ البِدايَةِ", params: {stops: [أفكر, ألاحظ, أسمع, "أحرّك يدي", "أمسك القلم", أتتبع, أكتب, أقرأ, "أحل وأبدع"]}}  # draft: educator review

  # ---- 🧠 أدرّب عقلي
  3: {type: journey-opener, title: "أُفَكِّرُ: أُدَرِّبُ عَقْلي", instruction: "هَيّا نَبْدَأُ! {حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إلى «أُفَكِّرُ»", params: {stop: أفكر, inside: ["أُلاحِظُ وَأَجِدُ المُخْتَلِفَ", "أَتَذَكَّرُ الصُّوَرَ", "أُرَتِّبُ القِصَّةَ وَأُصَنِّفُ"]}}  # draft: educator review
  4: {title: "مَنِ المُخْتَلِفُ؟", instruction: "في كُلِّ صَفٍّ {ضَعْ/ضَعي} دائِرَةً حَوْلَ المُخْتَلِفِ", params: {seed: 6, rules: [same, same, same], sizes: [4, 4, 4]}}  # draft: educator review
  5: {title: "تَوْأَمانِ!", instruction: "{لَوِّنْ/لَوِّني} صورَتَيْنِ مُتَشابِهَتَيْنِ تَمامًا", params: {picture: cat, bows: [red, blue, red, none], bow_at: [50, 86]}}  # draft: educator review
  6: {title: "كَبيرٌ وَصَغيرٌ", instruction: "{أَشِرْ/أَشيري} إلى الكَبيرِ {وَضَعْ/وَضَعي} حَوْلَهُ دائِرَةً", params: {concept: big-small}}  # draft: educator review
  7: {title: "{انْظُرْ وَتَذَكَّرْ/انْظُري وَتَذَكَّري}", instruction: "{احْفَظِ/احْفَظي} الصُّوَرَ الثَّلاثَ، ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [sun, ball, duck]}}  # draft: educator review
  8: {title: "{ماذا رَأَيْتَ؟/ماذا رَأَيْتِ؟}", instruction: "{تَذَكَّرْ/تَذَكَّري} {وَلَوِّنِ/وَلَوِّني} الصُّوَرَ الَّتي {رَأَيْتَها/رَأَيْتِها}", params: {choices: [sun, ball, duck, cat, apple, car], answer: [sun, ball, duck]}}  # draft: educator review
  9: {title: "ماذا يَنْقُصُ؟", instruction: "{ابْحَثْ/ابْحَثي} عَنِ الجُزْءِ النّاقِصِ {وَصِلْهُ/وَصِليهِ} بِصورَتِهِ", params: {items: ["car:wheel", "rabbit:ear", "house:door"]}}  # draft: educator review
  10: {title: "مِنَ المَجْموعَةِ نَفْسِها", instruction: "أَيُّ صورَةٍ تُناسِبُ المَجْموعَةَ؟ {ضَعْ/ضَعي} حَوْلَها دائِرَةً", params: {group: "فَواكِهُ", shown: [apple, banana, grapes], choices: [orange, shoe, car], answer: orange}}  # draft: educator review
  11: {title: "قِصَّةُ البِذْرَةِ", instruction: "{رَتِّبِ/رَتِّبي} الصُّوَرَ بِرَسْمِ النِّقاطِ تَحْتَها", params: {story: seed}}  # draft: educator review
  12: {title: "طَويلٌ وَقَصيرٌ", instruction: "{جِدِ/جِدي} الأَطْوَلَ في كُلِّ صَفٍّ {وَحَوِّطْهُ/وَحَوِّطيهِ}", params: {concept: long-short}}  # draft: educator review
  13: {title: "أَرْبَعُ صُوَرٍ", instruction: "{انْظُرْ/انْظُري} جَيِّدًا {وَتَذَكَّرْ/وَتَذَكَّري}، ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [cat, tree, ball, car]}}  # draft: educator review
  14: {title: "أَيُّ صورَةٍ اخْتَفَتْ؟", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ الصّورَةِ الَّتي اخْتَفَتْ", params: {shown: [cat, tree, car], choices: [ball, apple, duck], answer: [ball]}}  # draft: educator review
  15: {title: "ما نَأْكُلُهُ وَما نَلْبَسُهُ", instruction: "نَأْكُلُهُ أَمْ نَلْبَسُهُ؟ {صِلْ/صِلي} كُلَّ صورَةٍ بِسَلَّتِها", params: {groups: [{label: "نَأْكُلُهُ", icon: plate}, {label: "نَلْبَسُهُ", icon: sun-hat}], items: [[apple, 0], [hat, 1], [bread, 0], [shoe, 1], [banana, 0], [sock, 1]]}}  # draft: educator review
  16: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{حُلَّ/حُلّي} المُهِمّاتِ، ثُمَّ {لَوِّنْ/لَوِّني} نَجْمَةً لِكُلِّ واحِدَةٍ", params: {tasks: [odd-one-out, big-small, gone], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 👀 عيني تقود يدي
  17: {type: journey-opener, title: "أُلاحِظُ: عَيْني تَقودُ يَدي", instruction: "{خُذْ بَطَلَكَ/خُذي بَطَلَتَكِ} إلى «أُلاحِظُ»", params: {stop: ألاحظ, inside: ["أَتْبَعُ الطَّريقَ بِعَيْني ثُمَّ بِقَلَمي", "أَحُلُّ مَتاهَةً", "أَجِدُ الظِّلَّ وَالطَّريقَ الأَقْصَرَ"]}}  # draft: educator review
  18: {title: "الفَراشَةُ وَالزَّهْرَةُ", instruction: "مِنَ الفَراشَةِ إلى الزَّهْرَةِ {ارْسُمْ/ارْسُمي} خَطًّا", params: {path: straight, words: [butterfly, flower]}}  # draft: educator review
  19: {title: "السَّيّارَةُ تَعودُ إلى البَيْتِ", instruction: "{تَتَبَّعْ/تَتَبَّعي} طَريقَ السَّيّارَةِ حَتّى البَيْتِ", params: {path: curve, words: [car, house]}}  # draft: educator review
  20: {title: "طَعامُ الحَيَواناتِ", instruction: "ماذا يَأْكُلُ كُلُّ حَيَوانٍ؟ {صِلْهُ/صِليهِ} بِطَعامِهِ", params: {pairs: [[rabbit, carrot], [bee, flower], [cow, grass]]}}  # draft: educator review
  21: {title: "الأَرْنَبُ الجائِعُ", instruction: "{ارْسُمْ/ارْسُمي} طَريقًا لِلْأَرْنَبِ إلى الجَزَرَةِ", params: {seed: 21, cols: 3, rows: 3, runner: rabbit, goal: carrot}}  # draft: educator review
  22: {title: "{ساعِدْ/ساعِدي} {child:acc} لِلْوُصولِ إلى الحَديقَةِ", instruction: "{مُرَّ/مُرّي} بِالقَلَمِ بَيْنَ الأَشْجارِ وَلا {تَلْمِسْها/تَلْمِسيها}", params: {seed: 19, cols: 5, rows: 5, goal: garden}}  # draft: educator review
  23: {title: "أَيْنَ ظِلّي؟", instruction: "{قارِنِ/قارِني} الأَشْكالَ، ثُمَّ {صِلْ/صِلي} كُلَّ طِفْلٍ بِظِلِّهِ", params: {items: [{figure: boy, outfit: "#6E95DB", prop: ball, name: "ولد وكرة"}, {figure: girl, outfit: "#E98AA6", prop: balloon, name: "بنت وبالون"}, {figure: boy, outfit: "#86BF72", prop: kite, name: "ولد وطائرة ورقية"}]}}  # draft: educator review
  24: {title: "الطَّريقُ الأَقْصَرُ", instruction: "أَيُّ طَريقٍ أَقْصَرُ إلى الرَّوْضَةِ؟ {لَوِّنْهُ/لَوِّنيهِ}", params: {to: school}}  # draft: educator review
  25: {title: "لِمَنِ البالونُ؟", instruction: "{اتْبَعْ/اتْبَعي} كُلَّ خَيْطٍ {بِإِصْبَعِكَ/بِإِصْبَعِكِ} حَتّى صاحِبِهِ", params: {from: [red, blue], to: [boy, girl]}}  # draft: educator review
  26: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{ارْسُمِ/ارْسُمي} الطَّريقَ أَوَّلًا، ثُمَّ {صِلِ/صِلي} الصُّوَرَ", params: {tasks: [trace-path, connect-pairs], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 👂 أسمع وأميّز (every page plays its audio item; the scripts are what staff record, in order)
  27: {type: journey-opener, title: "أَسْمَعُ: أَسْمَعُ وَأُمَيِّزُ", instruction: "{امْشِ بِإِصْبَعِكَ/امْشي بِإِصْبَعِكِ} عَلى الطَّريقِ إلى «أَسْمَعُ»", params: {stop: أسمع, inside: ["أُمَيِّزُ أَصْواتَ الحَيَواناتِ وَالأَشْياءِ", "العالي وَالمُنْخَفِضُ، السَّريعُ وَالبَطيءُ", "أَسْمَعُ الكَلِمَةَ وَأَجِدُ صورَتَها"]}}  # draft: educator review
  28:  # draft: educator review
    type: listen-rows
    title: "مَنْ يُصْدِرُ هَذا الصَّوْتَ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} لِكُلِّ صَوْتٍ {وَضَعْ/وَضَعي} دائِرَةً حَوْلَ صاحِبِهِ"
    params: {rows: [[cow, cat, rooster], [sheep, cat, duck], [dog, cow, rooster]], answers: [cow, cat, rooster]}
    audio: {say: "الصوت الأول: بقرة تخور. الصوت الثاني: قطة تموء. الصوت الثالث: ديك يصيح.", show: ["بَقَرَة", "قِطَّة", "دِيك"]}
  29:  # draft: educator review
    title: "عالٍ أَمْ مُنْخَفِضٌ؟"
    instruction: "{أَنْصِتْ/أَنْصِتي}، ثُمَّ {ضَعْ/ضَعي} دائِرَةً: عالٍ أَمْ مُنْخَفِضٌ؟"
    params: {rows: [{sound: drum, loud: true}, {sound: bell, loud: false}, {sound: whistle, loud: true}, {sound: cat, loud: false}]}
    audio: {say: "الأول: طبل عالٍ. الثاني: جرس صغير بهدوء. الثالث: صفّارة عالية. الرابع: قطة تموء بهدوء.", show: ["طَبْل", "جَرَس", "صَفّارَة", "قِطَّة"]}
  30:  # draft: educator review
    type: listen-rows
    title: "أَصْواتُ البَيْتِ"
    instruction: "ماذا {تَسْمَعُ/تَسْمَعينَ} في البَيْتِ؟ {ضَعْ/ضَعي} دائِرَةً حَوْلَهُ"
    params: {rows: [[bell, phone, faucet], [clock, phone, cat], [drum, bell, faucet]], answers: [bell, phone, faucet]}
    audio: {say: "الأول: جرس الباب. الثاني: رنين الهاتف. الثالث: ماء الحنفية.", show: ["جَرَس", "هاتِف", "حَنَفِيَّة"]}
  31:  # draft: educator review
    title: "سَريعٌ أَمْ بَطيءٌ؟"
    instruction: "سَريعٌ أَمْ بَطيءٌ؟ {حَوِّطِ/حَوِّطي} الأَرْنَبَ أَوِ السُّلَحْفاةَ"
    params: {rows: [{sound: drum, fast: true}, {sound: drum, fast: false}, {sound: shoe, fast: true}, {sound: shoe, fast: false}]}
    audio: {say: "الأول: طبل سريع. الثاني: طبل بطيء. الثالث: خطوات سريعة. الرابع: خطوات بطيئة.", show: ["سَريع", "بَطيء", "سَريع", "بَطيء"]}
  32:  # draft: educator review
    type: listen-rows
    title: "{اسْمَعِ/اسْمَعي} الكَلِمَةَ"
    instruction: "في كُلِّ صَفٍّ {لَوِّنْ/لَوِّني} صورَةَ ما {تَسْمَعُهُ/تَسْمَعينَهُ}"
    params: {rows: [[ball, moon], [cat, duck], [tree, sun]], answers: [ball, cat, sun], style: line}
    audio: {title: "اسْمَعِ الكَلِمَةَ", say: "كُرَة. قِطَّة. شَمْس.", show: ["كُرَة", "قِطَّة", "شَمْس"], tts: true}
  33:  # draft: educator review
    type: same-different
    title: "مُتَشابِهانِ أَمْ مُخْتَلِفانِ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} لِلصَّوْتَيْنِ، ثُمَّ {ضَعْ/ضَعي} دائِرَةً حَوْلَ الجَوابِ"
    params: {pairs: [[rooster, rooster], [cat, cow], [bell, bell], [drum, whistle]]}
    audio: {say: "الأول: ديك ثم ديك. الثاني: قطة ثم بقرة. الثالث: جرس ثم جرس. الرابع: طبل ثم صفّارة."}
  34:  # draft: educator review
    title: "ماذا تَعَلَّمْتُ؟"
    instruction: "ثَلاثَةُ أَصْواتٍ: {أَشِرْ/أَشيري} إلى صورَةِ كُلِّ صَوْتٍ"
    params: {tasks: [animal-sound, loud-soft, word], cheer: "رائِعٌ يا {child}!"}
    audio: {say: "الأول: بقرة تخور. الثاني: طبل عالٍ. الثالث: كلمة «شَمْس».", show: ["بَقَرَة", "طَبْل", "شَمْس"]}

  # ---- ✋ أدرّب يدي (writing level 1: lines)
  35: {type: journey-opener, title: "أُحَرِّكُ يَدي: أُدَرِّبُ يَدي", instruction: "مَحَطَّةٌ جَديدَةٌ! {حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إلى «أُحَرِّكُ يَدي»", params: {stop: "أحرّك يدي", inside: ["لُعْبَةُ الأَصابِعِ قَبْلَ القَلَمِ", "أَتَتَبَّعُ الخُطوطَ مِنَ اليَمينِ", "أَرْسُمُ المَطَرَ وَالعُشْبَ وَالأَمْواجَ"]}}  # draft: educator review
  36: {title: "الطَّريقُ المُسْتَقيمُ", instruction: "{ابْدَأْ/ابْدَئي} مِنَ اليَمينِ {وَتَتَبَّعِ/وَتَتَبَّعي} الخَطَّ إلى البَيْتِ", params: {level: 1, target: horizontal, rows: 4, from: car, to: house}}  # draft: educator review
  37: {title: "المَطَرُ يَنْزِلُ", instruction: "تَحْتَ كُلِّ غَيْمَةٍ {ارْسُمْ/ارْسُمي} قَطَراتِ المَطَرِ", params: {theme: rain, clouds: 3, lines: 3}}  # draft: educator review
  38: {title: "الزُّحْليقَةُ", instruction: "{تَزَحْلَقْ/تَزَحْلَقي} بِالقَلَمِ مِنْ أَعْلى الزُّحْليقَةِ إلى أَسْفَلِها", params: {level: 1, target: diagonal, rows: 4}}  # draft: educator review
  39: {title: "العُشْبُ الأَخْضَرُ", instruction: "الأَرْنَبُ يُحِبُّ العُشْبَ: {ارْسُمْ/ارْسُمي} خُطوطًا قَصيرَةً تَحْتَهُ", params: {theme: grass, lines: 12}}  # draft: educator review
  40: {title: "قَفَزاتُ الأَرْنَبِ", instruction: "{اقْفِزْ/اقْفِزي} مَعَ الأَرْنَبِ: {تَتَبَّعِ/تَتَبَّعي} الأَقْواسَ", params: {level: 1, target: arcs, rows: 3, from: rabbit}}  # draft: educator review
