# «رحلتي الأولى للتعلّم» — the 12 sample pages for approval (Addendum 6 §3.7), updated for Tareq's decisions of
# 2026-09-28 (docs/workbook/decisions-2026-09-28.md) and sent as one PDF.
#
#   uv run python -m qamra_workbook.render.samples        # → out/samples/journey/
#
# `page` uses the journey plan's page schema (qamra_workbook.journey.JourneyPage): a big title, an
# instruction of at most 7 words, the skill for grown-ups, goals and difficulty. Titles and instructions
# take `{child}` (`{child:acc}` / `{child:gen}` for its case, as in the stage files) and `{masc/fem}`
# variants. Engine-only keys live in `params`: `seed` fixes a puzzle (the same seed always gives the same
# page), `lang: en` and `instruction_en` make an English page.
# Page numbers are the pages chosen in content/journey/plan.yaml (`samples:`), in the same order.
#
# `numerals`: hindi (١٢٣, the default) or latin (123, the parent's option) on Arabic and math pages; English
# pages always print 123. Write numbers in texts as 1, 2, 3: the engine prints them in the page's numerals.
# `latin_preview`: these sections are also rendered with latin numerals, into png-latin/.

product: journey
title_ar: رحلتي الأولى للتعلّم
child:
  name: ليان
  gender: f
  character_sheet: content/workbook/samples/sample-character.png  # AI-drawn sample, not a real child
date: 2026-09-28
numerals: hindi
latin_preview: [math]

samples:
  - stage: 1
    page:
      n: 2
      section: intro
      type: journey-map
      title: "خريطة رحلة {child:gen}"
      instruction: "{لوّن/لوّني} نجمة كل محطة {تنهيها/تنهينها}"
      skill: "{يتعرّف/تتعرّف} محطات {رحلته/رحلتها} التسع {ويتابع تقدّمه بنفسه/وتتابع تقدّمها بنفسها}"
      goals: [independence]
      difficulty: 1
      params:
        stops: [أفكر, ألاحظ, أسمع, أحرّك يدي, أمسك القلم, أتتبع, أكتب, أقرأ, أحل وأبدع]

  - stage: 1
    page:
      n: 4
      section: think
      type: odd-one-out
      title: "مَنِ المختلف؟"
      instruction: "{ضع/ضعي} دائرة حول المختلف"
      skill: "التمييز البصري: {يجد/تجد} الصورة المختلفة بين أربع"
      goals: [observation, visual_discrimination]
      difficulty: 1
      example: true
      params: {seed: 6, rules: [same, same, same, category], sizes: [4, 4, 4, 5]}

  - stage: 1
    page:
      n: 22
      section: eye-hand
      type: maze
      title: "{ساعد/ساعدي} {child:acc} للوصول إلى الحديقة"
      instruction: "{ارسم/ارسمي} الطريق بالقلم"
      skill: "التآزر البصري الحركي: {يتبع/تتبع} طريقًا دون لمس الجدران"
      goals: [visual_motor, pen_control, attention]
      difficulty: 2
      params: {seed: 19, cols: 5, rows: 5, goal: garden}

  - stage: 1
    page:
      n: 37
      section: hand
      type: themed-pen-drill
      title: "{ارسم/ارسمي} المطر"
      instruction: "{تتبّع/تتبّعي} خطوط المطر من الغيمة"
      skill: "ما قبل الكتابة: خطوط عمودية من الأعلى إلى الأسفل"
      goals: [pen_control, fine_motor, writing_readiness]
      difficulty: 1
      example: true
      params: {theme: rain, clouds: 3, lines: 3}

  - stage: 1
    page:
      n: 70
      section: patterns
      type: pattern-complete
      title: "{أكمل/أكملي} النمط"
      instruction: "ماذا يأتي بعد ذلك؟ {ارسمه/ارسميه}"
      skill: "الأنماط: {يكمل/تكمل} نمطًا من عنصرين"
      goals: [logic, sequencing]
      difficulty: 1
      example: true
      params: {seed: 43, units: [AB, AB, AB, ABB], shown: [4, 4, 5, 6]}

  - stage: 1
    page:
      n: 77
      section: smart-coloring
      type: smart-coloring
      title: "{لوّن/لوّني} كل الدوائر"
      instruction: "{لوّن/لوّني} الدوائر فقط مثل النموذج"
      skill: "التلوين الذكي: {يلوّن/تلوّن} حسب قاعدة {ويميّز/وتميّز} الدائرة"
      goals: [visual_discrimination, classification, fine_motor]
      difficulty: 1
      example: true
      params: {seed: 52, target: circle, color: "#EE8A6E"}

  - stage: 1
    page:
      n: 104
      section: math
      type: quantity-first
      title: "كم تفاحة؟"
      instruction: "{عُدّ/عُدّي} {وضع/وضعي} دائرة حول الرقم"
      skill: "بعد العدّ: {يتعرّف/تتعرّف} على الأرقام 1–5 بالنظر {ويطابقها/وتطابقها} بالكمية، دون كتابتها"
      goals: [numbers, attention, visual_discrimination]
      difficulty: 2
      example: true
      params: {seed: 71, picture: apple, answer_with: numerals, example: 3, counts: [2, 5, 4], options: [1, 2, 3, 4, 5], cards: 3}

  - stage: 1
    page:
      n: 28
      section: listening
      type: listen-and-choose
      title: "{اسمع/اسمعي} {واختر/واختاري}"
      instruction: "{ضع/ضعي} دائرة حول الحيوان الذي {تسمعه/تسمعينه}"
      skill: "التمييز السمعي: {يعرف/تعرف} الحيوان من صوته"
      goals: [auditory_discrimination, attention]
      difficulty: 1
      audio: true
      params: {choices: [cow, cat, sheep, duck], answer: cat, sound: "مياو"}

  - stage: 2
    page:
      n: 32
      section: arabic
      type: finger-trace
      title: "حرف الباء"
      instruction: "{مرّر/مرّري} إصبعك على الحرف"
      skill: "حرف جديد واحد: {يرى الباء ويسمعها ويتتبعها بإصبعه/ترى الباء وتسمعها وتتتبعها بإصبعها} في اتجاه الكتابة"
      goals: [arabic, writing_readiness, visual_motor]
      difficulty: 2
      audio: true
      params: {letter: ب, form: isolated, word: duck}

  - stage: 2
    page:
      n: 80
      section: english
      type: en-letter
      title: "A a"
      instruction: "{تتبّع/تتبّعي} الحرف بالقلم"
      skill: "Recognises A a, hears it and traces it, capital and small"
      goals: [english, pen_control]
      difficulty: 2
      audio: true
      params: {letter: A, word: apple, lang: en, instruction_en: "Trace the letters."}

  - stage: 3
    page:
      n: 113
      section: games
      type: spot-difference
      title: "{جِد/جِدي} الفروق الخمسة"
      instruction: "{ضع/ضعي} دائرة حول كل فرق"
      skill: "الانتباه والملاحظة: {يقارن/تقارن} صورتين {ويجد/وتجد} 5 فروق"
      goals: [attention, observation, visual_discrimination]
      difficulty: 4
      params: {seed: 97, count: 5}

  - stage: 3
    page:
      n: 120
      section: finale
      type: certificate
      title: "{أحسنتَ يا بطل/أحسنتِ يا بطلة}!"
      instruction: "{لوّن/لوّني} النجوم {واحتفل/واحتفلي}"
      skill: "شهادة إتمام الرحلة"
      goals: [independence]
      difficulty: 1
      params:
        line: "لقد {أنهيتَ/أنهيتِ} «رحلتي الأولى للتعلّم»"
