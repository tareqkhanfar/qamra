# «رحلتي الأولى للتعلّم» — the print layer of stage 2 (qamra_workbook.journey_book): how each page of the
# plan (content/journey/plan.yaml) prints. See stage-1.yaml for the format. Letter pages reuse the دوسية's
# finger-trace, letter-trace, find-letter, en-letter, unit-review and name-trace; audio items with a shared
# key (letter:ar:ب, letter:en:A) keep one code wherever that letter appears.
#
# draft: educator review — every title, instruction, «فِي هذه المحطة» line and audio script is a draft note
# for the educator (Tareq reviewed the pages himself; nothing here gates the site).
#
#   uv run python -m qamra_workbook.journey_book check
#   uv run python -m qamra_workbook.render.journey --stage 2 --book

stage: 2
title_ar: "المحطة الثانية: أتعرّف على الحروف والأعداد"
cover:
  front: {subtitle: "أتعرّف على الحروف والأعداد", kicker: "رحلة {child}"}  # draft: educator review
  back:  # draft: educator review
    blurb: "في المحطة الثانية {يتعرّف/تتعرّف} {child} على أول أربعة عشر حرفًا عربيًّا، {ويسمع صوت كل حرف ويتتبّعه بإصبعه ثم بقلمه، ويكتب/وتسمع صوت كل حرف وتتتبّعه بإصبعها ثم بقلمها، وتكتب} الأعداد من 1 إلى 10، {ويتعلّم/وتتعلّم} الحروف الإنجليزية من A إلى N بكلماتها."
    points: ["120 صفحة ملوّنة بالكامل، حرف جديد واحد في كل صفحة", "رموز QR لسماع كل حرف وكلمة", "اسم {child} للتتبّع بالعربية والإنجليزية، وشهادة"]

pages:
  # ---- البداية
  1: {type: journey-owner, title: "هَذا الكِتابُ لِـ {child}", instruction: "{ضَعْ كَفَّكَ/ضَعي كَفَّكِ} هُنا", params: {subtitle: "المَحَطَّةُ الثّانِيَةُ: أَتَعَرَّفُ عَلى الحُروفِ وَالأَعْدادِ", lines: ["عُمْري", "بَدَأْتُ رِحْلَتي فِي"]}}  # draft: educator review
  2: {title: "خَريطَةُ رِحْلَةِ {child}: المَحَطَّةُ الثّانِيَةُ", instruction: "{ضَعْ مُلْصَقَكَ/ضَعي مُلْصَقَكِ} عِنْدَ «أُفَكِّرُ»", params: {stops: [أفكر, ألاحظ, أسمع, "أحرّك يدي", "أمسك القلم", أتتبع, أكتب, أقرأ, "أحل وأبدع"]}}  # draft: educator review

  # ---- 🧠 أدرّب عقلي + 👀 عيني تقود يدي (shared opener and review)
  3: {type: journey-opener, title: "أُفَكِّرُ وَأُلاحِظُ", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أُفَكِّرُ» ثُمَّ «أُلاحِظُ»", params: {here: [أفكر, ألاحظ], inside: ["أُرَتِّبُ قِصَّةً مِنْ أَرْبَعِ صُوَرٍ", "أَتَذَكَّرُ خَمْسَ صُوَرٍ", "أَحُلُّ مَتاهَةً أَصْعَبَ"]}}  # draft: educator review
  4: {type: journey-story, title: "كَعْكُ العيدِ", instruction: "{رَتِّبِ/رَتِّبي} الصُّوَرَ الأَرْبَعَ كَما حَدَثَتْ", params: {story: eid}}  # draft: educator review
  5: {title: "خَمْسُ صُوَرٍ", instruction: "{تَذَكَّرِ/تَذَكَّري} الصُّوَرَ الخَمْسَ ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [moon, key, apple, cat, ball]}}  # draft: educator review
  6: {title: "ماذا اخْتَفى؟", instruction: "{ضَعْ/ضَعي} دائِرَةً حَوْلَ الصّورَتَيْنِ المُخْتَفِيَتَيْنِ", params: {shown: [moon, apple, ball], choices: [key, cat, fish, sun], answer: [key, cat]}}  # draft: educator review
  7: {type: journey-classify-shapes, title: "أَشْكالٌ وَأَلْوانٌ", instruction: "{صِلْ/صِلي} كُلَّ شَكْلٍ بِصُنْدوقِهِ", params: {shapes: [circle, triangle], colors: {red: "#E5604E", blue: "#5E86D6"}}}  # draft: educator review
  8: {title: "{ساعِدْ/ساعِدي} {child} لِلْوُصولِ إِلى الرَّوْضَةِ", instruction: "{ارْسُمِ/ارْسُمي} الطَّريقَ {وَتَجَنَّبِ/وَتَجَنَّبي} الطُّرُقَ المَسْدودَةَ", params: {seed: 208, cols: 6, rows: 6, goal: school}}  # draft: educator review
  9: {type: journey-tangled, title: "ثَلاثُ طائِراتٍ وَرَقِيَّةٍ", instruction: "{اتْبَعْ/اتْبَعي} كُلَّ خَيْطٍ إِلى صاحِبِهِ", params: {from: [red, blue, yellow], to: [boy, girl, boy]}}  # draft: educator review
  10: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{رَتِّبْ وَتَذَكَّرْ وَاتْبَعِ/رَتِّبي وَتَذَكَّري وَاتْبَعي} الطَّريقَ", params: {tasks: [sequence-4, memory, classify, maze], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 👂 أسمع وأميّز + ✋ أدرّب يدي
  11: {type: journey-opener, title: "أَسْمَعُ وَأُحَرِّكُ يَدي", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أَسْمَعُ» ثُمَّ «أُحَرِّكُ يَدي»", params: {here: [أسمع, "أحرّك يدي"], inside: ["أُمَيِّزُ الكَلِماتِ وَأُصَفِّقُ لِلْمَقاطِعِ", "أَسْمَعُ الصَّوْتَ الأَوَّلَ", "أَرْسُمُ أَمْواجًا صَغيرَةً"]}}  # draft: educator review
  12:  # draft: educator review
    type: same-different
    title: "مُتَشابِهَتانِ أَمْ مُخْتَلِفَتانِ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} لِلْكَلِمَتَيْنِ {وَاخْتَرْ/وَاخْتاري}"
    params: {pairs: [[moon, moon], [duck, cat], [door, door], [fish, sun]]}
    audio: {say: "الأولى: قَمَر، قَمَر. الثانية: بَطَّة، قِطَّة. الثالثة: باب، باب. الرابعة: سَمَكَة، شَمْس.", show: ["قَمَر", "بَطَّة", "باب", "سَمَكَة"], tts: true}
  13:  # draft: educator review
    type: journey-claps
    title: "نُصَفِّقُ لِلْكَلِمَةِ"
    instruction: "{صَفِّقْ/صَفِّقي} لِكُلِّ مَقْطَعٍ {وَلَوِّنْ/وَلَوِّني} دائِرَةً"
    params: {words: [sun, duck, rabbit, butterfly], claps: [1, 2, 2, 3]}
    audio: {say: "شَمْس: شَمْس. بَطَّة: بَطْ، طَة. أَرْنَب: أَرْ، نَب. فَراشَة: فَ، را، شَة.", show: ["شَمْس", "بَطَّة", "أَرْنَب", "فَراشَة"], tts: true}
  14:  # draft: educator review
    type: journey-first-sound
    title: "صَوْتُ الأَلِفِ: أَسَد"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} {وَلَوِّنْ/وَلَوِّني} ما يَبْدَأُ مِثْلَ أَسَد"
    params: {letter: أ, words: [lion, rabbit, ear], distractors: [moon, house, fish]}
    audio: {say: "أَسَد. أَرْنَب. أُذُن. قَمَر. بَيْت. سَمَكَة.", show: ["أَسَد", "أَرْنَب", "أُذُن"], tts: true}
  15:  # draft: educator review
    type: journey-first-sound
    title: "صَوْتُ الباءِ: بَطَّة"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} {وَلَوِّنْ/وَلَوِّني} ما يَبْدَأُ مِثْلَ بَطَّة"
    params: {letter: ب, words: [duck, door, house], distractors: [fish, apple, banana]}
    audio: {say: "بَطَّة. باب. بَيْت. سَمَكَة. تُفّاحَة. مَوْزَة.", show: ["بَطَّة", "باب", "بَيْت"], tts: true}
  16: {title: "أَمْواجٌ صَغيرَةٌ", instruction: "{ارْسُمِ/ارْسُمي} الأَمْواجَ دونَ أَنْ {تَرْفَعَ/تَرْفَعي} القَلَمَ", params: {theme: waves, rows: 4}}  # draft: educator review
  17: {title: "النِّصْفُ الآخَرُ", instruction: "{أَكْمِلِ/أَكْمِلي} النِّصْفَ الآخَرَ مِنَ الصّورَةِ", params: {items: [butterfly, house, face]}}  # draft: educator review
  18:  # draft: educator review
    title: "ماذا تَعَلَّمْتُ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} لِلصَّوْتِ الأَوَّلِ {وَارْسُمِ/وَارْسُمي} الأَمْواجَ"
    params: {tasks: [same-different, syllables, first-sound, small-waves], cheer: "رائِعٌ يا {child}!"}
    audio: {say: "الأولى: كلمة شَمْس. الثانية: فَراشَة. الثالثة: بَطَّة، بَيْت، سَمَكَة.", show: ["شَمْس", "فَراشَة", "بَطَّة"], tts: true}

  # ---- 🔺 الأشكال والألوان + 🔵 الأنماط
  19: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: أَشْكالٌ وَأَلْوانٌ وَأَنْماطٌ", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أُمْسِكُ القَلَمَ»", params: {here: ["أمسك القلم"], inside: ["أَعُدُّ الأَشْكالَ فِي المَدينَةِ", "أُصَنِّفُ الفَواكِهَ بِأَلْوانِها", "أُكْمِلُ نَمَطًا مِنْ ثَلاثَةٍ"]}}  # draft: educator review
  20: {type: journey-shape-city, title: "أَشْكالٌ فِي المَدينَةِ", instruction: "{عُدَّ/عُدّي} الأَشْكالَ {وَلَوِّنْ/وَلَوِّني} كُلَّ شَكْلٍ بِلَوْنِهِ", params: {key: {circle: yellow, square: blue, triangle: red, rectangle: green, star: orange, heart: pink}}}  # draft: educator review
  21: {type: classify-by, title: "سِلالُ الأَلْوانِ", instruction: "{ضَعْ/ضَعي} كُلَّ صورَةٍ فِي سَلَّةِ لَوْنِها", params: {groups: [{label: "أَحْمَرُ", color: red}, {label: "أَصْفَرُ", color: yellow}, {label: "أَخْضَرُ", color: green}, {label: "بَنَفْسَجِيٌّ", color: "#C7B3E6"}], items: [[strawberry, 0], [banana, 1], [cucumber, 2], [grapes, 3], [apple, 0], [lemon, 1]]}}  # draft: educator review
  22: {type: pattern-train, title: "نَجْمَةٌ وَقَمَرانِ", instruction: "{ارْسُمْ/ارْسُمي} ما يَأْتي بَعْدُ فِي النَّمَطِ", params: {sequence: [star, moon, moon, star, moon, "__", "__"]}}  # draft: educator review
  23: {title: "نَمَطي الثُّلاثِيُّ", instruction: "{اصْنَعْ/اصْنَعي} نَمَطًا مِنْ ثَلاثَةِ أَشْكالٍ", params: {slots: 9, stickers: [star, heart, circle]}}  # draft: educator review
  24: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{جِدِ/جِدي} الأَشْكالَ {وَأَكْمِلِ/وَأَكْمِلي} النَّمَطَ", params: {tasks: [find-shapes, sort-colors, pattern-abb], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 🎨 التلوين الذكي
  25: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: التَّلْوينُ الذَّكِيُّ", instruction: "{لَوِّنِ/لَوِّني} النَّجْمَةَ عَلى الخَريطَةِ", params: {here: ["أمسك القلم"], inside: ["أُلَوِّنُ حَسَبَ الصَّوْتِ الأَوَّلِ", "أُلَوِّنُ حَسَبَ المِفْتاحِ"]}}  # draft: educator review
  26: {type: rule-coloring, title: "صَوْتُ الباءِ", instruction: "{لَوِّنْ/لَوِّني} ما يَبْدَأُ بِصَوْتِ الباءِ", params: {rule: category, items: [duck, door, house, fish, banana, cow], take: [duck, door, house, cow]}}  # draft: educator review
  27: {type: rule-coloring, title: "قِطارُ الأَشْكالِ", instruction: "{لَوِّنْ/لَوِّني} كُلَّ شَكْلٍ بِلَوْنِهِ فِي المِفْتاحِ", params: {rule: key, key: {circle: yellow, triangle: red, square: blue}}}  # draft: educator review
  28: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{لَوِّنْ/لَوِّني} حَسَبَ الصَّوْتِ وَحَسَبَ المِفْتاحِ", params: {tasks: [first-sound-coloring, key-coloring], cheer: "رائِعٌ يا {child}!"}}  # draft: educator review

  # ---- 🔤 الحروف العربية: أ–ص, one new letter per page (finger-trace with its sound, then letter-trace)
  29: {type: journey-opener, title: "أَتَتَبَّعُ: الحُروفُ العَرَبِيَّةُ", instruction: "{حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أَتَتَبَّعُ»", params: {here: [أتتبع], inside: ["أَسْمَعُ الحَرْفَ وَأُمَرِّرُ إِصْبَعي عَلَيْهِ", "أَتَتَبَّعُهُ بِالقَلَمِ", "أَجِدُهُ بَيْنَ الحُروفِ"]}}  # draft: educator review
  30: {type: journey-finger-trace, title: "حَرْفُ الأَلِفِ: أَسَد", instruction: "{اسْتَمِعْ وَمَرِّرْ إِصْبَعَكَ/اسْتَمِعي وَمَرِّري إِصْبَعَكِ} عَلى الأَلِفِ", params: {letter: أ, form: isolated, word: lion}, audio: {key: "letter:ar:أ", title: "حَرْفُ الأَلِف", say: "أَلِف. أَسَد. أَرْنَب.", show: ["أ", "أَسَد"], tts: true}}  # draft: educator review
  31: {title: "الأَلِفُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الأَلِفَ ثُمَّ {اكْتُبْها/اكْتُبيها} بِجانِبِ النَّموذَجِ", params: {letter: ا, sizes: [xl, l, m]}}  # draft: educator review
  32: {type: journey-finger-trace, title: "حَرْفُ الباءِ: بَطَّة", instruction: "{مَرِّرْ إِصْبَعَكَ/مَرِّري إِصْبَعَكِ} وَلا {تَنْسَ/تَنْسَي} النُّقْطَةَ", params: {letter: ب, form: isolated, word: duck}, audio: {key: "letter:ar:ب", title: "حَرْفُ الباءِ", say: "باء. بَطَّة. باب.", show: ["ب", "بَطَّة"], tts: true}}  # draft: educator review
  33: {title: "الباءُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الباءَ ثُمَّ {اكْتُبْها/اكْتُبيها} بِجانِبِ النَّموذَجِ", params: {letter: ب, sizes: [xl, l, m]}}  # draft: educator review
  34: {title: "أَيْنَ الأَلِفُ وَالباءُ؟", instruction: "{لَوِّنِ/لَوِّني} الأَلِفَ بِالأَحْمَرِ وَالباءَ بِالأَزْرَقِ", params: {letters: [أ, ب], distractors: [ل, د]}}  # draft: educator review
  35: {type: journey-finger-trace, title: "حَرْفُ التّاءِ: تُفّاحَة", instruction: "{اسْتَمِعْ وَمَرِّرْ إِصْبَعَكَ/اسْتَمِعي وَمَرِّري إِصْبَعَكِ} ثُمَّ {ضَعِ/ضَعي} النُّقْطَتَيْنِ", params: {letter: ت, form: isolated, word: apple}, audio: {key: "letter:ar:ت", title: "حَرْفُ التّاء", say: "تاء. تُفّاحَة. تَمْر.", show: ["ت", "تُفّاحَة"], tts: true}}  # draft: educator review
  36: {title: "التّاءُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} التّاءَ ثُمَّ {ضَعْ/ضَعي} نُقْطَتَيْها", params: {letter: ت, sizes: [xl, l, m]}}  # draft: educator review
  37: {type: journey-finger-trace, title: "حَرْفُ الثّاءِ: ثَعْلَب", instruction: "{اسْتَمِعْ وَعُدَّ/اسْتَمِعي وَعُدّي} نِقاطَ الثّاءِ", params: {letter: ث, form: isolated, word: fox}, audio: {key: "letter:ar:ث", title: "حَرْفُ الثّاء", say: "ثاء. ثَعْلَب. ثَوْم.", show: ["ث", "ثَعْلَب"], tts: true}}  # draft: educator review
  38: {title: "الثّاءُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} الثّاءَ {وَضَعِ/وَضَعي} النِّقاطَ الثَّلاثَ", params: {letter: ث, sizes: [xl, l, m]}}  # draft: educator review
  39: {title: "{عُدَّ/عُدّي} النِّقاطَ!", instruction: "{لَوِّنْ/لَوِّني}: ب أَحْمَرُ، ت أَزْرَقُ، ث أَصْفَرُ", params: {letters: [ب, ت, ث], distractors: [ن, ي]}}  # draft: educator review
