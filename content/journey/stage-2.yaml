# «رحلتي الأولى للتعلّم» — the print layer of stage 2 (qamra_workbook.journey_book): how each page of the
# plan (content/journey/plan.yaml) prints. See stage-1.yaml for the format. Letter pages reuse the دوسية's
# finger-trace, letter-trace, find-letter, en-letter, unit-review and name-trace; audio items with a shared
# key (letter:ar:ب, letter:en:A) keep one code wherever that letter appears.
#
# draft: educator review — every title, instruction, «فِي هذه المحطة» line and audio script is a draft note
# for the educator (Tareq reviewed the pages himself; nothing here gates the site).
#
#   uv run python -m qamra_workbook.journey_book check
#   uv run python -m qamra_workbook.render.journey --stage 2 --book

stage: 2
title_ar: "المحطة الثانية: أتعرّف على الحروف والأعداد"
cover:
  front: {subtitle: "أتعرّف على الحروف والأعداد", kicker: "رحلة {child:gen}"}  # draft: educator review
  back:  # draft: educator review
    blurb: "في المحطة الثانية {يتعرّف/تتعرّف} {child} على أول أربعة عشر حرفًا عربيًّا، {ويسمع صوت كل حرف ويتتبّعه بإصبعه ثم بقلمه، ويكتب/وتسمع صوت كل حرف وتتتبّعه بإصبعها ثم بقلمها، وتكتب} الأعداد من 1 إلى 10، {ويتعلّم/وتتعلّم} الحروف الإنجليزية من A إلى N بكلماتها."
    points: ["120 صفحة ملوّنة بالكامل، حرف جديد واحد في كل صفحة", "رموز QR لسماع كل حرف وكلمة", "اسم {child:gen} للتتبّع بالعربية والإنجليزية، وشهادة"]

pages:
  # ---- البداية
  1: {type: journey-owner, title: "هَذا الكِتابُ لِـ {child:gen}", instruction: "{ضَعْ كَفَّكَ/ضَعي كَفَّكِ} هُنا", params: {subtitle: "المَحَطَّةُ الثّانِيَةُ: أَتَعَرَّفُ عَلى الحُروفِ وَالأَعْدادِ", lines: ["عُمْري", "بَدَأْتُ رِحْلَتي فِي"]}}  # draft: educator review
  2: {title: "خَريطَةُ رِحْلَةِ {child:gen}: المَحَطَّةُ الثّانِيَةُ", instruction: "{أَلْصِقْ مُلْصَقَ بَطَلِكَ/أَلْصِقي مُلْصَقَ بَطَلَتِكِ} عِنْدَ «أُفَكِّرُ»", params: {stops: [أفكر, ألاحظ, أسمع, "أحرّك يدي", "أمسك القلم", أتتبع, أكتب, أقرأ, "أحل وأبدع"]}}  # draft: educator review

  # ---- 🧠 أدرّب عقلي + 👀 عيني تقود يدي (shared opener and review)
  3: {type: journey-opener, title: "أُفَكِّرُ وَأُلاحِظُ", instruction: "هَيّا! {حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أُفَكِّرُ» ثُمَّ «أُلاحِظُ»", params: {here: [أفكر, ألاحظ], inside: ["أُرَتِّبُ قِصَّةً مِنْ أَرْبَعِ صُوَرٍ", "أَتَذَكَّرُ خَمْسَ صُوَرٍ", "أَحُلُّ مَتاهَةً أَصْعَبَ"]}}  # draft: educator review
  4: {type: journey-story, title: "كَعْكُ العيدِ", instruction: "كَيْفَ نَصْنَعُ كَعْكَ العيدِ؟ {رَتِّبِ/رَتِّبي} الصُّوَرَ الأَرْبَعَ", params: {story: eid}}  # draft: educator review
  5: {title: "خَمْسُ صُوَرٍ", instruction: "{احْفَظِ/احْفَظي} الصُّوَرَ الخَمْسَ جَيِّدًا، ثُمَّ {اقْلِبِ/اقْلِبي} الصَّفْحَةَ", params: {items: [moon, key, apple, cat, ball]}}  # draft: educator review
  6: {title: "ماذا اخْتَفى؟", instruction: "صورَتانِ اخْتَفَتا! {ضَعْ/ضَعي} حَوْلَهُما دائِرَتَيْنِ", params: {shown: [moon, apple, ball], choices: [key, cat, fish, sun], answer: [key, cat]}}  # draft: educator review
  7: {type: journey-classify-shapes, title: "أَشْكالٌ وَأَلْوانٌ", instruction: "{صِلْ/صِلي} كُلَّ شَكْلٍ بِصُنْدوقِ شَكْلِهِ وَلَوْنِهِ", params: {shapes: [circle, triangle], colors: {red: "#E5604E", blue: "#5E86D6"}}}  # draft: educator review
  8: {title: "{ساعِدْ/ساعِدي} {child:acc} لِلْوُصولِ إِلى الرَّوْضَةِ", instruction: "{ابْحَثْ/ابْحَثي} عَنِ الطَّريقِ المَفْتوحِ {وَارْسُمْهُ/وَارْسُميهِ} بِالقَلَمِ", params: {seed: 208, cols: 6, rows: 6, goal: school}}  # draft: educator review
  9: {type: journey-tangled, title: "ثَلاثُ طائِراتٍ وَرَقِيَّةٍ", instruction: "لِمَنْ كُلُّ طائِرَةٍ وَرَقِيَّةٍ؟ {اتْبَعْ/اتْبَعي} خَيْطَها {بِإِصْبَعِكَ/بِإِصْبَعِكِ}", params: {from: [red, blue, yellow], to: [boy, girl, boy]}}  # draft: educator review
  10: {title: "ماذا تَعَلَّمْتُ؟", instruction: "{رَتِّبِ/رَتِّبي} الصُّوَرَ، {وَتَذَكَّرْ/وَتَذَكَّري}، ثُمَّ {اتْبَعِ/اتْبَعي} الطَّريقَ", params: {tasks: [sequence-4, memory, classify, maze], cheer: "{رائِعٌ/رائِعَةٌ} يا {child}!"}}  # draft: educator review

  # ---- 👂 أسمع وأميّز + ✋ أدرّب يدي
  11: {type: journey-opener, title: "أَسْمَعُ وَأُحَرِّكُ يَدي", instruction: "{خُذْ بَطَلَكَ/خُذي بَطَلَتَكِ} إِلى «أَسْمَعُ» ثُمَّ «أُحَرِّكُ يَدي»", params: {here: [أسمع, "أحرّك يدي"], inside: ["أُمَيِّزُ الكَلِماتِ وَأُصَفِّقُ لِلْمَقاطِعِ", "أَسْمَعُ الصَّوْتَ الأَوَّلَ", "أَرْسُمُ أَمْواجًا صَغيرَةً"]}}  # draft: educator review
  12:  # draft: educator review
    type: same-different
    title: "مُتَشابِهَتانِ أَمْ مُخْتَلِفَتانِ؟"
    instruction: "{اسْتَمِعْ/اسْتَمِعي} لِلْكَلِمَتَيْنِ، ثُمَّ {حَوِّطِ/حَوِّطي} الجَوابَ"
    params: {pairs: [[moon, moon], [duck, cat], [door, door], [fish, sun]], names: [متشابهتان, مختلفتان]}
    audio: {say: "الأولى: قَمَر، قَمَر. الثانية: بَطَّة، قِطَّة. الثالثة: باب، باب. الرابعة: سَمَكَة، شَمْس.", show: ["قَمَر", "بَطَّة", "باب", "سَمَكَة"], tts: true}
  13:  # draft: educator review
    type: journey-claps
    title: "نُصَفِّقُ لِلْكَلِمَةِ"
    instruction: "{صَفِّقْ/صَفِّقي} لِكُلِّ مَقْطَعٍ، {وَلَوِّنْ/وَلَوِّني} دائِرَةً لِكُلِّ تَصْفيقَةٍ"
    params: {words: [sun, duck, rabbit, butterfly], claps: [1, 2, 2, 3]}
    audio: {say: "شَمْس: شَمْس. بَطَّة: بَطْ، طَة. أَرْنَب: أَرْ، نَب. فَراشَة: فَ، را، شَة.", show: ["شَمْس", "بَطَّة", "أَرْنَب", "فَراشَة"], tts: true}
  14:  # draft: educator review
    type: journey-first-sound
    title: "صَوْتُ الأَلِفِ: أَسَد"
    instruction: "{اسْمَعِ/اسْمَعي} الكَلِماتِ {وَلَوِّنْ/وَلَوِّني} ما يَبْدَأُ مِثْلَ «أَسَد»"
    params: {letter: أ, words: [lion, rabbit, ear], distractors: [moon, house, fish]}
    audio: {say: "أَسَد. أَرْنَب. أُذُن. قَمَر. بَيْت. سَمَكَة.", show: ["أَسَد", "أَرْنَب", "أُذُن"], tts: true}
  15:  # draft: educator review
    type: journey-first-sound
    title: "صَوْتُ الباءِ: بَطَّة"
    instruction: "أَيُّ الصُّوَرِ تَبْدَأُ مِثْلَ «بَطَّة»؟ {لَوِّنْها/لَوِّنيها}"
    params: {letter: ب, words: [duck, door, house], distractors: [fish, apple, banana]}
    audio: {say: "بَطَّة. باب. بَيْت. سَمَكَة. تُفّاحَة. مَوْزَة.", show: ["بَطَّة", "باب", "بَيْت"], tts: true}
  16: {title: "أَمْواجٌ صَغيرَةٌ", instruction: "{حَرِّكِ/حَرِّكي} القَلَمَ كَالمَوْجِ، وَلا {تَرْفَعْهُ/تَرْفَعيهِ} عَنِ الوَرَقَةِ", params: {theme: waves, rows: 4}}  # draft: educator review
  17: {title: "النِّصْفُ الآخَرُ", instruction: "نِصْفُ الصّورَةِ ناقِصٌ: {ارْسُمْهُ/ارْسُميهِ} مِثْلَ النِّصْفِ الأَوَّلِ", params: {items: [butterfly, house, face]}}  # draft: educator review
  18:  # draft: educator review
    title: "ماذا تَعَلَّمْتُ؟"
    instruction: "{اسْمَعِ/اسْمَعي} الصَّوْتَ الأَوَّلَ، ثُمَّ {ارْسُمِ/ارْسُمي} الأَمْواجَ"
    params: {tasks: [word, syllables, first-sound, small-waves], cheer: "{رائِعٌ/رائِعَةٌ} يا {child}!"}
    audio: {say: "الأولى: كلمة شَمْس. الثانية: فَراشَة. الثالثة: بَطَّة، بَيْت، سَمَكَة.", show: ["شَمْس", "فَراشَة", "بَطَّة"], tts: true}

  # ---- 🔺 الأشكال والألوان + 🔵 الأنماط
  19: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: أَشْكالٌ وَأَلْوانٌ وَأَنْماطٌ", instruction: "مَحَطَّةٌ جَديدَةٌ! {حَرِّكْ بَطَلَكَ/حَرِّكي بَطَلَتَكِ} إِلى «أُمْسِكُ القَلَمَ»", params: {here: ["أمسك القلم"], inside: ["أَعُدُّ الأَشْكالَ فِي المَدينَةِ", "أُصَنِّفُ الفَواكِهَ بِأَلْوانِها", "أُكْمِلُ نَمَطًا مِنْ ثَلاثَةٍ"]}}  # draft: educator review
  20: {type: journey-shape-city, title: "أَشْكالٌ فِي المَدينَةِ", instruction: "{عُدَّ/عُدّي} أَشْكالَ المَدينَةِ، ثُمَّ {لَوِّنْ/لَوِّني} كُلًّا بِلَوْنِهِ", params: {key: {circle: yellow, square: blue, triangle: red, rectangle: green, star: orange, heart: pink}}}  # draft: educator review
  21: {type: classify-by, title: "سِلالُ الأَلْوانِ", instruction: "لِكُلِّ لَوْنٍ سَلَّةٌ: {صِلْ/صِلي} كُلَّ فاكِهَةٍ بِسَلَّتِها", params: {groups: [{label: "أَحْمَرُ", color: red}, {label: "أَصْفَرُ", color: yellow}, {label: "أَخْضَرُ", color: green}, {label: "بَنَفْسَجِيٌّ", color: "#C7B3E6"}], items: [[strawberry, 0], [banana, 1], [cucumber, 2], [grapes, 3], [apple, 0], [lemon, 1]]}}  # draft: educator review
  22: {type: pattern-train, title: "نَجْمَةٌ وَقَمَرانِ", instruction: "{قُلِ/قُولي} النَّمَطَ بِصَوْتٍ عالٍ {وَارْسُمْ/وَارْسُمي} ما بَعْدَهُ", params: {sequence: [star, moon, moon, star, moon, "__", "__"]}}  # draft: educator review
  23: {title: "نَمَطي الثُّلاثِيُّ", instruction: "{اخْتَرْ/اخْتاري} ثَلاثَةَ أَشْكالٍ {وَكَرِّرْها/وَكَرِّريها} {لِتَصْنَعَ/لِتَصْنَعي} نَمَطًا", params: {slots: 9, stickers: [star, heart, circle]}}  # draft: educator review
  24: {title: "ماذا تَعَلَّمْتُ؟", instruction: "أَوَّلًا {جِدِ/جِدي} الأَشْكالَ، ثُمَّ {أَكْمِلِ/أَكْمِلي} النَّمَطَ", params: {tasks: [find-shapes, sort-colors, pattern-abb], cheer: "{رائِعٌ/رائِعَةٌ} يا {child}!"}}  # draft: educator review

  # ---- 🎨 التلوين الذكي
  25: {type: journey-opener, title: "أُمْسِكُ القَلَمَ: التَّلْوينُ الذَّكِيُّ", instruction: "نَجْمَةٌ جَديدَةٌ تَنْتَظِرُ! {لَوِّنْها/لَوِّنيها} عَلى الخَريطَةِ", params: {here: ["أمسك القلم"], inside: ["أُلَوِّنُ حَسَبَ الصَّوْتِ الأَوَّلِ", "أُلَوِّنُ حَسَبَ المِفْتاحِ"]}}  # draft: educator review
  26: {type: rule-coloring, title: "صَوْتُ الباءِ", instruction: "{سَمِّ/سَمّي} الصُّوَرَ، {وَلَوِّنْ/وَلَوِّني} ما يَبْدَأُ بِصَوْتِ الباءِ", params: {rule: category, items: [duck, door, house, fish, banana, cow], take: [duck, door, house, cow]}}  # draft: educator review
  27: {type: rule-coloring, title: "قِطارُ الأَشْكالِ", instruction: "{انْظُرْ/انْظُري} إِلى المِفْتاحِ أَوَّلًا، ثُمَّ {لَوِّنِ/لَوِّني} القِطارَ", params: {rule: key, key: {circle: yellow, triangle: red, square: blue}}}  # draft: educator review
  28: {title: "ماذا تَعَلَّمْتُ؟", instruction: "مَرَّةً بِالصَّوْتِ وَمَرَّةً بِالمِفْتاحِ: {لَوِّنْ/لَوِّني} كَما {تَعَلَّمْتَ/تَعَلَّمْتِ}", params: {tasks: [first-sound-coloring, key-coloring], cheer: "{رائِعٌ/رائِعَةٌ} يا {child}!"}}  # draft: educator review

  # ---- 🔤 الحروف العربية: أ–ص, one new letter per page (finger-trace with its sound, then letter-trace)
  29: {type: journey-opener, title: "أَتَتَبَّعُ: الحُروفُ العَرَبِيَّةُ", instruction: "{أَوْصِلْ بَطَلَكَ/أَوْصِلي بَطَلَتَكِ} إِلى «أَتَتَبَّعُ»: هُنا الحُروفُ!", params: {here: [أتتبع], inside: ["أَسْمَعُ الحَرْفَ وَأُمَرِّرُ إِصْبَعي عَلَيْهِ", "أَتَتَبَّعُهُ بِالقَلَمِ", "أَجِدُهُ بَيْنَ الحُروفِ"]}}  # draft: educator review
  30: {type: journey-finger-trace, title: "حَرْفُ الأَلِفِ: أَسَد", instruction: "هَذِهِ الأَلِفُ! {اسْمَعْ صَوْتَها وَمَرِّرْ إِصْبَعَكَ/اسْمَعي صَوْتَها وَمَرِّري إِصْبَعَكِ} عَلَيْها", params: {letter: أ, form: isolated, word: lion}, audio: {key: "letter:ar:أ", title: "حَرْفُ الأَلِف", say: "أَلِف. أَسَد. أَرْنَب.", show: ["أ", "أَسَد"], tts: true}}  # draft: educator review
  31: {title: "الأَلِفُ بِالقَلَمِ", instruction: "مِنْ أَعْلى إِلى أَسْفَلَ: {تَتَبَّعِ/تَتَبَّعي} الأَلِفَ {وَاكْتُبْها/وَاكْتُبيها}", params: {letter: ا, sizes: [xl, l, m]}}  # draft: educator review
  32: {type: journey-finger-trace, title: "حَرْفُ الباءِ: بَطَّة", instruction: "{اسْتَمِعْ/اسْتَمِعي} لِلْباءِ، {وَتَتَبَّعْها/وَتَتَبَّعيها} {بِإِصْبَعِكَ/بِإِصْبَعِكِ} مَعَ نُقْطَتِها", params: {letter: ب, form: isolated, word: duck}, audio: {key: "letter:ar:ب", title: "حَرْفُ الباءِ", say: "باء. بَطَّة. باب.", show: ["ب", "بَطَّة"], tts: true}}  # draft: educator review
  33: {title: "الباءُ بِالقَلَمِ", instruction: "الباءُ قارِبٌ تَحْتَهُ نُقْطَةٌ: {تَتَبَّعْها/تَتَبَّعيها} {وَاكْتُبْها/وَاكْتُبيها}", params: {letter: ب, sizes: [xl, l, m]}}  # draft: educator review
  34: {title: "أَيْنَ الأَلِفُ وَالباءُ؟", instruction: "{لَوِّنْ/لَوِّني} كُلَّ أَلِفٍ بِالأَحْمَرِ وَكُلَّ باءٍ بِالأَزْرَقِ", params: {letters: [أ, ب], distractors: [ل, د]}}  # draft: educator review
  35: {type: journey-finger-trace, title: "حَرْفُ التّاءِ: تُفّاحَة", instruction: "التّاءُ مِثْلُ الباءِ، وَنُقْطَتاها فَوْقَها: {تَتَبَّعْها/تَتَبَّعيها} {بِإِصْبَعِكَ/بِإِصْبَعِكِ}", params: {letter: ت, form: isolated, word: apple}, audio: {key: "letter:ar:ت", title: "حَرْفُ التّاء", say: "تاء. تُفّاحَة. تَمْر.", show: ["ت", "تُفّاحَة"], tts: true}}  # draft: educator review
  36: {title: "التّاءُ بِالقَلَمِ", instruction: "{تَتَبَّعِ/تَتَبَّعي} التّاءَ بِالقَلَمِ، {وَلا تَنْسَ/وَلا تَنْسَيْ} نُقْطَتَيْها", params: {letter: ت, sizes: [xl, l, m]}}  # draft: educator review
