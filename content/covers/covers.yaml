        - {icon: sticker, text: "ورقة ملصقات"}
        - {icon: speaker, text: "رموز QR لسماع كل حرف وكلمة"}
        - {icon: trophy, text: "اسم {child} للتتبّع، وشهادة {باسمه/باسمها}"}
    journey-3:
      blocks: [ض, ن, ي, "3", "+", "4"]
      inside:
        - {icon: letter-ba, text: "آخر 14 حرفًا: من الضاد إلى الياء"}
        - {icon: ear, text: "الحركات والمقاطع"}
        - {icon: book, text: "قراءة الكلمات والجمل القصيرة"}
        - {icon: write, text: "أكتب على السطر ثم وحدي"}
        - {icon: abacus, text: "الجمع والطرح بالصور"}
        - {icon: letter-a, text: "الحروف الإنجليزية O–Z وجمل قصيرة"}
      comes_with:
        - {icon: flag, text: "خريطة الرحلة"}
        - {icon: sticker, text: "ورقة ملصقات"}
        - {icon: speaker, text: "رموز QR لسماع الحروف والكلمات"}
        - {icon: trophy, text: "تقييم ختامي وشهادة إتمام الرحلة"}

family:
  ribbon: "عائِلَةُ {family_name}"
  pill: "كِتابُ أَنْشِطَةٍ عائِلِيٌّ"  # on the front and the back
  age: "3–7"
  badges:
    - {icon: clock, text: "أنشطة من 5 إلى 20 دقيقة"}
    - {icon: book, text: "{pages}"}
    - {icon: heart, text: "باسم {child} {وعائلته/وعائلتها}"}
  comes_with:
    - {icon: sticker, text: "ورقة ملصقات"}
    - {icon: scissors, text: "كرتون للقصّ: نقود وبطاقات ودمى"}
    - {icon: passport, text: "{جواز سفر المغامر/جواز سفر المغامِرة}"}
    - {icon: trophy, text: "{شهادة المغامر/شهادة المغامِرة}"}
  binding: "تجليد حلزوني مزدوج يُفتح مسطّحًا"
  parts:
    family:
      blocks: []

islamic:
  # the volume's title, level, goal and units come from content/islamic (plan.yaml, units.yaml)
  series: "قَلْبِي يَعْرِفُ اللهَ"  # «الله» as units.yaml writes it
  kicker: "{رِحْلَةُ الْمُسْلِمِ الصَّغِيرِ/رِحْلَةُ الْمُسْلِمَةِ الصَّغِيرَةِ}"
  badges:
    - {icon: book, text: "{pages}"}
    - {icon: star, text: "{units}"}
    - {icon: heart, text: "صُنِعَ لِـ{child}"}
  comes_with:
    - {icon: passport, text: "{جواز المسلم الصغير/جواز المسلمة الصغيرة}"}
    - {icon: sticker, text: "ورقة ملصقات للأختام والنجوم"}
    - {icon: heart, text: "صفحة للأهل بعد كل وحدة"}
    - {icon: trophy, text: "شهادة في آخر الكتاب"}
  care: "في الكتاب آيات وأذكار؛ نرجو حفظه في مكان نظيف لائق، وألّا يوضع على الأرض أو يُرمى مع المهملات."
  # the back's blurb for parents (the volume's goal in content/islamic/plan.yaml, worded for the cover)
  parts:
    islamic-v1:
      blurb: "يتعرّف الطفل إلى الله ونعمه ونبيّه ﷺ، ويكتسب عاداته الأولى: الأذكار والأخلاق ويومه مع الله."
    islamic-v2:
      blurb: "يتعلّم الطفل الوضوء والصلاة، ويستمع إلى القرآن ويحفظ سورًا قصيرة، ويتعلّم أذكارًا يومية ويُحسن إلى أهله، ويتدرّب على التصرّف في مواقف يومية."
    islamic-v3:
      blurb: "يفهم الطفل أركان الإسلام والإيمان بأمثلة من عالمه، ويتعلّم الصلاة كاملة، ويتعرّف إلى الصيام والزكاة والحج حبًّا لا خوفًا."
    islamic-v4:
      blurb: "يسمع الطفل قصصًا مختارة من حياة الأنبياء عليهم السلام، ويأخذ من كل قصة قيمة واحدة، ويقترب من نبيّنا ﷺ بمواقف صحيحة من سيرته."
    islamic-v5:
      blurb: "تتحوّل القيم إلى عادات: أخلاق تكبر معه، وآداب يومية، وبرّ بالوالدين، وحلال وحرام بلا تخويف، وسور جديدة، ويوم كامل مع الله."
    islamic-r:
      blurb: "أجواء رمضان والعيد بالقصة واللعب والأنشطة: الصيام بقدر الطاقة، والقرآن والصدقة، وليلة القدر، وآداب العيد وفرحته."
