    - {icon: book, text: "{pages}"}
    - {icon: flag, text: "مهمّة واحدة في كل صفحة"}
    - {icon: heart, text: "باسم {child} {وشخصيته/وشخصيتها}"}
  parts:
    journey-1:
      blocks: [circle, triangle, square, "1", "2", "3"]  # stage 1 writes no letter: shapes and quantities
      inside:
        - {icon: brain, text: "ألعاب التفكير والملاحظة"}
        - {icon: ear, text: "الاستماع وتمييز الأصوات"}
        - {icon: hand, text: "تحريك اليد ومسك القلم"}
        - {icon: shapes, text: "الأشكال والألوان والأنماط"}
        - {icon: abacus, text: "الكميات والأعداد من 1 إلى 5"}
        - {icon: speaker, text: "أول كلمات إنجليزية بالسمع"}
      comes_with:
        - {icon: flag, text: "خريطة الرحلة"}
        - {icon: sticker, text: "ورقة ملصقات"}
        - {icon: speaker, text: "رموز QR لسماع الأصوات والكلمات"}
