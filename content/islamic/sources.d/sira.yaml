# «قلبي يعرف الله»: statements that are not a verse or a hadith text but still need a named source and, for most, the
# scholar's decision: events of the biography (`sira`) and simple rulings (`ruling`, with `basis` ids). These have NO text
# of their own: a page that uses one prints only the drafter's simple explanation (marked AI-drafted), and nothing is
# printed before the scholar names the source and approves the wording. All `proposed`.
sources:
  - {id: s-name-lineage, kind: sira, title_ar: "اسم نبينا ﷺ ونسبه المبسّط (محمد بن عبد الله من قريش)", topic: prophet, scholar_decision: "المرجع ومقدار التبسيط: ندرج الاسم والأب والقبيلة فقط للأطفال؟ يحدّد المشرف المرجع (السيرة أو الصحيحين)"}
  - {id: s-al-amin, kind: sira, title_ar: "لقب «الصادق الأمين» قبل البعثة", topic: prophet-honesty, scholar_decision: "هل نذكر اللقب وقصة إعادة بناء الكعبة؟ تحقّق من ثبوتها والمصدر؛ وإلا فنكتفي بحديث الصفا (البخاري ٤٧٧٠)"}
  - {id: s-prayer-hands, kind: ruling, title_ar: "وضع اليدين في الصلاة", basis: [h-bukhari-631], topic: prayer, scholar_decision: "المذاهب تختلف (على الصدر، تحت السرّة، سدل اليدين). لا نختار مذهبًا بصمت: نرسم اليدين أمام الجسم بوضع محايد أو نعرض ما يقرّره المشرف"}
  - {id: s-prayer-rakaat, kind: ruling, title_ar: "عدد ركعات الصلوات الخمس", basis: [h-bukhari-46], topic: prayer, scholar_decision: "يسمّي المشرف المصدر الذي يُنسب إليه عدد الركعات (٢، ٤، ٣، ٤، ٤)"}
  - {id: s-prayer-age, kind: ruling, title_ar: "الصلاة للطفل: التدرّج والتشجيع بلا إلزام", basis: [h-abudawud-495], topic: prayer-kids, scholar_decision: "صيغة مخاطبة الأهل: نشجّع الطفل ونصلّي معه من سن الرابعة بقدر ما يتحمّل؛ يقرّر المشرف الصياغة"}
  - {id: s-fasting-kids, kind: ruling, title_ar: "صيام الطفل بقدر طاقته وبلا إلزام", basis: [h-bukhari-1960], topic: fasting-kids, scholar_decision: "نعرض صيامًا جزئيًّا لطيفًا (ساعات أو يومًا في الأسبوع) تشجيعًا؛ يقرّر المشرف الصيغة والأعمار"}
  - {id: s-charity-kids, kind: ruling, title_ar: "الطفل يتصدّق من مصروفه: صدقة لا زكاة", basis: [h-bukhari-6021], topic: charity, scholar_decision: "الزكاة على المال البالغ نصابًا؛ للطفل نتحدّث عن الصدقة والعطاء فقط؛ المشرف يؤكّد"}
  - {id: s-found-item, kind: ruling, title_ar: "لو وجدت شيئًا ليس لي: أحمله لأمي وأبي ليعيدوه لصاحبه", basis: [q-4-58], topic: trust, scholar_decision: "أحكام اللقطة للكبار؛ للطفل: لا آخذه لنفسي وأخبر أهلي. المشرف يؤكّد الصياغة"}
  - {id: s-halal-haram-kids, kind: ruling, title_ar: "الحلال والحرام للأطفال بأمثلة من حياتهم", basis: [q-2-168, q-7-157, h-muslim-1015], topic: halal, scholar_decision: "اختيار الأمثلة (الكذب، السرقة، إيذاء الآخرين، ما يؤكل) وصياغتها بلا تخويف؛ المشرف يقرّر ما يُذكر لهذا العمر"}
  - {id: s-eid-takbir, kind: ruling, title_ar: "صيغة تكبير العيد", basis: [q-2-185], topic: eid, scholar_decision: "صيغ التكبير متعدّدة وكلها مقبولة (مرتان أو ثلاث تكبيرات). يختار المشرف صيغة واحدة ويسمّي مصدرها"}
  - {id: s-eid-greeting, kind: ruling, title_ar: "«تقبّل الله منّا ومنكم» تهنئة العيد", topic: eid, scholar_decision: "التهنئة مأثورة عن الصحابة؛ المشرف يسمّي المصدر ويقرّر عرضها"}
  - {id: s-illustrations, kind: ruling, title_ar: "رسم الأشخاص والحيوانات في الكتب التعليمية للأطفال", topic: all, scholar_decision: "سؤال عام للمشرف: نرسم أطفالًا وجدّة وحيوانات بأسلوب مبسّط، ولا نرسم الله ولا الأنبياء ولا الملائكة ولا الصحابة بأي شكل. هل يُقبل هذا؟ وهل من قيود إضافية (مثلًا بلا وجوه للأشخاص)؟"}
  - {id: s-prayer-clothing, kind: ruling, title_ar: "ملابس الشخصيات في مشاهد الصلاة (احتشام وحجاب البنت)", topic: prayer, scholar_decision: "في مشاهد الصلاة ترتدي البنت حجابًا وثيابًا ساترة ويرتدي الولد لباسًا محتشمًا؛ حجاب بطلة الكتاب يتبع اختيار الأهل. المشرف يؤكّد"}
  - {id: s-quran-respect, kind: ruling, title_ar: "توقير المصحف والصفحات التي فيها كلام الله", basis: [q-56-77-79], topic: quran-respect, scholar_decision: "ما نكتبه للأهل عن حفظ الكتاب وعدم رمي صفحاته؛ ومتى نقول للأطفال إنهم يلمسون الصفحات بيد نظيفة؛ المشرف يقرّر"}
