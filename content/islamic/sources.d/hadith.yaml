# «قلبي يعرف الله»: the hadith the series plans to print or cite (collection + number; references only). Every entry is
# `proposed`: the reference and grading are the drafter's belief and `scripts/islamic_sources.py fetch` sanity-checks
# them against an open dataset before the scholar sees them. Bukhari and Muslim entries are preferred; entries from
# other collections are kept to the established adhkar and a few well-known sahih/hasan hadith, flagged for verification.
# Commonly repeated sayings that are weak or invented are NOT used (see the proposal's "excluded" list).
