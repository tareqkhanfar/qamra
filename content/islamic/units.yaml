# «قلبي يعرف الله»: the units and their visual identity (Addendum 10 §4.7): a colour, an icon and a small motif per
# unit, so the child remembers by symbols. `area` is the brief's area number (docs/ADDENDUM-10.md §2, 1–16).
# Icons and motifs are programmatic SVG (qamra_workbook/pictures/islamic.py); none depicts a person of the faith.
# Titles are fully vowelised (ages 4–8). `volume` is the volume the unit belongs to (volumes/*.yaml lists its lessons).

units:
  # ---- المستوى الأول · المجلد ١: أعرف ربّي وأحبّه
  - {id: u-allah,     volume: V1, area: 1,  title_ar: "اللهُ خَلَقَنِي", color: "#5B6FC0", icon: star,          motif: stars}
  - {id: u-blessings, volume: V1, area: 1,  title_ar: "نِعَمُ رَبِّي", color: "#F2B33D", icon: sun,           motif: sun-and-dates}
  - {id: u-prophet,   volume: V1, area: 2,  title_ar: "نَبِيُّنَا مُحَمَّدٌ ﷺ", color: "#3E6B4D", icon: palm,          motif: palm-leaves}
  - {id: u-follow,    volume: V1, area: 2,  title_ar: "أَقْتَدِي بِنَبِيِّي ﷺ", color: "#2FA597", icon: footprints,    motif: footprint-trail}
  - {id: u-house,     volume: V1, area: 3,  title_ar: "بَيْتُ الْإِسْلَامِ", color: "#A7432D", icon: five-columns,  motif: columns}
  - {id: u-myday1,    volume: V1, area: 16, title_ar: "يَوْمِي مَعَ اللهِ", color: "#DB9A1F", icon: sun-moon,      motif: sun-moon-arc}
  - {id: u-adhkar1,   volume: V1, area: 7,  title_ar: "أَقُولُ وَأَذْكُرُ", color: "#C0265B", icon: beads,         motif: bead-string}
  - {id: u-manners1,  volume: V1, area: 8,  title_ar: "أَخْلَاقِي الْجَمِيلَةُ", color: "#F28C28", icon: tulip,         motif: tulips}
