concept:
  paragraphs:
    - "«قلبي يعرف الله» ليس كتاب معلومات للحفظ، بل رحلة إيمانية كاملة لطفل من 4 إلى 8 سنوات: يتعرّف إلى الله فيحبّه، ويعرف نبيّه ﷺ فيقتدي به، ثم يعيش دينه في يومه: صلاة وذكر وخلق وأدب. وكل وحدة تجمع القصة والحوار والتكرار والتلوين والألعاب ومواقف الحياة والتطبيق في البيت والمراجعة."
    - "الأهل شركاء في كل وحدة: صفحة لهم بعد كل وحدة تشرح لهم كيف يشرحون الفكرة، وسؤال يسألونه، ونشاط يفعلونه معًا، وعادة يومية تثبّت ما تعلّمه الطفل."
  differentiators:
    - "**المحبة قبل الخوف:** لا نار ولا عقاب ولا تهديد في هذه الأعمار. الخطأ يقابله اعتذار وتوبة ومحاولة جديدة، ونذكّر الطفل أن الله يحب التوّابين."
    - "**لا نصّ ديني بلا مصدر:** كل آية وحديث وذكر يُنسخ بالبرنامج من مصدر موثّق، ولا تكتبه الأداة الذكية ولا أنا من ذاكرتي. وكل جملة دينية في الكتاب لها رقم في سجلّ المصادر."
    - "**مشرف علمي يراجع كل صفحة قبل الطباعة:** تمرّ كل وحدة بمراحل: مسوّدة، ثم مراجعة علمية، ثم اعتماد. ولا شيء يُطبع ولا يُباع قبل الاعتماد."
    - "**لا تُرسم الذات الإلهية ولا الأنبياء ولا الملائكة ولا الصحابة بأي شكل:** قصص الأنبياء تُحكى بالمشاهد والطبيعة، وتحكيها جدّة الكتاب «سِتِّي هُدَى» لأطفال الكتاب."
    - "**شخصية طفلكم في الكتاب:** على الغلاف وجواز المسلم الصغير وافتتاح الوحدات والشهادة، بصيغة المذكر أو المؤنث الصحيحة في كل جملة."
    - "**يكبر مع الطفل:** مستويان وخمسة مجلدات، كل مجلد يُباع وحده أو ضمن مجموعة، وكتاب موسمي صغير لرمضان والعيد."

split:
  intro: "أقترح خمسة مجلدات في مستويين، وكتابًا موسميًّا. كل مجلد بين 98 و120 صفحة، يصلح للقراءة مع الأهل في دقائق كل يوم، وكل مجلد مكتمل بنفسه ويمكن شراؤه وحده."
  why:
    - "المحتوى المطلوب (16 محورًا) أكبر من أن يصير كتابًا واحدًا مريحًا، وتقسيمه إلى مجلدات يُبقي الصفحات واسعة وبسيطة للصغار."
    - "المستوى الأول (4 إلى 6 سنوات) يبني العلاقة: معرفة الله ونبيّه ﷺ، والأذكار الأولى، والصلاة والوضوء، وأول سور القرآن. المستوى الثاني (6 إلى 8 سنوات) يعمّق: الأركان بأمثلة من عالم الطفل، وقصص الأنبياء، والأخلاق والآداب والأحكام."
    - "كل مجلد يمرّ على المشرف العلمي وحده، فلا ننتظر السلسلة كلها لنبدأ البيع؛ والمجلد الأول يُجرَّب مع عائلات قبل بناء الباقي."
  alternative: "**خيار أقصر:** أربعة مجلدات بدمج الرابع في الثالث والخامس، فيصير كل منها نحو 150 صفحة. لا أنصح به: الصفحات تضيق والكتاب يثقل على الطفل ويطول عمل المراجعة العلمية لكل مجلد."
  seasonal: "**الكتاب الموسمي «رمضان والعيد»** (نحو 70 صفحة، لكل الأعمار بمستويين ⭐ و⭐⭐) يُباع مستقلًا. حسب الملحق يجب أن يكون جاهزًا قبل رمضان بستة أسابيع. رمضان 1448 هـ يبدأ قرابة 8 فبراير 2027 (ويتأكّد برؤية الهلال)، فالموعد قرابة **28 ديسمبر 2026**، أي بعد نحو 12 أسبوعًا من اليوم. وهذا يستدعي أن نقدّمه على باقي السلسلة (انظر القرارات)."

retention:
  intro: "نظام التثبيت هو قلب الكتاب: لا نشرح الفكرة مرة ونمضي. كل مفهوم أساسي يعود بأشكال مختلفة وفي أماكن متباعدة، فيتذكّره الطفل لأنه عاشه لا لأنه حفظه."
  forms:
    - {k: story, ar: قصة, d: "يسمع الفكرة في حكاية أو حوار بين ريم وسالم وسِتِّي هُدَى"}
    - {k: activity, ar: نشاط, d: "يلوّن ويبحث ويرتّب ويصل ويرسم: تعلّم باليد والعين"}
    - {k: question, ar: سؤال, d: "صح أم خطأ، اختر الإجابة: يتأكّد أنه فهم"}
    - {k: situation, ar: موقف, d: "«ماذا كنت ستفعل؟» و«ماذا أفعل لو…؟» وصورة الذكر: يطبّق في موقف من حياته"}
    - {k: review, ar: مراجعة, d: "«ماذا تعلّمت؟» ومراجعات تراكمية: يستعيد ما مضى بعد حين"}
    - {k: home, ar: تطبيق في البيت, d: "صفحة الأهل وتحدٍّ مع أمي وأبي: تتحوّل الفكرة إلى عادة"}
  rules:
    - "كل مفهوم أساسي يصل إلى 5 أشكال على الأقل من الستة، وأغلبها إلى الستة."
    - "يعود المفهوم في أكثر من مكان: درسه، ثم خاتمة وحدته وصفحة أهلها، ثم مراجعة تراكمية بعد وحدات، ثم التقييم الختامي، ومرّات يعود في المجلد التالي."
    - "تُحسب المصفوفة من الخطة نفسها بالبرنامج، فلا يمكن أن يظهر في الجدول ما ليس في الصفحات."
  how_to_read: "في كل مجلد جدول: الصف مفهوم، والأعمدة الأشكال الستة، والخلية أرقام الصفحات التي يظهر فيها."

closing:
  intro: "كل وحدة تنتهي بصفحتين ثابتتين، ويأتي بعدها صفحة للأهل:"
  items:
    - "**«ماذا تعلّمت؟»** و**«ماذا سأطبّق هذا الأسبوع؟»** (الصفحة الأولى)"
    - "**دعاء الوحدة أو ذكرها** بنصّه الموثّق ومصدره، و**«تحدٍّ صغير مع أمي وأبي»** بجدول نجوم (الصفحة الثانية)"
    - "**صفحة الأهل:** ما تعلّمه الطفل، وكيف تشرحون الفكرة، وسؤال تسألونه، ونشاط تفعلونه معًا، وكيف يصير عادة"
  placement: "قبل الوحدات: صفحات البداية (العنوان، التعارف بالشخصيات، «كيف نستعمل الكتاب» مع نصيحة للأهل بحفظ الكتاب، جواز المسلم الصغير، «هذا أنا»). بين الوحدات: مراجعات تراكمية «ماذا تتذكّر؟» و«اختبر نفسك». وفي النهاية: التقييم الختامي الممتع (لعب وأسئلة ومواقف، ونجوم يضعها الأهل لمهارات الطفل)، ثم الجواز وشهادة المسلم الصغير/المسلمة الصغيرة."

samples_note: "الصفحات الاثنتا عشرة التالية مصمّمة بمحرّك الكتب نفسه. ما فيها من آيات وأحاديث وأذكار **منسوخ آليًا من مصادر مرشّحة وغير معتمد بعد** (وآية السورة بدل مؤقت لحين وصول ملف طنزيل الرسمي)، وما فيها من شرح للأطفال والأهل مسوّدة من الأداة الذكية تنتظر المشرف. الغرض هنا التصميم والنبرة والبنية لا النصوص."

characters_note: "ثلاث شخصيات أصلية وقطّتهم، وبطل الكتاب (طفلكم). لا يظهر فيها نبيّ ولا ملَك ولا صحابي، وتُرسم بأسلوب مبسّط. **سؤال للمشرف:** هل يُقبل رسم الأطفال والجدّة والحيوانات بهذا الأسلوب؟ (انظر قرارات المشرف)."

identity_note: "كل وحدة لها لون ورمز وزخرفة صغيرة تتكرّر في افتتاحها وصفحاتها وخاتمتها وختم جواز المسلم الصغير، فيتذكّر الطفل الوحدة بالرمز: الحلقة المضيئة في الجواز تُلوَّن أو يُلصق عليها ملصق الوحدة."

sources:
  intro: "كل ما هو ديني في الكتاب يمرّ عبر سجلّ المصادر (content/islamic/sources.yaml وملفات sources.d). وهو **سجلّ مراجع فقط: لا يحوي نصًّا**."
  how:
    - "**القرآن:** من ملف طنزيل المعتمد (نص عثماني)، يُنسخ حرفيًا بالبرنامج. الموقع لا يفتح من خادمنا، فيلزم أن تنزّل الملف أنت وتضعه في content/islamic/quran/. حتى ذلك الحين تطبع الصفحات بدلًا مؤقتًا مؤطَّرًا. الخط المقترح: «أميري قرآن» (رخصة OFL، تسمح بالتضمين والطباعة) ونرجع إلى خط مجمع الملك فهد إن أرادها المشرف بعد قراءة رخصتها."
    - "**الحديث:** بالمرجع (المجموعة والرقم) والدرجة، وأفضّل ما في الصحيحين. تُجلَب نصوص مرشّحة من مجموعة بيانات مفتوحة للتأكد من سلامة المرجع فقط، ويقرّر المشرف النصّ والطبعة."
    - "**الأذكار والأدعية:** مقطع من نص الحديث الذي رواها، يُقتطع بين علامتي بحث لا تُطبعان أبدًا؛ فلا يمكن أن يظهر على الصفحة غير ما في المصدر."
    - "**حالات المصدر:** مقترَح ← نص مرشّح ← نص مدقَّق (قُورن حرفًا بحرف) ← معتمَد من المشرف. وبناء الطباعة يفشل إن بقي مصدر لم يُعتمد."
  excluded_intro: "أقوال وقصص شائعة بين الناس **لن نستعملها** لأنها لا تثبت أو لا أصل لها (يؤكّد المشرف القائمة):"
  excluded:
    - "«الجنة تحت أقدام الأمهات» (بهذا اللفظ؛ نستعمل بدلها «أمك ثم أمك ثم أمك ثم أبوك» في الصحيحين)"
    - "«الصلاة عماد الدين»"
    - "«النظافة من الإيمان» (بهذا اللفظ؛ نستعمل «الطهور شطر الإيمان» في صحيح مسلم)"
    - "«حب الوطن من الإيمان»"
    - "«اطلبوا العلم ولو في الصين»"
    - "«من عرف نفسه فقد عرف ربه»"
    - "«اختلاف أمتي رحمة»"
    - "قصة المرأة التي كانت ترمي القمامة على النبي ﷺ، وقصة الأعمى اليهودي الذي كان أبو بكر يُطعمه: غير ثابتتين، فنستعمل بدلهما مواقف ثابتة في الصحيحين (عيادته الغلام اليهودي، وصبره على الأعرابي)"

print:
  size: "المقاس 21×28 سم افتراضيًا، ويتبدّل إلى A4 بإعداد واحد إن كانت قوالب المطبعة A4 (كما في كتاب «مغامراتي مع عائلتي»). الصفحات الداخلية ملوّنة بالكامل."
  paper: "ورق 120 غرام أو 140: نطلب عرض سعر بالاثنين ونختار 140 إن كان الفرق أقل من 3 ₪ للنسخة (كما اتفقنا في ملحق 7)."
  binding_intro: "قرار الغلاف مهم هنا لأن في الكتاب صفحات فيها كلام الله تعالى:"
  bindings:
    - {name: "غلاف ورقي مدهون ومخيّط/ملصوق (الأرجح)", pros: "متين، وشكل كتاب يُحفظ على الرفّ، والصفحات لا تُنزع، ويُحترم ما فيه من آيات وأذكار", cons: "لا يفتح مسطّحًا تمامًا: نترك هامش تجليد إضافيًا في الصفحات التي يكتب فيها الطفل"}
    - {name: "سلك حلزوني (wire-o)", pros: "يفتح مسطّحًا ويناسب الكتابة والتلوين", cons: "الصفحات قد تُنزع وتُرمى، وهذا ضدّ قاعدة عدم رمي صفحات فيها آيات وأذكار"}
  recommendation: "**التوصية: غلاف ورقي لاصق (perfect-bound)** للمجلدات الخمسة، مع غلاف مقوّى اختياريًّا للمجموعة الهدية. نسأل المطبعة عن العرضين ونحسم بعد عروض الأسعار. أسعار الطباعة في الجدول **تقديرات ⚠ مؤقتة** حتى يصلنا عرض المطبعة، ولا نبيع 10 نسخ فأكثر قبل أن تُدخل أسعارها الحقيقية."
  product_note: "المنتج في المتجر خطّ «قلبي يعرف الله» بأصناف: مجلد، مجموعة المستوى الأول (٢)، مجموعة المستوى الثاني (٣)، المجموعة الكاملة (٥)، النسخة الرقمية PDF، والكتاب الموسمي. الإضافات: ورقة ملصقات، دليل أهل مطبوع، علبة هدية رمضان/عيد. وللمساجد والمراكز والروضات: شرائح كمية وشعار على الغلاف الخلفي. ويظهر المنتج في «أي كتاب يناسب طفلي؟» عند الهدف «تعليم ديني»."
  prices_note: "الأسعار المقترحة (تأكيد بعد عرض المطبعة): المجلد المطبوع 79 ₪، النسخة الرقمية 35 ₪، المجموعات بخصم يظهر في الجدول."

decisions:
  - {q: "الاسم", a: "اختر من الخمسة أو أبقِ «قلبي يعرف الله». وأي اسم فيه لفظ الجلالة يلزمه رأي المشرف في طباعته على الغلاف وعلى مواد قد تُرمى."}
  - {q: "تقسيم السلسلة", a: "أوصي بخمسة مجلدات (مستويان) + كتاب موسمي. هل توافق؟"}
  - {q: "أسبقية رمضان", a: "للحاق بموعد 28 ديسمبر 2026 أوصي أن يكون كتاب «رمضان والعيد» أول ما يمرّ بكل المراحل (مصادره، صفحاته، مراجعة المشرف، نسخة تجريبية) قبل المجلد الأول. هل توافق؟ وهل المشرف جاهز خلال أسبوعين لمراجعة قائمة مصادره؟"}
  - {q: "المشرف العلمي", a: "من هو وكيف يراجع (على الشاشة في المراجعة الإدارية أم على ورق)؟ وهل يقبل أن يظهر اسمه في الكتاب «راجعه علميًا»؟"}
  - {q: "ملف القرآن", a: "نزّل ملف طنزيل (نص عثماني، txt مع علامات الضبط) من tanzil.net وضعه في content/islamic/quran/quran-uthmani.txt مع ترويسة الرخصة كما هي. إن فضّل المشرف رواية أو مصحفًا آخر فهو القرار."}
  - {q: "الصوت", a: "تلاوة القرآن: مقرئ مؤهّل نسجّل معه أو تسجيلات مرخّصة؛ ولا قراءة آلية للقرآن أبدًا. الأذكار بصوت بشري. من هو القارئ؟"}
  - {q: "الغلاف والمقاس", a: "الغلاف الورقي اللاصق أم الحلزوني؟ والمقاس 21×28 أم A4؟ (حسب عروض المطبعة)."}
  - {q: "الأسعار", a: "79 ₪ للمجلد و35 ₪ للنسخة الرقمية، والمجموعات كما في الجدول. هل توافق كبداية؟"}
  - {q: "الجواز والملصقات", a: "الجواز يعمل بالتلوين بلا ملصقات (نجمة تُلوَّن)، وورقة الملصقات إضافة مدفوعة. هل توافق؟"}

