# «قلبي يعرف الله» (Addendum 10): the register of every religious source the books use.
#
# THE RULE (Addendum 10 §3): no religious text is ever typed or generated by AI. This file holds REFERENCES
# only. The printed wording is copied by code from a verified source, and a page may print a verse, hadith or
# dua only through an id from this file. A build check fails when a religious block on a page has no id, when an
# id does not exist, or when a source is not yet approved and the build is a print build.
#
# status (advances only forward):
#   proposed          reference suggested by the AI drafter; nobody has checked it (everything starts here)
#   text_candidate    the reference was fetched from a named dataset and its sanity keywords matched
#                     (`uv run python scripts/islamic_sources.py fetch`); NOT approved, NOT printable
#   text_verified     the wording was diffed character by character against the licensed source
#   scholar_approved  the scholar signed it off (name and date stored in the review workflow)
#
# Where the wording comes from:
#   quran   the official Tanzil Uthmani file (see `corpus.quran`), copied verbatim, never from memory.
#           The file is in the repo (content/islamic/quran/quran-uthmani.txt, unchanged, its header kept);
#           changing it is not allowed by the Tanzil terms, and every page showing it credits Tanzil + tanzil.net.
#   hadith  the collection's own text by (collection, number). Candidates come from an open dataset only to
#           sanity-check the reference; the final wording and numbering edition are the scholar's decision.
#   dua     a span cut out of a hadith's verified text between two search markers (`start`, `end`, inclusive,
#           matched on the letters only). The markers are search keys and are NEVER printed: what is printed
#           is the span of the verified text, so a typo in a marker can only fail the build, never reach a page.
#
# `scholar_decision`: a point where scholars differ or the age needs care. It goes to the review queue;
# nobody picks a madhab silently. `grading_claimed` is what the drafter believes and must be verified.

version: 1

corpus:
  quran:
    file: content/islamic/quran/quran-uthmani.txt   # Tanzil, lines "surah|ayah|text"
    license_note: >-
      Tanzil text: verbatim copies may be distributed, changing the text is not allowed, and the copyright
      header must be kept. Recorded in docs/licenses.md (CC BY 3.0, credit Tanzil Project + link tanzil.net).
  hadith:
    dataset: fawazahmed0/hadith-api   # Unlicense (code); candidates only. The texts' own status is the scholar's call
    editions: {bukhari: ara-bukhari, muslim: ara-muslim, abudawud: ara-abudawud, tirmidhi: ara-tirmidhi}

