# «قلبي يعرف الله»: المجلد ١ (المستوى الأول). A lesson: t = title (vowelised), c = concepts it teaches, s = source ids,
# p = its pages (page types of plan.yaml). Each unit adds automatically: an opener (1), a closing (2: «ماذا تعلّمت؟»
# + «ماذا سأطبّق؟» + the unit's dhikr + «تحدٍّ مع أمي وأبي») and a parent page (1); the closing and parent pages carry
# the unit's concepts for the retention matrix. `cumulative` pages review earlier units. AI-drafted; nothing here is
# final before the scholar signs it off.
volume: V1
level: 1
title_ar: أَعْرِفُ رَبِّي وَأُحِبُّهُ
title_en: I Know My Lord and Love Him
age: [4, 5]
goal: "يتعرّف الطفل إلى الله ونعمه ونبيّه ﷺ، ويبدأ عاداته الأولى: الأذكار والأخلاق ويومه مع الله"
front: 5   # title, «meet Reem, Salem and Sitti Huda», how to use + a note for parents on caring for the book, the passport, «this is me»
units:
