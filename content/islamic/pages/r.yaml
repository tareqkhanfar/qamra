      - "كَانَ نَبِيُّنَا ﷺ كَرِيمًا، وَفِي رَمَضَانَ كَانَ أَكْثَرَ عَطَاءً."
      - "كُلُّ عَمَلٍ طَيِّبٍ نُقَدِّمُهُ لِغَيْرِنَا صَدَقَةٌ."
    apply: "أَخْتَارُ مَا سَأَفْعَلُهُ هَذَا الْأُسْبُوعَ:"
    apply_choices: ["أَقْرَأُ أَوْ أَسْمَعُ آيَاتٍ مِنَ الْقُرْآنِ كُلَّ يَوْمٍ.", "أَضَعُ شَيْئًا مِنْ مَصْرُوفِي فِي حَصَّالَةِ الْخَيْرِ.", "أُسَاعِدُ أَهْلِي فِي تَحْضِيرِ الْإِفْطَارِ."]

  - key: u-ram3/closing-2
    type: unit-closing
    ai_drafted: true
    dhikr: {source: q-54-17, label: "آيَةٌ أَحْفَظُهَا"}
    dhikr_when: "أَحْفَظُهَا مَعَ أَهْلِي هَذَا الْأُسْبُوعَ."
    challenge: "نَمْلَأُ مَعًا حَصَّالَةَ الْخَيْرِ: نَضَعُ فِيهَا شَيْئًا كُلَّ يَوْمٍ، وَنُعْطِيهَا لِمَنْ يَحْتَاجُ قَبْلَ الْعِيدِ."

  - key: u-ram3/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعلّم طفلكم أن رمضان شهر القرآن وأن الله يسّره لنا، وأن نبينا ﷺ كان كريمًا وأكثر ما يكون عطاءً في رمضان، وأن كل عمل طيب نقدّمه لغيرنا صدقة.", sources: [q-2-185, q-54-17, h-bukhari-6, h-bukhari-6021], ai_drafted: true}
    explain: {text: "لا يُطلب من الطفل ختم القرآن؛ يكفيه أن يسمع ويردّد آيات قصيرة. وفي الصدقة دعوه يعطي بيده، ولو قليلًا، ليشعر بفرحة العطاء.", ai_drafted: true}
    ask: "لمن نعطي صدقتنا هذا العام؟ ولماذا؟"
    together: "ضعوا «حصّالة الخير» في مكان ظاهر، يضع فيها الطفل من مصروفه، ثم اذهبوا معًا ليعطيها بنفسه لمن يحتاج قبل العيد."
    habit: {text: "خصّصوا وقتًا قصيرًا ثابتًا للقرآن كل يوم، بعد الإفطار أو قبل النوم: آية أو آيتان تكفيان للبداية.", sources: [q-54-17], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

