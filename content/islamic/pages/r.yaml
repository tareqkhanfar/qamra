# «قلبي يعرف الله» · الكتاب الموسمي «رَمَضَانُ وَالْعِيدُ» (R, ages 4–8): the content of the volume's pages, one entry
# per place.
#
# AI-DRAFTED, PENDING THE SCHOLAR. Nothing here is final: every page and every line is a draft by the AI drafter and
# waits for the scholar's page-by-page review (Addendum 10 §3). Nothing prints or sells before that approval.
#
# The writers' guide is docs/islamic/content-guide.md (every page type, the rules, the length limits). `key` names
# the page's place (front/<k>, <unit>/opener, <unit>/l<lesson>-<page>, <unit>/closing-<k>, <unit>/parent,
# <unit>/review-<k>, end/<k>); the engine derives id, unit and volume, and the title when there is none.
#
#   uv run python -m qamra_workbook.render.islamic_volume --volume r --keys    # the places (✓ = written here)
#   uv run python -m qamra_workbook.render.islamic_volume --volume r --check   # what is missing or wrong
#
# No verse, hadith, dua or dhikr is typed here: a block names a source id of content/islamic/sources.yaml (+
# sources.d/), and the engine prints the verified wording. The takbir of Eid and the Eid greeting have no wording in
# the register yet (s-eid-takbir, s-eid-greeting are rulings without text), so the pages describe them and never
# type them.

pages:
  # ---- the front pages (R has 4: no passport at the front; the passport is at the end)
  - key: front/1
    type: front-title
    ai_drafted: true
    subtitle: "أُحِبُّ رَمَضَانَ، وَأَفْرَحُ بِالْعِيدِ"

  - key: front/2
    type: front-characters
    ai_drafted: true
    intros:
      - {who: huda, t: "سِتِّي هُدَى تَحْكِي لَنَا حِكَايَاتِ رَمَضَانَ وَالْعِيدِ، وَتُجِيبُ عَنْ أَسْئِلَتِنَا بِحُبٍّ."}
      - {who: reem, t: "رِيمُ أُخْتٌ كَبِيرَةٌ تُحِبُّ أَنْ تَسْأَلَ: لِمَاذَا؟ وَتُحِبُّ فَانُوسَ رَمَضَانَ."}
      - {who: salem, t: "سَالِمٌ أَخُوهَا الصَّغِيرُ، يَلْعَبُ وَيُخْطِئُ وَيَتَعَلَّمُ، وَيَنْتَظِرُ الْعِيدَ بِشَوْقٍ."}
      - {who: naanaa, t: "نَعْنَاعُ قِطَّتُهُمُ الْكَسُولُ، تُحِبُّ النَّوْمَ قُرْبَ الْفَانُوسِ."}
      - {who: reader, t: "وَ{أَنْتَ/أَنْتِ} يَا {child} {بَطَلُ/بَطَلَةُ} هَذَا الْكِتَابِ!"}

  - key: front/3
    type: front-how-to-use
    ai_drafted: true
    steps:
      - {icon: clock, t: "نَبْدَأُ الْكِتَابَ قَبْلَ رَمَضَانَ، وَنَقْرَأُ صَفَحَاتِ الْعِيدِ فِي آخِرِهِ."}
      - {icon: book, t: "أَقْرَأُ صَفْحَةً أَوْ صَفْحَتَيْنِ كُلَّ يَوْمٍ مَعَ أُمِّي أَوْ أَبِي."}
      - {icon: pencil, t: "أُلَوِّنُ وَأَرْسُمُ وَأَصِلُ وَأَخْتَارُ بِنَفْسِي."}
      - {icon: star, t: "أُلَوِّنُ نَجْمَةً كُلَّمَا أَنْهَيْتُ تَحَدِّيًا."}
      - {icon: stamp, t: "أُلْصِقُ خَتْمَ كُلِّ وَحْدَةٍ أُنْهِيهَا فِي جَوَازِي، فِي آخِرِ الْكِتَابِ."}
    care_note: "في هذا الكتاب آيات من القرآن الكريم وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه، وأن يلمس الطفل صفحاته بيدين نظيفتين."

  - key: front/4
    type: front-this-is-me
    ai_drafted: true
    prompts: ["اسْمِي:", "عُمْرِي:", "أُحِبُّ فِي رَمَضَانَ:", "أُحِبُّ فِي الْعِيدِ:"]
    draw_box: "{ارْسُمْ أُسْرَتَكَ/ارْسُمِي أُسْرَتَكِ} عَلَى مَائِدَةِ الْإِفْطَارِ"

