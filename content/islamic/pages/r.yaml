  - key: u-ram2/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعلّم طفلكم أن الصغير يصوم بقدر طاقته ويتدرّج، كما كان الصحابة رضي الله عنهم يعوّدون أطفالهم، وتعلّم ذكر الإفطار، وأن الصائم يحفظ لسانه ويده.", sources: [s-fasting-kids, h-bukhari-1960, h-abudawud-2357, h-bukhari-1894], ai_drafted: true}
    explain: {text: "الصيام للطفل تدريب لا امتحان. ابدؤوا بساعات قليلة، وامدحوا المحاولة لا النتيجة، وإن تعب ففطّروه بلطف وقولوا: «غدًا نحاول من جديد».", ai_drafted: true}
    ask: "ما أصعب شيء في الصيام؟ وما الذي ساعدك؟"
    together: "اصنعوا «جدول صيامي»: يلوّن الطفل نجمة عن كل يوم حاول فيه الصيام، ثم أفطروا معًا وقولوا ذكر الإفطار."
    habit: {text: "عند الإفطار يقول أحدكم ذكر الإفطار بصوت مسموع، ويردّده الطفل بعده، حتى يحفظه دون ضغط.", sources: [h-abudawud-2357], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

