  - key: u-eid2/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعلّم طفلكم آداب الزيارة والتهنئة في العيد، وأن إفشاء السلام ينشر المحبة، وأن زكاة الفطر تُعطى قبل صلاة العيد، وأن يشارك غيره من عيديّته.", sources: [h-muslim-54, s-eid-greeting, h-abudawud-1609, h-bukhari-6021], ai_drafted: true}
    explain: {text: "قبل الزيارة اتفقوا مع الطفل على ثلاث خطوات: يطرق الباب ويسلّم، ويهنّئ بالعيد، ويشكر من يعطيه. وامدحوه أمام الآخرين حين يفعلها.", ai_drafted: true}
    ask: "من الذي فرح بزيارتنا أكثر؟ وكيف عرفت؟"
    together: "اقترحوا على الطفل أن يقسم عيديّته ثلاثة أقسام: قسم يشتري به ما يحب، وقسم يدّخره، وقسم يعطيه بنفسه لمن يحتاج."
    habit: {text: "عوّدوا الطفل أن يبدأ بالسلام كلما دخل بيتًا أو لقي أحدًا، في العيد وبعده.", sources: [h-muslim-54], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

