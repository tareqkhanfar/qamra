  - key: u-ram4/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعرّف طفلكم إلى ليلة القدر: ليلة أنزل الله فيها القرآن، وهي أفضل من ألف شهر، ونلتمسها في العشر الأخيرة من رمضان بالصلاة والدعاء وقراءة القرآن.", sources: [q-97, h-bukhari-2017], ai_drafted: true}
    explain: {text: "لا داعي لتحديد ليلة بعينها للطفل؛ قولوا له: «هي ليلة مخفيّة في العشر الأخيرة، فنجتهد فيها كلها». واجعلوا الاجتهاد فرحًا قصيرًا يناسب عمره، لا سهرًا متعبًا.", ai_drafted: true}
    ask: "لو كانت الليلة ليلة القدر، بماذا تدعو الله؟"
    together: "اختاروا ليلة من العشر الأخيرة: صلّوا ركعتين معًا، واقرؤوا سورة القدر، وليكتب كل فرد دعوة لأحبابه ويقرأها."
    habit: {text: "في كل ليلة من العشر الأخيرة، ادعوا الله مع الطفل دعوة قصيرة قبل النوم، ليتعلّم أن الله قريب يسمع الدعاء.", sources: [h-bukhari-2017, q-2-186], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

