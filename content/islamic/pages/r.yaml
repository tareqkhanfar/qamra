    learned: {text: "تعلّم طفلكم أن العيد يأتي بعد إتمام رمضان، وأننا نكبّر الله ونشكره، وأن الصغار يخرجون إلى صلاة العيد مع أهلهم كما شهدها ابن عباس رضي الله عنهما صغيرًا.", sources: [q-2-185, s-eid-takbir, h-bukhari-977], ai_drafted: true}
