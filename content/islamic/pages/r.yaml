      - {who: huda, t: "لِأَنَّ اللهَ أَنْزَلَ فِيهِ الْقُرْآنَ، وَأَمَرَنَا بِصِيَامِهِ.", sources: [q-2-185, q-2-183], ai_drafted: true}
    quote: {source: q-2-185, span: {start: "شهر رمضان", end: "هدى للناس"}}
    lesson: {text: "رَمَضَانُ شَهْرُ الْقُرْآنِ وَالصِّيَامِ، نَسْتَقْبِلُهُ بِفَرَحٍ.", sources: [q-2-185, q-2-183], ai_drafted: true}

