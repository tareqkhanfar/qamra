    question: "{هَلْ تَعْرِفُ/هَلْ تَعْرِفِينَ} مَتَى نُصَلِّي فِي يَوْمِنَا؟"

  # lesson 1 «أُصَلِّي لِأَنِّي أُحِبُّ اللهَ»: story, choose
  - key: u-why-pray/l1-1
