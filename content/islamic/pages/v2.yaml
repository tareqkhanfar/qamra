      - {skill: "حِفْظُ السُّوَرِ", t: "{يَقْرَأُ/تَقْرَأُ} الْفَاتِحَةَ وَالْإِخْلَاصَ وَالْكَوْثَرَ."}
      - {skill: "الدُّعَاءُ", t: "{يَدْعُو لِوَالِدَيْهِ، وَيَرُدُّ عَلَى الْعَاطِسِ/تَدْعُو لِوَالِدَيْهَا، وَتَرُدُّ عَلَى الْعَاطِسِ}."}
      - {skill: "بِرُّ الْوَالِدَيْنِ", t: "{يُسَاعِدُ فِي الْبَيْتِ، وَيَتَكَلَّمُ بِأَدَبٍ/تُسَاعِدُ فِي الْبَيْتِ، وَتَتَكَلَّمُ بِأَدَبٍ}."}
      - {skill: "إِصْلَاحُ الْخَطَأِ", t: "{يَعْتَذِرُ وَيَقُولُ الصِّدْقَ إِذَا أَخْطَأَ/تَعْتَذِرُ وَتَقُولُ الصِّدْقَ إِذَا أَخْطَأَتْ}."}
    note: "نَجْمَةٌ: بِدَايَةٌ، نَجْمَتَانِ: تَقَدُّمٌ، ثَلَاثُ نَجَمَاتٍ: عَادَةٌ ثَابِتَةٌ."

