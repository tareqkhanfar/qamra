      - {who: huda, t: "شَبَّهَ نَبِيُّنَا ﷺ الصَّلَوَاتِ الْخَمْسَ بِنَهْرٍ عِنْدَ الْبَابِ، نَغْتَسِلُ فِيهِ كُلَّ يَوْمٍ خَمْسَ مَرَّاتٍ.", sources: [h-bukhari-528], ai_drafted: true}
