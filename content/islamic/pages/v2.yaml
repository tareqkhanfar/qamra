      - {a: {t: "الظُّهْرُ"}, b: {pic: sun, t: "وَسَطَ النَّهَارِ"}, sources: [q-4-103]}
      - {a: {t: "الْعَصْرُ"}, b: {pic: shadow, t: "بَعْدَ الظُّهْرِ"}, sources: [q-4-103]}
      - {a: {t: "الْمَغْرِبُ"}, b: {pic: "isl:sun-moon", t: "حِينَ تَغِيبُ الشَّمْسُ"}, sources: [q-4-103]}
      - {a: {t: "الْعِشَاءُ"}, b: {pic: moon, t: "فِي اللَّيْلِ"}, sources: [q-4-103]}

  - key: u-why-pray/l2-3
