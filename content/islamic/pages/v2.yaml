      - {n: 4, t: "الْمَغْرِبُ: حِينَ تَغِيبُ الشَّمْسُ.", sources: [h-bukhari-46, q-4-103]}
      - {n: 5, t: "الْعِشَاءُ: حِينَ يَأْتِي اللَّيْلُ.", sources: [h-bukhari-46, q-4-103]}
    parent_line: "صَلُّوا مَعَ طِفْلِكُمْ فِي أَوْقَاتِ الصَّلَاةِ، وَقُولُوا لَهُ اسْمَ كُلِّ صَلَاةٍ وَوَقْتَهَا."

