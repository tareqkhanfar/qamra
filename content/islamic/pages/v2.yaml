  - key: u-whatif1/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعلّم طفلكم ماذا يفعل إذا كذب أو ظلم صديقه أو غضب: يرجع إلى الصدق، ويعتذر ويُصلح، ويستعيذ بالله ويجلس حتى يهدأ.", sources: [h-bukhari-6094, q-49-10, h-abudawud-4782], ai_drafted: true}
    explain: {text: "الأهم أن يشعر الطفل بالأمان حين يعترف بخطئه: اشكروه على صدقه أولًا، ثم ساعدوه على الإصلاح. إذا عوقب على الصدق تعلّم الإخفاء.", ai_drafted: true}
    ask: "ماذا تفعل لو أخطأت في حقّ أخيك أو صديقك؟"
    together: "مثّلوا المواقف الثلاثة بالدمى أو بتبادل الأدوار، واتركوا الطفل يقترح الحلّ بنفسه."
    habit: {text: "اعتذروا أنتم للطفل حين تخطئون في حقّه، فيتعلّم أنّ الاعتذار قوّة لا ضعف.", sources: [h-tirmidhi-2499, q-41-34], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأذكار ودعوات؛ نرجو حفظ الكتاب في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

