        sources: [q-49-10]
      - text: "كَيْفَ يَكُونُ الْمُسْلِمُونَ بَعْضُهُمْ مَعَ بَعْضٍ؟"
        choices: [{t: "إِخْوَةً يَتَحَابُّونَ", ok: true}, {t: "مُتَخَاصِمِينَ"}]
        sources: [q-49-10, h-bukhari-6064]
      - text: "{اعْتَذَرَ إِلَيْكَ صَدِيقُكَ، فَمَاذَا تَفْعَلُ؟/اعْتَذَرَتْ إِلَيْكِ صَدِيقَتُكِ، فَمَاذَا تَفْعَلِينَ؟}"
        choices: [{t: "أُسَامِحُ وَأَبْتَسِمُ", ok: true}, {t: "{أَبْقَى غَاضِبًا/أَبْقَى غَاضِبَةً} أُسْبُوعًا"}]
