  # lesson 2 «خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ»: order-steps, match, true-false
  - key: u-why-pray/l2-1
    type: prayer-steps
    ai_drafted: true
    title: أُرَتِّبُ صَلَوَاتِ يَوْمِي
    instruction: "{رَتِّبِ/رَتِّبِي} الصَّلَوَاتِ مِنْ ١ إِلَى ٥"
    steps:
      - {n: 1, t: "الْفَجْرُ: قَبْلَ شُرُوقِ الشَّمْسِ.", sources: [h-bukhari-46, q-4-103]}
