    scenario: "{دَفَعْتَ صَدِيقَكَ فِي الطَّابُورِ لِتَسْبِقَهُ، فَوَقَعَ/دَفَعْتِ صَدِيقَتَكِ فِي الطَّابُورِ لِتَسْبِقِيهَا، فَوَقَعَتْ}."
    scene: {backdrop: classroom, props: [backpack, book], figures: [reader, salem]}
