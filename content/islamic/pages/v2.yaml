    lesson: {text: "نُصَلِّي لِأَنَّنَا نُحِبُّ اللهَ، وَبِالصَّلَاةِ يَمْحُو اللهُ أَخْطَاءَنَا كَمَا يُنَظِّفُ الْمَاءُ أَجْسَامَنَا.", sources: [q-20-14, h-bukhari-528], ai_drafted: true}

