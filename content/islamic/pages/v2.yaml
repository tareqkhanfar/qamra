# «قلبي يعرف الله» · المجلد ٢ «أُصَلِّي وَأَتَعَلَّمُ»: the content of the volume's pages, one entry per place.
#
# AI-DRAFTED — PENDING THE SCHOLAR. Nothing in this file is final: every page, line and explanation below was
# drafted by the AI drafter and waits for the scholar's page-by-page review (Addendum 10 §3). Nothing prints or
# sells before that.
#
# The writers' guide is docs/islamic/content-guide.md (every page type, the rules, the length limits). `key` names
# the page's place (front/<k>, <unit>/opener, <unit>/l<lesson>-<page>, <unit>/closing-<k>, <unit>/parent,
# <unit>/review-<k>, end/<k>); the engine derives id, unit and volume, and the title when there is none.
#
#   uv run python -m qamra_workbook.render.islamic_volume --volume v2 --keys    # the places (✓ = written here)
#   uv run python -m qamra_workbook.render.islamic_volume --volume v2 --check   # what is missing or wrong
#
# No verse, hadith or dhikr is typed here: a block names a source id of content/islamic/sources.yaml (and
# sources.d/), and the engine prints the verified wording. The samples placed in V2 (u-wudu/l2-1,
# u-whatif1/l3-1, u-surahs1/l2-1) are copied from the guide with the language review's corrections.
#
# Visual notes: Reem and the reader are kept out of scenes of prayer itself (the engine has no prayer outfit or
# headscarf for them yet; s-prayer-clothing); Sitti Huda and Salem stand in those scenes.

pages:
  # ================================================================== front pages
  - key: front/1
    type: front-title

  - key: front/2
    type: front-characters
    ai_drafted: true
    intros:
      - {who: huda, t: "سِتِّي هُدَى تَحْكِي لَنَا أَجْمَلَ الْحِكَايَاتِ، وَتُجِيبُ عَنْ أَسْئِلَتِنَا بِحُبٍّ."}
      - {who: reem, t: "رِيمُ أُخْتٌ كَبِيرَةٌ تُحِبُّ أَنْ تَسْأَلَ: لِمَاذَا؟"}
      - {who: salem, t: "سَالِمٌ أَخُوهَا الصَّغِيرُ، يَلْعَبُ وَيُخْطِئُ وَيَتَعَلَّمُ."}
      - {who: naanaa, t: "نَعْنَاعُ قِطَّتُهُمُ الْكَسُولُ، تُحِبُّ النَّوْمَ فِي الشَّمْسِ."}
      - {who: reader, t: "وَ{أَنْتَ/أَنْتِ} يَا {child} {بَطَلُ/بَطَلَةُ} هَذَا الْكِتَابِ!"}

  - key: front/3
    type: front-how-to-use
    ai_drafted: true
    steps:
      - {icon: book, t: "أَقْرَأُ صَفْحَةً أَوْ صَفْحَتَيْنِ كُلَّ يَوْمٍ مَعَ أُمِّي أَوْ أَبِي."}
      - {icon: pencil, t: "أُلَوِّنُ وَأَرْسُمُ وَأَصِلُ وَأَخْتَارُ بِنَفْسِي."}
      - {icon: star, t: "أُلَوِّنُ نَجْمَةً كُلَّمَا أَنْهَيْتُ تَحَدِّيًا."}
      - {icon: stamp, t: "أُلْصِقُ خَتْمَ الْوَحْدَةِ فِي جَوَازِي حِينَ أُنْهِيهَا."}
    care_note: "في هذا الكتاب آيات من القرآن الكريم وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه، وأن يلمس الطفل صفحاته بيدين نظيفتين."

  - key: front/4
    type: passport
    ai_drafted: true
    gendered_title: "{جَوَازُ الْمُسْلِمِ الصَّغِيرِ/جَوَازُ الْمُسْلِمَةِ الصَّغِيرَةِ}"
    photo_slot: reader
    stamps_from: units.yaml
    challenge_stars: 8

  - key: front/5
    type: front-this-is-me
    ai_drafted: true
    prompts: ["اسْمِي:", "عُمْرِي:", "أُحِبُّ:", "مَسْجِدُ حَيِّنَا:"]
    draw_box: "{ارْسُمْ أُسْرَتَكَ/ارْسُمِي أُسْرَتَكِ} هُنَا"

  # ================================================================== لِمَاذَا نُصَلِّي؟
