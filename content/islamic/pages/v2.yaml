      - {t: "أَضْحَكُ وَأَبْقَى فِي مَكَانِي", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
      - {t: "{أَقُولُ: هُوَ الَّذِي وَقَعَ وَحْدَهُ/أَقُولُ: هِيَ الَّتِي وَقَعَتْ وَحْدَهَا}", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
    quote: {source: h-bukhari-10, span: {start: "المسلم من سلم", end: "ويده"}}
    sources: [q-49-10, h-bukhari-10]
    role_play: "{مَثِّلِ الْمَوْقِفَ مَعَ أَهْلِكَ/مَثِّلِي الْمَوْقِفَ مَعَ أَهْلِكِ}"

  - key: u-whatif1/l2-4
    type: choose
