  # lesson 2 «لَوْ ظَلَمْتُ صَدِيقِي»: wdif, story, wwyd, choose
  - key: u-whatif1/l2-1
    type: wdif
    ai_drafted: true
    title: مَاذَا أَفْعَلُ لَوْ ظَلَمْتُ صَدِيقِي؟
    intro: {text: "أَحْيَانًا نَأْخُذُ شَيْئًا مِنْ صَدِيقِنَا، أَوْ نُحْزِنُهُ دُونَ أَنْ نَنْتَبِهَ. هَكَذَا نُصْلِحُ مَا حَدَثَ:", ai_drafted: true}
    steps:
      - {n: 1, t: "أَتَوَقَّفُ، وَأَعْتَرِفُ بِخَطَئِي، وَلَا أَلُومُ غَيْرِي."}
      - {n: 2, t: "أَعْتَذِرُ لِصَدِيقِي بِكَلِمَةٍ طَيِّبَةٍ.", sources: [q-49-10]}
      - {n: 3, t: "أُعِيدُ إِلَيْهِ مَا أَخَذْتُهُ، أَوْ أُصْلِحُ مَا أَفْسَدْتُهُ.", sources: [q-49-10]}
      - {n: 4, t: "نَتَصَافَحُ، وَنَعُودُ أَصْدِقَاءَ كَمَا كُنَّا.", sources: [h-bukhari-6064]}
    quote: {source: q-49-10, span: {start: "إنما المؤمنون", end: "أخويكم"}}
    meaning: {text: "الْمُسْلِمُونَ إِخْوَةٌ، وَإِذَا أَخْطَأْنَا فِي حَقِّ أَخِينَا أَصْلَحْنَا مَا بَيْنَنَا.", sources: [q-49-10, h-bukhari-6064], ai_drafted: true}
    tracker: "هَلْ {أَصْلَحْتَ/أَصْلَحْتِ} خَطَأً هَذَا الْأُسْبُوعَ؟ {لَوِّنْ/لَوِّنِي} نَجْمَةً"

  - key: u-whatif1/l2-2
    type: story
    ai_drafted: true
    scene: {backdrop: garden, props: [ball, tree], figures: [salem, reem]}
    lines:
      - {who: narrator, t: "خَطِفَ سَالِمٌ الْكُرَةَ مِنْ صَدِيقِهِ زَيْدٍ، فَحَزِنَ زَيْدٌ وَذَهَبَ."}
      - {who: reem, t: "سَالِمُ، لَقَدْ أَحْزَنْتَ صَدِيقَكَ!"}
      - {who: salem, t: "صَحِيحٌ… أَخْطَأْتُ. سَأَذْهَبُ إِلَيْهِ وَأَعْتَذِرُ، وَأُعِيدُ إِلَيْهِ الْكُرَةَ."}
      - {who: narrator, t: "اعْتَذَرَ سَالِمٌ، فَابْتَسَمَ زَيْدٌ، وَلَعِبَا مَعًا مِنْ جَدِيدٍ."}
    quote: {source: h-bukhari-6064, span: {start: "وكونوا", end: "إخوانا"}}
    lesson: {text: "إِذَا ظَلَمْتُ صَدِيقِي، أَعْتَذِرُ إِلَيْهِ وَأُصْلِحُ خَطَئِي، فَنَحْنُ إِخْوَةٌ.", sources: [q-49-10, h-bukhari-6064], ai_drafted: true}

