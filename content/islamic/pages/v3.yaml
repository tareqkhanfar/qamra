    ask: "ما الكتاب الذي أنزله الله على نبينا محمد ﷺ؟"
    together: "اقرؤوا معًا الآية ٢٨٥ من سورة البقرة، وعدّوا فيها ما نؤمن به، ثم أكملوا الأركان الستة على الأصابع."
    habit: {text: "كلما رأيتم منظرًا جميلًا قولوا معه: هذا من خلق الله، ليربط الطفل بين ما يراه والإيمان بالخالق.", sources: [q-39-62], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأذكار ودعوات؛ نرجو حفظ الكتاب في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

