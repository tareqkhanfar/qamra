  - key: u-iman2/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "أكمل طفلكم أركان الإيمان: الإيمان بالرسل وخاتمهم محمد ﷺ، وباليوم الآخر يومَ يُجزى المؤمنون على أعمالهم الطيبة، وبالقدر: أن يحرص ويستعين بالله ثم يرضى بما قدّره.", sources: [q-4-136, q-10-9, h-muslim-2664, h-muslim-8], ai_drafted: true}
    explain: {text: "قدّموا اليوم الآخر بشارةً وفرحًا للمحسنين، بلا تخويف ولا تفاصيل مرعبة. واشرحوا القدر بمثال من حياته: نحاول ونأخذ بالأسباب، ثم نرضى بما يختاره الله لنا.", ai_drafted: true}
    ask: "ما الشيء الذي حاولت فيه كثيرًا ولم تستسلم؟"
    together: "اصنعوا معًا «جرّة الأعمال الطيبة»: يرسم الطفل كل عمل طيب على ورقة صغيرة ويضعه فيها، ثم تفتحونها آخر الأسبوع وتفرحون معًا."
    habit: {text: "إذا لم يتحقّق ما يريده الطفل، علّموه أن يرضى ويحاول من جديد، وألّا يكثر من «لو» التي تحزنه، كما أرشدنا النبي ﷺ.", sources: [h-muslim-2664], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأذكار ودعوات؛ نرجو حفظ الكتاب في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

