    idea: {text: "نَشْهَدُ أَنَّهُ لَا أَحَدَ يَسْتَحِقُّ الْعِبَادَةَ إِلَّا اللهُ، فَهُوَ وَحْدَهُ رَبُّنَا وَخَالِقُنَا.", sources: [q-47-19, q-112], ai_drafted: true}
    question:
      text: "مَنْ نَعْبُدُ؟"
      choices: [{t: "اللهَ وَحْدَهُ", ok: true}, {t: "الشَّمْسَ وَالْقَمَرَ"}]
      sources: [q-47-19, q-112]

