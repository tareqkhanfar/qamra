    explain: {text: "الصيام للأطفال تدريب بالحبّ لا امتحان: ساعات قليلة ثم تزيد. احتفلوا بكل محاولة، وقدّموا له لعبة أو نشاطًا يسلّيه، كما كان الصحابة يفعلون مع أطفالهم.", ai_drafted: true}
    ask: "ما أصعب شيء في الصيام؟ وما أجمل شيء فيه؟"
    together: "حضّروا معًا مائدة إفطار صغيرة في يوم عطلة، ويقول الطفل ذكر الإفطار، ثم يحكي كيف قضى ساعات صيامه."
    habit: {text: "ذكّروه بلطف أن الصائم يحفظ لسانه: إذا غضب يهدأ ويتذكّر أنه صائم، كما علّمنا النبي ﷺ.", sources: [h-bukhari-1894], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأذكار ودعوات؛ نرجو حفظ الكتاب في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

