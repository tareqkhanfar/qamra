    learned: {text: "تعرّف طفلكم إلى الحج: رحلة إلى بيت الله الحرام في مكة يؤدّيها المستطيع، ويجتمع فيها المسلمون من كل البلاد لعبادة الله وحده، وعرف أن الطفل يصحّ حجّه ولأهله أجر.", sources: [q-3-97, q-22-27, h-muslim-1336], ai_drafted: true}
    explain: {text: "اعرضوا عليه صورًا للكعبة وللحجاج بلباسهم البسيط، وقولوا: هنا يقف الناس من كل البلاد يدعون الله معًا. اربطوا الحجّ بالشوق والحبّ لا بالتعب والزحام.", ai_drafted: true}
    ask: "لو ذهبنا إلى مكة، ماذا تحبّ أن تفعل أولًا؟"
    together: "اصنعوا حصّالة «رحلة الحج» يضع فيها الطفل قطعة نقدية كل أسبوع، وحدّثوه عن الشوق إلى بيت الله."
    habit: {text: "علّموه أن الحاجّ يبتعد عن الكلام السيّئ والخصام، وأن هذا خُلق نتدرّب عليه كل يوم.", sources: [h-bukhari-1521], ai_drafted: true}
    care_note: "في الكتاب صفحات فيها كلام الله تعالى وأذكار ودعوات؛ نرجو حفظ الكتاب في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

