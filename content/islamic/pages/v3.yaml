      - {who: huda, t: "مَعْنَاهَا: لَا نَعْبُدُ إِلَّا اللهَ، فَهُوَ الْوَاحِدُ الَّذِي خَلَقَ كُلَّ شَيْءٍ.", sources: [q-47-19, q-112], ai_drafted: true}
      - {who: reem, t: "وَلِذَلِكَ نَعْبُدُهُ وَحْدَهُ، وَنُحِبُّهُ وَنَشْكُرُهُ!"}
    quote: {source: q-47-19, span: {start: "فاعلم", end: "إلا الله"}}
    lesson: {text: "نَعْبُدُ اللهَ وَحْدَهُ، لِأَنَّهُ رَبُّنَا الَّذِي خَلَقَنَا.", sources: [q-47-19, q-112], ai_drafted: true}

