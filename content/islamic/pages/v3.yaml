# «قلبي يعرف الله» · المجلد ٣ «أَرْكَانُ الْإِسْلَامِ وَأَرْكَانُ الْإِيمَانِ»: the content of the volume's pages, one entry
# per place.
#
# AI-DRAFTED, PENDING THE SCHOLAR: every page and every explanation below was drafted by the AI drafter and is NOT
# final. Nothing here prints or sells before the scholar reviews each unit page by page (Addendum 10 §3).
#
# The writers' guide is docs/islamic/content-guide.md (every page type, the rules, the length limits). `key` names
# the page's place (front/<k>, <unit>/opener, <unit>/l<lesson>-<page>, <unit>/closing-<k>, <unit>/parent,
# <unit>/review-<k>, end/<k>); the engine derives id, unit and volume, and the title when there is none.
#
#   uv run python -m qamra_workbook.render.islamic_volume --volume v3 --keys    # the places (✓ = written here)
#   uv run python -m qamra_workbook.render.islamic_volume --volume v3 --check   # what is missing or wrong
#
# No verse, hadith or dhikr is typed here: a block names a source id of content/islamic/sources.yaml (+ sources.d/),
# and a stretch of a hadith is cut by `span` markers (search keys, never printed). The pages of the lesson on the
# angels carry the tag `angels`: their scenes show no person, figure or symbol (Addendum 10 §3.5).

