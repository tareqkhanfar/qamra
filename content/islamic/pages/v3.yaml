    instruction: "{رَتِّبِ/رَتِّبِي} الْخُطُوَاتِ مِنْ ١ إِلَى ٧"
    steps:
      - {n: 1, t: "أَقِفُ {مُتَّجِهًا/مُتَّجِهَةً} إِلَى الْقِبْلَةِ، وَأُكَبِّرُ.", sources: [h-bukhari-631]}
      - {n: 2, t: "أَقْرَأُ الْفَاتِحَةَ وَسُورَةً قَصِيرَةً.", sources: [h-bukhari-631]}
      - {n: 3, t: "أَرْكَعُ، ثُمَّ أَرْفَعُ رَأْسِي.", sources: [h-bukhari-631]}
      - {n: 4, t: "أَسْجُدُ سَجْدَتَيْنِ، بَيْنَهُمَا جِلْسَةٌ.", sources: [h-bukhari-631]}
      - {n: 5, t: "أَقُومُ لِلرَّكْعَةِ الثَّانِيَةِ، وَأُصَلِّيهَا مِثْلَ الْأُولَى.", sources: [h-bukhari-631, s-prayer-rakaat]}
      - {n: 6, t: "أَجْلِسُ وَأَقْرَأُ التَّشَهُّدَ.", sources: [h-bukhari-831]}
      - {n: 7, t: "أُسَلِّمُ عَنْ يَمِينِي ثُمَّ عَنْ يَسَارِي.", sources: [h-bukhari-631], scholar_decision: true}
    scholar_points: [s-prayer-rakaat, h-bukhari-631]
    parent_line: "صَلُّوا أَمَامَ طِفْلِكُمْ، وَدَعُوهُ يُرَتِّبُ الْبِطَاقَاتِ، ثُمَّ يُصَلِّي بِجَانِبِكُمْ."

