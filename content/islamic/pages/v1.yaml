    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعرّف طفلكم إلى نبيّنا محمد بن عبد الله ﷺ من قريش، وإلى رحمته بالأطفال وصدقه وأمانته، وتعلّم أن يصلّي عليه حبًّا له.", sources: [s-name-lineage, h-bukhari-707, h-bukhari-4770, q-33-56], ai_drafted: true}
    explain: {text: "احكوا له المواقف كما هي في الصفحات دون زيادة، واربطوها بحياته: «كما خفّف النبي ﷺ الصلاة رحمةً بالطفل، نرحم نحن الصغار». لا نرسم النبي ﷺ ولا نتخيّل صورته.", sources: [h-bukhari-707], ai_drafted: true}
    ask: "ماذا فعل النبي ﷺ حين سمع بكاء طفل وهو يصلّي؟"
    together: "اختاروا وقتًا كل يوم، وردّدوا مع الطفل الصلاة على النبي ﷺ عدة مرات، ودعوه يرسم وردة في صفحة «حديقة حبّي»."
    habit: {text: "حين يُذكر اسم النبي ﷺ أمام الطفل صلّوا عليه بصوت مسموع، فيتعلّم ذلك بالقدوة.", sources: [q-33-56], ai_drafted: true}
    care_note: "في هذه الوحدة آيات وأحاديث؛ نرجو حفظ الكتاب في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

