    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعرّف طفلكم إلى أنّ الله هو الخالق الواحد، ومن أسمائه الخالق والرحمن والرزّاق، وأنّه قريب منه يسمعه ويجيب دعاءه.", sources: [q-39-62, q-112, q-59-24, q-1-3, q-51-58, q-2-186], ai_drafted: true}
    explain: {text: "انطلقوا من أسئلة الطفل نفسها: «من خلق الشمس؟ من خلقني؟». أجيبوا بجمل قصيرة دافئة، وقدّموا قرب الله طمأنينةً وحبًّا، لا رقابةً وتخويفًا.", ai_drafted: true}
    ask: "من خلق السماء؟ وماذا تحبّ أن تطلب من الله اليوم؟"
    together: "نزهة تفكّر: اخرجوا إلى الحديقة أو الشرفة، وعدّوا معًا خمسة أشياء خلقها الله، ثم ادعوا الله معًا بدعاء قصير يختاره الطفل بكلماته."
    habit: {text: "علّموه أن يدعو الله بكلماته البسيطة كل ليلة قبل النوم، فالله قريب يجيب الدعاء.", sources: [q-2-186], ai_drafted: true}
    care_note: "في الكتاب آيات من القرآن الكريم؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

