  - key: u-house/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "تعرّف طفلكم إلى أركان الإسلام الخمسة، وعرف أنّ الصلاة خمس مرات في اليوم، وأنّ كل عمل طيّب صدقة.", sources: [h-bukhari-8, h-bukhari-46, h-bukhari-6021], ai_drafted: true}
    explain: {text: "استخدموا صورة البيت ذي الأعمدة الخمسة. في هذا العمر نعرّفه بالأركان ولا نُلزمه؛ يصلّي معكم تشجيعًا، ويتصدّق من مصروفه أو ألعابه.", sources: [s-prayer-age, s-charity-kids], ai_drafted: true}
    ask: "كم ركنًا للإسلام؟ وأيّ ركن تحبّ أن تتعلّم عنه أكثر؟"
    together: "صندوق الصدقة: زيّنوا معه علبة يضع فيها شيئًا من مصروفه كل أسبوع، ثم يعطيها بنفسه لمن يحتاج."
