# «قلبي يعرف الله» · المجلد ١ «أَعْرِفُ رَبِّي وَأُحِبُّهُ»: the content of the volume's pages, one entry per place.
#
# AI-DRAFTED, PENDING THE SCHOLAR. Nothing in this file is final: every page, every explanation and every story was
# drafted by the AI drafter and waits for the scholar's page-by-page review (Addendum 10 §3). Nothing prints or
# sells before that approval.
#
# The writers' guide is docs/islamic/content-guide.md (every page type, the rules, the length limits). `key` names
# the page's place (front/<k>, <unit>/opener, <unit>/l<lesson>-<page>, <unit>/closing-<k>, <unit>/parent,
# <unit>/review-<k>, end/<k>); the engine derives id, unit and volume, and the title when there is none.
#
#   uv run python -m qamra_workbook.render.islamic_volume --volume v1 --keys    # the places (✓ = written here)
#   uv run python -m qamra_workbook.render.islamic_volume --volume v1 --check   # what is missing or wrong
#
# No verse, hadith or dhikr is typed here: a block names a source id of content/islamic/sources.yaml. The everyday
# stories with Reem, Salem, Sitti Huda and Naanaa are fictional. Prophets' and sira scenes show no person. Seeded
# from the proposal's sample pages (content/islamic/samples.yaml), with the language review's corrections.

pages:
  # ================================================================== the front pages
  - key: front/1
    type: front-title

  - key: front/2
    type: front-characters
    ai_drafted: true
    intros:
      - {who: huda, t: "سِتِّي هُدَى تَحْكِي لَنَا أَجْمَلَ الْحِكَايَاتِ، وَتُجِيبُ عَنْ أَسْئِلَتِنَا بِحُبٍّ."}
      - {who: reem, t: "رِيمُ أُخْتٌ كَبِيرَةٌ تُحِبُّ أَنْ تَسْأَلَ: لِمَاذَا؟"}
      - {who: salem, t: "سَالِمٌ أَخُوهَا الصَّغِيرُ، يَلْعَبُ وَيُخْطِئُ وَيَتَعَلَّمُ."}
      - {who: naanaa, t: "نَعْنَاعُ قِطَّتُهُمُ الْكَسُولُ، تُحِبُّ النَّوْمَ فِي الشَّمْسِ."}
      - {who: reader, t: "وَ{أَنْتَ/أَنْتِ} يَا {child} {بَطَلُ/بَطَلَةُ} هَذَا الْكِتَابِ!"}

  - key: front/3
    type: front-how-to-use
    ai_drafted: true
    steps:
      - {icon: book, t: "أَقْرَأُ صَفْحَةً أَوْ صَفْحَتَيْنِ كُلَّ يَوْمٍ مَعَ أُمِّي أَوْ أَبِي."}
      - {icon: pencil, t: "أُلَوِّنُ وَأَرْسُمُ وَأَصِلُ وَأَخْتَارُ بِنَفْسِي."}
      - {icon: speaker, t: "أَسْمَعُ الْأَذْكَارَ بِصَوْتٍ جَمِيلٍ حِينَ يُوَجِّهُ أَهْلِي الْهَاتِفَ إِلَى رَمْزِ الصَّوْتِ."}
      - {icon: star, t: "أُلَوِّنُ نَجْمَةً كُلَّمَا أَنْهَيْتُ تَحَدِّيًا."}
      - {icon: stamp, t: "أُلْصِقُ خَتْمَ الْوَحْدَةِ فِي جَوَازِي حِينَ أُنْهِيهَا."}
    care_note: "في هذا الكتاب آيات من القرآن الكريم وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه، وأن يلمس الطفل صفحاته بيدين نظيفتين."

