    together: "لوحة يومي: ارسموا خطًّا من الشمس إلى القمر، وعلّقوها قرب سرير الطفل، ويضع نجمة عند كل ذكر يقوله."
    habit: {text: "قولوا ذكر الاستيقاظ وذكر النوم بصوت مسموع أمامه كل يوم؛ فالتكرار في وقته يصنع العادة.", sources: [h-bukhari-6312, h-bukhari-6324], ai_drafted: true}
    care_note: "في هذه الوحدة أذكار؛ نرجو حفظ الكتاب في مكان نظيف مرتفع."

