    learned: {text: "تعلّم طفلكم: الصدق ولو أخطأ، والإحسان إلى الوالدين، والمشاركة والمساعدة، وقول «شكرًا» و«آسف».", sources: [h-bukhari-6094, q-17-23, h-tirmidhi-2499], ai_drafted: true}
