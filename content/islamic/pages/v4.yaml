    habit: {text: "ادعوا أمام {الطفل/الطفلة} بصوت مسموع في مواقف اليوم، {وعلّموه/وعلّموها} دعاء يونس عليه السلام {ليقوله حين يحزن أو يحتاج/لتقوله حين تحزن أو تحتاج} إلى عون الله.", sources: [q-21-87, q-2-186], ai_drafted: true}
