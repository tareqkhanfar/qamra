  # lesson 5 «لَمْ يَقُلْ لِي: أُفٍّ»: sira-story, draw
  - key: u-sira/l5-1
    type: sira-story
    ai_drafted: true
    narrator:
      figures: [huda, reem, salem]
      intro: "قَالَتْ رِيمُ: أَتْعَبَنِي سَالِمٌ الْيَوْمَ! فَقَالَتْ سِتِّي هُدَى: اسْمَعِي مَاذَا حَكَى أَنَسٌ رَضِيَ اللهُ عَنْهُ عَنْ نَبِيِّنَا ﷺ."
    scenes:
      - {backdrop: home, props: [jug, cup], text: "كَانَ أَنَسٌ رَضِيَ اللهُ عَنْهُ يَخْدُمُ النَّبِيَّ ﷺ وَهُوَ صَغِيرٌ.", sources: [h-bukhari-6038], ai_drafted: true}
      - {backdrop: street, props: [house, palm], text: "وَبَقِيَ يَخْدُمُهُ عَشْرَ سِنِينَ.", sources: [h-bukhari-6038], ai_drafted: true}
      - {backdrop: home, props: [lamp], text: "فَمَا قَالَ لَهُ النَّبِيُّ ﷺ كَلِمَةَ ضِيقٍ، وَلَا مَرَّةً وَاحِدَةً.", sources: [h-bukhari-6038], ai_drafted: true}
      - {backdrop: garden, props: [flower, bird], text: "وَلَمْ يَلُمْهُ عَلَى شَيْءٍ فَعَلَهُ، وَلَا عَلَى شَيْءٍ تَرَكَهُ.", sources: [h-bukhari-6038], ai_drafted: true}
