# «قلبي يعرف الله» · المجلد ٤ «قَصَصُ الْأَنْبِيَاءِ وَسِيرَةُ نَبِيِّنَا ﷺ»: the content of the volume's pages, one entry
# per place.
#
# AI-DRAFTED, PENDING THE SCHOLAR (Addendum 10 §3). Nothing here is final: every page and every explanation was
# drafted by the AI drafter and waits for the scholar's page-by-page review. Nothing prints or sells before that.
#
# The writers' guide is docs/islamic/content-guide.md (every page type, the rules, the length limits). `key` names
# the page's place; the engine derives id, unit and volume, and the title when there is none.
#
#   uv run python -m qamra_workbook.render.islamic_volume --volume v4 --keys    # the places (✓ = written here)
#   uv run python -m qamra_workbook.render.islamic_volume --volume v4 --check   # what is missing or wrong
#
# No verse, hadith or dhikr is typed here: a block names a source id of content/islamic/sources.yaml (+ sources.d)
# and the engine prints the verified wording. The prophets' stories and the sira pages are told by Sitti Huda in the
# narrator panel; their scenes show places, nature and objects only, never a person. In the prophets' units the
# colouring, maze and find pages picture objects only. The everyday situations with Reem, Salem, Sitti Huda and
# Naanaa are fictional.

pages:
  # ==== the front pages =========================================================================================
  - key: front/1
    type: front-title

  - key: front/2
    type: front-characters
    ai_drafted: true
    intros:
      - {who: huda, t: "سِتِّي هُدَى تَحْكِي لَنَا قَصَصَ الْأَنْبِيَاءِ وَسِيرَةَ نَبِيِّنَا ﷺ بِحُبٍّ."}
      - {who: reem, t: "رِيمُ أُخْتٌ كَبِيرَةٌ تُحِبُّ أَنْ تَسْأَلَ: لِمَاذَا؟ وَكَيْفَ؟"}
      - {who: salem, t: "سَالِمٌ أَخُوهَا الصَّغِيرُ، يُحِبُّ السُّفُنَ وَالْحِيتَانَ وَالنُّجُومَ."}
      - {who: naanaa, t: "نَعْنَاعُ قِطَّتُهُمُ الْكَسُولُ، تَغْفُو كُلَّمَا بَدَأَتْ سِتِّي تَحْكِي."}
      - {who: reader, t: "وَ{أَنْتَ/أَنْتِ} يَا {child} {تَسْمَعُ مَعَنَا وَتَتَعَلَّمُ/تَسْمَعِينَ مَعَنَا وَتَتَعَلَّمِينَ}!"}

  - key: front/3
    type: front-how-to-use
    ai_drafted: true
    steps:
      - {icon: book, t: "أَسْمَعُ الْقِصَّةَ مَعَ أَهْلِي، ثُمَّ أَحْكِيهَا بِكَلِمَاتِي."}
      - {icon: pencil, t: "أُلَوِّنُ وَأَرْسُمُ وَأَصِلُ وَأَخْتَارُ بِنَفْسِي."}
      - {icon: heart, t: "آخُذُ مِنْ كُلِّ قِصَّةٍ خُلُقًا جَمِيلًا، وَأَعْمَلُ بِهِ."}
      - {icon: stamp, t: "أُلْصِقُ خَتْمَ الْوَحْدَةِ فِي جَوَازِي حِينَ أُنْهِيهَا."}
    care_note: "في هذا الكتاب آيات من القرآن الكريم وأحاديث وأدعية؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه. وفي قصص الأنبياء لا نرسم نبيًّا ولا صحابيًّا: نرى الأماكن والأشياء فقط."

  - key: front/4
    type: passport
    ai_drafted: true
    gendered_title: "{جَوَازُ الْمُسْلِمِ الصَّغِيرِ/جَوَازُ الْمُسْلِمَةِ الصَّغِيرَةِ}"
    photo_slot: reader
    stamps_from: units.yaml
    challenge_stars: 7

  - key: front/5
    type: front-this-is-me
    ai_drafted: true
    prompts: ["اسْمِي:", "عُمْرِي:", "نَبِيٌّ أُحِبُّ قِصَّتَهُ:", "خُلُقٌ جَمِيلٌ أَتَعَلَّمُهُ:"]
    draw_box: "{ارْسُمْ أُسْرَتَكَ/ارْسُمِي أُسْرَتَكِ} هُنَا"

  # ==== آدَمُ عَلَيْهِ السَّلَامُ ====================================================================================
  - key: u-adam/opener
    type: unit-opener
    ai_drafted: true
    hello: {who: reem, t: "{تَعَالَ نَسْمَعْ/تَعَالَيْ نَسْمَعْ} مِنْ سِتِّي هُدَى قِصَّةَ أَبِينَا آدَمَ عَلَيْهِ السَّلَامُ!"}
    question: "{هَلْ تَعْرِفُ أَسْمَاءَ كُلِّ مَا حَوْلَكَ؟/هَلْ تَعْرِفِينَ أَسْمَاءَ كُلِّ مَا حَوْلَكِ؟}"

  # lesson 1 «آدَمُ وَالْأَسْمَاءُ»: prophet-story, find-objects, choose
  - key: u-adam/l1-1
    type: prophet-story
    ai_drafted: true
    narrator:
      figures: [huda, reem, salem]
      intro: "سَأَلَ سَالِمٌ: مَنْ عَلَّمَنَا أَسْمَاءَ الْأَشْيَاءِ؟ فَقَالَتْ سِتِّي هُدَى: سَأَحْكِي لَكُمَا عَنْ أَبِينَا آدَمَ عَلَيْهِ السَّلَامُ."
    scenes:
      - {backdrop: garden, props: [tree, flower, bird], text: "خَلَقَ اللهُ آدَمَ عَلَيْهِ السَّلَامُ، لِيَعِيشَ هُوَ وَأَبْنَاؤُهُ فِي الْأَرْضِ.", sources: [q-2-30-37, q-39-62], ai_drafted: true}
      - {backdrop: garden, props: [flower, rabbit, butterfly, grass, bird], text: "وَعَلَّمَ اللهُ آدَمَ عَلَيْهِ السَّلَامُ أَسْمَاءَ الْأَشْيَاءِ كُلِّهَا.", sources: [q-2-30-37], ai_drafted: true}
      - {backdrop: night-sky, props: [star], text: "ثُمَّ سَأَلَ اللهُ الْمَلَائِكَةَ عَنْ أَسْمَائِهَا، فَأَخْبَرُوا أَنَّهُمْ لَا يَعْلَمُونَ إِلَّا مَا عَلَّمَهُمُ اللهُ.", sources: [q-2-30-37], ai_drafted: true}
      - {backdrop: garden, props: [tree, bird, flower], text: "فَأَخْبَرَهُمْ آدَمُ عَلَيْهِ السَّلَامُ بِالْأَسْمَاءِ الَّتِي عَلَّمَهُ اللهُ إِيَّاهَا.", sources: [q-2-30-37], ai_drafted: true}
    verse: {source: q-20-114}
    lesson: {text: "الْعِلْمُ نِعْمَةٌ مِنَ اللهِ، فَنَتَعَلَّمُ وَنَشْكُرُهُ، وَنَدْعُوهُ أَنْ يَزِيدَنَا عِلْمًا.", sources: [q-2-30-37, q-20-114], ai_drafted: true}
    question:
      text: "مَنْ عَلَّمَ آدَمَ عَلَيْهِ السَّلَامُ الْأَسْمَاءَ؟"
      choices: [{t: "اللهُ", ok: true}, {t: "الْمَلَائِكَةُ"}, {t: "لَا أَحَدَ"}]
      sources: [q-2-30-37]

  - key: u-adam/l1-2
    type: find-objects
    ai_drafted: true
    instruction: "{ابْحَثْ عَنِ الْأَشْيَاءِ وَسَمِّهَا/ابْحَثِي عَنِ الْأَشْيَاءِ وَسَمِّيهَا}"
    find:
      - {pic: tree, word: الشَّجَرَةُ}
      - {pic: bird, word: الْعُصْفُورُ}
      - {pic: fish, word: السَّمَكَةُ}
      - {pic: flower, word: الزَّهْرَةُ}
      - {pic: moon, word: الْقَمَرُ}
      - {pic: water, word: الْمَاءُ}
    others: [car, ball, kite, chair, lamp, shoe, cup, phone]
    closing: {text: "عَلَّمَ اللهُ آدَمَ عَلَيْهِ السَّلَامُ أَسْمَاءَ الْأَشْيَاءِ، وَعَلَّمَنَا نَحْنُ أَيْضًا مَا لَمْ نَكُنْ نَعْلَمُ.", sources: [q-2-30-37, q-96-1-5], ai_drafted: true}

  - key: u-adam/l1-3
    type: choose
    ai_drafted: true
    instruction: "{اخْتَرِ/اخْتَارِي} الْجَوَابَ الصَّحِيحَ"
    questions:
      - text: "مَنْ خَلَقَ آدَمَ عَلَيْهِ السَّلَامُ؟"
        choices: [{t: "اللهُ", ok: true}, {t: "الْمَلَائِكَةُ"}]
        sources: [q-39-62, q-2-30-37]
      - text: "مَاذَا عَلَّمَ اللهُ آدَمَ عَلَيْهِ السَّلَامُ؟"
        pic: book
        choices: [{t: "أَسْمَاءَ الْأَشْيَاءِ", ok: true}, {t: "أَلْعَابًا جَدِيدَةً"}]
        sources: [q-2-30-37]
      - text: "بِمَاذَا نَدْعُو لِيَزِيدَنَا اللهُ عِلْمًا؟"
        choices: [{source: q-20-114, span: {start: "رب زدني", end: "علما"}, ok: true}, {source: d-sneeze-2}]
        sources: [q-20-114]

  # lesson 2 «آدَمُ يَتُوبُ»: prophet-story, wwyd, true-false
  - key: u-adam/l2-1
    type: prophet-story
    ai_drafted: true
    narrator:
      figures: [huda, reem, salem]
      intro: "سَأَلَ سَالِمٌ: هَلْ يُخْطِئُ الْكِبَارُ؟ فَقَالَتْ سِتِّي هُدَى: كُلُّنَا نُخْطِئُ، وَالْمُهِمُّ أَنْ نَرْجِعَ إِلَى اللهِ."
    scenes:
      - {backdrop: garden, props: [flower, bird, tree], text: "أَسْكَنَ اللهُ آدَمَ عَلَيْهِ السَّلَامُ وَزَوْجَهُ الْجَنَّةَ، وَأَبَاحَ لَهُمَا كُلَّ شَيْءٍ إِلَّا شَجَرَةً وَاحِدَةً.", sources: [q-2-30-37], ai_drafted: true}
      - {backdrop: garden, props: [tree], text: "فَخَدَعَهُمَا الشَّيْطَانُ، فَأَكَلَا مِنَ الشَّجَرَةِ وَأَخْطَآ.", sources: [q-2-30-37], ai_drafted: true}
      - {backdrop: night-sky, props: [moon], text: "فَنَدِمَا، وَدَعَوَا اللهَ أَنْ يَغْفِرَ لَهُمَا وَيَرْحَمَهُمَا.", sources: [q-7-23], ai_drafted: true}
      - {backdrop: garden, props: [grass, flower, sprout], text: "فَتَابَ اللهُ عَلَى آدَمَ عَلَيْهِ السَّلَامُ، وَهُوَ سُبْحَانَهُ يَقْبَلُ تَوْبَةَ مَنْ يَرْجِعُ إِلَيْهِ.", sources: [q-2-30-37, q-2-222], ai_drafted: true}
    verse: {source: q-7-23, label: "دُعَاءُ آدَمَ عَلَيْهِ السَّلَامُ وَزَوْجِهِ"}
    lesson: {text: "إِذَا أَخْطَأْنَا نَنْدَمُ وَنَعْتَذِرُ وَنَرْجِعُ إِلَى اللهِ، وَهُوَ يُحِبُّ مَنْ يَتُوبُ إِلَيْهِ.", sources: [q-2-222, h-tirmidhi-2499], ai_drafted: true}
    question:
      text: "مَاذَا فَعَلَ آدَمُ عَلَيْهِ السَّلَامُ بَعْدَ الْخَطَأِ؟"
      choices: [{t: "نَدِمَ وَتَابَ إِلَى اللهِ", ok: true}, {t: "بَنَى بَيْتًا كَبِيرًا"}]
      sources: [q-2-30-37, q-7-23]

  - key: u-adam/l2-2
    type: wwyd
    ai_drafted: true
    title: "{مَاذَا كُنْتَ سَتَفْعَلُ؟/مَاذَا كُنْتِ سَتَفْعَلِينَ؟}"
    scenario: "{قُلْتَ لِأَخِيكَ/قُلْتِ لِأَخِيكِ} الصَّغِيرِ كَلِمَةً قَاسِيَةً {وَأَنْتَ غَاضِبٌ/وَأَنْتِ غَاضِبَةٌ}، فَحَزِنَ وَبَكَى."
    scene: {backdrop: home, props: [blocks, teddy], figures: [reader, salem]}
    choices:
      - {t: "أَعْتَذِرُ إِلَيْهِ، وَأَقُولُ لَهُ كَلِمَةً طَيِّبَةً", ok: true, feedback: "{أَحْسَنْتَ يَا بَطَلُ/أَحْسَنْتِ يَا بَطَلَةُ}! الِاعْتِذَارُ يُصْلِحُ الْقُلُوبَ."}
      - {t: "أَتْرُكُهُ يَبْكِي، وَأَذْهَبُ لِأَلْعَبَ", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
      - {t: "أَقُولُ: هُوَ الَّذِي أَغْضَبَنِي أَوَّلًا", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
    quote: {source: h-tirmidhi-2499, span: {start: "كل ابن آدم", end: "التوابون"}}
    sources: [h-tirmidhi-2499]
    role_play: "{مَثِّلِ الِاعْتِذَارَ مَعَ أَهْلِكَ/مَثِّلِي الِاعْتِذَارَ مَعَ أَهْلِكِ}"

  - key: u-adam/l2-3
    type: true-false
    ai_drafted: true
    instruction: "{ضَعْ/ضَعِي} دَائِرَةً حَوْلَ الْجَوَابِ"
    statements:
      - {t: "نَدِمَ آدَمُ عَلَيْهِ السَّلَامُ عَلَى خَطَئِهِ، وَتَابَ إِلَى اللهِ.", ok: true, sources: [q-2-30-37]}
      - {t: "اللهُ يَقْبَلُ تَوْبَةَ مَنْ يَرْجِعُ إِلَيْهِ.", ok: true, sources: [q-2-30-37, q-2-222]}
      - {t: "إِذَا أَخْطَأْنَا نُخْفِي الْخَطَأَ وَلَا نَعْتَذِرُ.", ok: false, sources: [h-tirmidhi-2499]}
      - {t: "دَعَا آدَمُ عَلَيْهِ السَّلَامُ وَزَوْجُهُ رَبَّهُمَا أَنْ يَغْفِرَ لَهُمَا.", ok: true, sources: [q-7-23]}

