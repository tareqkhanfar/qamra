    learned: {text: "{تعرّف طفلكم/تعرّفت طفلتكم} إلى يونس عليه السلام: ركب السفينة ثم التقمه الحوت، فنادى ربّه في الظلمات، فاستجاب الله له ونجّاه. {وتعلّم/وتعلّمت} أنّ الله قريب يسمع الدعاء.", sources: [q-37-139-148, q-21-87, q-21-88, q-2-186], ai_drafted: true}
