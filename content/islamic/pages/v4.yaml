    learned: {text: "{تعرّف طفلكم/تعرّفت طفلتكم} إلى أبينا آدم عليه السلام: علّمه الله الأسماء، وحين أخطأ ندم ودعا ربّه، فتاب الله عليه.", sources: [q-2-30-37, q-7-23], ai_drafted: true}
