      - {backdrop: street, props: [tree, flower], text: "فَأَسْلَمَ الْوَلَدُ، وَخَرَجَ النَّبِيُّ ﷺ يَحْمَدُ اللهَ.", sources: [h-bukhari-1356], ai_drafted: true}
