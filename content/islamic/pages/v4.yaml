      - {art: ship-at-sea, text: "وَجَاءَ الْمَاءُ، فَجَرَتِ السَّفِينَةُ فِي الْمَوْجِ الْعَالِي، وَاللهُ يَحْفَظُ مَنْ فِيهَا.", sources: [q-11-37-44], ai_drafted: true}
      - {backdrop: garden, props: [flower, grass, ship], text: "ثُمَّ نَقَصَ الْمَاءُ، وَاسْتَقَرَّتِ السَّفِينَةُ عَلَى جَبَلٍ اسْمُهُ الْجُودِيُّ.", sources: [q-11-37-44], ai_drafted: true}
