  - key: u-sira/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "{تعرّف طفلكم/تعرّفت طفلتكم} إلى مواقف صحيحة من حياة نبينا ﷺ: صدقه حتى شهد له قومه، وثقته بالله في الغار، وصبره على الأعرابي، وزيارته للمريض، ولطفه مع أنس رضي الله عنه.", sources: [h-bukhari-4770, q-9-40, h-bukhari-3149, h-bukhari-1356, h-bukhari-6038], ai_drafted: true}
    explain: {text: "احكوا كل موقف قصيرًا كما في الكتاب، ثم اسألوا: ماذا نتعلّم منه؟ نحكي {للطفل/للطفلة} ما ثبت فقط، ولا نرسم النبي ﷺ ولا أصحابه؛ نرى المكان والأشياء.", ai_drafted: true}
    ask: "أيّ خلق من أخلاق النبي ﷺ أحببته أكثر؟ ولماذا؟"
    together: "اصنعوا «شجرة الأخلاق» على ورقة كبيرة: ورقة خضراء لكل خلق {تعلّمه الطفل/تعلّمته الطفلة} من سيرة النبي ﷺ، {ويلصق/وتلصق} ورقة جديدة كلما {عمل/عملت} به."
    habit: {text: "صلّوا على النبي ﷺ كلما ذُكر اسمه أمام {الطفل/الطفلة}، واربطوا مواقف اليوم بخلق من أخلاقه ﷺ: «هكذا كان نبيّنا يفعل».", sources: [q-33-56, q-33-21], ai_drafted: true}
    care_note: "في الكتاب آيات من القرآن الكريم وأحاديث وأدعية؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

