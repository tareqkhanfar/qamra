    ask: "لماذا لا نعبد الشمس ولا القمر؟"
    together: "في ليلة صافية، اخرجوا معًا إلى مكان مفتوح، وتأمّلوا السماء، وعدّوا النجوم، وتحدّثوا عن عظمة الله الذي خلقها."
    habit: {text: "قبل النوم، {اسألوا الطفل/اسألوا الطفلة} عن شيء جميل خلقه الله {رآه/رأته} اليوم، وادعوا {معه/معها} لوالديكم كما دعا إبراهيم عليه السلام.", sources: [q-14-41, q-39-62], ai_drafted: true}
    care_note: "في الكتاب آيات من القرآن الكريم وأحاديث وأدعية؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

