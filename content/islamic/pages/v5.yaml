# «قلبي يعرف الله» · المجلد ٥ «أَخْلَاقِي وَآدَابِي وَأَحْكَامِي» (المستوى الثاني، 6–8 سنوات): the content of the
# volume's pages, one entry per place.
#
# AI-DRAFTED, PENDING THE SCHOLAR. Nothing here is final: every page and every explanation was drafted by the AI
# drafter and waits for the scholar's page-by-page review (Addendum 10 §3). Nothing prints or sells before that.
#
# The writers' guide is docs/islamic/content-guide.md (every page type, the rules, the length limits). `key` names
# the page's place (front/<k>, <unit>/opener, <unit>/l<lesson>-<page>, <unit>/closing-<k>, <unit>/parent,
# <unit>/review-<k>, end/<k>); the engine derives id, unit and volume, and the title when there is none.
#
#   uv run python -m qamra_workbook.render.islamic_volume --volume v5 --keys    # the places (✓ = written here)
#   uv run python -m qamra_workbook.render.islamic_volume --volume v5 --check   # what is missing or wrong
#
# No verse, hadith or dhikr is typed here: a block names a source id of content/islamic/sources.yaml (+ sources.d/),
# and the engine prints the verified wording. Span markers (`start`/`end`) are search keys only, never printed.

pages:
  # ==== the front pages ==========================================================================================
  - key: front/1
    type: front-title
    ai_drafted: true
    subtitle: "أَخْلَاقٌ جَمِيلَةٌ وَآدَابٌ وَأَحْكَامٌ أَعِيشُهَا كُلَّ يَوْمٍ"

  - key: front/2
    type: front-characters
    ai_drafted: true
    intros:
      - {who: huda, t: "سِتِّي هُدَى تَحْكِي لَنَا الْحِكَايَاتِ، وَتُعَلِّمُنَا الْأَخْلَاقَ الْجَمِيلَةَ بِحُبٍّ وَصَبْرٍ."}
      - {who: reem, t: "رِيمُ أُخْتٌ كَبِيرَةٌ، تَسْأَلُ كَثِيرًا، وَتُحِبُّ أَنْ تُسَاعِدَ الْجَمِيعَ."}
      - {who: salem, t: "سَالِمٌ أَخُوهَا الصَّغِيرُ، يُخْطِئُ أَحْيَانًا، ثُمَّ يَعْتَذِرُ وَيُحَاوِلُ مِنْ جَدِيدٍ."}
      - {who: naanaa, t: "نَعْنَاعُ قِطَّتُهُمُ الْكَسُولُ، تُحِبُّ النَّوْمَ وَالْحَلِيبَ الدَّافِئَ."}
      - {who: reader, t: "وَ{أَنْتَ/أَنْتِ} يَا {child} {بَطَلُ/بَطَلَةُ} هَذَا الْكِتَابِ!"}

  - key: front/3
    type: front-how-to-use
    ai_drafted: true
    steps:
      - {icon: book, t: "أَقْرَأُ صَفْحَةً أَوْ صَفْحَتَيْنِ كُلَّ يَوْمٍ مَعَ أُمِّي أَوْ أَبِي."}
      - {icon: talk, t: "أُفَكِّرُ فِي الْمَوَاقِفِ، وَأَخْتَارُ الْأَجْمَلَ، ثُمَّ نَتَحَدَّثُ عَنْهُ مَعًا."}
      - {icon: home, t: "أُطَبِّقُ مَا تَعَلَّمْتُهُ فِي الْبَيْتِ، وَأُلَوِّنُ نَجْمَةً كُلَّ يَوْمٍ."}
      - {icon: stamp, t: "أُلْصِقُ خَتْمَ الْوَحْدَةِ فِي جَوَازِي حِينَ أُنْهِيهَا."}
    care_note: "في هذا الكتاب آيات من القرآن الكريم وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه، وأن يلمس الطفل صفحاته بيدين نظيفتين."

  - key: front/4
    type: passport
    ai_drafted: true
    gendered_title: "{جَوَازُ الْمُسْلِمِ الصَّغِيرِ/جَوَازُ الْمُسْلِمَةِ الصَّغِيرَةِ}"
    photo_slot: reader
    stamps_from: units.yaml
    challenge_stars: 7

  - key: front/5
    type: front-this-is-me
    ai_drafted: true
    prompts: ["اسْمِي:", "عُمْرِي:", "خُلُقٌ جَمِيلٌ أُحِبُّهُ:", "أُحِبُّ أَنْ أُسَاعِدَ فِي:"]
    draw_box: "{ارْسُمْ نَفْسَكَ وَأَنْتَ تُسَاعِدُ أَحَدًا/ارْسُمِي نَفْسَكِ وَأَنْتِ تُسَاعِدِينَ أَحَدًا}"

  # ==== أَخْلَاقِي أَكْبَرُ (u-manners2) ===========================================================================
  - key: u-manners2/opener
    type: unit-opener
    ai_drafted: true
    hello: {who: reem, t: "{تَعَالَ نَتَعَلَّمْ/تَعَالَيْ نَتَعَلَّمْ} كَيْفَ تَكْبُرُ أَخْلَاقُنَا: نَحْفَظُ أَلْسِنَتَنَا، وَنَرْحَمُ الْجَمِيعَ، وَنُسَامِحُ!"}
    question: "{هَلْ تَذْكُرُ/هَلْ تَذْكُرِينَ} كَلِمَةً طَيِّبَةً {قُلْتَهَا/قُلْتِهَا} الْيَوْمَ؟"

  # lesson 1 «أَحْفَظُ لِسَانِي»: story, wwyd, true-false
  - key: u-manners2/l1-1
    type: story
    ai_drafted: true
    scene: {backdrop: garden, props: [ball, kite], figures: [huda, reem, salem]}
    lines:
      - {who: salem, t: "ضَحِكْتُ الْيَوْمَ عَلَى وَلَدٍ يَلْبَسُ نَظَّارَةً كَبِيرَةً، وَنَادَيْتُهُ بِاسْمٍ مُضْحِكٍ."}
      - {who: reem, t: "لَكِنَّهُ حَزِنَ كَثِيرًا يَا سَالِمُ، وَجَلَسَ وَحْدَهُ."}
      - {who: huda, t: "الْمُسْلِمُ لَا يُؤْذِي أَحَدًا بِلِسَانِهِ، وَلَا يَسْخَرُ مِنْ أَحَدٍ.", sources: [h-bukhari-10, q-49-11], ai_drafted: true}
      - {who: salem, t: "سَأَعْتَذِرُ إِلَيْهِ غَدًا، وَأَقُولُ لَهُ كَلِمَةً طَيِّبَةً."}
    lesson: {text: "أَقُولُ خَيْرًا أَوْ أَسْكُتُ، وَلَا أُنَادِي أَحَدًا بِاسْمٍ يُحْزِنُهُ.", sources: [h-bukhari-6018, q-49-11], ai_drafted: true}
    question:
      text: "مَاذَا يَفْعَلُ الْمُسْلِمُ بِلِسَانِهِ؟"
      choices: [{t: "يَقُولُ كَلَامًا طَيِّبًا", ok: true}, {t: "يَسْخَرُ مِنَ النَّاسِ"}]
      sources: [h-bukhari-6018]

  - key: u-manners2/l1-2
    type: wwyd
    ai_drafted: true
    title: "{مَاذَا كُنْتَ سَتَفْعَلُ؟/مَاذَا كُنْتِ سَتَفْعَلِينَ؟}"
    scenario: "{أَخْطَأَ صَدِيقُكَ/أَخْطَأَتْ صَدِيقَتُكِ} فِي الْقِرَاءَةِ أَمَامَ الصَّفِّ، فَضَحِكَ بَعْضُ الْأَطْفَالِ."
    scene: {backdrop: classroom, props: [book, pencil], figures: [reader]}
    choices:
      - {t: "لَا أَضْحَكُ، وَأَقُولُ {لَهُ كَلِمَةً تُشَجِّعُهُ/لَهَا كَلِمَةً تُشَجِّعُهَا}", ok: true, feedback: "{أَحْسَنْتَ يَا بَطَلُ/أَحْسَنْتِ يَا بَطَلَةُ}! الْكَلِمَةُ الطَّيِّبَةُ تُفْرِحُ الْقُلُوبَ."}
      - {t: "أَضْحَكُ مَعَ الْأَطْفَالِ", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
      - {t: "{أُقَلِّدُهُ/أُقَلِّدُهَا} لِيَضْحَكَ الْجَمِيعُ", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
    quote: {source: h-bukhari-10, span: {start: "المسلم من سلم", end: "ويده"}}
    sources: [h-bukhari-10, q-49-11]
    role_play: "{مَثِّلِ الْمَوْقِفَ مَعَ أَهْلِكَ/مَثِّلِي الْمَوْقِفَ مَعَ أَهْلِكِ}"

  - key: u-manners2/l1-3
    type: true-false
    ai_drafted: true
    instruction: "{ضَعْ/ضَعِي} دَائِرَةً حَوْلَ الْجَوَابِ"
    statements:
      - {t: "الْمُسْلِمُ يَقُولُ خَيْرًا أَوْ يَسْكُتُ.", ok: true, sources: [h-bukhari-6018]}
      - {t: "لَا بَأْسَ أَنْ أَسْخَرَ مِنْ {صَدِيقِي/صَدِيقَتِي} إِذَا ضَحِكَ الْجَمِيعُ.", ok: false, sources: [q-49-11]}
      - {t: "الْمُسْلِمُ لَا يُؤْذِي النَّاسَ بِلِسَانِهِ وَلَا بِيَدِهِ.", ok: true, sources: [h-bukhari-10]}
      - {t: "أُنَادِي أَصْدِقَائِي بِأَسْمَاءٍ تُحْزِنُهُمْ.", ok: false, sources: [q-49-11]}
      - {t: "الْكَلِمَةُ الطَّيِّبَةُ تُفْرِحُ مَنْ يَسْمَعُهَا.", ok: true, sources: [h-bukhari-6018]}

  # lesson 2 «أَمِينٌ عَلَى مَا عِنْدِي»: story, wwyd, match
  - key: u-manners2/l2-1
    type: story
    ai_drafted: true
    scene: {backdrop: market, props: [key, loaf, basket], figures: [huda, reem, salem]}
    lines:
      - {who: huda, t: "يَا سَالِمُ، هَذَا مِفْتَاحُ الْبَيْتِ، أَتَحْفَظُهُ لِي حَتَّى نَرْجِعَ؟"}
      - {who: salem, t: "نَعَمْ يَا سِتِّي! سَأَضَعُهُ فِي جَيْبِي، وَلَا أَلْعَبُ بِهِ."}
      - {who: narrator, t: "وَحِينَ رَجَعُوا، أَعْطَى سَالِمٌ الْمِفْتَاحَ لِسِتِّي هُدَى."}
      - {who: huda, t: "أَحْسَنْتَ يَا أَمِينُ! اللهُ أَمَرَنَا أَنْ نَرُدَّ الْأَمَانَاتِ إِلَى أَصْحَابِهَا.", sources: [q-4-58], ai_drafted: true}
    lesson: {text: "الْأَمِينُ يَحْفَظُ الْأَشْيَاءَ الَّتِي عِنْدَهُ، وَيَرُدُّهَا إِلَى أَصْحَابِهَا.", sources: [q-4-58, h-abudawud-3535], ai_drafted: true}
    question:
      text: "مَاذَا فَعَلَ سَالِمٌ بِالْمِفْتَاحِ؟"
      choices: [{t: "حَفِظَهُ وَرَدَّهُ إِلَى سِتِّي", ok: true}, {t: "لَعِبَ بِهِ وَأَضَاعَهُ"}]
      sources: [q-4-58]

