    choices:
      - {t: "{أَرُدُّهَا إِلَيْهِ نَظِيفَةً وَأَشْكُرُهُ/أَرُدُّهَا إِلَيْهَا نَظِيفَةً وَأَشْكُرُهَا}", ok: true, feedback: "{أَحْسَنْتَ يَا بَطَلُ! أَنْتَ أَمِينٌ/أَحْسَنْتِ يَا بَطَلَةُ! أَنْتِ أَمِينَةٌ}."}
      - {t: "أُبْقِيهَا عِنْدِي لِأَنَّهَا أَعْجَبَتْنِي", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
      - {t: "أُعْطِيهَا لِطِفْلٍ آخَرَ دُونَ أَنْ أَسْأَلَ", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
    quote: {source: h-abudawud-3535, span: {start: "أد الأمانة", end: "ائتمنك"}}
