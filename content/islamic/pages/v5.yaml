    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "{تعلّم طفلكم/تعلّمت طفلتكم} ماذا {يفعل لو وجد شيئًا ليس له، أو نسي الصلاة، أو كذب، أو ظلم صديقه، أو غضب/تفعل لو وجدت شيئًا ليس لها، أو نسيت الصلاة، أو كذبت، أو ظلمت صديقها، أو غضبت}: خطوات هادئة تنتهي بالإصلاح.", sources: [s-found-item, h-bukhari-597, h-tirmidhi-2499], ai_drafted: true}
