    statements:
      - {t: "نَأْكُلُ وَنَشْرَبُ، وَلَا نُسْرِفُ.", ok: true, sources: [q-7-31]}
      - {t: "كَانَ نَبِيُّنَا ﷺ يَعِيبُ الطَّعَامَ الَّذِي لَا يُحِبُّهُ.", ok: false, sources: [h-bukhari-3563]}
      - {t: "إِذَا سَقَطَتْ لُقْمَةٌ نُنَظِّفُهَا وَنَأْكُلُهَا.", ok: true, sources: [h-muslim-2034]}
      - {t: "نَمُدُّ يَدَنَا إِلَى الطَّعَامِ الْبَعِيدِ أَمَامَ غَيْرِنَا.", ok: false, sources: [h-bukhari-5376]}
      - {t: "نَمْلَأُ صُحُونَنَا كَثِيرًا، ثُمَّ نَرْمِي الْبَاقِيَ.", ok: false, sources: [q-7-31]}

  # lesson 2 «آدَابُ النَّوْمِ وَالنَّظَافَةِ»: story, order-steps, true-false, wwyd
