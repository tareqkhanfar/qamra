  - key: u-adab/l2-2
    type: prayer-steps
    ai_drafted: true
    title: أُرَتِّبُ خُطُوَاتِ نَوْمِي
    instruction: "{رَتِّبِ/رَتِّبِي} الْخُطُوَاتِ مِنْ ١ إِلَى ٤"
    steps:
      - {n: 1, t: "أَقُولُ دُعَاءَ دُخُولِ الْخَلَاءِ، ثُمَّ أَدْخُلُ.", sources: [h-bukhari-142]}
      - {n: 2, t: "أَغْسِلُ يَدَيَّ، وَأُنَظِّفُ أَسْنَانِي.", sources: [h-muslim-223], scholar_decision: true}
      - {n: 3, t: "أَسْتَلْقِي فِي سَرِيرِي، وَأَقْرَأُ الْإِخْلَاصَ وَالْفَلَقَ وَالنَّاسَ.", sources: [h-bukhari-5017]}
      - {n: 4, t: "أَقُولُ ذِكْرَ النَّوْمِ، وَأُغْمِضُ عَيْنَيَّ.", sources: [d-sleep]}
    scholar_points: [h-muslim-223, h-bukhari-5017]
    parent_line: "اجْعَلُوا هَذِهِ الْخُطُوَاتِ عَادَةً ثَابِتَةً كُلَّ لَيْلَةٍ، وَقُومُوا بِهَا مَعَ الطِّفْلِ."

