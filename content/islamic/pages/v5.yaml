    ask: "ما الخطأ الذي أصلحته هذا الأسبوع؟ وكيف شعرت بعده؟"
    together: "اصنعوا «ركن الهدوء»: وسادة ورسمة وكوب ماء، {يلجأ إليه الطفل حين يغضب/تلجأ إليه الطفلة حين تغضب}."
    habit: {text: "اعتذروا أمام {الطفل/الطفلة} حين تخطئون، فالقدوة أقوى درس في التوبة.", sources: [q-2-222], ai_drafted: true}
    care_note: "في الكتاب آيات وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

