  # lesson 1 «آدَابُ الطَّعَامِ»: story, order-steps, true-false
  - key: u-adab/l1-1
    type: story
    ai_drafted: true
    scene: {backdrop: table, props: [plate, loaf, olive, water], figures: [huda, reem, salem]}
    lines:
      - {who: huda, t: "يَا سَالِمُ، نُسَمِّي اللهَ، وَنَأْكُلُ بِالْيَدِ الْيُمْنَى مِنَ الطَّعَامِ الَّذِي أَمَامَنَا.", sources: [h-bukhari-5376], ai_drafted: true}
      - {who: salem, t: "نَعَمْ يَا سِتِّي. وَلَكِنْ سَقَطَتْ مِنِّي لُقْمَةٌ عَلَى الْمَائِدَةِ!"}
      - {who: huda, t: "نُزِيلُ عَنْهَا مَا عَلِقَ بِهَا وَنَأْكُلُهَا، فَهِيَ نِعْمَةٌ مِنَ اللهِ.", sources: [h-muslim-2034], ai_drafted: true}
      - {who: reem, t: "وَعَرَفْتُ أَنَّ نَبِيَّنَا ﷺ لَمْ يَكُنْ يَعِيبُ طَعَامًا أَبَدًا.", sources: [h-bukhari-3563], ai_drafted: true}
    lesson: {text: "آكُلُ بِأَدَبٍ: أُسَمِّي اللهَ، وَآكُلُ بِيَمِينِي، وَلَا أُسْرِفُ، وَلَا أَعِيبُ الطَّعَامَ.", sources: [h-bukhari-5376, q-7-31, h-bukhari-3563], ai_drafted: true}
    question:
      text: "بِأَيِّ يَدٍ نَأْكُلُ؟"
      choices: [{t: "بِالْيَدِ الْيُمْنَى", ok: true}, {t: "بِالْيَدِ الْيُسْرَى"}]
      sources: [h-bukhari-5376]

  - key: u-adab/l1-2
    type: prayer-steps
    ai_drafted: true
    title: أُرَتِّبُ آدَابَ الطَّعَامِ
    instruction: "{رَتِّبِ/رَتِّبِي} الْخُطُوَاتِ مِنْ ١ إِلَى ٥"
    steps:
      - {n: 1, t: "أُسَمِّي اللهَ قَبْلَ أَنْ أَبْدَأَ.", sources: [h-bukhari-5376]}
      - {n: 2, t: "آكُلُ بِيَمِينِي مِنَ الطَّعَامِ الَّذِي أَمَامِي.", sources: [h-bukhari-5376]}
      - {n: 3, t: "آكُلُ مَا يَكْفِينِي، وَلَا أُسْرِفُ.", sources: [q-7-31]}
      - {n: 4, t: "أَحْمَدُ اللهَ حِينَ أَنْتَهِي.", sources: [h-abudawud-4023]}
      - {n: 5, t: "أُسَاعِدُ أَهْلِي فِي رَفْعِ الصُّحُونِ.", sources: [h-bukhari-676]}
    parent_line: "تَنَاوَلُوا وَجْبَةً مَعًا، وَاطْلُبُوا مِنَ الطِّفْلِ أَنْ يُذَكِّرَكُمْ بِالْآدَابِ بِالتَّرْتِيبِ."

  - key: u-adab/l1-3
    type: true-false
    ai_drafted: true
