  # lesson 3 «أَسْتَأْذِنُ قَبْلَ أَنْ أَدْخُلَ»: story, role-play, true-false
  - key: u-manners2/l3-1
    type: story
    ai_drafted: true
    scene: {backdrop: home, props: [door, lamp], figures: [huda, reem, salem]}
    lines:
      - {who: narrator, t: "أَرَادَ سَالِمٌ أَنْ يَدْخُلَ غُرْفَةَ رِيمَ، وَكَانَ الْبَابُ مُغْلَقًا."}
      - {who: huda, t: "يَا سَالِمُ، نَطْرُقُ الْبَابَ أَوَّلًا، وَنُسَلِّمُ، وَنَسْتَأْذِنُ.", sources: [q-24-27], ai_drafted: true}
      - {who: salem, t: "طَرَقْتُ ثَلَاثَ مَرَّاتٍ يَا سِتِّي، وَلَمْ تُجِبْ رِيمُ!"}
      - {who: huda, t: "إِذَا لَمْ يَأْذَنُوا لَكَ بَعْدَ ثَلَاثِ مَرَّاتٍ، فَارْجِعْ بِهُدُوءٍ.", sources: [h-bukhari-6245], ai_drafted: true}
    lesson: {text: "أَطْرُقُ الْبَابَ وَأَسْتَأْذِنُ، فَإِنْ لَمْ يَأْذَنُوا لِي رَجَعْتُ وَلَمْ أَغْضَبْ.", sources: [h-bukhari-6245, q-24-27], ai_drafted: true}
    question:
      text: "إِذَا اسْتَأْذَنْتُ ثَلَاثَ مَرَّاتٍ وَلَمْ يَأْذَنُوا، مَاذَا أَفْعَلُ؟"
      choices: [{t: "أَرْجِعُ بِهُدُوءٍ", ok: true}, {t: "أَدْخُلُ دُونَ إِذْنٍ"}]
      sources: [h-bukhari-6245]

  - key: u-manners2/l3-2
    type: role-play
    ai_drafted: true
    instruction: "{مَثِّلِ الْمَوْقِفَ مَعَ أَهْلِكَ/مَثِّلِي الْمَوْقِفَ مَعَ أَهْلِكِ}"
    scenario: "{تَحْمِلُ صَحْنًا إِلَى جِيرَانِكُمْ، وَتُرِيدُ أَنْ تَدْخُلَ بَيْتَهُمْ/تَحْمِلِينَ صَحْنًا إِلَى جِيرَانِكُمْ، وَتُرِيدِينَ أَنْ تَدْخُلِي بَيْتَهُمْ}."
    scene: {backdrop: street, props: [plate, door], figures: [reader]}
    roles:
      - {role: "{الزَّائِرُ/الزَّائِرَةُ}", by: "{أَنْتَ/أَنْتِ}"}
      - {role: "صَاحِبُ الْبَيْتِ", by: "{أَبُوكَ أَوْ أُمُّكَ/أَبُوكِ أَوْ أُمُّكِ}"}
    script:
      - {role: "{الزَّائِرُ/الزَّائِرَةُ}", t: "أَطْرُقُ الْبَابَ بِلُطْفٍ، وَأَنْتَظِرُ قَلِيلًا، ثُمَّ أُسَلِّمُ.", sources: [q-24-27]}
