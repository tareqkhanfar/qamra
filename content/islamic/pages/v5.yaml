      - {who: reem, t: "نَعَمْ، وَقَصَصْتُ أَظَافِرِي الْيَوْمَ مَعَ أُمِّي!", sources: [h-bukhari-5889], ai_drafted: true}
      - {who: salem, t: "وَأَنَا غَسَلْتُ يَدَيَّ وَوَجْهِي، وَالْآنَ أَنَامُ!"}
