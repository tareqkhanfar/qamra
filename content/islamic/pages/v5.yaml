    type: wwyd
    ai_drafted: true
    title: "{مَاذَا كُنْتَ سَتَفْعَلُ؟/مَاذَا كُنْتِ سَتَفْعَلِينَ؟}"
    scenario: "{أَعَارَكَ صَدِيقُكَ قِصَّةً جَمِيلَةً، وَأَنْهَيْتَ قِرَاءَتَهَا/أَعَارَتْكِ صَدِيقَتُكِ قِصَّةً جَمِيلَةً، وَأَنْهَيْتِ قِرَاءَتَهَا}."
