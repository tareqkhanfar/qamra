    instruction: "{ضَعْ/ضَعِي} عَلَامَةً عَلَى كُلِّ عَادَةٍ {بَنَيْتَهَا/بَنَيْتِهَا}"
    moments:
      - {when: "صَلَاةُ الْفَجْرِ", t: "أُصَلِّيهَا فِي وَقْتِهَا مَعَ أَهْلِي.", picture: "isl:night-stars", sources: [h-bukhari-527]}
      - {when: "صَلَاةُ الظُّهْرِ", t: "أُصَلِّيهَا حِينَ أَسْمَعُ الْأَذَانَ أَوْ حِينَ أَرْجِعُ.", picture: sun, sources: [h-bukhari-527]}
      - {when: "صَلَاةُ الْعَصْرِ", t: "أَتْرُكُ لَعِبِي، وَأُصَلِّيهَا.", picture: clock, sources: [h-bukhari-527]}
      - {when: "صَلَاةُ الْمَغْرِبِ", t: "أُصَلِّيهَا حِينَ تَغْرُبُ الشَّمْسُ.", picture: "isl:sun-moon", sources: [h-bukhari-527]}
      - {when: "صَلَاةُ الْعِشَاءِ", t: "أُصَلِّيهَا قَبْلَ أَنْ أَنَامَ.", picture: moon, sources: [h-bukhari-527]}
      - {when: "كُلَّ يَوْمٍ", t: "أَقْرَأُ صَفْحَةً مِنَ الْقُرْآنِ، أَوْ أَسْتَمِعُ إِلَيْهَا.", picture: "isl:book-stand", sources: [q-54-17]}
      - {when: "كُلَّ يَوْمٍ", t: "أَقْتَدِي بِنَبِيِّي ﷺ فِي خُلُقٍ جَمِيلٍ.", picture: heart, sources: [q-33-21]}

  - key: u-myday2/l2-2
    type: story
    ai_drafted: true
    scene: {backdrop: home, props: ["isl:book-stand", clock, lamp], figures: [huda, reem, salem]}
    lines:
      - {who: reem, t: "سِتِّي، كَيْفَ أَجْعَلُ الصَّلَاةَ وَالْقُرْآنَ عَادَةً لَا أَنْسَاهَا؟"}
      - {who: huda, t: "اللهُ يُحِبُّ أَنْ نُصَلِّيَ فِي الْوَقْتِ، فَنَبْدَأُ بِهَذِهِ الْعَادَةِ.", sources: [h-bukhari-527], ai_drafted: true}
      - {who: huda, t: "وَالْقُرْآنُ يَسَّرَهُ اللهُ لِنَقْرَأَهُ وَنَحْفَظَهُ، فَنَقْرَأُ قَلِيلًا كُلَّ يَوْمٍ.", sources: [q-54-17], ai_drafted: true}
      - {who: salem, t: "وَأَنَا أَقْتَدِي بِنَبِيِّنَا ﷺ: أَبْتَسِمُ، وَأَصْدُقُ، وَأُسَاعِدُ!", sources: [q-33-21], ai_drafted: true}
    lesson: {text: "الْعَادَةُ الْجَمِيلَةُ تَبْدَأُ صَغِيرَةً، وَتَكْبُرُ حِينَ نُكَرِّرُهَا كُلَّ يَوْمٍ.", ai_drafted: true}
    question:
      text: "مَا الْعَمَلُ الَّذِي يُحِبُّهُ اللهُ كَثِيرًا؟"
      choices: [{t: "الصَّلَاةُ فِي وَقْتِهَا", ok: true}, {t: "اللَّعِبُ طُولَ الْيَوْمِ"}]
      sources: [h-bukhari-527]

  - key: u-myday2/l2-3
    type: wwyd
    ai_drafted: true
    title: "{مَاذَا كُنْتَ سَتَفْعَلُ؟/مَاذَا كُنْتِ سَتَفْعَلِينَ؟}"
    scenario: "{كُنْتَ تُشَاهِدُ بَرْنَامَجًا تُحِبُّهُ، فَسَمِعْتَ/كُنْتِ تُشَاهِدِينَ بَرْنَامَجًا تُحِبِّينَهُ، فَسَمِعْتِ} أَذَانَ الْمَغْرِبِ."
    scene: {backdrop: home, props: ["isl:prayer-mat", lamp, window], figures: [reader]}
    choices:
      - {t: "أُطْفِئُ الشَّاشَةَ، وَأَتَوَضَّأُ، وَأُصَلِّي", ok: true, feedback: "{أَحْسَنْتَ يَا بَطَلُ/أَحْسَنْتِ يَا بَطَلَةُ}! الصَّلَاةُ فِي وَقْتِهَا يُحِبُّهَا اللهُ."}
      - {t: "أَقُولُ: بَعْدَ الْحَلْقَةِ، ثُمَّ أَنْسَى", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
      - {t: "أَرْفَعُ الصَّوْتَ حَتَّى لَا أَسْمَعَ الْأَذَانَ", feedback: "لَيْسَ هَذَا أَجْمَلَ اخْتِيَارٍ. {جَرِّبْ/جَرِّبِي} مَرَّةً أُخْرَى!"}
    quote: {source: h-bukhari-527, span: {start: "الصلاة على وقتها", end: "الصلاة على وقتها"}}
    sources: [h-bukhari-527]
    role_play: "{مَثِّلِ الْمَوْقِفَ مَعَ أَهْلِكَ/مَثِّلِي الْمَوْقِفَ مَعَ أَهْلِكِ}"

