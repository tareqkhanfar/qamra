    instruction: "{الْعَبْ وَأَجِبْ/الْعَبِي وَأَجِيبِي}"
    intro: "هَذِهِ لُعْبَةٌ وَلَيْسَتِ امْتِحَانًا، {أَجِبْ مَعَ أُمِّكَ أَوْ أَبِيكَ/أَجِيبِي مَعَ أُمِّكِ أَوْ أَبِيكِ}."
    true_false:
      - {t: "نَسْتَأْذِنُ قَبْلَ أَنْ نَدْخُلَ بُيُوتَ غَيْرِنَا.", ok: true, sources: [q-24-27]}
      - {t: "إِذَا قَالَتْ أُمِّي: لَا، أَصْرُخُ وَأَبْكِي.", ok: false, sources: [q-17-23]}
    questions:
      - text: "مَاذَا نَقْرَأُ قَبْلَ النَّوْمِ؟"
        choices: [{t: "الْإِخْلَاصَ وَالْمُعَوِّذَتَيْنِ", ok: true}, {t: "لَا نَقْرَأُ شَيْئًا"}]
        sources: [h-bukhari-5017]
    situations:
      - t: "وَجَدَ سَالِمٌ لُعْبَةً لَيْسَتْ لَهُ فِي الْحَدِيقَةِ. مَاذَا يَفْعَلُ؟"
        choices: [{t: "يُخْبِرُ أَهْلَهُ لِيُعِيدُوهَا", ok: true}, {t: "يَأْخُذُهَا لِنَفْسِهِ"}]
        sources: [s-found-item]
      - t: "غَضِبَتْ رِيمُ مِنْ أَخِيهَا. مَاذَا تَفْعَلُ؟"
        choices: [{t: "تَسْتَعِيذُ بِاللهِ، وَتَجْلِسُ حَتَّى تَهْدَأَ", ok: true}, {t: "تَصْرُخُ فِي وَجْهِهِ"}]
        sources: [d-anger-refuge, h-abudawud-4782]

  - key: end/2
    type: assessment
    ai_drafted: true
    instruction: "لَاحِظُوا طِفْلَكُمْ وَلَوِّنُوا النُّجُومَ"
    skills:
      - {skill: "حِفْظُ اللِّسَانِ", t: "{يَقُولُ كَلَامًا طَيِّبًا، وَلَا يَسْخَرُ مِنْ أَحَدٍ/تَقُولُ كَلَامًا طَيِّبًا، وَلَا تَسْخَرُ مِنْ أَحَدٍ}."}
      - {skill: "الْأَمَانَةُ", t: "{يَرُدُّ مَا لَيْسَ لَهُ إِلَى صَاحِبِهِ/تَرُدُّ مَا لَيْسَ لَهَا إِلَى صَاحِبِهِ}."}
      - {skill: "الْآدَابُ الْيَوْمِيَّةُ", t: "{يَسْتَأْذِنُ وَيُسَلِّمُ، وَيَأْكُلُ بِأَدَبٍ/تَسْتَأْذِنُ وَتُسَلِّمُ، وَتَأْكُلُ بِأَدَبٍ}."}
      - {skill: "بِرُّ الْوَالِدَيْنِ", t: "{يُسَاعِدُ أَهْلَهُ، وَيَقْبَلُ «لَا» بِأَدَبٍ/تُسَاعِدُ أَهْلَهَا، وَتَقْبَلُ «لَا» بِأَدَبٍ}."}
      - {skill: "الِاعْتِذَارُ وَالْهُدُوءُ", t: "{يَعْتَذِرُ إِذَا أَخْطَأَ، وَيَهْدَأُ حِينَ يَغْضَبُ/تَعْتَذِرُ إِذَا أَخْطَأَتْ، وَتَهْدَأُ حِينَ تَغْضَبُ}."}
      - {skill: "يَوْمِي مَعَ اللهِ", t: "{يُصَلِّي فِي الْوَقْتِ، وَيَذْكُرُ اللهَ صَبَاحًا وَمَسَاءً/تُصَلِّي فِي الْوَقْتِ، وَتَذْكُرُ اللهَ صَبَاحًا وَمَسَاءً}."}
    note: "نَجْمَةٌ: بِدَايَةٌ، نَجْمَتَانِ: تَقَدُّمٌ، ثَلَاثُ نَجَمَاتٍ: عَادَةٌ ثَابِتَةٌ."

