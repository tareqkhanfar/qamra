  - key: u-myday2/closing-2
    type: unit-closing
    ai_drafted: true
    dhikr: {source: d-sleep, label: "ذِكْرُ النَّوْمِ"}
    dhikr_when: "أَقُولُهُ كُلَّ لَيْلَةٍ قَبْلَ أَنْ أَنَامَ."
    challenge: "نَصْنَعُ مَعًا لَوْحَةَ «يَوْمِي مَعَ اللهِ»، وَأُلْصِقُ نَجْمَةً عَلَى كُلِّ عَادَةٍ أَفْعَلُهَا هَذَا الْأُسْبُوعَ."

  - key: u-myday2/parent
    type: parent-guide
    ai_drafted: true
    lang: modern-standard
    learned: {text: "{تعلّم طفلكم أن يومه كله مع الله: يذكره حين يستيقظ ويأكل وينام، ويصلّي في الوقت، ويقرأ/تعلّمت طفلتكم أن يومها كله مع الله: تذكره حين تستيقظ وتأكل وتنام، وتصلّي في الوقت، وتقرأ} شيئًا من القرآن.", sources: [d-wake, h-bukhari-527, q-54-17], ai_drafted: true}
    explain: {text: "العادات تُبنى خطوة خطوة: عادة جديدة كل أسبوع، مربوطة بعادة ثابتة، مثل ذكر النوم بعد تنظيف الأسنان.", ai_drafted: true}
    ask: "أيّ عادة من عاداتك مع الله {تحبها/تحبينها} أكثر؟ ولماذا؟"
    together: "اصنعوا لوحة أسبوعية للصلوات وقراءة القرآن، واحتفلوا معًا في آخرها."
    habit: {text: "شجّعوا {الطفل/الطفلة} على الصلاة بالحب والقدوة لا بالإلزام، وصلّوا {معه/معها}.", sources: [s-prayer-age], ai_drafted: true}
    care_note: "في الكتاب آيات وأحاديث وأذكار؛ نرجو حفظه في مكان نظيف مرتفع، وعدم رميه أو وضع شيء فوقه."

