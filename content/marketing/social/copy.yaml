    note: ويمكنكم إضافة علبة هدية وبطاقة برسالتكم
    cta: order

  - slug: journey-stages
    bg: paper
    pill: رحلتي الأولى للتعلّم
    headline: ["ثلاث محطات", "حتى يقرأ ويكتب"]
    sub: يستعدّ في الأولى بالتفكير وتدريب اليد، ويتعرّف في الثانية على الحروف والأعداد، ويقرأ ويكتب ويجمع ويطرح في~الثالثة.
