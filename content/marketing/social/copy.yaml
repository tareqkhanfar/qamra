  - slug: foundation-name
    bg: paper
    pill: دوسية التأسيس
    headline: ["يكتب اسمه", "بيده الصغيرة"]
    sub: يتتبّع طفلكم اسمه ويكتبه بالعربية والإنجليزية، ويتدرّب على إمساك القلم خطوة خطوة، وفي آخر الدوسية شهادة إنجاز~باسمه.
    visual: photo
    media: workbook-tracing
    layout: hero
    note: ملوّنة أو بالأبيض والأسود، أو PDF تطبعونه في البيت
    cta: order

  - slug: faq-2
    bg: sky
    pill: أسئلة شائعة
    headline: ["قبل أن تطلبوا"]
    visual: faq
    qa:
      - {q: هل يمكنني تعديل نص القصة؟, a: نعم، تعدّلون نص كل صفحة في خطوة المراجعة، أو تعيدونه كما كان~بضغطة.}
