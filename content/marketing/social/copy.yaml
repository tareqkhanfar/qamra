  - slug: foundation
    bg: glow
    pill: دوسية التأسيس
    headline: ["منهج متكامل", "في دوسية باسمه"]
    sub: العربية والإنجليزية والرياضيات ومهارات القلم، متدرّجة أسبوعًا بأسبوع، وشخصية طفلكم من الغلاف حتى شهادة~الإنجاز.
    visual: fan
    pages: [workbooks/foundation-workbook/01.jpg, workbooks/foundation-workbook/02.jpg, workbooks/foundation-workbook/09.jpg]
    note: لعمر ٤–٦ سنوات، في ثلاثة أجزاء بتجليد حلزوني
    cta: order

  - slug: new-baby
    bg: blush
    pill: ضيفنا الصغير
    headline: ["مولود جديد في البيت؟", "طفلكم هو البطل"]
    sub: حكاية «ضيفنا الصغير» تطمئن طفلكم أنّ مكانه في قلب العائلة لا يتغيّر، وتعلّمه كيف يكون الأخ الكبير أو الأخت~الكبيرة.
    visual: scene_book
    media: plate-new-sibling
    cover: new-sibling
    note: لعمر ٣–٦ سنوات، ويمكنكم إضافة علبة هدية
    cta: order

  - slug: privacy
    bg: night
    pill: خصوصية طفلكم
    headline: ["تُحذف الصورة،", "وتبقى الحكاية"]
    sub: نستخدم صورة طفلكم لرسم شخصيته فقط، ثم تُحذف تلقائيًا خلال ٢٤ ساعة من اعتمادكم~للشخصية.
    visual: points
    points:
      - {icon: consent, text: لا نبدأ دون موافقة صريحة منكم بصفتكم أولياء~أمره}
      - {icon: shield, text: لا نستخدم صور أطفالكم لتدريب أي نموذج ذكاء~اصطناعي}
      - {icon: trash, text: تحذفون بيانات طفلكم وكتبه من حسابكم متى~شئتم}
    cta: order

  - slug: family
    bg: sage
    pill: مغامراتي مع عائلتي
    headline: ["١٢ مغامرة", "يعيشها معكم"]
    sub: في البيت والسوق والمطبخ والطبيعة، وطفلكم بطل كل مغامرة باسمه وشخصيته، وأسماؤكم في~المهمّات.
    visual: photo
    media: family-book-table
    layout: hero
    note: ومع الكتاب جواز سفر المغامر وملصقات المكافآت
    cta: order

  - slug: faq-1
    bg: paper
    pill: أسئلة شائعة
    headline: ["هل يشبه الرسم طفلي؟", "وأسئلة أخرى"]
    visual: faq
    qa:
      - {q: هل يشبه الرسم طفلي فعلًا؟, a: نعرض عليكم «بطاقة الشخصية» أولًا، ولا نكمل حتى تقولوا «يشبه~طفلي».}
      - {q: ماذا لو لم تعجبني الصفحات؟, a: تتصفّحون الكتاب كاملًا مجانًا، وتعدّلون الكلمات أو تعيدون رسم أي~صفحة.}
      - {q: كيف أدفع؟, a: نقدًا للمندوب عند الاستلام، دون بطاقة ولا دفع~مسبق.}
    cta: order

  - slug: gifts
    bg: blush
    pill: عيد ميلاد أو عيد
    headline: ["هدية عيد ميلاده:", "حكاية هو بطلها"]
    sub: اختاروا حكاية من حكاياتنا، أو اكتبوا لنا فكرتكم فنكتب ونرسم «حكاية خاصة» لطفلكم وحده، لعيد ميلاده أو~للعيد.
    visual: photo
