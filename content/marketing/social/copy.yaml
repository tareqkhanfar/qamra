      - {q: إلى أين توصّلون؟, a: إلى بابكم في مدن الضفة الغربية والقدس، والرسوم في صفحة~الأسعار.}
      - {q: ماذا لو وصل الكتاب بعيب طباعة؟, a: نعيد طباعته مجانًا إذا كان الخطأ منّا.}
    cta: order

# Carousels (1080×1350, 5 slides). A slide with `step` lights that step on the tracker; the first slide is a cover.
carousels:
  - slug: photo-to-book
    pill: من الصورة إلى الكتاب
    steps: [الصورة, الشخصية, المعاينة, الكتاب]
    slides:
      - title: ["من صورة على جوالكم", "إلى كتاب بين يديه"]
        body: هكذا نصنع كتاب حكاية مطبوعًا، يكون طفلكم بطل كل صفحة~فيه.
        visual: photo
        media: hero-reading
      - step: 1
        title: [صورة واضحة لوجهه]
        body: من جوالكم، في ضوء النهار والوجه ظاهر كاملًا، مع اسمه وعمره وموافقتكم بصفتكم أولياء~أمره.
        visual: photo
        media: film-photo
        badge: "مثال: طفلة متخيَّلة"
        badge_kind: tag
      - step: 2
        title: [نرسم شخصيته, وتوافقون عليها]
        body: نعرض عليكم «بطاقة الشخصية»، طفلكم من الأمام وبوضعيتين، ولا نكمل حتى تقولوا~«يشبه~طفلي».
        visual: photo
        media: character-sheet
        focus: "50% 12%"
        badge: يشبه طفلي
      - step: 3
        title: [تتصفّحون الكتاب مجانًا]
        body: تقرؤون كل الصفحات على الجوال، وتعدّلون الكلمات أو تعيدون رسم صفحة، قبل أن تدفعوا~شيئًا.
        visual: photo
        media: mock-spread
      - step: 4
        title: [نطبعه ونوصله إليكم]
        body: طباعة ملوّنة على ورق سميك، بغلاف~مقوّى~أو~ورقي، والدفع نقدًا عند~الاستلام.
        visual: photo
        media: mock-hardcover-wide
        cta: order

  - slug: kindergartens
    pill: للروضات
    steps: [قائمة الصف, الأهالي, صفحة الروضة, التسليم]
    slides:
      - title: [كتب التخرّج, لروضتكم]
        body: كتاب لكل طفل في الصف، هو بطله باسمه وملامحه. أنتم ترفعون القائمة، ونحن نتولّى~الباقي.
        visual: photo
        media: graduation-class
      - step: 1
        title: [ترفعون قائمة الصف]
        body: ملف Excel بأسماء الأطفال وأرقام أولياء~الأمور، ونتولّى نحن التواصل مع~الأهالي.
        visual: kg_list
        file: قائمة صف القمر
        cols: [اسم الطفل, واتساب ولي الأمر]
        names: [ليان, يوسف, سلمى, آدم, جنى, كريم]
      - step: 2
        title: [كل ولي أمر يوافق, ويرفع الصورة بنفسه]
        body: نرسل لكل ولي أمر رابطًا خاصًا بطفله على واتساب. الروضة لا ترفع صور الأطفال، وترى الرسومات~فقط.
        visual: kg_link
        message: "رابط خاص بكتاب تخرّج ليان: وافقوا، ثم ارفعوا صورة واضحة لوجهها."
        button: افتحوا الرابط
        checks: [موافقة ولي الأمر, صورة واضحة للوجه, اعتماد شخصية الطفل]
      - step: 3
        title: [صفحة خاصة بروضتكم]
        body: الشعار وصورة الصف وكلمة المعلّمة، وصفحة «أصدقائي في الصف» بأسماء كل~الأطفال.
        visual: kg_page
        media: graduation-class
        logo: شعار الروضة
        school: [روضة الفراشات, صف القمر]
        note: «كنتم نجوم صفّنا هذا العام… نحبّكم!»
      - step: 4
        title: [نطبع ونسلّمكم الكتب]
        body: نراجع الكتب معكم، ثم نطبعها ونسلّمها للروضة مغلّفة باسم كل طفل، بفاتورة~واحدة.
        visual: kg_stack
        cta: quote

