      - {n: 3, title: معاينة مجانية, text: تتصفّحون الصفحات وتعدّلون الكلمات قبل أن تدفعوا شيئًا.}
      - {n: 4, title: نطبع ونوصّل إلى بابكم, text: طباعة محلية على ورق سميك، والدفع عند الاستلام.}
