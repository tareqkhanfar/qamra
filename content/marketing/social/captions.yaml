ad-a-launch:
  text: |-
    طفلكم بطل حكايته، في كتاب مطبوع يحمل اسمه وملامحه.
    أرسلوا لنا صورة واضحة لوجهه، فنرسم شخصيته ولا نكمل حتى تقولوا «يشبه طفلي».
    بعدها تتصفّحون الكتاب كاملًا قبل أن تدفعوا شيئًا، والدفع عند الاستلام.
    اطلبوا الآن من qamra.app
  hashtags: [قمرة, قصص_أطفال, كتب_أطفال, هدايا_أطفال, فلسطين]

ad-b-kindergarten:
  text: |-
    كتاب «يوم تخرّجي» لكل طفل في الصف: هو بطل الحكاية باسمه وملامحه، ومعه صفحة لروضتكم فيها الشعار وصورة الصف وكلمة المعلّمة.
    كل ولي أمر يوافق ويرفع صورة طفله بنفسه عبر رابط خاص، وتصلكم الكتب مغلّفة باسم كل طفل.
    اطلبوا عرض سعر لروضتكم من qamra.app
  hashtags: [قمرة, تخرج_الروضة, روضة_أطفال, حفل_تخرج, فلسطين]

ad-c-family:
  text: |-
    «مغامراتي مع عائلتي»: ١٢ مغامرة في البيت والسوق والمطبخ والطبيعة، يعيشها طفلكم معكم.
    طفلكم بطل كل مغامرة باسمه وشخصيته، وأسماء أفراد العائلة في المهمّات، ومع الكتاب جواز سفر المغامر وملصقات المكافآت.
