ad-e-foundation:
  text: |-
    «دوسية التأسيس»: منهج متكامل للروضة في ثلاثة أجزاء، فيه العربية والإنجليزية والرياضيات ومهارات القلم.
    غلافها بشخصية طفلكم واسمه، وفيها يتتبّع اسمه ويكتبه، وفي آخرها شهادة إنجاز له.
    لعمر ٤–٦ سنوات، بتجليد حلزوني ينفتح مسطّحًا. اطلبوها من qamra.app
