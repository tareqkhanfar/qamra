ad-d-journey:
  text: |-
    «رحلتي الأولى للتعلّم»: كتاب مغامرة يتعلّم فيه طفلكم وهو يلعب، من التفكير وتدريب اليد حتى الحروف والقراءة.
    امسحوا رموز QR في الصفحات بالجوال، فيسمع طفلكم الأصوات والكلمات.
    ثلاث محطات متدرّجة لعمر ٣–٦ سنوات. اطلبوه من qamra.app
