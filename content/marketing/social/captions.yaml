ad-f-gifts:
  text: |-
    هدية يكون طفلكم بطلها: حكاية مطبوعة باسمه وملامحه، لعيد ميلاده أو للعيد.
    وحين ينتظر أخًا أو أختًا، تطمئنه حكاية «ضيفنا الصغير» بأنّ مكانه في قلب العائلة لا يتغيّر.
    ومعها علبة هدية وبطاقة برسالتكم، إن أحببتم. اطلبوها من qamra.app
  hashtags: [قمرة, هدايا_أطفال, هدية_عيد_ميلاد, هدايا_العيد, مولود_جديد]

ad-g-trust:
  text: |-
    صورة طفلكم أمانة عندنا: نستخدمها لرسم شخصيته فقط، وتُحذف تلقائيًا خلال ٢٤ ساعة من اعتمادكم للشخصية.
    لا نستخدم صور أطفالكم لتدريب أي نموذج ذكاء اصطناعي، ويمكنكم حذف بيانات طفلكم كلها من حسابكم متى شئتم.
    والدفع نقدًا عند الاستلام، دون بطاقة ولا دفع مسبق. تعرّفوا إلينا على qamra.app
  hashtags: [قمرة, خصوصية_الأطفال, كتب_أطفال, قصص_أطفال]

carousel-how-it-works:
  text: |-
    كيف نصنع كتاب طفلكم؟ أربع خطوات من الصورة إلى الكتاب المطبوع.
    صورة من جوالكم، ثم نرسم شخصيته وتوافقون عليها، وتتصفّحون الحكاية مجانًا، ثم نطبع الكتاب ونوصله إلى بابكم.
    والدفع عند الاستلام. ابدؤوا من qamra.app
