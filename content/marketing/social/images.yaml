# Image slots of the social kit. Each slot lists files in priority order: `public:` site photos first (retouched on
# 2026-10-07 by scripts/retouch_site_photos.py: our real covers and pages are on the books in them), then files
# from design/incoming/ (names as in docs/image-prompts.md, sections A and B), whose books are blurred and blank. The renderer uses the first file that exists; when none exists it
# draws the slot in code (books, sky, moon, public workbook pages: `wb:<book>/<scope>/<cover|n>`, looked up in
# apps/web/src/lib/workbook-previews.json). Nothing from out/ and no real child's photo.
#
# kind: photo   → shown in a rounded frame, cropped to fill it; `focus` is the CSS object-position.
# kind: mockup  → a product photo with a blank white cover. Our cover is laid onto it, so it is used only
#                 when `cover_quad` is filled: the cover's four corners in the image's own pixels, in the
#                 order top-left, top-right, bottom-right, bottom-left of the cover as printed (the spine is on
#                 the right). Read them off the photo in any image viewer. `cover_size` is the cover art box.

files:
  A1-hero-reading.png: {kind: photo, focus: "62% 45%"}
  A3-graduation-class.png: {kind: photo, focus: "50% 40%"}
  A4-family-book-table.png: {kind: photo, focus: "50% 55%"}
  A5-workbook-tracing.png: {kind: photo, focus: "50% 50%"}
  A6-journey-qr.png: {kind: photo, focus: "50% 50%"}
  A8-gift-box.png: {kind: photo, focus: "50% 55%"}
  B1-mockup-hardcover-angle.png: {kind: mockup, cover_size: [600, 600], cover_quad: null}
  B2-mockup-open-spread.png: {kind: mockup, cover_size: [1200, 600], cover_quad: null}  # the quad spans both pages
  B4-mockup-spiral.png: {kind: mockup, cover_size: [600, 800], cover_quad: null}

slots:
  launch:        # ad-a-launch, story-a-launch
    candidates: [public:photos/hero-reading.jpg, A1-hero-reading.png, B1-mockup-hardcover-angle.png]
    cover: first-day
    fallback: hardcover «ليان في أوّل يوم بالروضة» drawn in code
  kindergarten:  # ad-b-kindergarten, story-b-kindergarten
    # public: = a file under apps/web/public (the 2026-10-03 photo, no child in a hijab); A3 only as a fallback
    candidates: [public:photos/graduation-class.jpg, A3-graduation-class.png]
    fallback: a stack of «يوم تخرّج» books with a different child's name on each spine
  family:        # ad-c-family
    candidates: [public:photos/family-book-table.jpg, A4-family-book-table.png]
    fallback: spiral book + real pages of «مغامراتي مع عائلتي» (wb:family-adventures/book/…)
  journey:       # ad-d-journey
    candidates: [public:photos/journey-qr.jpg, A6-journey-qr.png, B4-mockup-spiral.png]
    cover_image: wb:learning-journey/1/cover  # laid onto B4's blank cover
    fallback: the real cover and QR page of «رحلتي الأولى للتعلّم» + a phone drawn in code
  foundation:    # ad-e-foundation
    candidates: [public:photos/workbook-tracing.jpg, A5-workbook-tracing.png]
    fallback: real pages of «دوسية التأسيس» (wb:foundation-workbook/…)
  gifts:         # ad-f-gifts, story-f-gifts
    candidates: [public:photos/gift-box.jpg, A8-gift-box.png]
    fallback: hardcover «ليان وضيفنا الصغير» with a ribbon and a gift tag, drawn in code
  spread:        # carousel-3-story
    candidates: [B2-mockup-open-spread.png]
    fallback: an open book drawn in code (picture page + vowelized text page)
  hardcover:     # carousel-4-book
    candidates: [B1-mockup-hardcover-angle.png]
    cover: graduation
    fallback: hardcover «يوم تخرّج ليان» drawn in code

# ------------------------------------------------------------------------------------------------ media
# Every other bitmap the posts, ads and video end cards use (copy.yaml `media:` keys), path from the repo root.
# All are AI-made (no real child) and were checked by eye on 2026-10-03 for Tareq's rule: no little girl in a
# hijab in our marketing (adults in a hijab are fine). Never add content/cast/classmates-* (a girl in a hijab)
# or an old copy of graduation-class (the 2026-10-03 file is the one without hijabs).
# out/video/ is the brand film's folder (gitignored): its stills and mockups exist only on the machine that built
# the film, so the posts that use them need it (the renderer says which file is missing).
# focus = the CSS object-position used when the picture is cropped to its frame.
media:
  hero-reading: {src: apps/web/public/photos/hero-reading.jpg, focus: "60% 50%"}
  first-day: {src: apps/web/public/photos/first-day.jpg, focus: "64% 50%"}
  graduation-class: {src: apps/web/public/photos/graduation-class.jpg, focus: "57% 40%"}
  family-book-table: {src: apps/web/public/photos/family-book-table.jpg, focus: "52% 50%"}
  journey-qr: {src: apps/web/public/photos/journey-qr.jpg, focus: "50% 45%"}
  grandma-voice: {src: apps/web/public/photos/grandma-voice.jpg, focus: "58% 45%"}
  gift-box: {src: apps/web/public/photos/gift-box.jpg, focus: "50% 58%"}
  kindergarten-teacher: {src: apps/web/public/photos/kindergarten-teacher.jpg, focus: "48% 60%"}
  workbook-tracing: {src: apps/web/public/photos/workbook-tracing.jpg, focus: "50% 55%"}
  plate-new-sibling: {src: content/themes/new-sibling/plates/3d-1.jpg, focus: "50% 60%"}
  film-qamour: {src: out/video/shot1-start.png, focus: "62% 30%"}        # «قمّور» over the town at night
  film-photo: {src: out/video/shot2-start.png, focus: "50% 32%"}         # the sample photo (AI-made girl)
  film-character: {src: out/video/shot2-end.png, focus: "50% 32%"}       # the same girl drawn in 3D
  character-sheet: {src: out/video/sample-character-3d.png, focus: "50% 50%"}
  mock-hardcover: {src: out/video/mock/hardcover.png, focus: "50% 52%"}  # «يوم تخرّج ليان», square
  mock-hardcover-wide: {src: out/video/mock3x2/hardcover.png, focus: "50% 50%"}
  mock-spread: {src: out/video/mock/spread.png, focus: "40% 62%"}
  cover-graduation: {src: out/video/front-lettered.png, focus: "50% 50%"}  # the flat cover art
