# Qamra edge: the only service meant to face the internet.
# - Overwrites X-Forwarded-For with the real peer address (clients cannot spoof their IP, so the
#   per-IP rate limits here and in the API hold).
# - /api/* goes straight to the API; everything else to the Next.js web app.
# - Rate/connection limits, slow-client timeouts, method allow-list, security headers.
# TLS terminates in front of this: the host's nginx + Let's Encrypt (infra/scripts/setup-https.sh) or
# Cloudflare. The front proxy reaches this edge through Docker's local proxy, so its connections come from the
# Docker bridge gateway; only those may set the client address (X-Forwarded-For). Internet clients arrive
# with their real public address (Docker DNATs published ports), can't come from these private ranges, and
# so can't spoof their IP.

resolver 127.0.0.11 valid=10s ipv6=off;  # Docker DNS: re-resolve containers after restarts

set_real_ip_from 172.16.0.0/12;  # Docker bridge gateways (the host's nginx via docker-proxy)
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;  # take exactly the address the trusted proxy wrote

limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 20m;  # child photos and drawings
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 16k;
    limit_conn perip 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) {
        return 405;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 120s;
    proxy_hide_header X-Powered-By;

    # security headers for every response (pages add their own nonce-based CSP)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # never serve dotfiles (/.env, /.git …) whatever the upstream does
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        set $api http://api:8000;
        proxy_pass $api;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        set $api http://api:8000;
        proxy_pass $api;
    }

    location / {
        limit_req zone=site burst=60 nodelay;
        set $web http://web:3000;
        proxy_pass $web;
    }
}
