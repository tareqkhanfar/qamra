# Qamra edge: the only service meant to face the internet.
# - Overwrites X-Forwarded-For with the real peer address (clients cannot spoof their IP, so the
#   API's per-IP login rate limits hold).
# - /api/* goes straight to the API; everything else to the Next.js web app.
# TLS terminates in front of this (Cloudflare) or is added here in Phase 6.

resolver 127.0.0.11 valid=10s ipv6=off;  # Docker DNS: re-resolve containers after restarts

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;  # child photos and drawings

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
    }

    location / {
        set $web http://web:3000;
        proxy_pass $web;
    }
}
